<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La talpa — porta il calore alla scuola</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23123E90'/%3E%3Cpath d='M16 27V9' stroke='%23D4A017' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M11 10h10l-5-6z' fill='%23D4A017'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="campus-icona.png">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   LA TALPA — Campus Sacra Famiglia
   Sezione verticale sul FRONTE NORD: chiesa con l'arco cieco di mattoni,
   portale con la lunetta a raggiera, lesena di mattoni, ala a tetto
   piatto. Sotto: strati, rocce, fondazioni e le quattro reti di
   sottoservizi (codice colore UNI 9165/9860/10576).
   Non si scava dall'alto: si parte DALLA SACCA GEOTERMICA e si risale
   guidando la talpa, che si porta dietro il tunnel che ha scavato.
   Il rosso è colore di CONTENUTO (il cavo elettrico), mai errore: i
   danni sono in ambra.
   ==================================================================== */
:root{
  --pann:#141E28; --pann2:#1D2A38; --linea:#2C3D4F;
  --testo:#EAF0F6; --muto:#93A9BE;
  --blu:#123E90; --blu2:#5B8AE0; --oro:#D4A017; --ambra:#E0A52B;
  --body:'Atkinson Hyperlegible',Helvetica,Arial,sans-serif;
  --head:'Lexend',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* LA PAGINA STA IN UNO SCHERMO, SENZA SCROLL. La tela non si dimensiona
   più sulla larghezza (che sforava in altezza): si prende lo spazio che
   avanza fra intestazione e striscia, e dentro quello sceglie il lato
   più stretto fra larghezza e altezza. */
html,body{margin:0;height:100%;overflow:hidden;background:#0B1118;
  color:var(--testo);font-family:var(--body);font-size:17px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.22}
button{font-family:var(--body);font-size:1rem;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1440px;height:100%;margin:0 auto;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:7px 13px;background:var(--pann);border:1px solid var(--linea);border-radius:12px}
header b{font-family:var(--head);font-weight:700;letter-spacing:.045em}
.occ{font-family:var(--head);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--oro)}
header .occ{display:block;color:var(--muto)}
.spazio{flex:1 1 auto}
.btn{min-height:42px;padding:8px 14px;border-radius:10px;background:var(--pann2);
  border:1px solid var(--linea);font-weight:700;font-size:.88rem}
.btn:hover{border-color:var(--blu2)}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#1a1206}
.btn:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.cont{display:flex;gap:8px;flex-wrap:wrap}
.c{background:var(--pann2);border:1px solid var(--linea);border-radius:10px;
  padding:3px 11px;text-align:center;min-width:74px}
.c b{display:block;font-family:var(--head);font-size:1.14rem;line-height:1.1}
.c span{font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muto)}
.c.oro b{color:var(--oro)} .c.ambra{border-color:var(--ambra)} .c.ambra b{color:var(--ambra)}
#telaio{flex:1 1 auto;min-height:0;border-radius:13px;overflow:hidden;
  border:1px solid var(--linea);background:#0D1620;
  display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;cursor:crosshair}
/* la striscia in basso: la legenda essenziale in una riga sola */
.striscia{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 13px;background:var(--pann);border:1px solid var(--linea);
  border-radius:12px;font-size:.82rem;color:var(--muto)}
.striscia b{color:var(--testo)}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:20px;height:8px;border-radius:3px;display:block;
  border:1px solid rgba(255,255,255,.22)}
.sotto{display:grid;gap:11px;grid-template-columns:1.2fr 1fr;margin-top:11px}
@media(max-width:820px){.sotto{grid-template-columns:1fr}}
.card{background:var(--pann);border:1px solid var(--linea);border-radius:13px;padding:13px 16px}
.voce{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:.87rem}
.q{width:26px;height:9px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(255,255,255,.22)}
.card p{margin:7px 0 0;font-size:.9rem;line-height:1.55;color:var(--muto)}
.card p b{color:var(--testo)}
#velo{position:fixed;inset:0;background:rgba(6,10,15,.9);z-index:50;display:none;
  align-items:center;justify-content:center;padding:20px}
#velo.on{display:flex}
.modale{background:var(--pann);border:1px solid var(--linea);border-radius:15px;
  padding:24px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto}
.modale h2{font-size:1.5rem;margin-bottom:10px}
.modale p{line-height:1.6}
.avviso{background:rgba(224,165,43,.13);border:1px solid var(--ambra);border-radius:11px;
  padding:11px 14px;font-size:.9rem;margin-top:12px}
.passi{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
/* --- l'esito: stelle grandi, poche parole -------------------------- */
.esito{text-align:center}
.stelle{display:flex;justify-content:center;gap:12px;margin:6px 0 14px}
.stelle svg{width:62px;height:62px;opacity:.16;transform:scale(.5) rotate(-25deg);
  transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.5,.4,1)}
.stelle svg.on{opacity:1;transform:scale(1) rotate(0)}
.verdetto{font-family:var(--head);font-size:1.7rem;font-weight:700;line-height:1.15}
.riga1{color:var(--muto);font-size:.95rem;margin-top:6px}
.numeri{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}
.numeri div{background:var(--pann2);border:1px solid var(--linea);border-radius:10px;
  padding:6px 12px;min-width:78px}
.numeri b{display:block;font-family:var(--head);font-size:1.16rem;line-height:1.1}
.numeri span{font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muto)}
.pensiero{background:rgba(91,138,224,.10);border-left:3px solid var(--blu2);
  border-radius:0 10px 10px 0;padding:10px 14px;margin-top:14px;text-align:left;
  font-size:.9rem;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#123E90"/>
    <path d="M16 27V9" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 10h10l-5-6z" fill="#D4A017"/>
  </svg>
  <div><span class="occ">Campus Sacra Famiglia</span><b>LA TALPA</b></div>
  <div class="spazio"></div>
  <div class="cont" id="cont"></div>
  <button class="btn" id="bMusica" aria-pressed="true">Musica</button>
  <button class="btn" id="bAiuto">Come si guida</button>
  <button class="btn" id="bRicomincia">Riprova</button>
  <button class="btn" id="bTorna">Torna al campus</button>
</header>
<div id="telaio"><canvas id="tela"></canvas></div>
<div class="striscia" id="striscia"></div>
</div>
<div id="yt" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;
     opacity:0;pointer-events:none" aria-hidden="true"></div>
<div id="velo"><div class="modale" id="modale"></div></div>

<script>
"use strict";
function cyrb53(s,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);
    h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);
  h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

/* ====================================================================
   1. IL FRONTE NORD — quote verificate sul modello 3D e sulle foto
   facciata1/2/3 e chiesa1/2/3 di questo progetto.
   ==================================================================== */
const X0=-56, X1=40, PROF=38;
/* L'ORDINE DEL FRONTE, da ponente a levante (Andrea):
     PISCINA — PORTONE della scuola — CHIESA.
   Prima avevo la chiesa a ponente e l'ala a levante: era rovesciato.
   La centrale tecnica non è fissa: si sposta di livello in livello, sul
   prato a levante della chiesa, dove non ci sono fondazioni. */
const PISCINA={da:-54,a:-38};
const ALA    ={da:-32,a:-16};
const STORICO={da:-16,a:  6};
const CHIESA ={da:  8,a: 16.7};
const PORTALE=-5, LESENA=-16;
let   CENTRALE={da:18,a:24};
/* LE POSIZIONI DELLA CENTRALE DEVONO AVERE IL CIELO LIBERO DA TUBI.
   La prima stesura ne aveva tre, e due erano attraversate dall'acqua e
   dal cavo: bucare un tubo chiude la partita come persa, quindi quei
   livelli erano IRRISOLVIBILI. Adesso i tratti di condotta passano
   NEGLI SPAZI FRA una posizione e l'altra, e collaudoCentrali() lo
   verifica — se un domani si sposta un tubo, il test lo dice subito. */
const POSTI_CENTRALE=[[-37.5,-32.5],[18,24],[27,33]];
const EDIFICI=[PISCINA,ALA,STORICO,CHIESA];
const sottoEdificio=x=>EDIFICI.some(e=>x>e.da-0.5&&x<e.a+0.5);

const RETI={
 elet :{nome:'Cavo elettrico',col:'#C0392B',prof:0.70,r:0.24},
 gas  :{nome:'Gas metano',    col:'#E8B21E',prof:0.95,r:0.22},
 acqua:{nome:'Acqua potabile',col:'#29A3D6',prof:1.35,r:0.28},
 fogna:{nome:'Fognatura',     col:'#8A7A62',prof:2.20,r:0.42}
};
/* I sottoservizi corrono SOTTO gli edifici e attraversano il prato solo
   in tratti corti: fra un tratto e l'altro ci sono i varchi, ed è lì che
   la talpa può risalire. */
const TUBI=[
 {r:'elet', da:-52,a:-40},{r:'elet', da:-30,a:-18},{r:'elet', da:-14,a: 4},
 {r:'elet', da: 34,a: 39},
 {r:'gas',  da:-30,a:-20},{r:'gas',  da:-12,a:  2},
 {r:'acqua',da:-53,a:-41},{r:'acqua',da:-31,a:-17},{r:'acqua',da:-13,a: 5},
 {r:'acqua',da: 24.6,a: 26.4},
 {r:'fogna',da:-50,a:-41},{r:'fogna',da:-28,a:-18},{r:'fogna',da: 10,a: 17}
];

/* ogni posizione della centrale dev'essere libera da tubi: senza cielo
   libero il traguardo non si raggiunge senza rompere qualcosa. */
function collaudoCentrali(){
  return POSTI_CENTRALE.map(function(q){
    const sopra=TUBI.filter(function(t){return t.a>q[0]&&t.da<q[1];});
    return {posto:q, ok:sopra.length===0,
            bloccanti:sopra.map(function(t){return RETI[t.r].nome;})};});
}
const STRATI=[
 {fino:0.9, c:'#6E5A3C',c2:'#7E6944'},{fino:4.2, c:'#8A7048',c2:'#9A7F55'},
 {fino:11.0,c:'#9A8560',c2:'#A8926B'},{fino:22.0,c:'#7C6A52',c2:'#8A7860'},
 {fino:999, c:'#5E5A54',c2:'#6B665F'}
];

/* ====================================================================
   2. STATO
   ==================================================================== */
const S={ seme:'', nick:'', rocce:[], gemme:[], sacca:{x:0,y:0}, x:0,y:0, dir:0,
  energia:130, tunnel:[], raccolte:0, colpi:0,
  attiva:false, finita:false, vinta:false, msg:'', msgT:0, mira:null, tasto:0,
  calore:0 };
const MAXE=130;

/* ====================================================================
   3. TELA — scala di profondità spezzata: i primi 3 m ingranditi,
   perché è lì che stanno i sottoservizi ed è lì che si decide.
   ==================================================================== */
const tela=document.getElementById('tela'), ctx=tela.getContext('2d');
let LARG=1200, SUOLO=250, ALT=700, MPX=1;
const YSPACCO=3, FRAZ=0.24;
const RAPPORTO=0.725;                 /* altezza / larghezza della scena */
function dimensiona(){
  const box=document.getElementById('telaio');
  const W=Math.max(320,box.clientWidth-2), H=Math.max(240,box.clientHeight-2);
  LARG=Math.floor(Math.min(W, H/RAPPORTO));
  ALT=Math.round(LARG*RAPPORTO);
  SUOLO=Math.round(LARG*0.225);
  tela.width=LARG; tela.height=ALT;
  tela.style.width=LARG+'px'; tela.style.height=ALT+'px';
  MPX=LARG/(X1-X0);
}
const px=x=>(x-X0)*MPX;
function py(y){ const h=ALT-SUOLO;
  return y<=YSPACCO ? SUOLO+h*FRAZ*(y/YSPACCO)
                    : SUOLO+h*FRAZ+h*(1-FRAZ)*((y-YSPACCO)/(PROF-YSPACCO)); }
const xDaPx=p=>X0+p/MPX;
function yDaPy(p){ const h=ALT-SUOLO;
  return p<=SUOLO+h*FRAZ ? (p-SUOLO)/(h*FRAZ)*YSPACCO
                         : YSPACCO+(p-SUOLO-h*FRAZ)/(h*(1-FRAZ))*(PROF-YSPACCO); }
addEventListener('resize',dimensiona);

/* ====================================================================
   4. IL LIVELLO — rocce sparse ma con un corridoio garantito dalla
   sacca all'arrivo, e le GEMME DI CALORE fuori dalla strada dritta:
   sono loro a creare la scelta fra la via sicura e quella che rende.
   ==================================================================== */
function generaLivello(seme){
  const r=mulberry32(cyrb53(seme));
  /* la centrale tecnica cambia posto a ogni livello: sta sempre sul prato
     a levante della chiesa, dove non ci sono fondazioni da attraversare */
  const posto=POSTI_CENTRALE[Math.floor(r()*POSTI_CENTRALE.length)];
  CENTRALE={da:posto[0],a:posto[1]};
  const cx=(CENTRALE.da+CENTRALE.a)/2;
  /* la sacca non deve nascere addosso al bordo dello scavo: ORZO ci
     sbatteva al primo secondo. Almeno otto metri di margine. */
  let sx=cx+(r()<0.5?-1:1)*(15+r()*15);
  sx=Math.max(X0+8,Math.min(X1-8,sx));
  S.sacca={x:sx, y:29+r()*6};
  const via=[[S.sacca.x,S.sacca.y],
             [S.sacca.x+(cx-S.sacca.x)*0.45, 19+r()*4],
             [cx+(r()-0.5)*6, 8+r()*3],
             [cx,0]];
  const distVia=(x,y)=>{ let m=1e9;
    for(let i=0;i<via.length-1;i++){
      const a=via[i],b=via[i+1], vx=b[0]-a[0], vy=b[1]-a[1];
      const t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/(vx*vx+vy*vy||1)));
      m=Math.min(m,Math.hypot(x-(a[0]+vx*t), y-(a[1]+vy*t)));}
    return m;};
  const rocce=[]; let t1=0;
  while(rocce.length<30 && t1++<4000){
    const x=X0+3+r()*(X1-X0-6), y=4.4+r()*(PROF-6.5), rr=1.5+r()*3.2;
    if(distVia(x,y)<rr+2.4) continue;
    if(rocce.some(q=>Math.hypot(q.x-x,q.y-y)<q.r+rr+1.0)) continue;
    rocce.push({x:x,y:y,r:rr,f:r()*6.28});}
  /* LE SACCHE SI LEGGONO A COLPO D'OCCHIO: più sono profonde, più sono
     GRANDI e più il loro colore va verso l'arancio. È la lezione della
     geotermia detta senza numeri — il caldo sta in basso, e si vede
     prima ancora di muoversi.
     Le profonde sono POCHE e LONTANE fra loro, le superficiali piccole
     ma sulla strada: così la domanda non è «le prendo tutte?» ma «quale
     deviazione in profondità vale la pena?», che cambia a ogni livello. */
  const gemme=[];
  const BANDE=[{n:3,y0:5,  y1:12, r:2.2, v:8,  d0:3,  d1:9 },
               {n:2,y0:13, y1:24, r:3.3, v:17, d0:5,  d1:15},
               {n:2,y0:25, y1:PROF-3, r:4.6, v:32, d0:7, d1:20}];
  BANDE.forEach(function(b){
    let messe=0;
    /* RIPIEGO PROGRESSIVO: si prova coi vincoli stretti, e se la banda
       non si riempie li si allenta. Coi vincoli fissi ne entravano tre
       su sette — le profonde non trovavano mai posto e la lezione
       "il caldo sta in basso" spariva dallo schermo. */
    for(let giro=0; giro<4 && messe<b.n; giro++){
      const lasco=giro*0.35;
      const d0=b.d0*(1-lasco), d1=b.d1*(1+lasco*1.6);
      const minD=Math.max(5,((b.v>25)?16:7)*(1-lasco));
      let t2=0;
      while(messe<b.n && t2++<2500){
        const x=X0+5+r()*(X1-X0-10), y=b.y0+r()*(b.y1-b.y0);
        const d=distVia(x,y);
        if(d<d0||d>d1) continue;
        if(rocce.some(q=>Math.hypot(q.x-x,q.y-y)<q.r+b.r+0.6)) continue;
        if(gemme.some(q=>Math.hypot(q.x-x,q.y-y)<minD)) continue;
        gemme.push({x:x,y:y,r:b.r,v:b.v,presa:false}); messe++;}}});
  S.rocce=rocce; S.gemme=gemme;
}
function ostacoloA(x,y){
  for(let i=0;i<S.rocce.length;i++){
    const q=S.rocce[i];
    if(Math.hypot(q.x-x,q.y-y)<q.r) return {t:'roccia',q:q};}
  /* IL POZZO DELLA CENTRALE È UN VARCO NELLE FONDAZIONI. Senza questa
     riga il traguardo cadeva dentro l'impronta dell'ala est e la talpa
     sbatteva contro il proprio arrivo a −3,40: livello impossibile. */
  const dentroPozzo = x>=CENTRALE.da && x<=CENTRALE.a;
  if(y<3.4 && sottoEdificio(x) && !dentroPozzo) return {t:'fondazione'};
  return null;
}
function tuboA(x,y){
  for(let i=0;i<TUBI.length;i++){
    const t=TUBI[i], R=RETI[t.r];
    if(x>=t.da&&x<=t.a&&Math.abs(y-R.prof)<=R.r+0.22) return t;}
  return null;
}

/* ====================================================================
   5. DISEGNO
   ==================================================================== */
const rf=mulberry32(20260810);
const GRANI=[],CIOTTOLI=[];
for(let i=0;i<2200;i++) GRANI.push({x:rf(),y:rf(),r:.4+rf()*1.6,a:.05+rf()*.14,t:rf()});
for(let i=0;i<160;i++) CIOTTOLI.push({x:rf(),y:rf(),r:1.5+rf()*3,s:.6+rf()*.5,a:rf()*6.28});
const quotaStrato=(i,x)=>STRATI[i].fino+Math.sin(x*.05+i*2.1)*.45+Math.sin(x*.019+i*5.7)*.85;

function disegna(){
  ctx.clearRect(0,0,LARG,ALT);
  cielo(); fronteNord(); terreno(); rocce(); tunnel(); gemme(); tubi();
  arrivo(); talpa(); etichette();
}
function cielo(){
  const g=ctx.createLinearGradient(0,0,0,SUOLO);
  g.addColorStop(0,'#5E93BE'); g.addColorStop(.55,'#9CC3DE'); g.addColorStop(1,'#DCEAF3');
  ctx.fillStyle=g; ctx.fillRect(0,0,LARG,SUOLO);
  const s=ctx.createRadialGradient(LARG*.2,SUOLO*.22,4,LARG*.2,SUOLO*.22,SUOLO);
  s.addColorStop(0,'rgba(255,247,218,.7)'); s.addColorStop(1,'rgba(255,247,218,0)');
  ctx.fillStyle=s; ctx.fillRect(0,0,LARG,SUOLO);
}
function fronteNord(){
  _nFin=0;                       /* si ricontano a ogni fotogramma */
  const U=Math.min(15,SUOLO*.072);
  ctx.fillStyle='#5F8342'; ctx.fillRect(0,SUOLO-9,LARG,9);
  ctx.fillStyle='#8A7566'; ctx.fillRect(px(-18),SUOLO-7,px(19)-px(-18),7);
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1;
  for(let p=px(-18);p<px(19);p+=13){
    ctx.beginPath(); ctx.moveTo(p,SUOLO-7); ctx.lineTo(p,SUOLO); ctx.stroke();}
  piscina(U); alaPiatta(U); corpoStorico(U); chiesa(U); centraleTermica(U); sagrato(U);
  ctx.fillStyle='#3F3527'; ctx.fillRect(0,SUOLO-2,LARG,3);
}
function chiesa(U){
  const a=px(CHIESA.da), b=px(CHIESA.a), w=b-a, H=13.5*U, y=SUOLO-H;
  if(w<20) return;

function corpoStorico(U){

/* quante finestre sono accese: è il punteggio che un bambino legge in

    g2.addColorStop(0,'rgba(255,190,90,.55)'); g2.addColorStop(1,'rgba(255,180,80,0)');

    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy+h); ctx.stroke();

    ctx.strokeStyle='#B8BEC4'; ctx.lineWidth=1.1;

    ctx.fillStyle='#6B6E70'; ctx.fillRect(cx-w/2,cy,w,h);      /* tapparella */

    ctx.strokeStyle='rgba(20,18,16,.45)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.restore();});
}
/* IL TUNNEL SCAVATO — è quello che resta, e si vede. Da Diggy: la
   soddisfazione è guardare la galleria che hai aperto tu. */
function tunnel(){
  if(S.tunnel.length<2) return;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#2A2118'; ctx.lineWidth=Math.max(9,1.35*MPX);
  ctx.beginPath();
  S.tunnel.forEach((p,i)=>i===0?ctx.moveTo(px(p[0]),py(p[1])):ctx.lineTo(px(p[0]),py(p[1])));
  ctx.stroke();
  ctx.strokeStyle='rgba(196,168,120,.35)'; ctx.lineWidth=Math.max(11,1.7*MPX);
  ctx.globalCompositeOperation='destination-over';
  ctx.stroke(); ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(226,150,60,.28)'; ctx.lineWidth=Math.max(3,.5*MPX);
  ctx.stroke();
}
function gemme(){
  S.gemme.forEach(g=>{
    if(g.presa) return;
    const X=px(g.x), Y=py(g.y), t=performance.now()*.003;
    /* più è profonda, più è grande e più il colore va verso l'arancio */
    const cal=Math.max(0,Math.min(1,(g.y-5)/28));
    const cuore='rgb(255,'+Math.round(238-90*cal)+','+Math.round(190-140*cal)+')';
    const orlo ='rgb('+Math.round(240-14*cal)+','+Math.round(190-70*cal)+','
                 +Math.round(90-50*cal)+')';
    const R=Math.max(6,g.r*MPX*0.62)*(1+.07*Math.sin(t+g.x));
    const gr=ctx.createRadialGradient(X,Y,1,X,Y,R*2.6);
    gr.addColorStop(0,'rgba(255,'+Math.round(210-70*cal)+',120,'+(0.55+0.35*cal)+')');
    gr.addColorStop(1,'rgba(226,138,48,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(X,Y,R*2.6,0,6.29); ctx.fill();
    ctx.fillStyle=orlo;
    ctx.beginPath();
    for(let k=0;k<6;k++){ const a=k/6*6.283-Math.PI/2;
      const P=[X+Math.cos(a)*R,Y+Math.sin(a)*R];
      k===0?ctx.moveTo(P[0],P[1]):ctx.lineTo(P[0],P[1]);}
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=cuore; ctx.lineWidth=Math.max(1.4,R*0.14); ctx.stroke();});
}
function tubi(){
  /* CONDOTTI, non barre. Nei primi tre metri il disegno è ingrandito,
     quindi il diametro vero (fino a 84 cm) diventava una fascia da venti
     pixel: sembravano travi. Lo spessore a video è limitato fra 5 e 11 px
     — il tubo resta alla sua quota vera, ma si legge come un tubo.
     I raccordi sono due soli e semplici: un COLLARE ogni tanto lungo il
     tratto, e a ciascuna estremità un GOMITO corto che scende. */
  TUBI.forEach(t=>{
    const R=RETI[t.r];
    const a=px(Math.max(t.da,X0)), b=px(Math.min(t.a,X1));
    if(b-a<4) return;
    const y=py(R.prof);
    const vero=py(R.prof+R.r)-py(R.prof-R.r);
    const sp=Math.max(5,Math.min(11,vero*0.42));
    const scuro=ombreggia(R.col,-0.42), chiaro=ombreggia(R.col,0.40);

    /* il letto di sabbia: appena accennato, non una fascia piena */
    ctx.strokeStyle='rgba(226,214,182,.22)'; ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(a,y+sp*0.9+3); ctx.lineTo(b,y+sp*0.9+3); ctx.stroke();
    ctx.setLineDash([]);

    /* il corpo del condotto */
    ctx.fillStyle=R.col; ctx.fillRect(a,y-sp/2,b-a,sp);
    ctx.fillStyle=chiaro; ctx.fillRect(a,y-sp/2,b-a,Math.max(1,sp*0.22));
    ctx.fillStyle=scuro;  ctx.fillRect(a,y+sp/2-Math.max(1,sp*0.20),b-a,Math.max(1,sp*0.20));

    /* i collari: uno ogni sei metri, sporgono di un pelo */
    const passo=Math.max(38,6*MPX);
    for(let p=a+passo*0.6;p<b-4;p+=passo){
      ctx.fillStyle=scuro; ctx.fillRect(p,y-sp/2-1.5,3,sp+3);
      ctx.fillStyle=chiaro; ctx.fillRect(p,y-sp/2-1.5,1,sp+3);}

    /* i due terminali: collare e gomito corto verso il basso */
    [[a,1],[b,-1]].forEach(q=>{
      const X=q[0], v=q[1];
      ctx.fillStyle=scuro; ctx.fillRect(X-(v>0?0:3),y-sp/2-2,3,sp+4);
      const g=sp*1.5;
      ctx.fillStyle=R.col; ctx.fillRect(X+(v>0?0:-sp),y-sp/2,sp,g);
      ctx.fillStyle=scuro; ctx.fillRect(X+(v>0?0:-sp),y-sp/2+g-2,sp,2);});

    /* il nastro segnalatore, mezzo metro sopra: sottile, tratteggiato */
    ctx.strokeStyle=R.col; ctx.globalAlpha=.5; ctx.lineWidth=1.6;
    ctx.setLineDash([9,6]);
    const yn=py(Math.max(0.20,R.prof-0.42));
    ctx.beginPath(); ctx.moveTo(a,yn); ctx.lineTo(b,yn); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;});
}
/* schiarisce o scurisce un colore esadecimale: serve a dare il tondo al
   tubo senza definire tre colori a mano per ogni rete */
function ombreggia(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(f>0){ r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; }
  else   { r*=(1+f); g*=(1+f); b*=(1+f); }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function arrivo(){
  const a=px(CENTRALE.da), b=px(CENTRALE.a);
  ctx.fillStyle='rgba(212,160,23,.15)'; ctx.fillRect(a,py(0),b-a,py(3.4)-py(0));
  ctx.strokeStyle='rgba(212,160,23,.9)'; ctx.lineWidth=2.4; ctx.setLineDash([7,5]);
  ctx.strokeRect(a,py(0),b-a,py(3.4)-py(0)); ctx.setLineDash([]);
}
function talpa(){
  /* la sacca da cui è partita, che resta accesa in fondo */
  const sg=ctx.createRadialGradient(px(S.sacca.x),py(S.sacca.y),2,
                                    px(S.sacca.x),py(S.sacca.y),48);
  sg.addColorStop(0,'rgba(255,196,92,.8)'); sg.addColorStop(1,'rgba(226,138,48,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(px(S.sacca.x),py(S.sacca.y),48,0,6.29); ctx.fill();

  /* ================= ORZO, DI PROFILO ==============================
     Prima l'avevo disegnato DI FACCIA — due occhi affiancati e la bocca —
     in una scena vista di LATO: veniva uno smile. Da questa inquadratura
     si vede il profilo: la trivella che punta avanti, UN occhio solo,
     l'elmetto sul dorso e le ZAMPE sotto, che remano nella terra.
     Il disegno è in coordinate locali con la punta verso -Y; quando ORZO
     punta a sinistra si specchia, così il dorso resta sempre in alto.  */
  const X=px(S.x), Y=py(S.y);
  const L=Math.max(32,3.4*MPX), W=Math.max(20,2.2*MPX);
  const t=performance.now()*0.004;
  const verso=(Math.sin(S.dir)>=0)?1:-1;      /* dorso sempre dalla stessa parte */
  ctx.save(); ctx.translate(X,Y); ctx.rotate(S.dir); ctx.scale(verso,1);

  /* --- il fascio della lampada, davanti alla punta ------------------ */
  const fascio=ctx.createRadialGradient(0,-L*0.6,2,0,-L*1.5,L*2.2);
  fascio.addColorStop(0,'rgba(255,244,196,.55)');
  fascio.addColorStop(1,'rgba(255,236,170,0)');
  ctx.fillStyle=fascio;
  ctx.beginPath(); ctx.moveTo(-W*0.20,-L*0.55);
  ctx.lineTo(-W*1.5,-L*2.4); ctx.lineTo(W*1.5,-L*2.4); ctx.lineTo(W*0.20,-L*0.55);
  ctx.closePath(); ctx.fill();

  /* --- LE ZAMPE, che remano: due davanti e due dietro --------------- */
  function zampa(base,fase,lung,gross){
    const a=0.55+Math.sin(t*5.5+fase)*0.62;    /* la bracciata */
    ctx.save(); ctx.translate(W*0.30,base); ctx.rotate(a);
    ctx.strokeStyle='#8A6A34'; ctx.lineCap='round';
    ctx.lineWidth=Math.max(2,W*gross);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,lung); ctx.stroke();
    ctx.strokeStyle='#C9A45C'; ctx.lineWidth=Math.max(1,W*gross*0.45);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,lung*0.75); ctx.stroke();
    /* gli artigli */
    ctx.strokeStyle='#DDE2E6'; ctx.lineWidth=Math.max(1,W*0.055);
    for(let k=-1;k<=1;k++){
      ctx.beginPath(); ctx.moveTo(0,lung);
      ctx.lineTo(k*W*0.13,lung+W*0.16); ctx.stroke();}
    ctx.restore();}
  zampa( L*0.30, 2.4,  L*0.24, 0.10);          /* la posteriore, dietro il corpo */

  /* --- il corpo di profilo: testa affusolata e groppa --------------- */
  const corpo=ctx.createLinearGradient(-W*0.55,0,W*0.55,0);
  corpo.addColorStop(0,'#E6C079'); corpo.addColorStop(0.42,'#B98B45');
  corpo.addColorStop(1,'#6B4A21');
  ctx.fillStyle=corpo;
  ctx.beginPath();
  ctx.moveTo(-W*0.16,-L*0.30);                        /* attacco del muso */
  ctx.quadraticCurveTo(-W*0.56,-L*0.10,-W*0.50,L*0.22);
  ctx.quadraticCurveTo(-W*0.42,L*0.62,0,L*0.62);      /* la coda          */
  ctx.quadraticCurveTo(W*0.46,L*0.60,W*0.50,L*0.18);
  ctx.quadraticCurveTo(W*0.50,-L*0.14,W*0.16,-L*0.30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(70,46,18,.7)'; ctx.lineWidth=1.2; ctx.stroke();
  /* rivetti lungo il dorso */
  ctx.fillStyle='rgba(255,232,180,.7)';
  for(let k=0;k<4;k++){
    ctx.beginPath(); ctx.arc(-W*0.34,-L*0.08+k*L*0.17,Math.max(0.8,W*0.05),0,6.29);
    ctx.fill();}
  /* l'ingranaggio sul fianco, che gira */
  ctx.save(); ctx.translate(W*0.06,L*0.26); ctx.rotate(t*1.6);
  ctx.fillStyle='#C99A42';
  for(let k=0;k<8;k++){ const a=k/8*6.283;
    ctx.fillRect(Math.cos(a)*W*0.17-W*0.05,Math.sin(a)*W*0.17-W*0.05,W*0.10,W*0.10);}
  ctx.beginPath(); ctx.arc(0,0,W*0.16,0,6.29); ctx.fill();
  ctx.fillStyle='#6E4E23'; ctx.beginPath(); ctx.arc(0,0,W*0.055,0,6.29); ctx.fill();
  ctx.restore();

  /* le zampe anteriori passano DAVANTI al corpo: sono quelle che si
     vedono di profilo, e sono le più grosse — è una talpa che scava */
  zampa(-L*0.04, 0,   L*0.32, 0.15);
  zampa( L*0.12, 1.1, L*0.27, 0.12);

  /* --- LA TRIVELLA: un cono grosso ad anelli, non uno spillo. Prima
     partiva da W*0,34 e si stringeva dell'82%: veniva un ago di due
     pixel. Adesso parte larga quanto il muso e resta piena fino quasi
     in punta, come nella foto. --------------------------------------- */
  for(let k=0;k<7;k++){
    const u=k/7, r=W*0.44*(1-u*0.60), yy=-L*0.26-u*L*0.46;
    const sf=ctx.createLinearGradient(-r,0,r,0);
    sf.addColorStop(0,'#7C8085'); sf.addColorStop(0.38,'#E8EDF1');
    sf.addColorStop(0.72,'#AFB5BA'); sf.addColorStop(1,'#5E6166');
    ctx.fillStyle=sf;
    const off=Math.sin(t*3+k*0.85)*r*0.14;
    ctx.beginPath();
    ctx.ellipse(off*0.28,yy,r,Math.max(2,L*0.075),0,0,6.29); ctx.fill();
    ctx.strokeStyle='rgba(40,44,48,.45)'; ctx.lineWidth=1; ctx.stroke();}
  ctx.fillStyle='#B8BFC5';
  ctx.beginPath(); ctx.moveTo(-W*0.10,-L*0.70); ctx.lineTo(W*0.10,-L*0.70);
  ctx.lineTo(0,-L*0.84); ctx.closePath(); ctx.fill();

  /* --- l'elmetto sul dorso, con la lampada accesa in avanti ---------- */
  ctx.save(); ctx.translate(-W*0.06,-L*0.18); ctx.rotate(-0.30);
  ctx.fillStyle='#C08B3E';
  ctx.beginPath(); ctx.ellipse(0,0,W*0.34,L*0.17,0,Math.PI,0); ctx.fill();
  ctx.fillStyle='#8E6428'; ctx.fillRect(-W*0.40,0,W*0.80,Math.max(1.6,L*0.045));
  const lampG=ctx.createRadialGradient(-W*0.16,-L*0.05,0.5,-W*0.16,-L*0.05,W*0.16);
  lampG.addColorStop(0,'#FFF8DC'); lampG.addColorStop(1,'#E8B21E');
  ctx.fillStyle=lampG;
  ctx.beginPath(); ctx.arc(-W*0.16,-L*0.05,W*0.13,0,6.29); ctx.fill();
  ctx.restore();

  /* --- UN occhio solo, di profilo, con la sopracciglia --------------- */
  const ox=-W*0.02, oy=-L*0.14;
  ctx.fillStyle='#FFB020';
  ctx.beginPath(); ctx.arc(ox,oy,Math.max(2,W*0.15),0,6.29); ctx.fill();
  ctx.fillStyle='#3A2408';
  ctx.beginPath(); ctx.arc(ox-W*0.03,oy-L*0.01,Math.max(1,W*0.07),0,6.29); ctx.fill();
  ctx.fillStyle='#FFF3D0';
  ctx.beginPath(); ctx.arc(ox-W*0.06,oy-L*0.03,Math.max(0.6,W*0.04),0,6.29); ctx.fill();
  ctx.save(); ctx.translate(ox,oy-L*0.10); ctx.rotate(-0.42);
  ctx.fillStyle='#7E858B'; ctx.fillRect(-W*0.16,-W*0.05,W*0.32,Math.max(1.4,W*0.085));
  ctx.restore();

  ctx.restore();

  /* la mira: dove sta puntando */
  if(S.mira&&S.attiva){
    ctx.strokeStyle='rgba(212,160,23,.5)'; ctx.lineWidth=1.6; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(px(S.mira[0]),py(S.mira[1])); ctx.stroke();
    ctx.setLineDash([]);}
}
function etichette(){
  ctx.textAlign='left'; ctx.font='600 11px Lexend, sans-serif';
  [1,2,3,5,10,15,20,25,30,35].forEach(m=>{ if(m>=PROF) return;
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,py(m)); ctx.lineTo(LARG,py(m)); ctx.stroke();

  ctx.setLineDash([7,5]); ctx.strokeStyle='rgba(212,160,23,.45)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(0,py(YSPACCO)); ctx.lineTo(LARG,py(YSPACCO)); ctx.stroke();
  ctx.setLineDash([]);
  if(S.msg&&performance.now()-S.msgT<3400){
    ctx.font='700 15px Atkinson Hyperlegible, sans-serif'; ctx.textAlign='center';
    const w=ctx.measureText(S.msg).width+28;
    ctx.fillStyle='rgba(12,18,26,.92)'; ctx.fillRect(LARG/2-w/2,12,w,33);
    ctx.strokeStyle='rgba(212,160,23,.7)'; ctx.lineWidth=1.4;
    ctx.strokeRect(LARG/2-w/2,12,w,33);

}

/* ====================================================================
   6. LA GUIDA — la talpa avanza sempre e vira PIANO. È il limite di
   sterzata a rendere la guida una cosa che si impara.
   ==================================================================== */
const VEL=3.6, STERZO=1.6;
/* L'ENERGIA NON FERMA PIÙ LA TALPA: era un limite arbitrario, chi
   sbagliava strada si vedeva chiudere la partita senza poter rimediare.
   Resta come PUNTEGGIO — decide le stelle — ma si ferma a zero.
   Il taglio sta QUI, in un posto solo: metterlo in fondo a passo() non
   bastava, perché sulle collisioni la funzione esce prima e l'energia
   scendeva a meno seicento. */
function consuma(n){ S.energia=Math.max(0,S.energia-n); }
function avvisa(t){ S.msg=t; S.msgT=performance.now(); }

/* ---- la musichetta della vittoria ---------------------------------
   Un <audio> solo, riusato: crearne uno nuovo a ogni partita lascia
   dietro elementi che continuano a tenere il file in memoria. Il
   browser blocca l'audio finché non c'è stato un gesto dell'utente —
   qui il gesto c'è sempre (il bottone "Accendi la talpa"), ma la
   promessa di play() va comunque raccolta, altrimenti in console
   compare un errore ogni volta. */
const suonoVinta=new Audio('win.wav');
suonoVinta.preload='auto';
let audioAcceso=(localStorage.getItem('talpa-audio')!=='0');
function suona(){
  if(!audioAcceso) return;
  try{ suonoVinta.currentTime=0; const pr=suonoVinta.play();
       if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
}

/* ---- IL RUMORE DELLA FRESA -----------------------------------------
   Non è un file: è rumore bianco filtrato a banda stretta, che è come
   suona davvero una punta nella terra. Costa zero byte e si accende e
   spegne con una rampa, senza scatti. L'AudioContext si crea solo dopo
   un gesto dell'utente, altrimenti il browser lo tiene sospeso. */
let ac=null, gainFresa=null;
function avviaAudio(){
  if(ac) return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const n=ac.sampleRate*2, buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=300; bp.Q.value=0.8;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=850;
    gainFresa=ac.createGain(); gainFresa.gain.value=0;
    src.connect(bp); bp.connect(lp); lp.connect(gainFresa); gainFresa.connect(ac.destination);
    src.start();
  }catch(e){ ac=null; }
}
function fresa(accesa){
  if(!ac||!gainFresa) return;
  gainFresa.gain.setTargetAtTime((accesa&&audioAcceso)?0.15:0, ac.currentTime, 0.07);
}

/* ---- LA MUSICA DI SOTTOFONDO ---------------------------------------
   YouTube in un iframe invisibile, coi parametri di casa:
   rel=0 · playsinline=1 · enablejsapi=1. Si rimette in moto da sola a
   fine video, così non serve un file audio nel progetto. */
/* IL NOME DELLA TALPA. Sta in una costante sola: cambiarlo qui lo
   cambia in tutta l'app, titolo compreso. */
const TALPA='ORZO';
const VIDEO_MUSICA='QBp3ggb8QB0';
let yt=null;
function avviaMusica(){
  if(yt||!audioAcceso) return;
  if(!window.YT){
    const t=document.createElement('script');
    t.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(t);
    window.onYouTubeIframeAPIReady=creaYT;
  } else creaYT();
}
function creaYT(){
  if(yt) return;
  yt=new YT.Player('yt',{ videoId:VIDEO_MUSICA, height:'1', width:'1',
    playerVars:{autoplay:1,controls:0,rel:0,playsinline:1,enablejsapi:1,
                loop:1,playlist:VIDEO_MUSICA,modestbranding:1},
    events:{
      onReady:function(e){ e.target.setVolume(22);
        if(audioAcceso) e.target.playVideo(); else e.target.pauseVideo(); },
      onStateChange:function(e){
        if(e.data===YT.PlayerState.ENDED) e.target.playVideo(); }}});
}
function musica(accesa){
  if(!yt||!yt.playVideo) return;
  try{ accesa?yt.playVideo():yt.pauseVideo(); }catch(e){}
}
function commutaAudio(){
  audioAcceso=!audioAcceso;
  localStorage.setItem('talpa-audio',audioAcceso?'1':'0');
  if(!audioAcceso){ suonoVinta.pause(); fresa(false); }
  musica(audioAcceso);
  if(audioAcceso) avviaMusica();
  segnaMusica();
}
function segnaMusica(){
  const b=document.getElementById('bMusica'); if(!b) return;
  b.textContent = audioAcceso ? 'Musica accesa' : 'Musica spenta';
  b.setAttribute('aria-pressed',String(audioAcceso));
}
function passo(dt){
  /* le frecce sterzano direttamente: è il comando più preciso su un
     portatile, e non richiede di tenere premuto il tasto del trackpad */
  if(S.tasto){
    S.dir+=S.tasto*STERZO*dt;
    consuma(STERZO*dt*6);
  } else if(S.mira){
    const dx=S.mira[0]-S.x, dy=S.mira[1]-S.y;
    let d=Math.atan2(dx,-dy)-S.dir;
    while(d>Math.PI) d-=6.283; while(d<-Math.PI) d+=6.283;
    const max=STERZO*dt, g=Math.max(-max,Math.min(max,d));
    S.dir+=g; consuma(Math.abs(g)*6);
  }
  /* La sterzata era limitata a ±1,4 rad: la talpa non poteva mai
     puntare di lato o in leggera discesa, quindi incastrata sotto una
     fondazione non aveva NESSUNA direzione di fuga. Ora arriva a ±2,0
     (poco oltre l'orizzontale): risalire resta il modo naturale, ma
     scansare un ostacolo è possibile. */
  S.dir=Math.max(-2.6,Math.min(2.6,S.dir));
  const nx=S.x+Math.sin(S.dir)*VEL*dt, ny=S.y-Math.cos(S.dir)*VEL*dt;
  /* IL CALORE È IL CARBURANTE. In profondità il terreno è caldo e ORZO
     si ricarica; salendo si raffredda e il consumo cresce fino al triplo.
     Non c'è nessun numero da leggere: si vede il termometro svuotarsi
     in fretta quando si sale, e chi resta basso arriva con più calore. */
  const freddo=1+2*Math.max(0,Math.min(1,(14-S.y)/14));
  consuma(VEL*dt*0.85*freddo);
  if(S.y>24) S.energia=Math.min(MAXE,S.energia+dt*6.5);
  if(nx<X0+1||nx>X1-1){ S.dir=-S.dir*.6; avvisa('Sei al bordo dello scavo.'); return; }
  const t=tuboA(nx,ny);
  if(t){ consuma(20); S.attiva=false;
    avvisa('Hai rotto: '+RETI[t.r].nome.toLowerCase()+'.'); finisci(false,'tubo'); return; }
  const o=ostacoloA(nx,ny);
  if(o){
    /* SI CERCA UN VARCO, non si rimbalza sul posto. La versione prima
       provava UNA sola direzione: se anche quella era bloccata la talpa
       non si muoveva, e sotto una fondazione macinava urti all'infinito
       — 1193, segnalati da Andrea. Adesso si prova un ventaglio di
       direzioni in ordine (di lato verso la centrale, di lato dall'altra
       parte, in leggera discesa) e si prende la prima libera. Se non ce
       n'è nessuna si torna indietro di un passo lungo il tunnel già
       scavato, che per costruzione è libero: da lì si esce sempre. */
    S.colpi++; consuma(6);
    const vc=((CENTRALE.da+CENTRALE.a)/2-S.x)>=0?1:-1;
    /* Le direzioni si provano dalla più utile alla più disperata, e
       comprendono la DISCESA: sotto un solaio le vie di lato sono
       ancora dentro la fondazione, e l'unica uscita è tornare giù.
       Il passo di fuga è più lungo del passo normale, altrimenti non
       basta a uscire dai cinque centimetri di massiccio. */
    const prove=[vc*1.4,-vc*1.4, vc*1.9,-vc*1.9, vc*2.3,-vc*2.3, vc*2.6,-vc*2.6];
    const passo=VEL*dt*3.0;
    let fuga=null;
    for(let k=0;k<prove.length;k++){
      const d=prove[k];
      const sx=S.x+Math.sin(d)*passo, sy=S.y-Math.cos(d)*passo;
      if(sx>X0+1.2&&sx<X1-1.2&&sy<PROF-0.5&&sy>0.1
         &&!ostacoloA(sx,sy)&&!tuboA(sx,sy)){ fuga={d:d,x:sx,y:sy}; break;}}
    if(fuga){ S.dir=fuga.d; S.x=fuga.x; S.y=fuga.y;
      const u=S.tunnel[S.tunnel.length-1];
      if(!u||Math.hypot(S.x-u[0],S.y-u[1])>0.45) S.tunnel.push([S.x,S.y]);
    }else if(S.tunnel.length>1){
      /* ultima risorsa: si torna indietro nella galleria già scavata,
         che per costruzione è libera. Di lì una via c'è sempre. */
      S.tunnel.pop();
      const q=S.tunnel[S.tunnel.length-1];
      S.x=q[0]; S.y=q[1]; S.dir=vc*1.4;
    }else{ S.y=Math.min(PROF-1,S.y+0.6); S.dir=vc*1.4; }
    avvisa(o.t==='roccia'?'Roccia: ORZO la costeggia.'
                         :'Fondazione: ORZO cerca un passaggio di lato.');
    return; }
  S.x=nx; S.y=ny;
  const u=S.tunnel[S.tunnel.length-1];
  if(!u||Math.hypot(S.x-u[0],S.y-u[1])>0.45) S.tunnel.push([S.x,S.y]);
  S.gemme.forEach(g=>{ if(!g.presa && Math.hypot(g.x-S.x,g.y-S.y)<(g.r||1.5)){
    g.presa=true; S.raccolte++; S.energia=Math.min(MAXE,S.energia+g.v);
    avvisa('Sacca di calore: +'+g.v+' di energia.');}});
  if(S.y<=0.15){ S.attiva=false;
    const dentro=S.x>=CENTRALE.da&&S.x<=CENTRALE.a;
    finisci(dentro,dentro?'arrivo':'fuori'); }
}
function finisci(vinta,perche){
  if(S.finita) return;
  S.finita=true; S.vinta=vinta;
  const E=Math.max(0,Math.round(S.energia)), n=stelle(vinta,E);
  /* il calore che è arrivato in centrale: da qui in poi la facciata lo
     mostra da sola — finestre accese e camino che smette di fumare */
  S.calore = vinta ? Math.max(0.25,Math.min(1,E/95)) : 0;
  const dist=Math.abs(S.x-(CENTRALE.da+CENTRALE.a)/2);

  /* UNA RIGA, non un paragrafo. Le card lunghe non le legge nessuno:
     il verdetto sta nelle stelle, il perché in una frase sola. */
  const verdetto = vinta
    ? 'Livello superato'
    : (perche==='tubo'?'Hai rotto un tubo.'
      :'Uscito fuori posto.');
  const riga = vinta
    ? (n===3?'Guarda la scuola: tutte le finestre sono calde e il camino ha smesso di fumare.'
      :n===2?'Qualche aula è ancora fredda. Più calore porti su, più finestre si accendono.'
      :'Sei arrivato quasi freddo: si è scaldata solo qualche aula.')
    : (perche==='tubo'?'Era disegnato: i tubi si vedono.'
      :'Sei uscito a '+dist.toFixed(0)+' m dalla centrale.');

  let h='<div class="esito">';
  /* il ritratto della talpa: quadrato, ha gia' la sua cornice dorata,
     quindi niente bordo aggiunto. Se il file manca la card regge lo
     stesso — l'immagine si toglie da sola. */
  h+='<img src="talpa2.jpg" alt="La talpa" style="width:104px;height:104px;'
    +'object-fit:cover;border-radius:14px;display:block;margin:0 auto 4px" '
    +'onerror="this.remove()">';
  h+='<div class="stelle" id="stelle">'+STELLA+STELLA+STELLA+'</div>';
  h+='<div class="verdetto" style="color:'+(vinta?'var(--oro)':'var(--ambra)')+'">'
    +verdetto+'</div>';
  h+='<div class="riga1">'+riga+'</div>';
  h+='<div class="numeri">'
    +'<div><b>'+E+'</b><span>energia</span></div>'
    +'<div><b>'+S.raccolte+'/'+S.gemme.length+'</b><span>sacche</span></div>'
    +'<div><b>'+S.colpi+'</b><span>urti</span></div>'
    +'<div><b>'+lung().toFixed(0)+' m</b><span>galleria</span></div></div>';
  /* la domanda resta, ma solo quando c'è qualcosa da imparare */
  if(n<3) h+='<div class="pensiero">Guarda la galleria che hai lasciato: '
    +'<b>dove hai virato più del necessario?</b> La talpa non frena — le curve '
    +'si cominciano prima.</div>';
  h+='<div id="bacheca" style="margin-top:14px;border-top:1px solid var(--linea);'
    +'padding-top:12px;text-align:left"></div>';
  h+='<div class="passi"><button class="btn oro" style="flex:1 1 180px" id="bNu">'
    +'Un altro sottosuolo</button>'
    +'<button class="btn" style="flex:1 1 150px" id="bAn">Rigioca questo</button>'
    +'</div></div>';
  modale(h);

  /* le stelle si accendono una alla volta, e la musichetta parte con la prima */
  const box=document.getElementById('stelle');
  for(let k=0;k<n;k++) setTimeout(function(){
    box.children[k].classList.add('on'); },260+k*300);
  if(vinta) setTimeout(suona,240);

  document.getElementById('bAn').onclick=function(){chiudi();nuovo(S.seme);};
  document.getElementById('bNu').onclick=function(){chiudi();nuovo();};

  Bacheca.invia({nick:S.nick||'anonimo',energia:E,sacche:S.raccolte,
    urti:S.colpi,esito:vinta?'arrivata':'ferma'});
  Bacheca.mostra(document.getElementById('bacheca'));
}
/* LE STELLE. Una misura sola, così si capisce senza spiegazioni:
   l'energia con cui arrivi. Le sacche di calore ne restituiscono, quindi
   chi devia bene ne ha di più — il trade-off entra da solo nel punteggio,
   senza aggiungere un secondo contatore. */
function stelle(vinta,energia){
  if(!vinta) return 0;
  if(energia>=75) return 3;
  if(energia>=45) return 2;
  return 1;
}
const STELLA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9'
  +'-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z" fill="#D4A017"'
  +' stroke="#8C6A0F" stroke-width="1" stroke-linejoin="round"/></svg>';

function lung(){ let L=0;
  for(let i=1;i<S.tunnel.length;i++)
    L+=Math.hypot(S.tunnel[i][0]-S.tunnel[i-1][0],S.tunnel[i][1]-S.tunnel[i-1][1]);
  return L; }

/* ====================================================================
   7. COMANDI — si tiene il dito dove si vuole andare. Nient'altro.
   ==================================================================== */
(function comandi(){
  /* TRE MODI DI GUIDARE, perché tre sono gli attrezzi dell'aula.
     - TOCCO (iPad): si tiene il dito dove si vuole andare.
     - MOUSE / TRACKPAD: NON serve tenere premuto. Si fa un clic per
       partire, poi ORZO segue il puntatore da solo. Tenere il tasto
       premuto e muovere insieme, su un trackpad, è scomodo — è il
       motivo per cui era difficile manovrarlo.
     - FRECCE (o A/D): sterzata continua, la più precisa su un portatile.
       Basta premerle per partire. */
  function punto(e){ const r=tela.getBoundingClientRect();
    const p=(e.touches&&e.touches[0])?e.touches[0]:e;
    return [xDaPx((p.clientX-r.left)*(tela.width/r.width)),
            yDaPy((p.clientY-r.top)*(tela.height/r.height))]; }

  /* --- tocco: come prima --- */
  tela.addEventListener('touchstart',function(e){ if(S.finita) return;
    S.attiva=true; S.mira=punto(e); e.preventDefault(); },{passive:false});
  tela.addEventListener('touchmove',function(e){ if(S.mira){ S.mira=punto(e);
    e.preventDefault(); } },{passive:false});
  tela.addEventListener('touchend',function(){ S.mira=null; });

  /* --- mouse e trackpad: il clic fa partire, poi basta muovere --- */
  tela.addEventListener('mousedown',function(e){ if(S.finita) return;
    S.attiva=true; S.mira=punto(e); e.preventDefault(); });
  tela.addEventListener('mousemove',function(e){
    if(S.finita||!S.attiva) return;
    if(S.tasto) return;                    /* le frecce hanno la precedenza */
    S.mira=punto(e); });
  tela.addEventListener('mouseleave',function(){ S.mira=null; });

  /* --- frecce e A/D --- */
  function giuTasto(e){
    const k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){ S.tasto=-1; }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ S.tasto=1; }
    else return;
    if(!S.finita){ S.attiva=true; S.mira=null; }
    e.preventDefault();}
  function suTasto(e){
    const k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ArrowRight'||k==='d'||k==='D') S.tasto=0;}
  addEventListener('keydown',giuTasto);
  addEventListener('keyup',suTasto);
  addEventListener('blur',function(){ S.tasto=0; });
})();

   8. INTERFACCIA

const $=id=>document.getElementById(id);
function contatori(){

     arancio quando ORZO è carico di calore, grigio-azzurro quando si è
     raffreddato. Il numero resta piccolo, per te e per i più grandi —
     ma non è il canale: se lo togli, il gioco insegna lo stesso. */
  const q=Math.max(0,Math.min(1,S.energia/MAXE));
  const col='rgb('+Math.round(120+135*q)+','+Math.round(150+50*q)+','
    +Math.round(190-140*q)+')';

    '<div class="c" style="min-width:136px;padding-top:7px">'

    '<div class="c oro"><b>'+S.raccolte+'/'+S.gemme.length+'</b><span>sacche</span></div>'+
    '<div class="c'+(S.colpi?' ambra':'')+'"><b>'+S.colpi+'</b><span>urti</span></div>';
}

    +'<span><b>Clic per partire</b>, poi segui col puntatore · <b>← →</b> per '
    +'sterzare · vira piano, non frena</span>';
}

/* ====================================================================
   LA BACHECA DELLA GIORNATA — Google Sheets via Apps Script.
   Chiamate in JSONP: Apps Script non manda intestazioni CORS.
   Il gioco funziona SEMPRE anche senza rete: se il foglio non risponde
   la bacheca si spegne e basta, e l'app lo dice.
   ==================================================================== */
const Bacheca={
  URL:'https://script.google.com/macros/s/AKfycby-gahd2YUorxQD644DEWY6jdUXUi9flCNGu8sf9hRdjXDRi0iwCqwla6JZgF11mFcI/exec',
  chiama(par,cb){
    if(!this.URL){cb(null);return;}
    const nome='tp_cb_'+Math.random().toString(36).slice(2,9);
    const t=setTimeout(function(){delete window[nome];cb(null);},7000);
    window[nome]=function(d){clearTimeout(t);delete window[nome];sc.remove();cb(d);};
    par.callback=nome;
    const sc=document.createElement('script');
    sc.src=this.URL+'?'+new URLSearchParams(par).toString();
    sc.onerror=function(){clearTimeout(t);delete window[nome];sc.remove();cb(null);};
    document.head.appendChild(sc);},
  invia(d){ this.chiama(Object.assign({azione:'salva',gioco:'talpa'},d),function(){}); },
  mostra(box){
    box.innerHTML='<div class="occ">La bacheca di oggi</div>'
      +'<p style="margin-top:0">Cerco chi ha giocato oggi…</p>';
    this.chiama({azione:'leggi'},function(d){
      if(!d||!d.ok){
        box.innerHTML='<div class="occ">La bacheca di oggi</div>'
          +'<p style="margin-top:0">Non sono riuscito a leggerla. Il tuo risultato '
          +'resta valido: riprova più tardi.</p>'; return;}
      let h='<div class="occ">La bacheca di oggi</div>';
      if(!d.classifica.length){
        h+='<p style="margin-top:0">Oggi non è ancora arrivato nessuno alla centrale. '
          +(d.partite?'Ci hanno provato in '+d.partite+'.':'Sei il primo a provarci.')+'</p>';
      }else{
        h+='<p style="margin-top:0">Oggi ce l\'hanno fatta in <b>'+d.riuscite+'</b> '
          +'su '+d.partite+' partite. Conta l\'<b>energia rimasta</b>: chi arriva con '
          +'più energia ha fatto la strada più pulita.</p><div style="margin-top:8px">';
        d.classifica.slice(0,8).forEach(function(r,i){
          h+='<div class="voce"><span class="q" style="width:22px;height:22px;'
            +'border-radius:50%;display:flex;align-items:center;justify-content:center;'
            +'background:'+(i===0?'var(--oro)':'var(--pann2)')+';color:'
            +(i===0?'#1a1206':'var(--muto)')+';font-weight:700;font-size:.72rem">'
            +(i+1)+'</span><span><b>'+r.nick+'</b> — energia <b>'+r.energia+'</b>'
            +' · '+r.sacche+' sacche'+(r.urti?' · '+r.urti+' urti':'')+'</span></div>';});
        h+='</div>';}
      h+='<p style="font-size:.78rem">A mezzanotte la bacheca si azzera: domani '
        +'si riparte da zero per tutti.</p>';
      box.innerHTML=h;});}
};

function modale(h){ $('modale').innerHTML=h; $('velo').classList.add('on'); }
function chiudi(){ $('velo').classList.remove('on'); }
function guida(){
  /* TESTO CORTO. La versione prima erano tre paragrafi e un riquadro:
     a dieci anni non si leggono. Qui: una riga di storia, una di
     comandi, tre divieti in fila. */
  modale('<img src="talpa.jpg" alt="'+TALPA+'" '
   +'style="width:100%;height:140px;object-fit:cover;object-position:center 42%;'

   +'<h2>Porta il calore alla scuola</h2>'
   +'<p>Trenta metri sotto il cortile c\'è <b>roccia calda</b>. Se '+TALPA
   +' la porta su fino alla <b>centrale termica</b>, la scuola si scalda '

   +'<p><b>Fai un clic per partire</b>, poi '+TALPA+' segue il puntatore: non '

  const inp=document.getElementById('nick');
  if(inp) inp.value=localStorage.getItem('talpa-nick')||'';
  $('bVia').onclick=function(){

      localStorage.setItem('talpa-nick',S.nick); }
    /* è QUI che si può accendere l'audio: prima del gesto dell'utente il
       browser tiene l'AudioContext sospeso e blocca la riproduzione */

}
/* ====================================================================
   9. AVVIO
   ==================================================================== */
function nuovo(seme){
  S.seme = seme || (Date.now().toString(36).slice(-4)
           +Math.floor(Math.random()*999)).toUpperCase();
  generaLivello(S.seme);
    /* SI PARTE A METÀ SERBATOIO, non pieno. Era questo il difetto della
     taratura: partendo carichi al massimo non c'era NIENTE da guadagnare
     restando in basso, e il gioco premiava chi scappava in superficie —
     l'opposto della lezione. Adesso il calore va preso dove sta. */
  S.x=S.sacca.x; S.y=S.sacca.y; S.dir=0; S.energia=58;
  S.tunnel=[[S.x,S.y]]; S.raccolte=0; S.colpi=0;
  S.attiva=false; S.finita=false; S.vinta=false; S.mira=null; S.msg=''; S.calore=0;
  /* prima si riempiono intestazione e striscia, POI si misura lo spazio
     che resta: misurare prima dava una tela più alta del contenitore. */
  legenda(); note(); contatori(); dimensiona();
  requestAnimationFrame(dimensiona);
}
$('bAiuto').onclick=guida;
$('bMusica').onclick=commutaAudio;
segnaMusica();
$('bRicomincia').onclick=function(){nuovo(S.seme);};
$('bTorna').onclick=function(){location.href='index.html';};
$('velo').onclick=function(e){ if(e.target===$('velo')) chiudi(); };

/* PRIMA si costruisce il livello, POI parte il ciclo. Al contrario il
   primo fotogramma disegnava con MPX ancora a 1: la facciata veniva di
   larghezza negativa, arc() sollevava IndexSizeError e l'eccezione
   abortiva il resto dello script — nuovo() non veniva mai eseguito. */
nuovo(new URLSearchParams(location.search).get('seme')||undefined);
guida();

let ultimo=performance.now();
(function ciclo(t){
  requestAnimationFrame(ciclo);
  const dt=Math.min(.045,(t-ultimo)/1000); ultimo=t;
  if(S.attiva&&!S.finita){ passo(dt); contatori(); }
  fresa(S.attiva && !!S.mira && !S.finita);
  disegna();
})(performance.now());
