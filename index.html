<!DOCTYPE html>
<html lang="it">
<head>

<title>Campus Sacra Famiglia</title>

<style>
  :root{ --blu:#123E90; --blu2:#0d2f6e; --ambra:#B8860B; --ambra2:#D4A017; --verde:#1f7a43; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#dfe8ef;
    font-family:'Atkinson Hyperlegible',sans-serif;font-size:18px}
  #scena{position:fixed;inset:0;display:block;touch-action:none}

  /* ---- intestazione ---- */
  #targa{position:fixed;top:14px;left:14px;z-index:20;display:block;
    filter:drop-shadow(0 3px 12px rgba(0,0,0,.30))}
  #marchio{width:184px;height:89px;display:block}

  /* ---- carta dell'indizio ---- */
  #carta{position:fixed;top:116px;left:14px;z-index:20;width:min(370px,calc(100vw - 24px));
    background:rgba(255,255,255,.96);border:1px solid rgba(18,62,144,.2);border-left:5px solid var(--ambra2);
    border-radius:12px;padding:13px 16px;box-shadow:0 6px 22px rgba(13,47,110,.16)}
  #carta .tappa{font-family:'Lexend',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ambra)}
  #carta h2{font-family:'Lexend',sans-serif;font-size:17px;color:var(--blu);margin:2px 0 6px;line-height:1.25}
  #carta p{font-size:15px;line-height:1.5;color:#33404f}
  #carta .fila{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  #carta button{font-family:'Lexend',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    border-radius:9px;padding:7px 12px;border:1px solid rgba(18,62,144,.3);background:#fff;color:var(--blu)}
  #carta button:hover{background:#eef3fc}
  #aiutoTesto{margin-top:9px;padding:9px 11px;background:#fdf6e3;border:1px solid #e6d3a3;
    border-radius:9px;font-size:14px;line-height:1.45;color:#6b5312;display:none;white-space:pre-line}

  /* ---- pannello grande (scoperta / diario / debrief) ---- */
  #velo{position:fixed;inset:0;z-index:40;background:rgba(13,32,66,.5);display:flex;
    align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
  .foglio{width:min(560px,100%);max-height:88vh;overflow-y:auto;background:#fffdf7;border-radius:16px;
    padding:26px 28px;box-shadow:0 18px 60px rgba(0,0,0,.35);border-top:6px solid var(--blu)}
  .foglio h1{font-family:'Lexend',sans-serif;font-size:22px;color:var(--blu);margin-bottom:4px;line-height:1.2}
  .foglio .occhiello{font-family:'Lexend',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ambra);margin-bottom:3px}
  .foglio p{font-size:16px;line-height:1.6;color:#33404f;margin-bottom:11px}
  .foglio .imparato{background:#eef6f0;border-left:4px solid var(--verde);border-radius:0 10px 10px 0;
    padding:11px 14px;margin:13px 0;font-size:15.5px;line-height:1.55;color:#1d4a30}
  .foglio .prossimo{background:#fdf6e3;border-left:4px solid var(--ambra2);border-radius:0 10px 10px 0;
    padding:11px 14px;margin:13px 0;font-size:15.5px;line-height:1.55;color:#6b5312}
  .foglio table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
  .foglio td{padding:6px 3px;border-bottom:1px solid #eceadf;vertical-align:top}
  .foglio td:first-child{width:34px}
  .foglio .azione{background:#f2f6fd;border:1px dashed #b6c8ea;border-radius:11px;padding:14px 16px;margin-top:14px}
  /* ---- card d'accesso al gioco ---- */
  .foglio.card{width:min(1000px,100%);padding:0;overflow:hidden;border-top:none;
    background:#12202f url('cacciatesoro.jpg') no-repeat right center/cover;
    display:flex;align-items:stretch;min-height:min(480px,72vh)}
  .card .colonna{width:min(430px,52%);padding:20px 24px 22px;color:#fff;
    display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(90deg,rgba(8,17,29,.94) 0%,rgba(8,17,29,.90) 62%,
      rgba(8,17,29,.55) 86%,rgba(8,17,29,0) 100%)}
  .card .pillola{align-self:flex-start;margin-bottom:16px;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.35))}
  .card .pillola svg{width:172px;height:83px;display:block}
  .card .occhiello{color:#f0c04a;margin-bottom:2px}
  .card h1{color:#fff;font-size:26px;margin-bottom:8px}
  .card p{color:#dfe6ef;font-size:15.5px;line-height:1.5;margin-bottom:10px}
  .card .comandi{font-size:13.5px;line-height:1.75;color:#b9c6d6;margin:2px 0 4px}
  .card .comandi b{color:#fff;font-weight:700}
  .card .nota{font-size:13px;color:#93a3b6;line-height:1.45;margin-top:8px}
  .card .bottoni{margin-top:14px}
  .card .bottoni button{background:#f0c04a;color:#12202f;font-size:16px;padding:13px 18px}
  .card .bottoni button:hover{background:#ffd166}
  @media(max-width:720px){
    .foglio.card{min-height:0;background-position:center top}
    .card .colonna{width:100%;background:linear-gradient(180deg,rgba(8,17,29,.90),rgba(8,17,29,.97))}
  }
  /* ---- pannello della domanda ---- */
  .foglio .domanda{font-family:'Lexend',sans-serif;font-size:19px;line-height:1.35;
    color:var(--blu);margin:6px 0 14px}
  .opz{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .opz button{text-align:left;padding:12px 15px;font-family:'Atkinson Hyperlegible',sans-serif;

  .opz button:hover{background:#eef3fc;border-color:#9fb6dc}
  .opz button.via{opacity:.28;pointer-events:none;text-decoration:line-through}

  .bottoni{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}

  .bottoni button.chiaro{background:#fff;color:var(--blu);border:1px solid rgba(18,62,144,.3)}

  /* ---- barra tappe + strumenti ---- */
  #barra{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;
    display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.93);
    border:1px solid rgba(18,62,144,.2);border-radius:999px;padding:7px 13px;
    box-shadow:0 3px 14px rgba(13,47,110,.16);max-width:calc(100vw - 24px);overflow-x:auto}
  #perline{display:flex;gap:5px}
  .perla{width:13px;height:13px;border-radius:50%;background:#d5dbe6;border:1px solid #b9c3d4;flex:0 0 auto}
  .perla.fatta{background:var(--verde);border-color:var(--verde)}
  .perla.ora{background:var(--ambra2);border-color:var(--ambra);box-shadow:0 0 0 3px rgba(212,160,23,.25)}
  #barra button{font-family:'Lexend',sans-serif;font-weight:600;font-size:13px;color:var(--blu);
    background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:7px;white-space:nowrap}
  #barra button:hover{background:#eef3fc}

  /* ---- mirino oggetto ---- */
  #mirino{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;
    width:22px;height:22px;display:none;pointer-events:none}

    box-shadow:0 0 3px rgba(0,0,0,.7)}
  #mirino i:nth-child(1){left:10px;top:0;width:2px;height:7px}
  #mirino i:nth-child(2){left:10px;bottom:0;width:2px;height:7px}
  #mirino i:nth-child(3){top:10px;left:0;height:2px;width:7px}
  #mirino i:nth-child(4){top:10px;right:0;height:2px;width:7px}
  #mirino.su i{background:#f0c04a}
  #avviso{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;
    background:rgba(8,17,29,.82);color:#fff;font-family:'Lexend',sans-serif;font-weight:600;
    font-size:15px;padding:11px 20px;border-radius:12px;display:none;pointer-events:none;
    box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #vicino{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:20;
    background:rgba(18,62,144,.94);color:#fff;font-family:'Lexend',sans-serif;font-weight:600;
    font-size:14px;padding:8px 15px;border-radius:999px;display:none;box-shadow:0 3px 14px rgba(0,0,0,.25)}

  /* ---- comandi touch ---- */
  .stick{position:fixed;z-index:25;width:118px;height:118px;border-radius:50%;display:none;
    background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.55)}
  .stick .pomo{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,.85);border:2px solid rgba(18,62,144,.4);transform:translate(-50%,-50%)}
  #stickMov{left:18px;bottom:78px} #stickVis{right:18px;bottom:78px}
  .tq{position:fixed;z-index:25;width:52px;height:52px;border-radius:14px;display:none;
    background:rgba(255,255,255,.85);border:2px solid rgba(18,62,144,.35);
    align-items:center;justify-content:center}
  #su{right:30px;bottom:212px} #giu{right:92px;bottom:212px}
  body.tocco .stick,body.tocco .tq{display:flex}
  body.tocco #carta{top:104px;width:min(300px,58vw);padding:10px 12px}
  body.tocco #carta p{font-size:13.5px}
  body.tocco #carta h2{font-size:15px}

  #quota{position:fixed;top:12px;right:12px;z-index:20;background:rgba(255,255,255,.9);
    border:1px solid rgba(18,62,144,.18);border-radius:11px;padding:6px 11px;font-size:12.5px;color:#4a5a7a}
  #quota b{font-family:'Lexend',sans-serif;font-weight:600;color:var(--blu)}
  #yt{position:fixed;width:1px;height:1px;left:-9999px;top:0;opacity:0;pointer-events:none}
  #bAudio{display:flex;align-items:center;gap:5px;padding:3px 7px !important}
  #bAudio svg{display:block}
  #bAudio.spento{opacity:.5}
  @media(max-width:780px){ #quota{display:none}
    #marchio{width:132px;height:64px} #carta{top:92px} }
</style>

<body>
<!--
  ============================================================================
  LA CHIAVE DEL CAMPUS — Scuola Sacra Famiglia di Orzinuovi (BS)
  Campus 3D navigabile + caccia al tesoro a dieci tappe.
  Single-file, Three.js r128, vanilla JS. Nessun build step.

  COM'E' NATO QUESTO FILE (leggilo prima di toccarlo)
  ---------------------------------------------------------------------------
  La base e' `primopiano.html`: il corridoio a U del primo piano, riscritto da
  zero sulle quote di PianoPrimo.pdf lette a 300 dpi. Su quella base sono
  stati innestati GLI ESTERNI del campus e la caccia al tesoro, presi da
  `index-prima-del-trapianto.html`. Mai il contrario: portare il primo piano
  dentro index e' fallito tre volte.

  REGOLE DEL TRAVASO, imparate sbagliando:
  1. Non si trapianta l'impianto Three ne' la navigazione di un file
     dentro l'altro: si porta L'AMBIENTE, non la finestra da cui lo si
     guardava. La navigazione qui sotto e' quella di primopiano (pos / giro /
     becco / quotaSotto) ESTESA al campus, non quella di index.
  2. UNA SOLA passata di convertSRGBToLinear, a scena costruita: due
     conversioni rendono ogni tinta due toni piu' scura.
  3. La "quinta scenografica" di primopiano — il campus in miniatura che si
     vedeva oltre le vetrate — E' STATA TOLTA: con gli esterni veri era un
     doppione, e il suo muro da 70 m attraversava il campo da volley.
  4. Prima si svuota, poi si verifica che sia vuoto, poi si riempie. Mai
     aggiungere sopra: "sommare le due versioni" e' il nome dell'errore.

  I QUATTRO NOMI CHE COLLIDEVANO fra i due file (box, contatto, seme,
  texOmbra) restano quelli degli esterni; le versioni del primo piano si
  chiamano boxP, contattoP, semeP, texOmbraP. `mondo` e' UNO SOLO ed e'
  condiviso: e' cosi' che il collaudo geometrico vede anche un muro del
  campus che attraversa il corridoio.

  FONTI (mai dedotte):
  - PianoTerra.pdf / PianoPrimo.pdf / PianoSecondo.pdf, "Istituto S.P.E.
    Cerioli, stato di fatto". Scala 10,4595 pt/m, origine condivisa.
  - ortofoto zenitale strumenti/campus_zen.png (0,20966 m/px, nord in alto).
  - le fotografie delle cartelle 1..6. `plan.png` NON si usa piu'.
  ============================================================================
-->
<canvas id="scena"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

'use strict';
/* ========================= IMPIANTO — UNO SOLO ==========================
   Renderer, scena e camera stanno scritti QUI e in nessun altro posto. E'
   la prima regola del travaso: due impianti nello stesso file vuol dire due
   `scene`, due `camera`, e ogni pezzo che finisce nella scena sbagliata.
   Nomi: scene / camera / renderer (quelli degli esterni, che sono 1900
   righe contro le 500 del primo piano).
   ====================================================================== */
const TOCCO = /[?&]touch=1/.test(location.search)
  || (('ontouchstart' in window) && navigator.maxTouchPoints>0 && /Mobi|iPad|iPhone|Android|Tablet/i.test(navigator.userAgent))
  || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
if(TOCCO) document.body.classList.add('tocco');

const canvas=document.getElementById('scena');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.86;

const scene=new THREE.Scene();
/* la nebbia e' quella degli esterni (300-1100): quella del primo piano
   partiva a 60 m e avrebbe cancellato meta' campus dopo il campo da basket. */
scene.fog=new THREE.Fog(0xe6ecef,300,1100);
const camera=new THREE.PerspectiveCamera(62,window.innerWidth/window.innerHeight,0.1,2400);

/* ===================== utilita' e collisioni ===================== */
/* ===================== utilita' ===================== */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rip){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  if(rip){t.wrapS=t.wrapT=THREE.RepeatWrapping;} t.anisotropy=4; return t;}
function lam(col,o){return new THREE.MeshLambertMaterial(Object.assign({color:col},o||{}));}
function seme(n){let s=n>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const _gc={};
function geoSmussata(w,h,d,r){
  const k=w.toFixed(3)+'|'+h.toFixed(3)+'|'+d.toFixed(3)+'|'+r.toFixed(3);
  if(_gc[k])return _gc[k];
  const rr=Math.min(r,w/2-0.001,h/2-0.001);
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+rr,y); s.lineTo(x+w-rr,y); s.quadraticCurveTo(x+w,y,x+w,y+rr);
  s.lineTo(x+w,y+h-rr); s.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  s.lineTo(x+rr,y+h); s.quadraticCurveTo(x,y+h,x,y+h-rr);
  s.lineTo(x,y+rr); s.quadraticCurveTo(x,y,x+rr,y);
  const b=Math.min(0.006,d/4);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-b*2,bevelEnabled:true,bevelThickness:b,
    bevelSize:b,bevelSegments:1,curveSegments:2,steps:1});
  g.translate(0,0,-(d-b*2)/2-b); g.computeVertexNormals(); _gc[k]=g; return g;
}
const texOmbra=(()=>{const c=mkCanvas(128,128),g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(.55,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');

/* ===================== COLLISIONI =====================================
   Non si attraversano i muri. Si passa invece da porte, finestre e vetrate:
   ogni apertura e' registrata come VARCO, cioe' un volume dove il divieto
   non vale. Cosi' per salire al primo piano non servono le scale: si entra
   da una finestra, che e' esattamente come vuole muoversi chi gioca in volo.
   I volumi si calcolano una sola volta a fine costruzione (compilaCollisioni),
   quando le matrici mondo sono aggiornate: farlo prima darebbe scatole
   ferme all'origine. */
const _sol=[], _var=[]; const SOLIDI=[], VARCHI=[];
function solido(m){ if(m) _sol.push(m); return m; }
function varco(m){ if(m) _var.push(m); return m; }
let COLLISIONI=false;
function compilaCollisioni(){
  scene.updateMatrixWorld(true);
  const b=new THREE.Box3();
  _sol.forEach(m=>{ b.setFromObject(m); if(isFinite(b.min.x)) SOLIDI.push(b.clone()); });
  /* il varco dev'essere piu' profondo del muro PIU' il raggio del giocatore,
     altrimenti si entra dalla finestra e si resta incastrati in uscita */
  _var.forEach(m=>{ b.setFromObject(m); if(isFinite(b.min.x)){
    const c=b.clone(); c.expandByScalar(0.95); VARCHI.push(c); } });
  COLLISIONI=true;
}
const RAGGIO=0.30;
function _dentro(lista,p,r){
  for(let i=0;i<lista.length;i++){ const b=lista[i];
    if(p.x>b.min.x-r&&p.x<b.max.x+r&&p.y>b.min.y-r&&p.y<b.max.y+r&&
       p.z>b.min.z-r&&p.z<b.max.z+r) return true; }
  return false;
}
function libero(p){
  if(!COLLISIONI) return true;
  if(!_dentro(SOLIDI,p,RAGGIO)) return true;
  return _dentro(VARCHI,p,0);      /* dentro un muro si passa solo dai varchi */
}

const X0  = -61.80, X1 = 15.00;      /* da ovest a est                      */
const OX0 = -61.80, OX1 = -55.50;    /* braccio ovest                       */

/* ANGGRAD: la diagonale della gradinata. Il segno decide da che parte pende,
   l'ampiezza quanto e' obliqua. Era -30 gradi (scendeva verso destra), poi
   +30 dopo il confronto "Adesso / Modifica". Ora +45: cosi' taglia l'angolo
   ESATTAMENTE A META', che e' la posa naturale di una gradinata messa in
   una svolta — la bisettrice fra i due bracci. */
const ZGRAD = -1.90, ANGGRAD = Math.PI/4;
/* LA RETTA DELLA GRADINATA, scritta UNA VOLTA SOLA: z = x - CGRAD.
   Il pavimento rialzato e la funzione che dice a che quota si cammina la
   prendono tutti e due da qui, percio' non possono piu' divergere — era la
   causa dei punti "senza pavimento" che rincorrevo aggiustando ora l'una
   ora l'altra. Vertice slittato verso l'angolo opposto (sud-est), cosi' la
   spezzata sta tutta DENTRO il braccio est e non invade l'incrocio. */
/* La diagonale taglia la svolta NELL'ALTRO VERSO (Andrea: "ruota il

   specchiata, quindi il triangolo del piano rialzato punta dalla parte
   opposta. Gli estremi restano gli stessi, invertiti fra loro:
   a EX0 vale +4,30 e a EX1 vale -0,30, dove prima era il contrario. */
const KGRAD = 14.70;
const zSoglia = x => KGRAD - x;

/* la mezzeria del corridoio lungo: ci stanno il vano scala, la ringhiera e

const XMEZZ = (-61.80 + 15.00) / 2;        /* -23,40 */

/* Tre tipi di lampada, come nelle foto:
   'inc'  incassata nel controsoffitto a quadrotti (aule, salone)
   'sosp' sospesa a due cavetti sotto il soffitto liscio (corridoi, atrio)
   'app'  applicata a plafone, senza cavetti (corridoio dei lavori, scala) */
function plafo(g,x,z,q,ry,tipo){
  const y=(q||SOFF); const t=tipo||'inc';

    const m=box(g,1.25,0.06,0.22,lam(0xF8F6EE),x,y-0.04,z,false);

    if(ry) c.rotation.y=ry; return m;}

  const g2=new THREE.Group(); g2.position.set(x,0,z); if(ry) g2.rotation.y=ry;

/* ==========================================================================
   LO SCAVO DEL CORRIDOIO NELLE MASSE DEGLI EDIFICI
   --------------------------------------------------------------------------
   `corpo()` posa il guscio di un edificio come UN VOLUME PIENO. Finche' al
   primo piano non c'era niente andava bene. Adesso il corridoio a U c'e', e
   sta DENTRO quelle masse: il corpo nord arriva a z=-2,40, cioe' 1,90 m
   dentro il corridoio, che va da -5,40 a -0,50. Risultato visibile dal campo
   da basket: DUE FRONTI PARALLELI a 1,9 m l'uno dall'altro — la vetrata vera
   del corridoio davanti, e dietro la faccia della massa che taglia in due il
   corridoio. Da fuori si leggono come due corridoi, uno vecchio e uno nuovo.
   Lo stesso succede sull'aggetto dell'ala est (che riempiva tutto il braccio
   est) e sull'ala ovest (faccia a x=-54,40, 1,1 m dietro la vetrata del
   braccio ovest).

   NON si risolve spostando le facciate a mano, una per una: si risolve
   togliendo alla massa il volume che il corridoio occupa. `scava()` fa la
   differenza fra due rettangoli sul piano XZ — taglia il rettangolo grande
   sui fili dei bracci e rimette solo le celle che NON sono corridoio.

   Lo scavo vale solo nella fascia PAV..SOF, cioe' fra il pavimento e il
   controsoffitto: sopra il controsoffitto la massa torna piena, altrimenti
   lungo la facciata resterebbe una fessura di 46 cm.
   ========================================================================== */
/* I FILI DELLO SCAVO non sono esattamente quelli del corridoio. Dove il
   guscio di index e il rilievo non vanno d'accordo vince il rilievo, e il
   pezzo di guscio che resta DAVANTI alla vetrata va tolto lo stesso: sul
   braccio ovest l'ala ovest arriva a x=-54,40 mentre la vetrata del
   corridoio, misurata in tavola, sta a -55,50. Quel metro e dieci restava
   come un setto piantato davanti al vetro — il secondo fronte che si vedeva
   dal cortile. Lo scavo arriva quindi a -54,30. */
const BRACCI_P1=[[X0,X1,NZ0,NZ1],[OX0,-54.30,NZ1,OZ1],[EX0,EX1,NZ1,EZ1]];
function dentroBraccio(x,z){
  for(const a of BRACCI_P1) if(x>a[0]&&x<a[1]&&z>a[2]&&z<a[3]) return true;
  return false;
}
/* rimette il volume x[x0,x1] z[z0,z1] fra le quote y0 e y1, meno i bracci */
function scava(x0,x1,z0,z1,y0,y1,m,omb){
  if(y1-y0<0.02) return;
  const xs=[x0,x1], zs=[z0,z1];
  BRACCI_P1.forEach(a=>{
    [a[0],a[1]].forEach(v=>{ if(v>x0+0.02&&v<x1-0.02) xs.push(v); });
    [a[2],a[3]].forEach(v=>{ if(v>z0+0.02&&v<z1-0.02) zs.push(v); });
  });
  xs.sort((p,q)=>p-q); zs.sort((p,q)=>p-q);
  for(let i=0;i<xs.length-1;i++) for(let j=0;j<zs.length-1;j++){
    const ax=xs[i], bx=xs[i+1], az=zs[j], bz=zs[j+1];
    if(bx-ax<0.02 || bz-az<0.02) continue;
    if(dentroBraccio((ax+bx)/2,(az+bz)/2)) continue;      /* qui c'e' il corridoio */
    box(mondo,bx-ax,y1-y0,bz-az,m,(ax+bx)/2,(y0+y1)/2,(az+bz)/2,omb);
  }
}
/* la massa di un corpo di fabbrica: piena sotto, scavata nella fascia del
   corridoio, piena di nuovo sopra il controsoffitto */
function massa(x0,x1,z0,z1,h,col,omb){
  const m=lam(col), w=x1-x0, d=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  if(h<=PAV || !BRACCI_P1.some(a=>x1>a[0]&&x0<a[1]&&z1>a[2]&&z0<a[3])){
    box(mondo,w,h,d,m,cx,h/2,cz,omb); return;             /* non lo tocca */
  }
  box(mondo,w,PAV,d,m,cx,PAV/2,cz,omb);                   /* sotto: pieno  */
  scava(x0,x1,z0,z1,PAV,Math.min(SOF,h),m,omb);           /* la fascia     */
  if(h>SOF) box(mondo,w,h-SOF,d,m,cx,(SOF+h)/2,cz,omb);   /* sopra: pieno  */
}

const matTegole=lam(0xffffff,{map:texCoppi});
const matColmo=lam(0xa05a42);
const matGronda=lam(0xb8b2a6);
const matLattoneria=lam(0x8f8a80);

/* una falda: 3 o 4 punti, UV proiettate in metri sul piano della falda */
function falda(p,pts,mat,scala){
  const p0=pts[0];
  const e1=V(0,0,0).subVectors(pts[1],pts[0]).normalize();
  const nrm=V(0,0,0).subVectors(pts[1],pts[0])
    .cross(V(0,0,0).subVectors(pts[pts.length-1],pts[0])).normalize();
  const e2=V(0,0,0).crossVectors(nrm,e1).normalize();
  const idx = pts.length===4 ? [0,1,2,0,2,3] : [0,1,2];
  const pos=[],uv=[];
  for(const i of idx){
    const q=pts[i]; pos.push(q.x,q.y,q.z);
    const d=V(0,0,0).subVectors(q,p0);
    uv.push(d.dot(e1)/scala, d.dot(e2)/scala);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  /* Le quattro falde di un padiglione non hanno tutte lo stesso verso di
     avvolgimento: con FrontSide una sparisce e il tetto risulta incompleto.
     Segnalazione di Andrea: "manca una falda a tutti i tetti".
     La falda va sempre a DOPPIA FACCIA. */
  const m2 = mat.clone(); m2.side = THREE.DoubleSide;
  const m=new THREE.Mesh(g,m2); m.castShadow=true; m.receiveShadow=true;
  (p||scene).add(m); return m;
}
/* fila di coppi di colmo/displuvio fra due punti */
function colmo(p,a,b,r){
  r=r||0.16;
  const len=a.distanceTo(b);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8,1,false,0,Math.PI),matColmo);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0),V(0,0,0).subVectors(b,a).normalize());
  m.castShadow=true; (p||scene).add(m); return m;
}
/* tetto a falde completo: padiglione o capanna, con sporto, gronda, colmo,
   displuvi, comignoli. Il colmo corre sempre lungo il lato lungo. */
function tetto(p,cx,cz,Lx,Lz,y0,alt,o){
  o=o||{};
  const sp=(o.sporto===undefined)?0.62:o.sporto;
  const g=new THREE.Group(); g.position.set(cx,0,cz); (p||scene).add(g);
  const ruota=Lz>Lx;
  const L=(ruota?Lz:Lx), W=(ruota?Lx:Lz);
  if(ruota) g.rotation.y=Math.PI/2;
  const Le=L+2*sp, We=W+2*sp, hw=Le/2, hd=We/2, yb=y0, yt=y0+alt, SC=2.0;
  const A=V(-hw,yb,-hd),B=V(hw,yb,-hd),C=V(hw,yb,hd),D=V(-hw,yb,hd);
  if(o.tipo==='capanna'){
    const E=V(-hw,yt,0),F=V(hw,yt,0);
    falda(g,[A,B,F,E],matTegole,SC); falda(g,[D,C,F,E],matTegole,SC);
    colmo(g,E,F);
    /* timpani verticali alle testate, sul filo del muro */
    const s=new THREE.Shape(); s.moveTo(-W/2,0); s.lineTo(W/2,0); s.lineTo(0,alt); s.closePath();
    [[-L/2,Math.PI/2],[L/2,-Math.PI/2]].forEach(t=>{
      const m=new THREE.Mesh(new THREE.ShapeGeometry(s),lam(o.colTimpano||0xd8d0bd));
      m.position.set(t[0],yb,0); m.rotation.y=t[1]; g.add(m);
    });
  } else {
    const rl=Math.max(0.05,(Le-We)/2);
    const E=V(-rl,yt,0),F=V(rl,yt,0);
    falda(g,[A,B,F,E],matTegole,SC);  /* nord */
    falda(g,[D,C,F,E],matTegole,SC);  /* sud  */
    falda(g,[C,B,F],matTegole,SC);    /* est  */
    falda(g,[A,D,E],matTegole,SC);    /* ovest*/
    colmo(g,E,F);
    [[A,E],[B,F],[C,F],[D,E]].forEach(q=>colmo(g,q[0],q[1],0.125));
  }
  /* sporto di gronda: fascia + canale semicilindrico su tutto il perimetro */
  const fasce=[[Le,0.2,-hd],[Le,0.2,hd]];
  fasce.forEach(f=>box(g,f[0]+0.1,0.2,0.12,matGronda,0,yb-0.1,f[2],false));
  box(g,0.12,0.2,We+0.1,matGronda,-hw,yb-0.1,0,false);
  box(g,0.12,0.2,We+0.1,matGronda, hw,yb-0.1,0,false);
  [[-hd,0],[hd,0]].forEach(q=>{
    const cn=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,Le,8,1,false,0,Math.PI),matLattoneria);
    cn.rotation.z=Math.PI/2; cn.rotation.y=Math.PI/2;
    cn.position.set(0,yb-0.2,q[0]); g.add(cn);
  });
  /* pluviali agli angoli, fino a terra se richiesto */
  if(o.pluviali!==undefined){
    const hP=yb-0.25-o.pluviali;
    /* I DISCENDENTI STANNO FUORI DAL MURO, non dentro. Erano piantati 25 cm
       DENTRO l'impronta: nel corpo nord finivano a z=-2,65, cioe' in mezzo al
       corridoio del primo piano, e si vedevano come colonne nere davanti alla
       vetrata. Un pluviale corre sul filo esterno della facciata. */
    if(hP>0.5)[[-hw-0.14,-hd-0.14],[hw+0.14,-hd-0.14],[-hw-0.14,hd+0.14],[hw+0.14,hd+0.14]].forEach(q=>{
      const t=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,hP,7),matLattoneria);
      t.position.set(q[0],o.pluviali+hP/2,q[1]); g.add(t);
    });
  }
  /* comignoli */
  (o.comignoli||[]).forEach(q=>{
    const h=q[2]||1.5, xx=q[0], zz=q[1];
    const yBase=yt-Math.abs(zz)/hd*alt*0.5;
    box(g,0.75,h,0.75,lam(0xc4b8a2),xx,yBase+h/2-0.3,zz,true);
    box(g,1.0,0.14,1.0,lam(0x9c9080),xx,yBase+h-0.25,zz,true);
    box(g,0.5,0.2,0.5,lam(0x8a7f70),xx,yBase+h-0.06,zz,true);
  });
  /* per le collisioni conta solo il volume delle falde: un proxy invisibile
     da y0 a y0+alt. Registrare l'intero gruppo includerebbe i pluviali, che
     arrivano a terra, e l'edificio diventerebbe un parallelepipedo pieno. */
  const proxy=new THREE.Mesh(new THREE.BoxGeometry(Lx+2*sp,alt+0.3,Lz+2*sp),
    new THREE.MeshBasicMaterial({visible:false}));
  proxy.position.set(cx,y0+alt/2,cz); (p||scene).add(proxy); solido(proxy);
  return g;
}

/* ===== PANNELLI SOLARI SULLE FALDE (tetti.png) =========================
   Sulle falde rivolte al cortile ci sono grandi campi di pannelli, in file
   regolari. Sono l'elemento piu' vistoso della copertura vista dall'alto e
   mancavano del tutto. I pannelli seguono l'inclinazione della falda: si
   ruotano dello stesso angolo, e si posano poco sopra il manto. ==== */
const texPannello=(()=>{const c=mkCanvas(128,128),g=c.getContext('2d');
  g.fillStyle='#1E3050';g.fillRect(0,0,128,128);
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){
    const gr=g.createLinearGradient(k*32,r*32,k*32+32,r*32+32);
    gr.addColorStop(0,'#2C4670');gr.addColorStop(0.5,'#1B2B49');gr.addColorStop(1,'#33507E');
    g.fillStyle=gr;g.fillRect(k*32+2,r*32+2,28,28);}
  g.strokeStyle='#8C99AC';g.lineWidth=2;g.strokeRect(0,0,128,128);
  return tex(c,true);})();
function matPannelli(nx,ny){const t=texPannello.clone();t.needsUpdate=true;
  t.repeat.set(nx,ny);
  return new THREE.MeshPhongMaterial({map:t,shininess:95,specular:0x9FB4CC});}
/* cx,cz centro dell'ala · lungo = sviluppo del colmo · semiProf = mezza
   larghezza della falda · y0 quota gronda · alt dislivello gronda-colmo
   verso = +1 se la falda guarda verso +Z (o +X se asseZ), -1 se il contrario */
function pannelliSolari(cx,cz,lungo,semiProf,y0,alt,verso,asseZ,nCampi){
  const ang=Math.atan2(alt,semiProf);
  const nR=3, nC=nCampi||6;
  const passoR=semiProf*0.80/nR;
  for(let r=0;r<nR;r++){
    const t=0.10+ (r+0.5)/nR*0.80;               /* dalla gronda verso il colmo */
    const off=semiProf*(1-t), yy=y0+alt*t+0.10;
    for(let c=0;c<nC;c++){
      const along=-lungo/2+lungo*(c+0.5)/nC;
      const w=lungo/nC-0.45, d=passoR-0.22;
      const m=new THREE.Mesh(new THREE.BoxGeometry(asseZ?d:w,0.07,asseZ?w:d),
        matPannelli(Math.max(1,Math.round((asseZ?d:w)/1.05)),
                    Math.max(1,Math.round((asseZ?w:d)/1.05))));
      if(asseZ){ m.position.set(cx+verso*off,yy,cz+along); m.rotation.z=-verso*ang; }
      else     { m.position.set(cx+along,yy,cz+verso*off); m.rotation.x= verso*ang; }
      m.castShadow=true; mondo.add(m);
      /* telaio d'alluminio sul bordo basso */
      const f=new THREE.Mesh(new THREE.BoxGeometry(asseZ?d+0.05:w+0.05,0.05,asseZ?w+0.05:d+0.05),
        lam(0x9AA3AE));
      f.position.copy(m.position); f.position.y-=0.05; f.rotation.copy(m.rotation);
      mondo.add(f);
    }}
}

/* abbaino a nastro sulla falda: cassonetto con la finestra inclinata, come
   nei rilievi di tetti.png. cx,cz = posizione sulla falda; verso e asseZ come
   in pannelliSolari. */
function abbaino(cx,cz,lungo,y0,alt,semiProf,verso,asseZ){
  const ang=Math.atan2(alt,semiProf);
  const t=0.55, off=semiProf*(1-t), yy=y0+alt*t;
  const px=asseZ?cx+verso*off:cx, pz=asseZ?cz:cz+verso*off;
  const w=asseZ?1.5:lungo, d=asseZ?lungo:1.5;
  box(mondo,w,0.95,d,lam(0xE0DAC8),px,yy+0.55,pz,true);
  const v=new THREE.Mesh(new THREE.BoxGeometry(w-0.2,0.08,d-0.2),
    new THREE.MeshPhongMaterial({color:0xBCD6E4,transparent:true,opacity:0.55,
      shininess:150,specular:0xffffff}));
  v.position.set(px,yy+1.05,pz);
  if(asseZ) v.rotation.z=-verso*ang*0.6; else v.rotation.x=verso*ang*0.6;
  mondo.add(v);
  box(mondo,w+0.12,0.10,d+0.12,lam(0x8F8A80),px,yy+1.12,pz,false);
}

/* tetto piano con parapetto (ali moderne sul cortile) */
function tettoPiano(p,cx,cz,Lx,Lz,y,colPar){
  const g=new THREE.Group(); (p||scene).add(g); solido(g);
  /* manto bituminoso con ghiaia, non una lastra bianca anonima */
  const manto=lam(0xffffff,{map:(()=>{const c=texPunti('#6f6c66',
      ['#66635d','#7a776f','#5f5c57','#807d75'],137),x=c.getContext('2d');
    x.strokeStyle='rgba(45,43,40,.5)';x.lineWidth=2;x.strokeRect(0,0,128,128);
    const t2=tex(c,true);t2.repeat.set(Math.max(2,Lx/3),Math.max(2,Lz/3));return t2;})()});
  const t=box(g,Lx+0.5,0.32,Lz+0.5,manto,cx,y+0.16,cz,true);
  t.receiveShadow=true;
  /* lucernari a nastro, unita' di trattamento aria e bocchette */
  const nL=Math.max(2,Math.round(Lx/11));
  for(let i=0;i<nL;i++){
    const lx=cx-Lx/2+Lx*(i+0.5)/nL;
    box(g,2.6,0.22,1.5,lam(0xb4b1a9),lx,y+0.43,cz,false);
    const vt=box(g,2.4,0.14,1.3,new THREE.MeshPhongMaterial({color:0xcfe2ee,
      transparent:true,opacity:0.55,shininess:130,specular:0xffffff}),lx,y+0.57,cz,false);
    vt.rotation.x=0.12;}
  for(let i=0;i<Math.max(1,Math.round(Lx/26));i++){
    const ux=cx-Lx/2+Lx*(i+0.5)/Math.max(1,Math.round(Lx/26));
    box(g,1.9,0.85,1.4,lam(0xb8b5ad),ux,y+0.75,cz-Lz/4,true);
    box(g,1.5,0.10,1.1,lam(0x8f8c85),ux,y+1.22,cz-Lz/4,false);
    for(let k=0;k<4;k++) box(g,0.06,0.55,1.2,lam(0x9a978f),ux-0.7+k*0.46,y+0.75,cz-Lz/4+0.72,false);}
  for(let i=0;i<Math.max(2,Math.round(Lx/18));i++){
    const dx=cx-Lx/2+Lx*(i+0.5)/Math.max(2,Math.round(Lx/18));
    const bo=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.18,10),lam(0x55524d));
    bo.position.set(dx,y+0.40,cz+Lz/2-0.7);g.add(bo);}
  const m=lam(colPar||0xeeece4);
  box(g,Lx+0.6,0.62,0.22,m,cx,y+0.62,cz-Lz/2-0.19,false);
  box(g,Lx+0.6,0.62,0.22,m,cx,y+0.62,cz+Lz/2+0.19,false);
  box(g,0.22,0.62,Lz+0.6,m,cx-Lx/2-0.19,y+0.62,cz,false);
  box(g,0.22,0.62,Lz+0.6,m,cx+Lx/2+0.19,y+0.62,cz,false);
  /* scossalina di coronamento */
  const s=lam(0xb0aca2);
  box(g,Lx+0.75,0.07,0.3,s,cx,y+0.95,cz-Lz/2-0.19,false);
  box(g,Lx+0.75,0.07,0.3,s,cx,y+0.95,cz+Lz/2+0.19,false);
  return g;
}

/* CAMPO BASKET — verificato sull'ORTOFOTO (Bing Maps, via Milano 75 Orzinuovi).
   MIA CORREZIONE SBAGLIATA, rimessa a posto: il campo E' BORDEAUX con le aree
   dei tiri liberi e il cerchio di centrocampo AZZURRO CHIARO, linee bianche.

   errore mio, l'ortofoto e' inequivocabile.
   Il tappeto e' piu' grande del campo: la fascia bordeaux di rispetto e' larga. */
const texBasket=(()=>{const c=mkCanvas(1024,576),g=c.getContext('2d'),rnd=seme(21);
  /* IMG_4947 (panoramica a livello suolo): il fondo e' un MATTONE SMORZATO,
     opaco, non un bordeaux saturo; le aree e il cerchio sono AZZURRO-GRIGIO
     POLVEROSO, non un celeste acceso. */
  const BOR='#96574E', AZZ='#9FB4C4';

  /* rettangolo di gioco, di poco piu' chiaro della fascia di rispetto */

  g.beginPath();g.arc(X0+W/2,CY,72,0,Math.PI*2);g.stroke();
  g.strokeRect(X0,CY-88,152,176);g.strokeRect(X0+W-152,CY-88,152,176);

     IMG_4947: attorno al bordeaux corre una CORNICE DI RESINA AZZURRA di un

  tappeto(lam(0x8FB6D8),32,19,-8.6,4.5,0.035);

  /* CAMPO DA VOLLEY, verde: sta FUORI dalla corte, sulla fascia d'erba fra la

     rilievo, lato est a x=+5,4 — e gli altri due si allineano su quello.

  /* ANDREA: i tre campi vanno allineati su ENTRAMBI i lati, e il campo che
     comanda lo slittamento e' il BASKET (l'unica misura certa: 28,00 x 15,00
     dal rilievo). Quindi tutti e tre condividono la stessa fascia in X:

  /* TRACCIATO DEL CAMPO DA PALLAVOLO — 18 x 9 con l'asse lungo in X.

  (function righeVolley(){

  /* il campo da calcio sconfinava di 7 m sotto il fabbricato a ovest: portato

  });
  if(o.portale!==undefined){
    const px=(o.portale-0.5)*w;
    box(g,3.0,3.5,0.16,lam(0xd8cfc0),px,1.75,0.2,false);
    const a=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.16,22,1,false,0,Math.PI),lam(0xd8cfc0));
    a.rotation.x=Math.PI/2;a.rotation.y=Math.PI/2;a.position.set(px,3.5,0.2);g.add(a);
    varco(box(g,2.3,3.05,0.1,lam(0x4a3a2a),px,1.52,0.27,false));
    const av=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,0.1,20,1,false,0,Math.PI),lam(0x4a3a2a));
    av.rotation.x=Math.PI/2;av.rotation.y=Math.PI/2;av.position.set(px,3.05,0.27);g.add(av);
  }
  g.position.set(x,y,z); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;}
/* muro intonacato con finestre */
function muroFin(p,w,h,col,fin,x,y,z,ry){
  const g=new THREE.Group();
  const m=solido(box(g,w,h,0.24,lam(col),0,h/2,0,true)); m.receiveShadow=false;
  fin.forEach(f=>{
    const px=(f.fx-0.5)*w, tel=f.scuro?matTelaioScuro:matTelaio;
    /* UNA FINESTRA NON E' UNA PORTA. Marcandola varco, e visto che il varco
       viene poi gonfiato di 95 cm per non restare incastrati nelle soglie,
       le finestre ravvicinate si saldavano fra loro e la parete diventava un
       colabrodo: si usciva dall'edificio attraversando il muro. Si entra
       dalle vetrate a tutta altezza e dal portale, che varco lo sono davvero. */
    box(g,f.fw,f.fh,0.08,tel,px,f.fy,0.14,false);
    const v=new THREE.Mesh(new THREE.PlaneGeometry(f.fw-0.14,f.fh-0.14),
      new THREE.MeshPhongMaterial({color:0x6f8ba0,shininess:130,specular:0x9fc4d8}));
    v.position.set(px,f.fy,0.185);g.add(v);
    /* montante centrale, traverso a un terzo dall'alto e fermavetro */
    box(g,0.045,f.fh-0.16,0.05,tel,px,f.fy,0.205,false);
    box(g,f.fw-0.16,0.04,0.05,tel,px,f.fy+f.fh/6,0.205,false);
    /* mazzetta: la finestra e' incassata nel muro, non incollata sopra */
    box(g,f.fw+0.10,0.05,0.16,lam(0xe6e2d8),px,f.fy+f.fh/2+0.03,0.09,false);
    box(g,0.05,f.fh,0.16,lam(0xe6e2d8),px-f.fw/2-0.03,f.fy,0.09,false);
    box(g,0.05,f.fh,0.16,lam(0xe6e2d8),px+f.fw/2+0.03,f.fy,0.09,false);
    /* davanzale sporgente con gocciolatoio */
    box(g,f.fw+0.28,0.06,0.22,lam(0xd8d2c4),px,f.fy-f.fh/2-0.05,0.16,false);
    box(g,f.fw+0.28,0.03,0.04,lam(0xb8b2a4),px,f.fy-f.fh/2-0.09,0.25,false);
  });
  g.position.set(x,y,z); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;}
/* VETRATA CONTINUA del corridoio (corretta sul video):
   davanzale 0.95, altezza fino a quasi soffitto, campate da ~2.9 m con
   traverso orizzontale, e pannelli d'accento GIALLI ogni 5 montanti. */
function vetrataCorridoio(p,x0,x1,z,ry,y0){
  const g=new THREE.Group(); const w=Math.abs(x1-x0);
  const sill=y0+0.95, hV=2.55;
  solido(box(g,w,0.95,0.26,matIntonaco,0,y0+0.475,0,false)); /* parapetto sotto */
  box(g,w,0.12,0.3,lam(0xcac6bc),0,sill+0.02,0.03,false);      /* davanzale */
  const v=new THREE.Mesh(new THREE.PlaneGeometry(w-0.3,hV-0.2),matVetro);
  v.position.set(0,sill+hV/2,0.05);g.add(v);varco(v);
  /* provini 01/02/07: sotto la finestra apribile corre un PARAPETTO IN VETRO
     riflettente, scuro, che dal cortile legge come una fascia continua. Senza
     di lui la facciata mostrava l'interno del primo piano e sembrava aperta. */
  const par=new THREE.Mesh(new THREE.PlaneGeometry(w-0.34,0.92),matVetroSpec);
  par.position.set(0,sill+0.50,0.055);g.add(par);
  /* 4861/4862/4873: nessun pannello giallo sull'esterno. Montanti tutti grigi,
     e ogni cinque campate un PILASTRO INTONACATO piu' largo, dello stesso
     colore del muro. Il giallo esiste solo DENTRO, sui pannelli di parete. */
  const n=Math.max(3,Math.round(w/2.9));
  for(let i=0;i<=n;i++){
    const px=-w/2+0.14+i*(w-0.28)/n, pil=(i%5===2);
    box(g,pil?0.62:0.13,hV,pil?0.30:0.22,pil?matIntonaco:matTelaioGrigio,px,sill+hV/2,0.02,false);
  }
  box(g,w,0.13,0.22,matTelaioGrigio,0,sill+1.55,0.02,false);   /* traverso */
  solido(box(g,w,0.9,0.3,matIntonaco,0,sill+hV+0.45,0,false)); /* fascia sopra */
  g.position.set((x0+x1)/2,0,z); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;}

/* ===== VETRATA CONTINUA DEL PIANO TERRA (IMG_4947, provini 01/02/07) ======
   Dal campo da basket il piano terra NON e' un muro con finestrelle quadrate:
   e' una VETRATA A TUTTA ALTEZZA che corre lungo tutto il fronte, montanti
   bianchi ogni ~1,65 m, un traverso a 2,15 e un sopraluce, e ogni tanto una
   campata che e' PORTA A DUE ANTE con maniglione. Il vetro e' SPECCHIANTE:
   dal cortile si vedono riflessi il campo e gli alberi, non l'interno (che a
   questa quota non e' modellato). Per questo il materiale e' opaco e lucido:
   un vetro trasparente aprirebbe un buco sul nulla.
   La vetrata si appoggia DAVANTI al muro esistente (5 cm), che resta a fare
   da solido per le collisioni: cosi' l'edificio non si buca.
   ======================================================================== */
const matVetroSpec=new THREE.MeshPhongMaterial({color:0x5D7789,shininess:150,
  specular:0xd6e8f5,reflectivity:0.9});
const matAlluBianco=lam(0xF2F1EC), matAlluScuro=lam(0x4A4F55);
function vetrataTerra(x0,x1,z,ry,h,porte){
  const g=new THREE.Group(); const w=Math.abs(x1-x0); h=h||3.35;
  porte=porte||[];
  const v=new THREE.Mesh(new THREE.PlaneGeometry(w-0.16,h-0.26),matVetroSpec);
  v.position.set(0,h/2+0.05,0.04); g.add(v);
  const n=Math.max(2,Math.round(w/1.65)), passo=w/n;
  for(let i=0;i<=n;i++)                                   /* montanti          */
    box(g,0.09,h,0.13,matAlluBianco,-w/2+i*passo,h/2,0.08,false);
  box(g,w,0.10,0.13,matAlluBianco,0,2.15,0.08,false);      /* traverso         */
  box(g,w,0.09,0.13,matAlluBianco,0,h-0.30,0.08,false);    /* sopraluce        */
  box(g,w,0.16,0.16,matAlluScuro,0,0.08,0.08,false);       /* soglia in allum. */
  box(g,w,0.13,0.16,matAlluBianco,0,h+0.07,0.06,false);    /* traverso alto    */
  /* le campate-porta: due ante, montante centrale e maniglione orizzontale */
  const inox=new THREE.MeshPhongMaterial({color:0xc6cad0,shininess:110,specular:0xffffff});
  porte.forEach(k=>{
    const px=-w/2+(k+0.5)*passo;
    box(g,passo-0.16,2.15,0.05,matAlluBianco,px,1.10,0.13,false);
    const vp=new THREE.Mesh(new THREE.PlaneGeometry(passo-0.34,1.92),matVetroSpec);
    vp.position.set(px,1.10,0.155); g.add(vp);
    box(g,0.07,2.10,0.07,matAlluBianco,px,1.07,0.17,false);
    [-0.30,0.30].forEach(o=>{
      const mn=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.42,8),inox);
      mn.rotation.z=Math.PI/2; mn.position.set(px+o,1.05,0.20); g.add(mn);});
    box(g,passo,0.06,0.30,lam(0xd8d5cc),px,0.03,0.20,false);   /* soglia esterna */
  });
  g.position.set(ry?z:(x0+x1)/2,0,ry?(x0+x1)/2:z); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;}

/* pluviale antracite: dal campo scandiscono la facciata piu' di ogni altra
   cosa (uno ogni ~9 m), tubo tondo con il collarino e il bicchiere in alto */
function pluviale(x,z,h,ry){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,h,9),lam(0x3C4147));
  t.position.set(0,h/2,0); t.castShadow=true; g.add(g.userData.t=t);
  box(g,0.20,0.20,0.20,lam(0x3C4147),0,h-0.08,0,false);         /* bicchiere   */
  [h*0.34,h*0.72].forEach(q=>box(g,0.19,0.045,0.09,lam(0x4A4F55),0,q,0.05,false));
  g.position.set(x,0,z); if(ry) g.rotation.y=ry; mondo.add(g); return g;}

/* proiettore a LED + telecamera dome sotto gronda (si vedono in ogni provino) */
function faroLed(x,y,z,ry){
  const g=new THREE.Group();
  box(g,0.40,0.26,0.09,lam(0x3C4147),0,0,0,false);

  box(g,0.06,0.16,0.10,lam(0x3C4147),0,0.18,-0.02,false);
  g.position.set(x,y,z); if(ry) g.rotation.y=ry; mondo.add(g); return g;}
function telecamera(x,y,z,ry){
  const g=new THREE.Group();

/* vetrocemento: i mattoni di vetro delle pareti interne (4855/4857) */
const texVetroC=(()=>{const c=mkCanvas(256,256),g=c.getContext('2d');
  g.fillStyle='#cfd8d6';g.fillRect(0,0,256,256);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const gr=g.createLinearGradient(x*32,y*32,x*32+32,y*32+32);
    gr.addColorStop(0,'#e6efee');gr.addColorStop(1,'#aebfc4');
    g.fillStyle=gr;g.fillRect(x*32+3,y*32+3,26,26);}
  return tex(c,true);})();
function matVetroC(rx,ry){const t=texVetroC.clone();t.needsUpdate=true;t.repeat.set(rx,ry);
  return lam(0xffffff,{map:t});}

/* ---- VETRATA CONTINUA DEL PIANO TERRA -----------------------------------
   IMG_4947 (giro completo dal campo da basket): il piano terra verso la corte
   non ha finestre bucate nel muro — e' una VETRATA A TUTTA ALTEZZA con
   montanti bianchi ogni 1,6 m, un traverso a 2,2 m e le porte a due ante.
   E' l'errore piu' vistoso della versione precedente, che qui aveva un muro
   quasi cieco con finestrelle quadrate. */
function vetrataTerra(a0,a1,pos,ry){
  const g=new THREE.Group(); const L=Math.abs(a1-a0), h=H_PT-0.30;
  const v=new THREE.Mesh(new THREE.PlaneGeometry(L-0.2,h-0.12),matVetro);
  v.position.set(0,h/2+0.06,0.06); g.add(v); varco(v);
  const tel=lam(0xF4F2EC);
  const n=Math.max(4,Math.round(L/1.6));
  for(let i=0;i<=n;i++)
    box(g,0.11,h,0.16,tel,-L/2+0.1+i*(L-0.2)/n,h/2,0.03,false);
  box(g,L,0.10,0.16,tel,0,2.20,0.03,false);          /* traverso            */
  box(g,L,0.13,0.18,tel,0,h+0.06,0.03,false);        /* traverso alto       */
  box(g,L,0.16,0.20,lam(0xE2E0D8),0,0.08,0.04,false);/* soglia              */
  /* le porte: due ante a vetro con maniglione, ogni 4 campate */
  for(let k=0;k<Math.floor(n/5);k++){
    const px=-L/2+2.4+k*8.0;
    box(g,1.86,0.09,0.19,tel,px,2.36,0.05,false);
    [-0.46,0.46].forEach(o=>box(g,0.07,2.30,0.19,tel,px+o,1.15,0.05,false));
    box(g,0.05,0.9,0.07,lam(0xB8BCC0),px+0.30,1.05,0.14,false);}
  g.position.set(ry?pos:(a0+a1)/2,0,ry?(a0+a1)/2:pos); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;
}
/* ---- FINESTRA A NASTRO DEL PIANO SUPERIORE ------------------------------
   Sopra il marcapiano: fascia continua di serramenti bianchi con il
   PARAPETTO IN VETRO riflettente sotto — nelle riprese e' la cosa che da'
   il carattere alla facciata, e mancava del tutto. */
function nastroPrimo(a0,a1,pos,ry,y0){
  const g=new THREE.Group(); const L=Math.abs(a1-a0);
  const tel=lam(0xF4F2EC);
  const par=new THREE.Mesh(new THREE.PlaneGeometry(L-0.3,0.95),
    new THREE.MeshPhongMaterial({color:0x5A6E7C,shininess:150,specular:0xBFD6E2,
      transparent:true,opacity:0.88,side:THREE.DoubleSide}));
  par.position.set(0,y0+0.62,0.07); g.add(par);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(L-0.3,1.45),matVetro);
  v.position.set(0,y0+1.92,0.07); g.add(v);
  box(g,L,0.12,0.20,tel,0,y0+0.12,0.05,false);
  box(g,L,0.11,0.20,tel,0,y0+1.14,0.05,false);
  box(g,L,0.14,0.22,tel,0,y0+2.72,0.05,false);
  const n=Math.max(4,Math.round(L/2.9));
  for(let i=0;i<=n;i++)
    box(g,0.10,2.7,0.17,tel,-L/2+0.15+i*(L-0.3)/n,y0+1.42,0.04,false);
  g.position.set(ry?pos:(a0+a1)/2,0,ry?(a0+a1)/2:pos); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;
}

/* ==========================================================================

   Cerioli, Secondaria di I grado, stato di fatto". Scala 10,46 pt/m, verificata
   sul campo di pallacanestro (28,00 x 15,00 su entrambi i lati).
   Le tre tavole NON condividono l'origine sul foglio: allineate per
   correlazione delle immagini intere (inchiostro contro inchiostro) e poi
   guardate in sovrapposizione. Scarti: PianoPrimo (-69,1; +8,6) pt,
   PianoSecondo (-67,0; +51,8) pt rispetto al PianoTerra.
   La pianta si innesta sul modello con  X = Xpianta - 8,6   Z = Zpianta + 4,5
   (l'origine della pianta e' il centro del campo da basket).

   QUOTE VERTICALI, lette in tavola: aule H 3,00 · solaio 3,44 · bar H 3,17 ·
   locali polivalenti H 3,02 e H 3,58 · corridoio primo piano H 3,00.
   PT 0,00-3,00 (solaio 3,44) · P1 3,44-6,44 (solaio 6,88) · P2 6,88-9,88.

   IMPIANTO (coordinate modello) ------------------------------------------
   ALA OVEST Infanzia/Nido    x[-70.7,-54.4]  z[-24.4,+21]   2 piani, coppi
   PALESTRA                   x[-57.3,-36.3]  z[-15.5,-5.0]  volume unico alto
   CORPO NORD (fronte)        x[-36.0,+14.3]  z[-18.1,-2.4]  atrio, segreteria,
        uffici, saletta riunioni, BAR (H 3,17), VERANDA mq 138,20, accesso
        Secondaria. Al primo piano: uffici e aule; al secondo, solo in parte.
   ALA EST (Secondaria)       x[+14.3,+22.5]  z[-18.1,+24.8] 3 livelli
        Al PT "LOCALI POLIVALENTI ALLIEVI SECONDARIA"; il PRIMO PIANO SPORGE
        di 2 m verso il campo (in tavola: "profilo esterno piano primo").
        E' quell'aggetto che nelle riprese dal campo fa ombra sulle vetrate.
   CORPO SUD (mensa)          x[-52.6,-24.6]  z[+24.5,+32.7]
        MENSA ALUNNI, cucina, dispensa, cella frigo, spogliatoio dipendenti.
   PORTICO DI COLLEGAMENTO    x[-30.0,-26.3]  z[-5.2,+19.6]  3,60 x 24,8
   CORTILE INFANZIA           x[-54.4,-30.0]  z[-5,+19]  "spazio gioco esterno"
   CORTE DEI CAMPI            x[-26.3,+14.3]  z[-2.4,+24.8]
        basket 28x15 x[-22.6,+5.4] z[-3,+12] · volley in erba sintetica a sud
   ========================================================================== */
const H_PT=3.44, H_P1=6.88, H_P2=10.32;      /* quote dei solai, dal rilievo */

/* ---- costruttore di corpo di fabbrica intonacato -------------------------
   Un corpo = solido + facciate con finestre + tetto. Le facciate si passano
   come lista di lati, cosi' non si ripete la stessa chiamata quattro volte. */
function corpo(o){
  const x0=o.x0,x1=o.x1,z0=o.z0,z1=o.z1,h=o.h;
  const cx=(x0+x1)/2, cz=(z0+z1)/2, w=x1-x0, d=z1-z0;
  /* IL VOLUME PIENO NON E' UN OSTACOLO: le collisioni stanno sulle PARETI
     (le crea muroFin, che marca solido ogni muro sottile). Marcando solido
     il volume intero, ogni punto dell'interno risultava "dentro un muro":
     si restava fuori da tutto e i luoghi del menu erano irraggiungibili.
     E' il baco che Andrea ha visto come "volo fuori dalle pareti oppure non
     riesco a esplorare". */
  /* IL VOLUME PIENO NON DEVE RIEMPIRE IL CORRIDOIO DEL PRIMO PIANO.
     Il corpo nord arrivava a z=-2,40, cioe' 1,90 m dentro il corridoio, e
     dal campo da basket si vedevano DUE FRONTI PARALLELI: la vetrata vera
     davanti e, dietro, la faccia della massa. Vedi `massa()` in testa. */
  massa(x0,x1,z0,z1,h,o.col,true);
  if(o.finN) muroFin(null,w,h,o.col,o.finN,cx,0,z0,Math.PI);
  if(o.finS) muroFin(null,w,h,o.col,o.finS,cx,0,z1,0);
  if(o.finO) muroFin(null,d,h,o.col,o.finO,x0,0,cz,-Math.PI/2);
  if(o.finE) muroFin(null,d,h,o.col,o.finE,x1,0,cz,Math.PI/2);
  if(o.tetto!==false)
    tetto(mondo,cx,cz,w,d,h,o.alt||2.6,Object.assign({pluviali:0},o.tOpt||{}));
  contatto(mondo,cx,0.03,cz,w+3,d+3,0.5);
  return {cx:cx,cz:cz,w:w,d:d};
}
/* finestre in griglia: n per registro, r registri, prima quota y0, passo dy */
function griglia(n,r,y0,dy,fw,fh,m0){
  const f=[]; m0=(m0===undefined)?0.5/n:m0;
  for(let k=0;k<r;k++) for(let i=0;i<n;i++)
    f.push({fx:m0+i*(1-2*m0)/(n-1||1),fy:y0+k*dy,fw:fw,fh:fh});
  return f;
}
/* pluviale antracite in vista: nelle riprese dal campo scandisce la facciata
   piu' di qualunque altro elemento */
function pluviale(x,z,h,ry){
  const g=new THREE.Group(); g.position.set(x,0,z); if(ry) g.rotation.y=ry;
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,h,8),lam(0x3A3E42));
  t.position.y=h/2; g.add(t);
  box(g,0.20,0.16,0.20,lam(0x33373B),0,h-0.12,0,false);
  box(g,0.13,0.30,0.13,lam(0x33373B),0,0.15,0,false);
  mondo.add(g); return g;
}
/* proiettore a LED sotto gronda + telecamera dome: ci sono su ogni facciata */
function faroLed(x,y,z,ry){
  const g=new THREE.Group(); g.position.set(x,y,z); if(ry) g.rotation.y=ry;
  box(g,0.44,0.26,0.10,lam(0x4A4E52),0,0,0.05,false);
  box(g,0.40,0.22,0.03,lam(0xE8EEF2),0,0,0.11,false);
  box(g,0.07,0.07,0.16,lam(0x4A4E52),0,0.12,-0.02,false);
  mondo.add(g);
}

/* ===================== ALA OVEST — Infanzia e Nido ======================
   Il fronte ovest del campus: aule materne in fila, spazio comune, aula
   riposo, locale caldaia in testa a nord. Due piani, tetto a coppi.

     DI QUESTA PALESTRA NON HO FOTOGRAFIE: qui c'e' solo quello che il

  (function dentro(){

/* ===================== PISCINE ANDREANA ================================
   RIFATTE SULLE QUOTE DEL RILIEVO (VERIFICA-FOTOGRAFICA §16) e sull'aerea
   etichettata Campus_zone.png.
   - Le piscine NON stanno lontane dalla scuola: sono A CONTATTO con
     l'estremita' del fronte, subito oltre il tratto "Ingresso Piscina".

     PIU' IN ALTO, su una terrazza. E' la vasca di partenza degli scivoli, ed
     e' il dislivello che non avevo mai considerato.
   - DUE scivoli ELICOIDALI, ~35 m di sviluppo ciascuno (non uno solo ad ansa
     aperta): scendono avvolgendosi attorno alla torre fino alla vasca d'arrivo.
   - Due capannoni chiari affiancati (uno per vasca coperta), terrazza del bar
     con tende a braccio e ombrelloni, torretta del bagnino.
   ====================================================================== */
(function piscine(){
  const g=new THREE.Group();
  /* ORTOFOTO: le piscine cominciano SUBITO a est dell'ala nord-est.
     Tutto il complesso e' costruito attorno all'origine locale e poi
     traslato: cosi' si sposta in un punto solo. */
  g.position.x=-40; mondo.add(g);
  const matPiastre=lam(0xffffff,{map:(()=>{const t=tex(texPunti('#e0c3a8',
    ['#d8bb9f','#e8cdb2','#d0b397'],23),true);t.repeat.set(46,40);return t;})()});
  const piastra=new THREE.Mesh(new THREE.PlaneGeometry(84,58),matPiastre);
  piastra.rotation.x=-Math.PI/2;piastra.position.set(109,0.02,-3);piastra.receiveShadow=true;g.add(piastra);
  const matBordo=lam(0xe6e2d8);

  /* vasca rettangolare a una quota qualsiasi: il piano vasca e' un parametro,
     perche' §16 quota due vasche a quote diverse (+0,50 e +6,50) */
  function vascaRett(cx,cz,w,d,corsie,blocchi,y0){
    y0=y0||0;
    box(g,w+1.6,0.32,d+1.6,matBordo,cx,y0+0.16,cz,false);
    const a2=new THREE.Mesh(new THREE.PlaneGeometry(w,d),matAcqua);
    a2.rotation.x=-Math.PI/2;a2.position.set(cx,y0+0.34,cz);g.add(a2);
    for(let i=1;i<corsie;i++){const t=i/corsie;
      for(let k=0.5;k<w;k+=0.85){
        const b2=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,5),
          lam((Math.floor(k/0.85)%2)?0xe8e4dc:0xd8443a));
        b2.position.set(cx-w/2+k,y0+0.41,cz-d/2+d*t);g.add(b2);}}
    if(blocchi) for(let i=0;i<corsie;i++){const t=(i+0.5)/corsie;
      box(g,0.46,0.34,0.46,lam(0xd8d4cc),cx-w/2+0.7,y0+0.47,cz-d/2+d*t,true);
      box(g,0.30,0.05,0.30,lam(0x2f6fb5),cx-w/2+0.7,y0+0.65,cz-d/2+d*t,false);}

     Nell'aerea sono DUE, chiari e affiancati, a falde leggere su montanti
     bianchi ravvicinati, con il vetro azzurrino. */
  function capannone(cx,cz,w,d,h,alt){
    const mm=lam(0xf2f0ea);
    for(let i=0;i<=Math.round(w/3.2);i++){
      const px=cx-w/2+i*w/Math.round(w/3.2);

    /* FOTO 4893-4896: la copertura della piscina e' RETTANGOLARE, PIATTA e in
       LAMIERA BLU — non due falde vetrate translucide. Andrea. */
    const mBlu = new THREE.MeshPhongMaterial({color:0x2E5F94,shininess:80,specular:0x8FB4D8});
    const cop = new THREE.Mesh(new THREE.BoxGeometry(w+1.2,0.26,d+1.2),mBlu);
    cop.position.set(cx,h+0.13,cz); cop.castShadow=true; g.add(cop);
    /* nervature della lamiera, nel senso lungo */
    for(let k=0;k<Math.round(d/1.6);k++){
      const n=new THREE.Mesh(new THREE.BoxGeometry(w+1.1,0.07,0.12),lam(0x24507E));
      n.position.set(cx,h+0.29,cz-d/2+0.8+k*1.6); g.add(n);}
    /* bordo di lattoneria tutt'intorno */
    box(g,w+1.4,0.16,0.18,lam(0x1E4570),cx,h+0.06,cz-d/2-0.6,false);
    box(g,w+1.4,0.16,0.18,lam(0x1E4570),cx,h+0.06,cz+d/2+0.6,false);
    box(g,0.18,0.16,d+1.4,lam(0x1E4570),cx-w/2-0.6,h+0.06,cz,false);
    box(g,0.18,0.16,d+1.4,lam(0x1E4570),cx+w/2+0.6,h+0.06,cz,false);

  const Y_TERR=6.5;

  (function scivoli(){

    (function spirale(){

       del primo piano: attaccati al filo della vetrata (x=10,20). E' lo
       stesso errore di prima, alla seconda facciata. */
    const a=V(10.2,c[1],6.0-k*0.6), b=V(-26.2,c[2],3.4-k*0.6), n=26, pt=[];
    for(let i=0;i<=n;i++){ const t=i/n;
      const p=V(0,0,0).lerpVectors(a,b,t); p.y-=Math.sin(Math.PI*t)*0.9; pt.push(p); }
    const cu=new THREE.CatmullRomCurve3(pt);
    mondo.add(new THREE.Mesh(new THREE.TubeGeometry(cu,60,0.055,6,false),
      new THREE.MeshBasicMaterial({color:c[0]})));});})();

/* ---- 4872/4873/4877: sul piano terra del fronte, fra le campate vetrate,
   corrono CROCI DI SANT'ANDREA in acciaio chiaro. Sottili, alte quanto il
   piano terra, non le X giganti che avevo fatto la prima volta. -------- */
(function controventi(){
  for(let i=0;i<5;i++){
    const px=-2.5+i*3.4;
    [1,-1].forEach(v=>{
      const c=box(mondo,0.09,4.4,0.09,lam(0xE0DCD4),px,1.62,-2.28,false);
