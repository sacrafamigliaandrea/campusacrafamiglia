/* ==========================================================================
   LA PARTITA — dieci ragazzi sul campo da calcio
   --------------------------------------------------------------------------
   Il campo e' il tappeto 28 x 55 centrato in (-8,6 · 59,5), quindi
   x[-22,6 · 5,4]  z[32 · 87]. I giocatori stanno DENTRO quel rettangolo con
   tre metri di margine: non si mettono a occhio, si ricavano dai numeri del
   campo — e' lo stesso errore degli ombrelloni finiti in vasca.

   PERCHE' SI MUOVONO. Dieci sagome ferme in mezzo al prato sembrano statue e
   fanno l'effetto contrario: si nota che sono finte. Bastano due cose per
   dire "partita": le GAMBE che vanno (rotazione all'anca, braccia in
   controtempo) e uno spostamento lento su un giro breve, ognuno col suo
   raggio e la sua fase. Il pallone si muove per conto suo e rotola.

   Statura 1,45: sono ragazzi delle medie, non adulti. Se li faccio alti 1,80
   il campo sembra piccolo.
   ========================================================================== */
(function partita(){
  const CX=-8.6, CZ=59.5, MW=28/2-3.5, MD=55/2-4.5;
  /* Tre campi, tre divise. Nel basket canotta e calzoncini sono dello
     stesso colore e le braccia restano scoperte; nella pallavolo le maglie
     sono piu' accese e i calzoncini corti. */
  const DIV_CALCIO=[{maglia:0x1D4E9C,calz:0xF2F0EA,calze:0x1D4E9C},
                    {maglia:0xE8E4DA,calz:0x2A3038,calze:0xE8E4DA}];
  const DIV_BASKET=[{maglia:0xC8862A,calz:0xC8862A,calze:0xF2F0EA},
                    {maglia:0x2E4E8C,calz:0x2E4E8C,calze:0xF2F0EA}];
  const DIV_VOLLEY=[{maglia:0x7A2E6B,calz:0x2A3038,calze:0xF2F0EA},
                    {maglia:0xE8E4DA,calz:0x2E6E5A,calze:0xE8E4DA}];
  const PELLE=[0xE4C3A0,0xC98F63,0x8B5A38,0xD9AE86];
  const CAPELLI=[0x2B2118,0x4A3524,0x8A6A3A,0x1A1512];
  const mossi=[];

  /* SPIGOLI SMUSSATI. Con box() puri i ragazzi erano dieci parallelepipedi:
     a venti metri e' proprio quello che si vede, perche' lo spigolo vivo
     prende un filo di luce netto lungo tutto il bordo. geoSmussata arrotonda
     il profilo XY e le geometrie restano in cache (le taglie si ripetono
     dieci volte), quindi non costa niente. Il raggio e' un terzo del lato
     corto: piu' di cosi' e diventano salsicce. */
  function sm(par,w,h,d,mat,x,y,z,ombra,r){
    const m=new THREE.Mesh(geoSmussata(w,h,d,
      r!==undefined?r:Math.min(w,h)*0.34),mat);
    m.position.set(x,y,z); if(ombra) m.castShadow=true; par.add(m); return m;}

  function giocatore(hx,hz,dv,sq,tono,fase,raggio,vel,opz){
    const d=dv[sq], O=opz||{};
    const g=new THREE.Group(); g.userData.animato=true;
    const maglia=lam(d.maglia), calz=lam(d.calz), calze=lam(d.calze),
          pelle=lam(PELLE[tono%PELLE.length]),
          cap=lam(CAPELLI[(tono+sq)%CAPELLI.length]), scarpa=lam(0x24282E);
    /* busto e testa */
    sm(g,0.36,0.46,0.20,maglia,0,1.06,0,true,0.11);
    sm(g,0.30,0.17,0.19,calz  ,0,0.79,0,false,0.07);
    const collo=new THREE.Mesh(
      new THREE.CylinderGeometry(0.055,0.062,0.09,8),pelle);
    collo.position.y=1.32; g.add(collo);
    const testa=new THREE.Mesh(new THREE.SphereGeometry(0.115,12,10),pelle);
    testa.position.y=1.44; testa.castShadow=true; g.add(testa);
    const capelli=new THREE.Mesh(new THREE.SphereGeometry(0.122,12,8,0,
      Math.PI*2,0,Math.PI*0.58),cap);
    capelli.position.y=1.45; g.add(capelli);
    /* DA CHE PARTE E' GIRATO. Senza niente in faccia, una testa e' una
       sfera e correre avanti o all'indietro e' lo stesso (Andrea). Servono
       due segni a due distanze diverse, perche' funzionano in due momenti
       diversi:
       - DA VICINO il viso: occhi, naso, bocca. Il fronte del modello e' -Z.
       - DA LONTANO, dove gli occhi sono due pixel, il NUMERO sulla schiena
         e la nuca scura. E' quello che si legge a venti metri. */
    const buio=lam(0x2A2622);
    [-1,1].forEach(sg=>{
      const oc=new THREE.Mesh(new THREE.SphereGeometry(0.020,8,6),buio);
      oc.position.set(sg*0.043,1.462,-0.099); g.add(oc);
      sm(g,0.040,0.011,0.02,cap,sg*0.045,1.497,-0.098,false,0.004);});
    sm(g,0.032,0.045,0.035,pelle,0,1.432,-0.104,false,0.012);   /* naso   */
    sm(g,0.048,0.011,0.02,buio ,0,1.394,-0.103,false,0.005);    /* bocca  */
    const nuca=new THREE.Mesh(new THREE.SphereGeometry(0.098,10,8),cap);
    nuca.position.set(0,1.415,0.046); g.add(nuca);
    if(O.coda){                       /* capelli raccolti dietro */
      const el=new THREE.Mesh(new THREE.SphereGeometry(0.052,8,6),cap);
      el.position.set(0,1.455,0.105); g.add(el);
      const cd=new THREE.Mesh(new THREE.CylinderGeometry(0.040,0.022,0.26,8),cap);
      cd.position.set(0,1.315,0.128); cd.rotation.x=-0.30; g.add(cd);}
    /* il numero sulla schiena: una placca nel colore dei calzoncini */
    sm(g,0.19,0.21,0.02,calz,0,1.105,0.104,false,0.03);
    /* LA CATENA DELLE ARTICOLAZIONI. Prima la gamba era UN pezzo solo che
       ruotava all'anca: e' il motivo per cui il movimento sembrava di un
       burattino. Nella corsa il ginocchio fa quasi tutto — si piega fino a
       ottanta gradi mentre la gamba torna avanti, e si distende appena prima
       di appoggiare. Senza quello il piede descrive un arco di cerchio, cosa
       che nessuno fa camminando.
       Quote della catena (statura 1,45): anca 0,72 · coscia 0,34 ·
       tibia 0,30 · caviglia 0,08 → a gamba dritta la suola tocca lo zero. */
    const anche=[],ginocchia=[],caviglie=[],spalle=[],gomiti=[];
    [-1,1].forEach(sg=>{
      const an=new THREE.Group(); an.position.set(sg*0.10,0.72,0);
      an.userData.animato=true; g.add(an); anche.push(an);
      sm(an,0.13,0.15,0.14,calz ,0,-0.075,0,false,0.055);   /* alto coscia  */
      sm(an,0.125,0.22,0.135,pelle,0,-0.24,0,false,0.050);  /* coscia       */
      const gi=new THREE.Group(); gi.position.set(0,-0.34,0);
      gi.userData.animato=true; an.add(gi); ginocchia.push(gi);
      sm(gi,0.115,0.20,0.125,pelle,0,-0.10,0,false,0.048);  /* tibia        */
      sm(gi,0.125,0.13,0.135,calze,0,-0.235,0,false,0.045); /* calzettone   */
      const ca=new THREE.Group(); ca.position.set(0,-0.30,0);
      ca.userData.animato=true; gi.add(ca); caviglie.push(ca);
      /* LA PUNTA VA IN AVANTI, cioe' verso -Z. Con z=+0,05 la scarpa
         sporgeva DIETRO il tallone: i giocatori correvano coi piedi al
         contrario. Me lo ero portato dietro dalla prima versione, e non si
         vedeva perche' le riprese erano quasi tutte di spalle. Ora il piede
         va da -0,17 (punta) a +0,07 (tallone) rispetto alla caviglia. */
      sm(ca,0.13,0.08,0.24,scarpa,0,-0.04,-0.05,false,0.035);

      const sp=new THREE.Group(); sp.position.set(sg*0.23,1.24,0);
      sp.userData.animato=true; g.add(sp); spalle.push(sp);
      const bs=new THREE.Mesh(new THREE.SphereGeometry(0.062,10,8),maglia);
      sp.add(bs);                       /* la sferetta della spalla         */
      sm(sp,0.10,0.22,0.11,O.canotta?pelle:maglia,0,-0.11,0,false,0.045);
      const go=new THREE.Group(); go.position.set(0,-0.22,0);
      go.userData.animato=true; sp.add(go); gomiti.push(go);
      sm(go,0.09,0.22,0.10,pelle,0,-0.11,0,false,0.042);
      const mano=new THREE.Mesh(new THREE.SphereGeometry(0.048,8,6),pelle);
      mano.position.y=-0.24; go.add(mano);});
    g.position.set(hx,0,hz); mondo.add(g);
    contatto(mondo,hx,0.035,hz,1.0,1.0,0.34);
    mossi.push({g:g,anche:anche,ginocchia:ginocchia,caviglie:caviglie,
                spalle:spalle,gomiti:gomiti,hx:hx,hz:hz,y0:O.y0||0,
                a:fase,f:fase*1.7,r:raggio,v:vel,
                campo:O.campo||null, sq:sq, x:hx, z:hz, dir:Math.PI, salto:0});
    if(O.statura&&O.statura!==1) g.scale.setScalar(O.statura);
    g.userData.rec=mossi[mossi.length-1];   /* per marcarlo da fuori */
    return g;}

  /* SCHIERA — mette in campo una formazione dentro un rettangolo dato.
     Il rettangolo NON e' a occhio: sono i bordi veri del campo meno il
     margine, e ogni giocatore ci sta dentro anche all'estremo del suo giro
     (posizione + raggio). E' il controllo che mi era mancato con gli
     ombrelloni finiti in vasca. */
  function schiera(cfg){
    cfg.posti.forEach(function(p,i){
      const r=cfg.r0+((i*3)%4)*cfg.dr;
      const hx=Math.max(cfg.x0+r,Math.min(cfg.x1-r,p[0]));
      const hz=Math.max(cfg.z0+r,Math.min(cfg.z1-r,p[1]));
      const o=Object.assign({},cfg.opz||{},{campo:cfg.campo||null});
      giocatore(hx,hz,cfg.divise,p[2],i+(cfg.tono||0),
                ((i*1.37)+(cfg.tono||0))%(Math.PI*2),r,
                cfg.v0+((i*5)%3)*cfg.dv,o);});}

  /* OGNI PALLONE SI MUOVE COME IL SUO GIOCO (Andrea). Ne avevo fatti tre
     uguali, che strisciavano a terra: giusto per il calcio, sbagliato per
     gli altri due.
       terra    — rotola sul prato
       volo     — la pallavolo sta IN ARIA: parabole da una parte all'altra
                  della rete, con la battuta che inverte di colpo la corsa
       rimbalzo — il basket si palleggia: tocca terra e risale */
  /* la stessa persona serve anche altrove (i ballerini del QdV Arena):
     si costruisce qui una volta e si presta. */
  window.creaPersona=giocatore;
  const palle=[];
  function pallone(col,raggio,cx,cz,rx,rz,vel,tipo,dati){
    const m=new THREE.Mesh(new THREE.SphereGeometry(raggio,14,12),lam(col));
    m.position.set(cx,raggio,cz); m.castShadow=true;
    m.userData.animato=true; mondo.add(m);
    palle.push({m:m,cx:cx,cz:cz,rx:rx,rz:rz,v:vel,y:raggio,
                tipo:tipo||'terra',d:dati||{}});}

  /* ---- CALCIO: cinque contro cinque, sparsi come in una partita vera --- */
  schiera({divise:DIV_CALCIO, campo:'calcio', x0:CX-14+3.5, x1:CX+14-3.5,
           z0:CZ-27.5+4.5, z1:CZ+27.5-4.5, r0:1.6, dr:0.7, v0:1.5, dv:0.45,
           posti:[[-16,44,0],[-11,50,0],[-4,47,0],[-14,58,0],[-6,62,0],
                  [-13,66,1],[-5,70,1],[-16,74,1],[-8,78,1],[-2,56,1]]});
  /* I DUE PORTIERI. Non stanno nella formazione: hanno una regola loro —
     restano sulla linea di porta e si spostano di lato seguendo la palla,
     dentro la larghezza dei pali. Divisa diversa da tutti e due i colori
     in campo, come nel regolamento. */
  const DIV_PORT=[{maglia:0xC9A22E,calz:0x2A2E34,calze:0xC9A22E},
                  {maglia:0x6E4A8C,calz:0x2A2E34,calze:0x6E4A8C}];
  [[34.6,0],[84.4,1]].forEach(function(q,i){
    const p=giocatore(CX,q[0],DIV_PORT,q[1],i+6,i*2.1,0.5,1.4,
                      {campo:'calcio'});
    mossi[mossi.length-1].port=q[0];});
  pallone(0xF2F0EA,0.11,CX-2,CZ+3,7.5,9.0,0.70,'terra');

  /* ---- BASKET: tre contro tre. Il campo e' 28 x 15, x[-22,6 · 5,4]
     z[-3 · 12] — le stesse quote con cui si collauda la tappa 2. Canotta e
     braccia scoperte, giro piu' stretto e piu' svelto del calcio: in un
     campo da basket non si fanno quaranta metri. */
  schiera({divise:DIV_BASKET, campo:'basket', x0:-22.6, x1:5.4, z0:-3, z1:12,
           r0:1.3, dr:0.5, v0:1.9, dv:0.4, tono:2, opz:{canotta:true},
           posti:[[-16.5,1.5,0],[-11,6.5,0],[-4.5,3.0,0],
                  [-18,7.5,1],[-9,10.0,1],[-3,8.5,1]]});
  /* il palleggio: 2,3 tocchi al secondo, come si palleggia camminando */
  pallone(0xC4661C,0.122,-9,4.5,4.6,3.2,0.95,'rimbalzo',{h:0.95,f:7.2});

  /* ---- VOLLEY: tre contro tre, e sono RAGAZZE (Andrea). Il campo e'
     18 x 9 centrato in (-8,6 · 25,8), con la rete sulla mezzeria x=-8,6:
     ogni squadra resta dalla sua parte, e il raggio del giro e' scelto
     perche' nessuna passi sotto la rete. In pallavolo non si corre in giro:
     ci si sposta di un passo, quindi raggi piccoli e andatura lenta. */
  schiera({divise:DIV_VOLLEY, campo:'volley', x0:-17.6, x1:-9.8, z0:21.3, z1:30.3,
           r0:0.7, dr:0.25, v0:0.85, dv:0.3, tono:1,
           opz:{coda:true, statura:0.97},
           posti:[[-15.4,23.2,0],[-15.4,28.4,0],[-11.4,25.8,0]]});
  schiera({divise:DIV_VOLLEY, campo:'volley', x0:-7.4, x1:0.4, z0:21.3, z1:30.3,
           r0:0.7, dr:0.25, v0:0.85, dv:0.3, tono:3,
           opz:{coda:true, statura:0.97},
           posti:[[-2.2,23.2,1],[-2.2,28.4,1],[-6.0,25.8,1]]});
  /* da (-13,8 · 24,2) a (-3,6 · 27,4), scavalcando la rete a x=-8,6 con
     3,1 m di apice: passa un metro buono sopra il nastro. */
  pallone(0xE8E4DA,0.105,-8.6,25.8,0,0,1.05,'volo',
          {ax:-13.8,az:24.2,bx:-3.6,bz:27.4,h:3.1});

  /* ======================================================================
     ADESSO SI GIOCA — la palla comanda, i giocatori la seguono
     ----------------------------------------------------------------------
     Prima ognuno girava su un cerchio suo e la palla su un altro: dieci
     traiettorie indipendenti che per caso stavano nello stesso campo. Da
     lontano sembra movimento, ma non e' una partita — non c'e' nessuna
     relazione fra dove va uno e dov'e' il pallone.
     Il principio nuovo e' uno solo: LA PALLA E' LO STATO, e la posizione di
     ognuno si ricava da lei.
       calcio  — chi ha il pallone lo porta avanti; ogni tanto PASSA a un
                 compagno e la palla vola verso di lui. Gli avversari piu'
                 vicini vanno sulla palla, gli altri si smarcano.
       basket  — chi palleggia va verso il canestro; ogni tanto TIRA, e la
                 palla fa una parabola sul ferro; poi si riparte dal rimbalzo.
       volley  — la palla vola da una parte all'altra: chi sta piu' vicino al
                 punto di caduta ci va sotto e SALTA quando arriva.
     Il passo delle gambe non e' piu' costante: segue la velocita' VERA, e
     chi e' fermo sta fermo. Era l'altro segno che tradiva il giro a vuoto.
     ====================================================================== */
  const CAMPI={
    calcio:{x0:-19,x1:2,z0:38,z1:84, cx:-8.6,cz:59.5,
            bx:-8.6,bz:59.5, tx:-8.6,tz:59.5, chi:0, t:0, vol:0},
    basket:{x0:-20,x1:3,z0:-1,z1:10, cx:-8.6,cz:4.5,
            bx:-9,bz:4.5, tx:-9,tz:4.5, chi:0, t:0, vol:0},
    volley:{x0:-16,x1:-1,z0:22,z1:29.5, cx:-8.6,cz:25.8,
            ax:-13.8,az:24.2, bx2:-3.6,bz2:27.4, k:0, t:0}};
  const SQUADRA={};
  mossi.forEach(function(m,i){ if(!m.campo) return;
    (SQUADRA[m.campo]=SQUADRA[m.campo]||[]).push(m); });

  function versoLaPalla(m,c,peso){
    m.tx=m.hx+(c.bx-c.cx)*peso; m.tz=m.hz+(c.bz-c.cz)*peso;}

  function pensaCalcio(c,g,dt,rnd2){
    c.t-=dt;
    const port=g[c.chi];
    if(c.vol>0){                       /* il pallone e' in volo verso uno */
      c.vol-=dt;
      if(c.vol<=0){ c.bx=c.tx; c.bz=c.tz; c.t=1.2+((c.chi*7)%5)*0.4; }
      else { const k=Math.min(1,dt*6.0);
        c.bx+=(c.tx-c.bx)*k; c.bz+=(c.tz-c.bz)*k; }
    } else if(c.t<=0){                 /* si passa a un compagno */
      const miei=g.filter(function(q){return q.sq===port.sq && q!==port;});
      const r=miei[(Math.abs(Math.round(c.bx*7+c.bz*13))||0)%miei.length];
      c.chi=g.indexOf(r); c.tx=r.x; c.tz=r.z; c.vol=0.55+Math.abs(c.bx%1)*0.5;
    } else {                           /* si conduce verso la porta */
      const av=(port.sq?-1:1);
      c.bx+=(port.x-c.bx)*Math.min(1,dt*5); 
      c.bz+=(port.z+av*1.1-c.bz)*Math.min(1,dt*5);
    }
    g.forEach(function(m,i){
      const dpx=c.bx-m.x, dpz=c.bz-m.z, d=Math.hypot(dpx,dpz);
      if(m.port!==undefined){            /* il portiere: sulla linea, di lato */
        m.tx=Math.max(-12.2,Math.min(-5.0,c.bx));
        m.tz=m.port+(c.bz-m.port)*0.035;  /* esce di un passo se la palla viene */
        return;}
      if(m===g[c.chi]){ m.tx=c.bx+(m.sq?-3:3)*0; m.tz=c.bz+(m.sq?-2.2:2.2); }
      else if(d<11 && m.sq!==g[c.chi].sq){ m.tx=c.bx; m.tz=c.bz; }
      else versoLaPalla(m,c,0.55);
      m.tx=Math.max(c.x0,Math.min(c.x1,m.tx));
      m.tz=Math.max(c.z0,Math.min(c.z1,m.tz));});}

  function pensaBasket(c,g,dt){
    c.t-=dt;
    const port=g[c.chi];
    if(c.vol>0){                        /* tiro in parabola */
      c.vol-=dt;
      const k=Math.min(1,dt*3.4);
      c.bx+=(c.tx-c.bx)*k; c.bz+=(c.tz-c.bz)*k;
      if(c.vol<=0){ c.chi=(c.chi+3)%g.length; c.t=2.6; }
    } else if(c.t<=0){                  /* si tira al canestro */
      c.tx=-8.6; c.tz=(port.z<4.5?-0.6:9.6); c.vol=1.5;
    } else {
      const cz=(port.sq?9.6:-0.6);
      c.bx+=(port.x+0.45-c.bx)*Math.min(1,dt*7);
      c.bz+=(port.z-c.bz)*Math.min(1,dt*7);
      port.tx=port.x+(-8.6-port.x)*0.3; port.tz=port.z+(cz-port.z)*0.22;}
    g.forEach(function(m){
      if(m===g[c.chi]) return;
      const d=Math.hypot(c.bx-m.x,c.bz-m.z);
      if(d<6 && m.sq!==g[c.chi].sq){ m.tx=c.bx; m.tz=c.bz; }
      else versoLaPalla(m,c,0.7);
      m.tx=Math.max(c.x0,Math.min(c.x1,m.tx));
      m.tz=Math.max(c.z0,Math.min(c.z1,m.tz));});}

  function pensaVolley(c,g,dt){
    /* la palla la muove gia' la sua parabola: qui si legge dove CADRA' e ci
       si manda sotto chi sta piu' vicino, di quella meta' campo. */
    const arr=(c.k? [c.ax,c.az] : [c.bx2,c.bz2]);
    g.forEach(function(m){ m.tx=m.hx; m.tz=m.hz; });
    [0,1].forEach(function(lato){
      const suo=g.filter(function(m){return m.sq===lato;});
      if(!suo.length) return;
      const meta=(lato? [c.bx2,c.bz2] : [c.ax,c.az]);
      let best=suo[0], bd=1e9;
      suo.forEach(function(m){ const d=Math.hypot(meta[0]-m.hx,meta[1]-m.hz);
        if(d<bd){bd=d;best=m;} });
      best.tx=meta[0]; best.tz=meta[1];
      best.vuoleSaltare=true;});}

  let tP=0;
  AGGIORNA.push(function(dt){
    tP+=dt;
    if(SQUADRA.calcio) pensaCalcio(CAMPI.calcio,SQUADRA.calcio,dt);
    if(SQUADRA.basket) pensaBasket(CAMPI.basket,SQUADRA.basket,dt);
    if(SQUADRA.volley) pensaVolley(CAMPI.volley,SQUADRA.volley,dt);
    mossi.forEach(function(m,i){
      /* si va verso il proprio bersaglio, non su un cerchio */
      if(m.tx===undefined){ m.tx=m.hx; m.tz=m.hz; }
      /* I BALLERINI. Col vecchio impianto giravano su un cerchio, quindi si
         muovevano; passando ai bersagli sono rimasti fermi, perche' senza
         campo il bersaglio e' casa propria. Qui il bersaglio oscilla — due
         seni di periodo diverso, che e' quanto basta a non far leggere un
         andirivieni — e il busto gira su se stesso. */
      if(m.ballo!==undefined){
        const w=tP*1.9+m.ballo*1.1;
        m.tx=m.hx+Math.sin(w)*1.15;
        m.tz=m.hz+Math.sin(w*0.63+1.2)*0.65;
        m.giravolta=(m.giravolta||0)+dt*(1.1+0.5*Math.sin(w*0.5));}
      const dx=m.tx-m.x, dz=m.tz-m.z, d=Math.hypot(dx,dz);
      const vmax=m.v*1.55, passo=Math.min(d,vmax*dt);
      if(d>0.06){ m.x+=dx/d*passo; m.z+=dz/d*passo;
                  m.dir=Math.atan2(dx,dz); }
      m.vel=(dt>0? passo/dt : 0);
      /* il salto della schiacciata */
      if(m.vuoleSaltare && d<0.9){ m.salto=Math.min(1,m.salto+dt*3.2); }
      else m.salto=Math.max(0,m.salto-dt*2.4);
      m.vuoleSaltare=false;
      m.g.position.set(m.x,0,m.z);
      m.g.rotation.y=(m.ballo!==undefined? m.giravolta||0 : m.dir+Math.PI);
      /* LA FALCATA. fase = 0 quando la gamba passa sotto il corpo.
         anca      = seno puro, avanti e indietro
         ginocchio = SEMPRE flesso all'indietro (mai negativo al contrario),
                     col massimo mentre la gamba torna avanti (cos > 0) e
                     quasi disteso quando sta per appoggiare
         caviglia  = compensa, cosi' la suola non punta al cielo */
      /* IL PASSO SEGUE LA VELOCITA' VERA. Prima era costante: uno fermo
         continuava a correre sul posto, ed era il secondo segno — dopo le
         traiettorie circolari — che tradiva il giro a vuoto. */
      m.and=(m.and||0)+dt*Math.max(0.0,m.vel)*2.35;
      const f=m.and+m.f;
      let piuBasso=9;
      for(let k=0;k<2;k++){
        const ph=f+k*Math.PI;
        const an=0.55*Math.sin(ph);
        const gi=-(0.12+1.30*Math.pow(Math.max(0,Math.cos(ph)),1.4));
        m.anche[k].rotation.x=an;
        m.ginocchia[k].rotation.x=gi;
        m.caviglie[k].rotation.x=-(an+gi)*0.80;
        /* quota della caviglia con questa piega: serve a far scendere il
           bacino quanto basta perche' il piede d'appoggio tocchi terra.
           Senza, i piedi galleggiano di 13 cm agli estremi della falcata. */
        const h=0.72-0.34*Math.cos(an)-0.30*Math.cos(an+gi);
        if(h<piuBasso) piuBasso=h;
        /* le braccia vanno in controtempo, e il gomito resta piegato */
        m.spalle[k].rotation.x=-0.50*Math.sin(ph);
        m.gomiti[k].rotation.x=0.95+0.30*Math.cos(ph);
      }
      /* il rimbalzo della corsa non e' un seno inventato: e' quanto deve
         calare il bacino, e viene fuori da solo due volte per ciclo */
      m.g.position.y=(m.y0||0)+Math.min(0,0.08-piuBasso)+m.salto*0.55;
    });
    palle.forEach(function(b){
      const u=tP*b.v, d=b.d;
      if(b.tipo==='rimbalzo'||b.tipo==='terra'){
        /* la posizione della palla la decide il campo, non un cerchio */
        const c=(b.tipo==='rimbalzo')?CAMPI.basket:CAMPI.calcio;
        b.m.position.x=c.bx; b.m.position.z=c.bz;
        b.m.position.y=(b.tipo==='rimbalzo')
          ? b.y+(c.vol>0 ? Math.sin((1-c.vol/1.5)*Math.PI)*3.1
                         : d.h*Math.abs(Math.sin(tP*d.f)))
          : b.y+(c.vol>0 ? Math.sin((1-Math.max(0,c.vol))*Math.PI)*1.1 : 0);
        b.m.rotation.x+=dt*4.6; b.m.rotation.z+=dt*1.8;
        return;}
      if(b.tipo==='volo'){
        /* mezzo periodo per ogni traversata; il verso si inverte a ogni
           tocco, ed e' quello che fa leggere "battuta" invece di "giro" */
        const k=Math.floor(u/Math.PI)%2, t=(u%Math.PI)/Math.PI;
        CAMPI.volley.k=k;   /* da che parte sta andando: lo legge chi ci va sotto */
        const t1=k?1-t:t;
        b.m.position.set(d.ax+(d.bx-d.ax)*t1, b.y+d.h*4*t*(1-t),
                         d.az+(d.bz-d.az)*t1);
        b.m.rotation.x+=dt*3.0;
      } else if(b.tipo==='rimbalzo'){
        /* |sin| e' il rimbalzo: tocca terra a ogni zero e non lo attraversa */
        b.m.position.set(b.cx+Math.cos(u)*b.rx,
                         b.y+d.h*Math.abs(Math.sin(tP*d.f)),
                         b.cz+Math.sin(u*1.3)*b.rz);
        b.m.rotation.x+=dt*5.0; b.m.rotation.z+=dt*1.4;
      } else {
        b.m.position.set(b.cx+Math.cos(u)*b.rx, b.y, b.cz+Math.sin(u*1.3)*b.rz);
        b.m.rotation.x+=dt*4.2; b.m.rotation.z+=dt*2.1;}});
  });
})();

/* ==========================================================================
   DENTRO IL QdV ARENA
   --------------------------------------------------------------------------
   Impianto descritto da Andrea, entrando dal varco di levante:
     - a DESTRA (lato nord) un PALCO largo quanto tutto il capannone, con le
       luci puntate sui ballerini;
     - a SINISTRA (lato sud) file di SEGGIOLE GRIGIE ordinate;
     - in FONDO (a ponente) le TRIBUNE: tre gradoni, struttura in ferro grigio
       scuro e seduta in legno, moduli da 6 m disposti a U.
   Entrando si guarda a ponente: con quella direzione il nord cade a destra.

   LA LUCE. Dentro un guscio chiuso arriva solo l'ambiente, e sarebbe tutto
   nero. Non si risolve con una luce su un layer — in r128 il layer di una
   luce non filtra chi illumina, e appena la si accende in camera rischiara
   anche il cortile. L'unica cosa davvero locale e' l'EMISSIVE dei materiali:
   qui ogni superficie interna ne ha un filo, e i fasci dei fari sono
   MeshBasicMaterial, che non si illumina — si vede e basta.
   ========================================================================== */
(function internoArena(){
  const g=new THREE.Group(); mondo.add(g);
  const cx=-66, cz=56, w=40, d=25;
  const X0=cx-w/2+0.4, X1=cx+w/2-0.4, Z0=cz-d/2+0.4, Z1=cz+d/2-0.4;
  const em=(c,e)=>lam(c,{emissive:e===undefined?0x24242A:e});
  const FERRO=em(0x3A3E44,0x1E2024), LEGNO=em(0xB08A52,0x3A2C18);

  /* ---- IL PALCO, lato nord, per tutta la larghezza ------------------- */
  const PH=1.0, PZ0=Z0, PZ1=Z0+5.6;
  box(g,X1-X0,PH,PZ1-PZ0,em(0x2A2C31,0x141519),(X0+X1)/2,PH/2,(PZ0+PZ1)/2,true);
  box(g,X1-X0,0.10,PZ1-PZ0,em(0x3E4148,0x1A1B20),(X0+X1)/2,PH+0.05,(PZ0+PZ1)/2,false);
  /* il bordo chiaro del proscenio e le due scalette laterali */
  box(g,X1-X0,0.09,0.16,em(0xC9C4B8,0x3A362E),(X0+X1)/2,PH+0.02,PZ1+0.06,false);
  [X0+1.4,X1-1.4].forEach(sx=>{ for(let k=0;k<3;k++)
    box(g,1.5,0.09,0.34,em(0x8A8E94,0x24262A),sx,0.30+k*0.32,PZ1+0.62-k*0.34,false);});
  /* il fondale scuro dietro il palco */
  box(g,X1-X0,5.2,0.12,em(0x1C1E23,0x0E0F12),(X0+X1)/2,PH+2.6,PZ0-0.10,false);

  /* ---- L'AMERICANA E I FARI ------------------------------------------ */
  const YT=6.2, TZ=PZ1-1.2;
  box(g,X1-X0,0.16,0.16,FERRO,(X0+X1)/2,YT,TZ,false);
  box(g,X1-X0,0.16,0.16,FERRO,(X0+X1)/2,YT-0.46,TZ,false);
  for(let k=0;k<14;k++)
    box(g,0.09,0.50,0.09,FERRO,X0+1.2+k*(X1-X0-2.4)/13,YT-0.23,TZ,false);
  /* I RIFLETTORI RUOTANO (Andrea). Testa e fascio stanno in un gruppo
     imperniato SULLA STAFFA, non sul pavimento: il cono ha l'apice
     nell'origine del gruppo (una ConeGeometry ha l'apice a +h/2, quindi la
     si posa a -h/2) e cosi' basta ruotare il gruppo perche' il fascio
     spazzi. Ogni faro ha ampiezza, velocita' e fase sue: se vanno tutti
     insieme sembra un tergicristallo.
     La POZZA di luce non sta nel gruppo — deve restare piatta sul tavolato:
     a ogni fotogramma si calcola dove il fascio tocca il palco, ruotando
     (0,-1,0) con l'assetto del gruppo e intersecando il piano y=PH. */
  const TINTE=[0xE8A02A,0x2F6FD8,0x35A85C,0xB84FA8];
  const FARI=[], giu=new THREE.Vector3(), eu=new THREE.Euler();
  for(let k=0;k<10;k++){
    const px=X0+2.4+k*(X1-X0-4.8)/9, col=TINTE[k%4];
    const gf=new THREE.Group(); gf.position.set(px,YT-0.62,TZ);
    gf.userData.animato=true; g.add(gf);
    box(gf,0.26,0.34,0.30,em(0x2A2C31,0x111216),0,0.06,0,false);
    const h=YT-1.0-PH, r=1.5;
    const f=new THREE.Mesh(new THREE.ConeGeometry(r,h,14,1,true),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.13,
        depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
    f.position.y=-h/2; gf.add(f);
    const p=new THREE.Mesh(new THREE.CircleGeometry(r*0.92,16),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.16,
        depthWrite:false,blending:THREE.AdditiveBlending}));
    p.rotation.x=-Math.PI/2; p.position.set(px,PH+0.12,TZ+0.9);
    p.userData.animato=true; g.add(p);
    FARI.push({gf:gf,p:p,px:px,y:YT-0.62,
               az:0.30+0.16*(k%3), ax:0.30+0.10*(k%4),
               vz:0.55+0.13*(k%5),  vx:0.37+0.09*(k%3),
               fz:k*0.9, fx:k*1.7+1.1, h:YT-0.62-PH});}
  let tF=0;
  AGGIORNA.push(function(dt){
    tF+=dt;
    FARI.forEach(function(q){
      const rz=q.az*Math.sin(tF*q.vz+q.fz);
      const rx=-0.10+q.ax*Math.sin(tF*q.vx+q.fx);
      q.gf.rotation.set(rx,0,rz);
      /* dove batte: (0,-1,0) ruotato, poi giu' fino al tavolato */
      giu.set(0,-1,0).applyEuler(eu.set(rx,0,rz));
      const t=q.h/Math.max(0.2,-giu.y);
      q.p.position.set(q.px+giu.x*t, PH+0.12, TZ+giu.z*t);});});

  /* ---- I BALLERINI --------------------------------------------------- */
  if(typeof window.creaPersona==='function'){
    const DIV=[{maglia:0xD8438C,calz:0x2A2E34,calze:0xE8E4DA},
               {maglia:0x2FB0A8,calz:0x2A2E34,calze:0xE8E4DA}];
    [[-80,1],[-74,0],[-68,1],[-62,0],[-56,1],[-50,0]].forEach((q,i)=>{
      const p=window.creaPersona(q[0],PZ0+2.9,DIV,q[1],i+2,(i*1.9)%6.28,
        0.55,0.9,{y0:PH,coda:i%2===0});
      if(p.userData.rec) p.userData.rec.ballo=i;   /* questi ballano */
      /* sul palco le luci battono forte: un filo di emissive perche' le
         figure non anneriscano contro il fondale */
      p.traverse(o=>{ if(o.isMesh&&o.material&&o.material.emissive)
        o.material.emissive.setHex(0x3A3A42); });});}

  /* ---- LE SEGGIOLE GRIGIE, lato sud ---------------------------------- */
  const GRI=em(0x9A9EA4,0x2A2C30), GAMBA=em(0x6E7278,0x1E2024);
  /* Una seggiola da conferenza e' 45 cm di seduta e 44 di larghezza, e
     quelle lo erano: il vuoto non veniva dalla misura, veniva dal NUMERO.
     Centotrenta sedie in un capannone da 39 x 24 occupavano 16 x 5 metri e
     lasciavano il resto deserto. Ora la platea e' vera: 396 posti in due
     settori separati da un corridoio centrale, che e' come si allestisce
     una sala — e riempie lo spazio fra il palco e le tribune.
     Tre pezzi per sedia invece di sei (seduta, schienale, telaio): con
     quattrocento sedie la differenza e' 1.200 mesh contro 2.400, e su iPad
     si sente. */
  function seggiola(sx,sz){
    box(g,0.46,0.055,0.44,GRI,sx,0.45,sz,false);          /* seduta    */
    box(g,0.46,0.48,0.05,GRI,sx,0.70,sz+0.20,false);      /* schienale */
    box(g,0.40,0.42,0.34,GAMBA,sx,0.21,sz,false);         /* telaio    */}
  /* due settori, corridoio centrale di 2,2 m, tutte rivolte al palco.
     Nove file da 0,95: da z=52,8 (2,7 m dal proscenio) a z=60,4 (4,1 m
     davanti al primo gradone delle tribune). */
  for(let r=0;r<9;r++) for(let s=0;s<2;s++) for(let k=0;k<22;k++)
    seggiola(cx+(s?1.1:-14.3)+k*0.60, 52.8+r*0.95);

  /* ---- GLI SPETTATORI SEDUTI --------------------------------------------
     Una persona seduta non e' una persona in piedi accorciata: le cosce
     stanno ORIZZONTALI sulla seduta (0,45) e le tibie scendono verticali
     davanti. Testa a 1,12 — sono ragazzi di 1,45 in piedi.
     Guardano tutti il palco, cioe' verso -Z, che e' il fronte del modello.
     Non sono su tutte le sedie: una sala piena in ogni posto e' meno vera
     di una con dei vuoti, e costerebbe il doppio delle mesh. */
  const APPLAUSI=[];
  const VESTI=[0x2E5B8C,0xB8563E,0x3E7A50,0x8A5FA8,0xC9A23E,0x2A2E34,
               0xD8D3C6,0x5A6470];
  const CARNI=[0xE4C3A0,0xC98F63,0x8B5A38,0xD9AE86];
  const CAPI =[0x2B2118,0x4A3524,0x8A6A3A,0x1A1512];
  function spettatore(sx,sz,i){
    const ve=em(VESTI[i%VESTI.length],0x24242A),
          pe=em(CARNI[(i*3)%CARNI.length],0x2A2420),
          ca=em(CAPI[(i*5)%CAPI.length],0x1A1614),
          pa=em(0x36393F,0x1C1E22);
    box(g,0.34,0.42,0.20,ve,sx,0.78,sz+0.10,false);         /* busto      */
    box(g,0.30,0.16,0.30,pa,sx,0.52,sz-0.06,false);         /* cosce      */
    [-1,1].forEach(q=>{
      box(g,0.12,0.42,0.13,pa,sx+q*0.09,0.24,sz-0.20,false);  /* tibie    */
      box(g,0.13,0.07,0.22,em(0x24282E,0x141618),sx+q*0.09,0.04,sz-0.26,false);});
    /* LE BRACCIA IN UN GRUPPO, PER APPLAUDIRE (Andrea). Erano due scatole
       fisse: un pubblico immobile davanti a un palco e' l'unica cosa che
       nessuno ha mai visto. Il gruppo e' imperniato alle spalle e ruota
       intorno a X, cosi' le mani salgono e si avvicinano. */
    const br=new THREE.Group(); br.position.set(sx,0.98,sz+0.02);
    br.userData.animato=true; g.add(br);
    [-1,1].forEach(q=>box(br,0.09,0.36,0.10,ve,q*0.21,-0.18,0.02,false));
    APPLAUSI.push({b:br,f:(i*2.3)%6.28});
    const t=new THREE.Mesh(new THREE.SphereGeometry(0.105,10,8),pe);
    t.position.set(sx,1.10,sz+0.06); g.add(t);
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.112,10,7,0,
      Math.PI*2,0,Math.PI*0.56),ca);
    c.position.set(sx,1.11,sz+0.06); g.add(c);
    const n=new THREE.Mesh(new THREE.SphereGeometry(0.088,8,6),ca);
    n.position.set(sx,1.08,sz+0.14); g.add(n);}
  /* piu' fitti davanti, radi in fondo: e' come si riempie una sala */
  const rnd=seme(4172); let n=0;
  for(let r=0;r<9;r++) for(let s=0;s<2;s++) for(let k=0;k<22;k++)
    if(rnd() < 0.78-r*0.06)
      spettatore(cx+(s?1.1:-14.3)+k*0.60, 52.8+r*0.95, n++);
  /* L'APPLAUSO. Non tutti insieme: ognuno ha la sua fase e la sua cadenza,
     altrimenti quattrocento persone battono le mani all'unisono come un
     metronomo — che e' peggio di stare ferme. Il ritmo e' quello vero,
     poco meno di tre battiti al secondo. */
  let tA=0;
  AGGIORNA.push(function(dt){
    tA+=dt;
    APPLAUSI.forEach(function(a){
      const w=tA*(16.5+(a.f%1.3)*2.6)+a.f;
      /* SEGNO SBAGLIATO: applaudivano DIETRO LA SCHIENA. Gli spettatori
         guardano il palco, che sta a z minore, quindi il loro davanti e'
         -Z; e per un braccio che pende lungo -Y una rotazione POSITIVA
         intorno a X porta la mano in avanti. Con il meno le mani finivano
         dietro. E' lo stesso errore delle scarpe montate al contrario: su
         una figura simmetrica il verso non protesta, va calcolato. */
      a.b.rotation.x=0.95+Math.abs(Math.sin(w))*0.42;});});

  /* ---- LE TRIBUNE A U, in fondo (a ponente) --------------------------- */
  /* Un modulo: 6 m di fronte, tre gradoni da 0,45 di alzata e 0,78 di
     pedata. `dir` e' il verso in cui si guarda: le sedute salgono
     allontanandosi da li'. */
  function tribuna(mx,mz,lungoX,dir){
    const L=6.0, AL=0.45, PE=0.78;
    for(let k=0;k<3;k++){
      const off=(k+0.5)*PE*(-dir), y=(k+1)*AL;
      const px=lungoX?mx:mx+off, pz=lungoX?mz+off:mz;
      const sw=lungoX?L:PE, sd=lungoX?PE:L;
      box(g,sw,0.10,sd,LEGNO,px,y,pz,true);                 /* seduta   */
      box(g,lungoX?L:0.08,AL,lungoX?0.08:L,FERRO,
          lungoX?px:px+PE*0.42*(-dir),y-AL/2,
          lungoX?pz+PE*0.42*(-dir):pz,false);               /* alzata   */
      /* i montanti del telaio */
      for(let j=0;j<3;j++){
        const t=(j-1)*L*0.42;
        box(g,0.07,y,0.07,FERRO,lungoX?px+t:px,y/2,lungoX?pz:pz+t,false);}}
    /* il corrimano dietro */
    const bx=lungoX?mx:mx-PE*3.2*dir, bz=lungoX?mz-PE*3.2*dir:mz;
    box(g,lungoX?L:0.07,0.07,lungoX?0.07:L,FERRO,bx,1.85,bz,false);
    [-1,1].forEach(sg=>box(g,0.07,1.5,0.07,FERRO,
      lungoX?bx+sg*L*0.46:bx, 1.1, lungoX?bz:bz+sg*L*0.46,false));}
  /* LE TRIBUNE STANNO TUTTE DALLA PARTE OPPOSTA AL PALCO (Andrea), cioe'
     addossate al lato sud, e guardano a nord — verso il palco. Niente piu'
     U: i due ritorni laterali davano le spalle o il fianco alla scena, che
     e' esattamente quello che una tribuna non deve fare.
     Sei moduli da 6 m in fila lungo X; `dir:-1` fa salire i gradoni
     ALLONTANANDOSI dal palco, cosi' chi sta in alto vede sopra chi sta
     davanti. La prima fila e' a z=64,7, l'ultima a 66,3, il corrimano a
     67,2: tutto dentro la parete sud (68,1). */
  const ZT=Z1-3.4;
  for(let k=0;k<6;k++) tribuna(X0+3.6+k*6.2, ZT, true, -1);
})();

/* ==========================================================================
   LA CASA FAMIGLIA — a ponente del QdV Arena, staccata da tutto
   --------------------------------------------------------------------------
   MISURATA SULL'ORTOFOTO ZENITALE, non stimata dalle oblique: il tetto in
   coppi va da z=54,7 a z=96,9 (42,1 m) e il corpo e' largo 13,5 fra x=-138,5
   e x=-125,0. Dal tratto z=71 in giu' la sagoma si allarga a 17,5 verso
   PONENTE: quei quattro metri e mezzo in piu' sono la LOGGIA, che dall'alto
   si legge come un allargamento del tetto e da terra e' un portico su
   pilastri quadrati (fotografia del fronte ovest).

   LA BICROMIA. Dalle viste dall'alto sembrava tutto di un colore perche' si
   vede quasi solo il tetto: la fotografia del fronte dice che i due corpi di
   TESTA sono a intonaco ROSSO TERRACOTTA e l'ala di mezzo, dietro la loggia,
   e' BIANCA. Senza quella lettura sarebbe una stecca beige.

   Un piano fuori terra, falda bassa in coppi con la gronda molto sporgente,
   e davanti — a ponente — un giardino formale: prato diviso in quarti da
   vialetti, siepi basse di bosso, filare di alberelli lungo il portico e una
   piazzola pavimentata al centro. Il giardino non e' contorno: nella foto
   occupa quanto l'edificio.
   ========================================================================== */
(function casaFamiglia(){
  const g=new THREE.Group(); mondo.add(g);
  const ZN=55.0, ZS=96.5, XW=-138.5, XE=-125.0;   /* corpo di fabbrica    */
  const XL=-143.3, ZL0=70.0, ZL1=92.0;            /* filo pilastri, loggia*/
  const H=4.30, CXC=(XW+XE)/2;
  const ROSSO=lam(0xA8482E), BIANCO=lam(0xEDE9DE),
        PIETRA=lam(0xD8D4C8), SCURO=lam(0x3A3630);

  /* i due corpi di testa, rosso terracotta */
  [[ZN,ZL0],[ZL1,ZS]].forEach(q=>
    solido(box(g,XE-XW,H,q[1]-q[0],ROSSO,CXC,H/2,(q[0]+q[1])/2,true)));
  /* l'ala di mezzo, bianca, arretrata dietro il portico */
  solido(box(g,XE-XW,H,ZL1-ZL0,BIANCO,CXC,H/2,(ZL0+ZL1)/2,true));
  /* zoccolo continuo */
  box(g,XE-XW+0.2,0.45,ZS-ZN+0.2,PIETRA,CXC,0.22,(ZN+ZS)/2,false);

  /* --- LA LOGGIA: pilastri quadrati e falda che sporge a coprirli ------ */
  const np=Math.round((ZL1-ZL0)/2.75);
  for(let i=0;i<=np;i++){
    const pz=ZL0+i*(ZL1-ZL0)/np;
    solido(box(g,0.40,H-0.10,0.40,BIANCO,XL,(H-0.10)/2,pz,true));}
  box(g,0.46,0.34,ZL1-ZL0+0.8,BIANCO,XL,H-0.05,(ZL0+ZL1)/2,false);  /* trave */
  /* la falda del portico: dal muro al filo dei pilastri */
  (function(){
    const w=XW-XL+0.5, cx=(XL+XW)/2-0.25;
    const f=box(g,w,0.22,ZL1-ZL0+1.0,lam(0xA85A3C),cx,H+0.42,(ZL0+ZL1)/2,true);
    f.rotation.z=-Math.atan2(0.55,w);})();
  /* pavimento del portico */
  box(g,XW-XL+0.3,0.12,ZL1-ZL0+0.6,PIETRA,(XL+XW)/2,0.30,(ZL0+ZL1)/2,false);
  /* le aperture sotto il portico: porte-finestra scure */
  for(let i=0;i<8;i++)
    box(g,0.10,2.35,1.30,SCURO,XW-0.06,1.35,ZL0+1.8+i*2.6,false);
  /* e le finestre sui due corpi rossi */
  [[ZN+2.6,4],[ZL1+1.3,2]].forEach(q=>{ for(let i=0;i<q[1];i++){
    box(g,0.10,1.35,1.15,SCURO,XW-0.06,2.35,q[0]+i*2.9,false);
    box(g,0.10,1.35,1.15,SCURO,XE+0.06,2.35,q[0]+i*2.9,false);}});

  /* --- IL TETTO in coppi, a padiglione, con la gronda sporgente -------- */
  tetto(g,CXC,(ZN+ZS)/2,XE-XW+1.5,ZS-ZN+1.5,H,2.35,{pluviali:0,
    comignoli:[[-3,-14,1.1],[2,13,1.0]]});

  /* --- il corpo minore bianco a levante (ortofoto: x -124 . -117) ------ */
  solido(box(g,7.0,3.05,8.4,BIANCO,-120.6,1.52,63.4,true));
  box(g,7.4,0.20,8.8,lam(0xC9C4B6),-120.6,3.14,63.4,false);
  contatto(g,-120.6,0.04,63.4,9.5,11,0.45);

  /* --- IL GIARDINO FORMALE, a ponente della loggia --------------------- */
  const GX0=-166.0, GX1=-144.5, GZ0=53.0, GZ1=96.0;
  (function(){
    const pr=new THREE.Mesh(new THREE.PlaneGeometry(GX1-GX0,GZ1-GZ0),
      lam(0x4E8A46));
    pr.rotation.x=-Math.PI/2; pr.position.set((GX0+GX1)/2,0.04,(GZ0+GZ1)/2);
    g.add(pr);})();
  /* i vialetti in ghiaia che dividono il prato in quarti */
  const GCX=(GX0+GX1)/2, GCZ=(GZ0+GZ1)/2, VIA=lam(0xCFC8B6);
  [[GX1-GX0,1.6,GCX,GCZ],[1.6,GZ1-GZ0,GCX,GCZ]].forEach(q=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(q[0],q[1]),VIA);
    m.rotation.x=-Math.PI/2; m.position.set(q[2],0.05,q[3]); g.add(m);});
  /* le siepi basse di bosso che bordano le quattro aiuole */
  const SIEPE=lam(0x2E5E30);
  [[GX0+1.2,GCX-1.6,GZ0+1.2,GCZ-1.6],[GCX+1.6,GX1-1.2,GZ0+1.2,GCZ-1.6],
   [GX0+1.2,GCX-1.6,GCZ+1.6,GZ1-1.2],[GCX+1.6,GX1-1.2,GCZ+1.6,GZ1-1.2]]
   .forEach(q=>{
    const w=q[1]-q[0], d=q[3]-q[2], cx=(q[0]+q[1])/2, cz=(q[2]+q[3])/2;
    [[w,0.5,cx,q[2]],[w,0.5,cx,q[3]],[0.5,d,q[0],cz],[0.5,d,q[1],cz]]
      .forEach(r=>box(g,r[0],0.55,r[1],SIEPE,r[2],0.28,r[3],false));});
  /* la piazzola pavimentata al centro, con l'elemento in mezzo */
  box(g,5.2,0.10,5.2,VIA,GCX,0.07,GCZ,false);
  box(g,1.5,0.55,1.5,PIETRA,GCX,0.30,GCZ,true);
  box(g,0.9,0.28,0.9,lam(0xBFB9A8),GCX,0.70,GCZ,false);
  /* il filare di alberelli lungo il portico */
  for(let i=0;i<8;i++) albero(XL-2.6, ZL0+1.2+i*3.0, 0.62);
  /* gli arbusti conici sul bordo esterno del giardino */
  for(let i=0;i<16;i++){
    const cz=GZ0+1.0+i*(GZ1-GZ0-2)/15;
    const c=new THREE.Mesh(new THREE.ConeGeometry(0.45,1.7,7),SIEPE);
    c.position.set(GX0-0.8,0.85,cz); c.castShadow=true; g.add(c);}
  contatto(g,CXC,0.05,(ZN+ZS)/2,XE-XW+7,ZS-ZN+4,0.45);
})();

/* ===================== I TOMBINI DEL PIANO TERRA =======================
   Quattro pozzetti di ispezione, uno per ciascun settore di SOTTOTRACCIA
   (sottosuolo.html). Non sono decorazione: si guardano col mirino e si
   aprono, e da lì si scende nella rete dei sottoservizi.

   Le quattro posizioni sono state verificate coi raggi, non a occhio:
   raggio verticale dall'alto (che cosa c'e' sotto quel punto) piu' il
   controllo che nella fascia 0,30 - 2,40 m non ci sia niente, cioe' che
   uno ci possa stare in piedi davanti.
     basket   (-24,0 ·   8,0)  bordo del campo, sull'area azzurra
     infanzia (-45,0 ·  12,0)  dentro il giardino, sul pavimento morbido
     chiesa   (-30,5 · -30,0)  sul prato davanti al fronte della chiesa
     piscine  ( 52,0 ·  -8,0)  sul piazzale di cotto, a ponente della vasca

   Accanto a ogni tombino c'e' il PALETTO SEGNALATORE, quello vero che si
   pianta sopra i sottoservizi: cappello del colore dell'impianto secondo
   il codice UNI (azzurro acqua, giallo gas, rosso cavo elettrico). Serve
   anche a far trovare il tombino senza mettere un cartello.
   ==================================================================== */
const TOMBINI=[];
(function tombini(){
  const mGhisa =lam(0x3A3F45), mBordo=lam(0x53585F), mOro=lam(0xB8860B);
  const mPalo  =lam(0xE4E0D6);

  function tombino(settore, x, z, y, colCappello, etichetta){
    const g=new THREE.Group(); g.position.set(x,y,z); mondo.add(g);

    /* Telaio e chiusino A FILO del terreno. La prima stesura li teneva
       13 cm sopra e sembravano un basamento posato li': un tombino sporge
       di quattro centimetri, non di quindici. Restano sopra il piano di
       calpestio quanto basta a non finire in z-fighting con l'asfalto. */
    box(g,0.96,0.05,0.96,mBordo,0,0.025,0,false);
    const ch=new THREE.Mesh(new THREE.CylinderGeometry(0.39,0.39,0.045,20),mGhisa);
    ch.position.y=0.052; ch.receiveShadow=true; g.add(ch);
    /* le nervature del chiusino: sei raggi, come sui tombini veri */
    for(let i=0;i<6;i++){
      const n=box(g,0.58,0.012,0.05,mBordo,0,0.078,0,false);
      n.rotation.y=i*Math.PI/6;}
    /* anello d'oro appena accennato: dice "questo si apre", senza cartelli */
    const an=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.022,6,24),mOro);
    an.rotation.x=-Math.PI/2; an.position.y=0.062; g.add(an);

    /* paletto segnalatore, col cappello del colore dell'impianto */
    box(g,0.06,0.92,0.06,mPalo,0.82,0.46,0.0,true);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.16,12),lam(colCappello));
    cap.position.set(0.82,0.99,0); cap.castShadow=true; g.add(cap);

    contatto(g,0,0.012,0,2.2,2.2,0.34);

    /* il bersaglio del mirino: un disco un filo piu' largo del chiusino,
       invisibile, cosi' si aggancia anche puntando storto */
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.72,0.5,12),
      new THREE.MeshBasicMaterial({visible:false}));
    b.position.y=0.25; g.add(b);
    b.userData.settore=settore; b.userData.etichetta=etichetta;
    b.userData.animato=true;              /* il gruppo non si muove, ma il
                                             test del raycaster vuole le
                                             matrici aggiornate */
    TOMBINI.push(b);
    return g;
  }

  tombino('basket',  -24.0,   8.0, 0.03, 0x29A3D6,
    'Pozzetto del drenaggio, al bordo del campo');
  tombino('infanzia',-45.0,  12.0, 0.06, 0xE8B21E,
    'Pozzetto dell\'irrigazione, nel giardino dell\'Infanzia');
  tombino('chiesa',  -30.5, -30.0, 0.01, 0xC0392B,
    'Pozzetto della linea elettrica, davanti alla chiesa');
  tombino('piscine',  52.0,  -8.0, 0.03, 0x29A3D6,
    'Pozzetto del ricircolo, sul piazzale delle piscine');
})();

/* ==========================================================================
   IL PRIMO PIANO — il file `primopiano.html`, portato qui INTERO
   --------------------------------------------------------------------------
   Corridoio a U scritto da zero sulle quote di PianoPrimo.pdf lette a
   300 dpi. Non e' stato ritoccato: sono state tolte solo le tre cose che
   qui sarebbero doppioni —
     · il suo impianto Three (scena, camera, renderer, luci): ce n'e' uno solo
       e sta in testa al file;
     · la sua passata di convertSRGBToLinear: una sola, in fondo;
     · la sua QUINTA SCENOGRAFICA ("quello che si vede fuori"), il campus in
       miniatura oltre le vetrate: con gli esterni veri era un doppione, e il
       suo muro da 70 m attraversava il campo da volley.
   Quattro nomi collidevano con gli esterni e sono stati rinominati, non
   fusi: boxP, pianoP, contattoP, semeP, texOmbraP.

   E il piano sta in un GRUPPO SUO, `piano1`, figlio di `mondo`. Non e' un
   dettaglio: il collaudo del corridoio e' geometrico su tutte le mesh, e
   condividendo `mondo` finiva per misurare anche il guscio degli edifici —
   che il corridoio lo CONTIENE per costruzione (corpo() fa un volume pieno).
   Risultato: "larghezza libera 0,00" su tutti e tre i bracci, cioe' un test
   che accusa il modello di un difetto che non ha. Il corridoio si misura
   dentro `piano1`; per il campus che gli passa attraverso c'e' un test
   apposta, piu' avanti, che cerca solo i pezzi SOTTILI.
   ========================================================================== */
const piano1=new THREE.Group(); mondo.add(piano1);

/* Le QUOTE e le coordinate del corridoio (PAV, SALTO, SOF, i fili dei tre
   bracci, la retta della gradinata) stanno in TESTA AL FILE, non qui: le
   usano anche gli esterni, che devono SCAVARE il corridoio dentro le masse
   degli edifici. Un numero, un posto solo. */
/* ============================ utilita' ================================== */
function tela(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function textura(c,rip){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  if(rip){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t;}
function mat(col,opt){return new THREE.MeshLambertMaterial(Object.assign({color:col},opt||{}));}

/* un generatore deterministico: le texture devono essere sempre uguali */
function semeP(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

function boxP(p,w,h,d,m,x,y,z,ombra){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);
  if(ombra){o.castShadow=true;o.receiveShadow=true;}
  p.add(o); return o;
}
function pianoP(p,w,d,m,x,y,z,rx){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  o.rotation.x = (rx===undefined?-Math.PI/2:rx);
  o.position.set(x,y,z); o.receiveShadow=true; p.add(o); return o;
}

/* ---- ombra di contatto: senza, ogni oggetto galleggia ------------------ */
const texOmbraP = (()=>{
  const c=tela(128,128), g=c.getContext('2d');
  const rg=g.createRadialGradient(64,64,4,64,64,62);
  rg.addColorStop(0,'rgba(0,0,0,.34)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,128,128); return textura(c,false);
})();
function contattoP(p,x,y,z,w,d){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({map:texOmbraP,transparent:true,depthWrite:false}));
  o.rotation.x=-Math.PI/2; o.position.set(x,y+0.004,z); p.add(o); return o;
}

/* ============================ materiali =================================
   I colori esadecimali sono sRGB ma Three r128 li tratta come lineari: a
   scena costruita si fa UNA passata di convertSRGBToLinear sui soli color,
   altrimenti ogni tinta esce di un tono e mezzo piu' chiara.           */

/* gres grigio a grandi lastre — 4868/4874: grigio medio caldo, fughe fini */
function texGres(w,d){
  const c=tela(512,512), g=c.getContext('2d'), r=semeP(17);
  g.fillStyle='#8e8a84'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){
    g.fillStyle=['#948f89','#87837d','#9a958f'][(r()*3)|0];
    g.fillRect(r()*512,r()*512,3,3);
  }
  g.strokeStyle='#7a766f'; g.lineWidth=3;
  g.strokeRect(0,0,512,512);
  const t=textura(c,true); t.repeat.set(Math.max(1,w/0.8),Math.max(1,d/0.8));
  return t;
}
/* pavimento a scacchi della Primaria — 4856: rosa antico, grigio, beige */
function texScacchi(w,d){
  const c=tela(512,512), g=c.getContext('2d'), r=semeP(29);
  const pal=['#cbbdb2','#6e6a66','#ded5c8','#b9a89c'];
  for(let i=0;i<8;i++) for(let j=0;j<8;j++){
    g.fillStyle=pal[(i+j*3+((r()*2)|0))%4];
    g.fillRect(i*64,j*64,64,64);
  }
  g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=2;
  for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,512);g.stroke();
                        g.beginPath();g.moveTo(0,i*64);g.lineTo(512,i*64);g.stroke();}
  const t=textura(c,true); t.repeat.set(Math.max(1,w/4),Math.max(1,d/4));
  return t;
}
/* controsoffitto a quadrotti — 4868 e 4856 lo mostrano in tutti e due i corridoi */
function texQuadrotti(w,d){
  const c=tela(256,256), g=c.getContext('2d');
  g.fillStyle='#f4f3ef'; g.fillRect(0,0,256,256);
  g.strokeStyle='#d9d7d1'; g.lineWidth=6; g.strokeRect(3,3,250,250);
  const t=textura(c,true); t.repeat.set(Math.max(1,w/1.2),Math.max(1,d/1.2));
  return t;
}

const M = {
  muroSec   : mat(0xF2F1ED),   /* pareti bianche della Secondaria          */
  muroPrim  : mat(0xE8620A),   /* arancione pieno della Primaria           */
  solaio    : mat(0xbdbab2),
  telaioChi : mat(0xB9BEC3),   /* IMG_4878: i telai sono GRIGIO CHIARO     */
  telaioScu : mat(0x4A4E52),   /* telai grigio scuro, Primaria             */
  /* IMG_4878: il vetro e' TRASPARENTE — dal corridoio si vedono i campi, gli
     alberi e l'edificio di fronte. Con opacity 0,30 era una lastra lattiginosa
     che non lasciava vedere niente. */
  vetro     : new THREE.MeshPhongMaterial({color:0xcfe2ef,transparent:true,
                opacity:0.13,shininess:110,specular:0xffffff,side:THREE.DoubleSide,
                depthWrite:false}),
  legno     : mat(0xb9905e),
  salvia    : mat(0xA8C49A),
  gambaBlu  : mat(0x2b5cae),
  portaSec  : mat(0xE4E2DC),   /* chiare: le rosse sono della Primaria     */
  portaPrim : mat(0xD8443A),
  senape    : mat(0xD8A83C),
  gres      : mat(0x7E7A75),
  inox      : new THREE.MeshPhongMaterial({color:0xc6cad0,shininess:110,specular:0xffffff}),
  travert   : mat(0xE8E2D4),
  scuro     : mat(0x4E5155),
  arancioF  : mat(0xE8862A),
  bianco    : mat(0xF6F4EE)
};
/* IL GRADINO PIU' ALTO DELLA GRADINATA E' COMPLANARE AL PAVIMENTO RIALZATO:
   tutti e due stanno a PAV+SALTO, e il poligono del gradino — che e' l'area
   OLTRE la sua retta — si estende fino in fondo al braccio est. Due superfici
   opache alla stessa profondita' sfarinano in strisce che cambiano a ogni
   fotogramma. La geometria non si tocca (quella gradinata e' costata cinque
   tentativi): si dice al depth buffer chi sta dietro.
   L'offset e' POSITIVO, cioe' spinge indietro i gradini: dove il gradino piu'
   alto e il pavimento coincidono deve vincere IL PAVIMENTO, che porta la
   texture del gres. Col segno opposto il fastidio spariva lo stesso, ma tutto
   il tratto rialzato diventava una campitura grigia piatta. */
M.gresGrad = mat(0x7E7A75,{polygonOffset:true,polygonOffsetFactor:2,
                           polygonOffsetUnits:2});

/* ====================== i pezzi del corridoio ===========================
   tre primitive, usate da tutti e tre i bracci: e' la ragione per cui qui
   una correzione vale per tutto il corridoio e non per un terzo. */

/* pavimento + solaio sotto + controsoffitto a quota +3,00 */
function calpestio(x0,x1,z0,z1,q,mpav){
  const w=x1-x0, d=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  pianoP(piano1,w,d, mpav || mat(0xffffff,{map:texGres(w,d)}), cx,q,cz);
  boxP(piano1,w,0.34,d,M.solaio,cx,q-0.18,cz,false);
  pianoP(piano1,w,d,mat(0xffffff,{map:texQuadrotti(w,d)}),cx,q+3.00,cz,Math.PI/2);
}
/* parete piena su un lato lungo: mai in mezzo al passaggio */
function parete(x0,x1,z0,z1,q,m){
  const w=(x1-x0)||0.16, d=(z1-z0)||0.16;
  boxP(piano1,w,3.00,d,m,(x0+x1)/2,q+1.50,(z0+z1)/2,false);
}
/* fronte vetrato CHIUSO: parapetto, lastra, montanti, traverso.
   Un montante senza lastra non e' una finestra: e' un colonnato, ed e'
   cosi' che il corridoio si leggeva come un ballatoio esterno. */
function vetrata(x0,x1,z0,z1,q,telaio){
  /* IMG_4878 — LA VETRATA HA DUE REGISTRI, non uno:
       - in alto i battenti GRANDI, che prendono i due terzi dell'altezza,
       - in basso una fascia PIU' BASSA, l'ultimo terzo,
     separate da un TRAVERSO robusto, con i montanti che continuano su tutti
     e due i registri. Telai GRIGIO CHIARO, vetro trasparente.
     Avevo invertito le proporzioni — battenti bassi sopra e alti sotto — e
     scurito i telai, che invece sono chiari. */
  const dx=x1-x0, dz=z1-z0, L=dx||dz, lungoX=!!dx;
  const HTOT=3.00-0.90-0.30;                 /* dal parapetto al traverso alto */
  const HALT=HTOT*0.62, HBAS=HTOT-HALT;      /* i battenti alti sono i piu' grandi */
  const yBas=q+0.90+HBAS/2, yAlt=q+0.90+HBAS+HALT/2, yTrav=q+0.90+HBAS;
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  /* parapetto sotto e fascia piena sopra */
  boxP(piano1,dx||0.16,0.90,dz||0.16,M.muroSec,cx,q+0.45,cz,false);
  boxP(piano1,dx||0.16,0.30,dz||0.16,M.muroSec,cx,q+3.00-0.15,cz,false);
  /* le due lastre */
  [[HBAS,yBas],[HALT,yAlt]].forEach(r=>{
    const l=new THREE.Mesh(new THREE.PlaneGeometry(L,r[0]),M.vetro);
    l.rotation.y = lungoX?0:Math.PI/2;
    l.position.set(cx,r[1],cz); piano1.add(l);
  });
  /* montanti: passo ~1,5 m, su tutta l'altezza */
  const n=Math.max(2,Math.round(L/1.5));
  for(let i=0;i<=n;i++){
    const t=i/n;
    boxP(piano1,lungoX?0.10:0.15,HTOT,lungoX?0.15:0.10,telaio,
        x0+(x1-x0)*t, q+0.90+HTOT/2, z0+(z1-z0)*t, false);

     dentro il vano il primo ostacolo sono i gradini, non il pavimento. */

    calpestio(vx0,vx1,NZ0,vz0,PAV, sc(vx1-vx0,vz0-NZ0));      /* lato aule  */

  parete(EX0,EX1,EZ1,EZ1,PAV+SALTO,M.muroSec);

/* ===== LA GRADINATA: tre alzate, obliqua a 30 gradi, nell'angolo NE ===== */
(function gradinata(){
  /* LA GRADINATA E' UN DISLIVELLO SCAVATO, NON TRE TRAVI APPOGGIATE.
     Prima ogni gradino era un box: aveva quattro fianchi liberi e le
     testate restavano sospese sopra il pavimento invece di morire dentro
     le pareti — nella foto reale il gradino non ha fianchi, e' il pavimento
     stesso che sale.
     Qui ogni gradino e' il POLIGONO dell'area oltre la sua retta,
     ritagliato sui fili del corridoio ed estruso in altezza: tocca le due
     pareti per costruzione e non puo' restare a mezz'aria.
     Tre rette parallele a 45 gradi, distanti una pedata: due rette
     z = x - C1 e z = x - C2 distano |dC|/radice2, quindi dC = ped*radice2.
     Il gradino piu' alto sta su CGRAD, la stessa retta da cui parte il
     pavimento rialzato. */
  /* PEDATE LARGHE: 0,95 m, non 0,42. Nella foto e nel confronto di Andrea i
     tre gradini sono ampi e comodi, occupano tutta la svolta — non tre
     scalini stretti al centro del corridoio. */
  const N=3, alz=SALTO/N, ped=0.95;
  for(let i=0;i<N;i++){
    const h=alz*(i+1);
    const Ki=KGRAD-(N-1-i)*ped*Math.SQRT2;   /* rette parallele, verso opposto */
    /* la shape sta nel piano XY e diventa XZ con rotation.x = -PI/2:
       la y della shape e' quindi -z del piano1. */
    const sh=new THREE.Shape();
    sh.moveTo(EX0, -(Ki-EX0));
    sh.lineTo(EX1, -(Ki-EX1));
    sh.lineTo(EX1, -EZ1);
    sh.lineTo(EX0, -EZ1);
    sh.closePath();
    const geo=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});
    const m=new THREE.Mesh(geo,M.gresGrad);
    m.rotation.x=-Math.PI/2; m.position.y=PAV;
    m.castShadow=true; m.receiveShadow=true; piano1.add(m);
    /* il naso: una riga chiara a filo dello spigolo, non un listello */
    /* NIENTE NASI (Andrea): erano box ruotati attorno al proprio centro,
       mentre il gradino e' un poligono ritagliato sui muri — due forme che
       non combaciano, e le righe chiare proseguivano oltre lo spigolo sul
       pavimento basso. Lo spigolo del gradino si legge gia' da solo. */
  }
  contattoP(piano1,(EX0+EX1)/2,PAV,zSoglia((EX0+EX1)/2)-0.7,EX1-EX0+1.0,3.6);
})();

(function ambientiPrimoPiano(){

  const COL=[0xA8C82E,0x2B3A6E];       /* sedie lime e blu, come nelle foto  */
  let nBanco=0;
  function aula(x0,x1,z0,z1,q,lato){

      finestre(z0,z1,x0,false,q,+1);

      cattedra(x1-1.7,z0+1.4,-Math.PI/2,q);

       "davanti" del banco (il suo -Z locale) in direzione (-sin ry, -cos ry):

       serve -PI/2. Nell'ala est e nella Primaria erano girati al contrario e

    const cx=(x0+x1)/2, cz=(z0+z1)/2, w=x1-x0, d=z1-z0;
    const nf=3, nc=2;

  aula(DIV_SEC[DIV_SEC.length-1],X1,Z_SEC,NZ0,PAV,'s');

  /* le porte del braccio est stanno a z = 3,28 · 9,56 · 15,88 · 22,23 ·
     27,35: i divisori cadono sulle loro mezzerie. */
  const P_EST=[3.28,9.56,15.88,22.23,27.35];
  const DIV_EST=[NZ1].concat(P_EST.slice(0,-1).map((z,i)=>(z+P_EST[i+1])/2)).concat([EZ1]);
  for(let i=0;i<DIV_EST.length-1;i++){

  /* "GLI UFFICI NON SI RICOSTRUISCONO" diceva il primo piano: si vedeva solo

  const DIV_UFF=[-36.70,-30.50,-25.00,-20.50,-15.72];
  for(let i=0;i<DIV_UFF.length-1;i++){

    contattoP(g,cx,PAV,Z_SEC+2.2,2.2,1.4);

    boxP(g,x1-x0-1.4,1.20,0.42,M.bianco,cx,PAV+0.60,NZ0-0.36,true);

/* ---- Coppa delle Case: il tesoro dell'ultima tappa ----
   Calice dorato su podio di pietra, con i quattro stemmi delle Case della
   Sacra Famiglia e quattro colonne di vetro riempite dei loro colori
   (Aquilablu, Querciaverde, Cerogiallo, Tassorosso). */
const texFascia=(()=>{const c=mkCanvas(1024,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#e8c86a');gr.addColorStop(.45,'#c9a03a');gr.addColorStop(1,'#9a7420');
  g.fillStyle=gr;g.fillRect(0,0,1024,256);
  g.fillStyle='rgba(255,244,206,.30)';g.fillRect(0,14,1024,10);
  g.fillStyle='rgba(90,64,10,.30)';g.fillRect(0,232,1024,12);
  [['#2b5aa8','AQUILABLU'],['#2e7a3a','QUERCIAVERDE'],
   ['#d8a828','CEROGIALLO'],['#a8302a','TASSOROSSO']].forEach((h,i)=>{
    const cx=128+i*256;
    g.fillStyle='#f2e6c2';
    g.beginPath();g.moveTo(cx-52,52);g.lineTo(cx+52,52);g.lineTo(cx+52,132);
    g.quadraticCurveTo(cx+52,186,cx,206);g.quadraticCurveTo(cx-52,186,cx-52,132);
    g.closePath();g.fill();
    g.fillStyle=h[0];
    g.beginPath();g.moveTo(cx-42,62);g.lineTo(cx+42,62);g.lineTo(cx+42,130);
    g.quadraticCurveTo(cx+42,176,cx,193);g.quadraticCurveTo(cx-42,176,cx-42,130);
    g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(cx,118,20,0,Math.PI*2);g.fill();
    g.fillStyle='#5a4410';g.font='bold 19px Lexend, sans-serif';g.textAlign='center';
    g.fillText(h[1],cx,40);});
  return tex(c,false);})();
function coppaDelleCase(){
  const g=new THREE.Group();
  const oro=new THREE.MeshPhongMaterial({color:0xd8ab3e,shininess:130,specular:0xfff2c8});
  const oroS=new THREE.MeshPhongMaterial({color:0xb0822a,shininess:100,specular:0xffe8a8});
  const pietra=lam(0xd2c8b0), pietraS=lam(0xbdb298);
  /* podio a due gradoni */
  box(g,3.4,0.30,1.7,pietraS,0,0.15,0,true);
  box(g,3.0,0.24,1.4,pietra,0,0.42,0,true);
  const targa=box(g,2.0,0.30,0.05,oro,0,0.20,0.87,false);
  targa.material=new THREE.MeshPhongMaterial({shininess:120,specular:0xfff2c8,
    map:(()=>{const c=mkCanvas(512,80),x=c.getContext('2d');
      x.fillStyle='#c9a03a';x.fillRect(0,0,512,80);
      x.fillStyle='#5a4410';x.font='bold 25px Lexend, sans-serif';x.textAlign='center';
      x.fillText('COPPA DELLE CASE',256,50);return tex(c,false);})()});
  /* calice: profilo a rivoluzione */
  const P=[[0.34,0],[0.36,0.05],[0.24,0.10],[0.11,0.16],[0.08,0.34],
           [0.15,0.42],[0.17,0.48],[0.12,0.55],[0.09,0.62],
           [0.20,0.70],[0.34,0.84],[0.43,1.04],[0.46,1.22],[0.455,1.28],[0.40,1.28]];
  const lat=new THREE.Mesh(new THREE.LatheGeometry(
    P.map(q=>new THREE.Vector2(q[0],q[1])),36),oro);
  lat.position.y=0.54;lat.castShadow=true;g.add(lat);
  /* fascia con i quattro stemmi attorno alla coppa */
  const fascia=new THREE.Mesh(new THREE.CylinderGeometry(0.455,0.40,0.42,40,1,true),
    new THREE.MeshPhongMaterial({map:texFascia,shininess:90,specular:0xfff0c0}));
  fascia.position.y=0.54+1.06;g.add(fascia);
  /* anse a voluta */
  [-1,1].forEach(sg=>{
    const an=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.032,8,20,Math.PI*1.25),oroS);
    an.position.set(sg*0.50,0.54+1.02,0);an.rotation.y=Math.PI/2;
    an.rotation.z=sg>0?-0.5:Math.PI+0.5;an.castShadow=true;g.add(an);});
  /* quattro colonne di vetro coi colori delle Case */
  const vetroT=new THREE.MeshPhongMaterial({color:0xdfeef6,transparent:true,opacity:0.34,
    shininess:170,specular:0xffffff,side:THREE.DoubleSide});
  [[-1.18,0x2b5aa8],[-0.78,0x2e7a3a],[0.78,0xd8a828],[1.18,0xa8302a]].forEach((q,i)=>{
    const x=q[0], h=0.95+((i===0||i===3)?0.16:0);
    box(g,0.34,0.30,0.34,pietra,x,0.69,0,true);
    const tu=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,h,16,1,true),vetroT);
    tu.position.set(x,0.84+h/2,0);g.add(tu);
    box(g,0.30,0.07,0.30,oroS,x,0.86,0,false);
    box(g,0.30,0.07,0.30,oroS,x,0.84+h,0,false);
    const rnd=seme(300+i*7);
    for(let k=0;k<16;k++){
      const gem=new THREE.Mesh(new THREE.IcosahedronGeometry(0.055,0),
        new THREE.MeshPhongMaterial({color:q[1],shininess:150,specular:0xffffff,
          transparent:true,opacity:0.9}));
      gem.position.set(x+(rnd()-0.5)*0.12, 0.92+k*(h-0.14)/16, (rnd()-0.5)*0.12);
      gem.rotation.set(rnd()*3,rnd()*3,rnd()*3);g.add(gem);}
  });
  return g;}
let cassetta=null, pulsa=0;
function creaCassetta(pos,ultima){
  if(cassetta){scene.remove(cassetta);cassetta=null;}
  if(ultima){                       /* il tesoro non e' una cassetta: e' la Coppa */
    const c=coppaDelleCase();
    /* LA COPPA E' A GRANDEZZA DI PIAZZA, ed e' nata cosi' quando stava in un
       atrio a doppia altezza: podio 3,40 x 1,70 e calice fino a 2,50. Sul
       tavolone del corridoio — largo 3,60, con il controsoffitto a 3,00 dal
       pavimento — sfondava il soffitto e straripava dal tavolo da tutti i
       lati. Ridotta a 0,55: 1,87 di podio su un tavolo da 3,60, e la punta
       del calice a 1,38 dal piano. */
    c.scale.setScalar(0.55);
    c.position.set(pos[0],pos[1],pos[2]);c.userData.bersaglio=true;
    scene.add(c);cassetta=c;
    contatto(scene,pos[0],pos[1]+0.006,pos[2],2.4,1.5,0.6);
    return c;}
  const g=new THREE.Group();
  const s=ultima?1.35:1.0;
  const corpo=new THREE.Mesh(geoSmussata(0.52*s,0.34*s,0.38*s,0.03),
    lam(ultima?0x8a5a26:0xa9793f));
  corpo.position.y=0.17*s;corpo.castShadow=true;g.add(corpo);
  const cop=new THREE.Mesh(new THREE.BoxGeometry(0.54*s,0.06*s,0.4*s),
    lam(0xffffff,{map:texCoperchio}));
  cop.position.y=0.37*s;cop.castShadow=true;g.add(cop);
  [[-0.26*s,0],[0.26*s,0]].forEach(q=>
    box(g,0.03*s,0.36*s,0.4*s,lam(0xc9a227),q[0],0.18*s,0,false));
  box(g,0.1*s,0.13*s,0.03*s,lam(0xc9a227),0,0.3*s,0.2*s,false);
  g.position.set(pos[0],pos[1],pos[2]);

  contatto(scene,pos[0],pos[1]+0.006,pos[2],1.1*s,1.0*s,0.55);

/* ==========================================================================
   NAVIGAZIONE — quella di primopiano.html, estesa al campus
   --------------------------------------------------------------------------
   NON e' la navigazione di index. Quella lavorava su `camera`, `yaw`, `pitch`
   e `vel`, e trapiantarla e' esattamente l'errore che ha fatto fallire tre
   volte il travaso: si porta l'ambiente, non la finestra da cui lo si
   guardava. Qui restano `pos`, `giro`, `becco` e `quotaSotto` del primo
   piano; quello che cambia e' che quotaSotto adesso conosce anche il terreno,
   e che da fermi si puo' staccare i piedi da terra.

   DUE MODI, UN SOLO COMANDO
   - A PIEDI (partenza): si cammina sulla quota che sta sotto — il pavimento
     del corridoio se si e' dentro la U, il terreno se si e' fuori. Un passo
     che cambierebbe quota di piu' di 55 cm viene RIFIUTATO: e' cosi' che non
     si cade dal primo piano e non ci si arrampica sui muri. Il salto della
     gradinata (37 cm) invece si sale, come deve essere.
   - IN VOLO: si entra premendo "sali" e si esce toccando terra. Serve per
     raggiungere le tappe che stanno oltre i muri, che e' il modo di muoversi
     di chi gioca.
   Le collisioni sono quelle registrate con solido()/varco() dagli esterni:
   il corridoio del primo piano non ne registra nessuna, e resta libero
   com'era stato collaudato.
   ========================================================================== */

const ALTEZZA = 1.62;            /* altezza degli occhi                     */
const PASSO   = 3.4;             /* m/s a piedi                             */
let   velBase = 14;              /* m/s in volo, regolabile con la rotella   */
let   COLLISIONI_ATTIVE = true;

const pos = new THREE.Vector3();
let giro = 0, becco = 0, inVolo = false;

/* --- quale quota di calpestio sta sotto un punto? ----------------------
   Dentro la U del primo piano si cammina sul suo pavimento; il tratto est
   oltre la gradinata sta 37 cm piu' in alto, e la soglia e' LA STESSA retta
   con cui e' costruito il pavimento (zSoglia): se le due divergono, si
   cerca l'appoggio alla quota alta dove c'e' ancora quella bassa. Fuori
   dalla U si cammina per terra. */
function quotaSotto(x,z){
  const nord  = (x>X0  && x<X1  && z>NZ0  && z<NZ1);
  const ovest = (x>OX0 && x<OX1 && z>=NZ1 && z<OZ1);
  const est   = (x>EX0 && x<EX1 && z>=NZ1 && z<EZ1);
  if(est && z>zSoglia(x)) return PAV+SALTO;
  if(nord||ovest||est)    return PAV;
  return 0;
}
/* --- si passa? --------------------------------------------------------
   Le collisioni sono quelle del CAMPUS: le pareti registrate con solido()
   dagli esterni. DENTRO IL CORRIDOIO DEL PRIMO PIANO NON VALGONO, e non e'
   una scorciatoia: il guscio degli edifici contiene il corridoio per
   costruzione — corpo() posa un volume pieno — e il fronte dell'ala ovest
   passa proprio dove si cammina. Applicandole li' dentro il corridoio
   diventa impercorribile a meta' del braccio nord, cioe' esattamente il
   percorso che il collaudo geometrico certifica come libero. Dentro la U
   decide il collaudo del corridoio; fuori, i muri del campus. */
function passabile(p){
  if(!COLLISIONI_ATTIVE) return true;
  if(quotaSotto(p.x,p.z)>1) return true;
  return libero(p);
}

/* --- i luoghi della barra "Luoghi" ------------------------------------
   nomi come sulla mappa Campus_zone.png. Terzina: [nome, dove si sta,
   dove si guarda].
   Le voci del primo piano stanno all'altezza degli occhi sul suo pavimento
   (3,42 + 1,62 = 5,04), cioe' ci si arriva A PIEDI: e' il modo giusto di
   visitare un corridoio. Anche le mete a terra stanno a 1,62 e non a tre o
   quattro metri, cosi' si atterra e si prosegue camminando; restano in quota
   solo le due viste d'insieme, che servono a guardare, non a camminare.
   DELLE CINQUE VOCI DEL PRIMO PIANO NE RESTA UNA (Andrea). Arriva davanti
   alla ZONA UFFICI, a meta' del corridoio lungo: da li' si vede il ballatoio
   col vano scala, e camminando si raggiunge tutto il resto del piano — la
   Primaria a ponente, la gradinata e la Secondaria a levante. Un piano che
   si visita a piedi non ha bisogno di cinque porte d'ingresso.
   Tolto anche "Portico e le due corti". */
const LUOGHI=[
  ['Tour del Campus',               [30,46,64],            [-25,0,0]],
  ['Ingresso Scuola',               [-22.6,1.62,-33],      [-22.6,2.6,-19]],
  ['Basket - Volley',               [-8.6,1.62,18],        [-8.6,3.2,-2]],
  ['Campo Calcio',                  [-8.6,1.62,78],        [-8.6,2.5,40]],
  ['Piscine Andreana',              [70,24,52],            [74,2,-6]],
  ['Scuola - primo piano',          [-18.5,5.04,-2.95],    [-31.0,4.72,-3.60]],
  /* I DUE INTERNI NUOVI. Il punto d'occhio sta appena dentro la porta e la
     mira e' quello che si e' venuti a vedere: il palco e l'altare. */
  ['QdV Arena',                     [-49.5,1.85,56.0],     [-70.0,2.60,50.0]],
  ['Chiesa',                        [-36.95,1.70,-46.0],   [-36.95,2.40,-21.5]],
  /* La Casa Famiglia si guarda dal giardino, cioe' dal FRONTE OVEST: e' la
     stessa inquadratura della fotografia — la loggia coi pilastri, i due
     corpi rossi di testa e il prato in quarti in primo piano. Da qualunque
     altro lato e' una stecca col tetto in coppi. */
  ['Casa Famiglia',                 [-162.0,8.5,74.5],     [-133.0,3.6,76.0]]
];

/* ==========================================================================
   DENTRO SI PLANA, NON SI SFRECCIA
   --------------------------------------------------------------------------
   La velocita' del giro la decide la quota: 7 m/s a cinquanta metri, 30 a
   terra. E' giusto sui campi — raso terra ci si passa dentro — ma dentro un
   ambiente e' un disastro: la navata e' lunga 30 metri e a 30 m/s dura un
   secondo. Qui la regola si ribalta: nei due interni si va PIANO, perche'
   e' li' che c'e' qualcosa da guardare.
   I rettangoli sono quelli veri: Arena x[-86 · -46] z[43,5 · 68,5],
   chiesa x[-41,3 · -32,6] z[-49,8 · -19,1], con un metro di margine per
   rallentare gia' sulla soglia invece che di colpo appena dentro.
   ========================================================================== */
const INTERNI=[[-87,-45,42.5,69.5],[-42.3,-31.6,-50.8,-18.1]];
function planata(p){
  if(p.y>12) return false;                 /* sopra i tetti non conta */
  for(let i=0;i<INTERNI.length;i++){ const q=INTERNI[i];
    if(p.x>=q[0]&&p.x<=q[1]&&p.z>=q[2]&&p.z<=q[3]) return true;}
  return false;}
/* ==========================================================================
   IL GIRO DEL CAMPUS — la prima voce del menu non e' piu' una vista ferma
   --------------------------------------------------------------------------
   E' un volo in circolo che non finisce mai. Si comincia alti e larghi sopra
   tutto il campus, si scende sul campo da calcio e lo si attraversa raso,
   si arriva sul campo da basket, si PASSA SOTTO IL PORTICO (che e' alto
   3,45: ci si infila a 1,90), si entra nel giardino dell'infanzia, si
   impenna e si va a prendere la facciata della chiesa, poi si risale e si
   ricomincia.

   LA VELOCITA' LA DECIDE LA QUOTA: 7 m/s a cinquanta metri, 30 m/s a terra.
   E' il contrario di quello che verrebbe da fare, ed e' il motivo per cui
   funziona: da lontano il campus si guarda, raso terra ci si passa dentro.

   Due curve CENTRIPETAL Catmull-Rom chiuse (la centripeta non fa cappi ne'
   sbandate fra due punti vicini: in un passaggio da 3,10 m di luce conta),
   una per dove sta l'occhio e una per dove
   guarda, percorse con `getPointAt` — che e' parametrizzata sulla LUNGHEZZA
   e non sull'indice dei punti: senza, il volo rallenterebbe dove i punti
   sono fitti e sfreccerebbe dove sono radi.
   Ogni riga: occhio [x,y,z] · mira [x,y,z].
   ========================================================================== */
const GIRO=[
  /* --- A. ALTO SUL FRONTE NORD, sguardo a mezzogiorno ------------------ */
  /* SI PARTE PIU' A LEVANTE, GUARDANDO A SUD-EST (Andrea). Il punto di
     partenza stava a ponente di tutto (x=-96) e la coda doveva risalire da
     mezzogiorno fin lassu': l'ultimo tratto guardava a ponente, dove non
     c'e' piu' campus — solo orizzonte vuoto. Portando la partenza a x=-18 e
     la mira a sud-est, la congiunzione avviene SOPRA il campus e in avanti
     si ha sempre qualcosa da guardare. */
  [ -18, 48, -98,    22, 10, -34],
  [  18, 44, -94,    52,  8, -30],
  [  50, 40, -88,    76,  5, -32],
  /* --- B. PLANATA SULLE PISCINE, piu' bassa e piu' svelta -------------- */
  [  78, 22, -62,    76,  3, -20],

let voloDa=null, voloA=null, voloT=1;
const mira=new THREE.Vector3();
/* LO SGUARDO NON SALTA. guardaVerso() punta la mira ISTANTANEAMENTE: dove la
   curva della mira gira stretto — l'uscita dal palco, l'uscita dalla chiesa —
   l'inquadratura ruotava di ottanta gradi in tre fotogrammi. Qui l'angolo si
   insegue con un filtro del primo ordine prendendo sempre la via piu' corta:
   senza il riavvolgimento, passando da +pi a -pi la testa farebbe un giro
   completo dalla parte sbagliata. La traiettoria resta identica, cambia solo
   quanto in fretta la testa la segue. */
function guardaVersoMorbido(t,dt,k){
  const dx=t.x-pos.x, dy=t.y-pos.y, dz=t.z-pos.z;
  const gv=Math.atan2(-dx,-dz);
  const bv=Math.max(-1.45,Math.min(1.45,Math.atan2(dy,Math.hypot(dx,dz))));
  let d=gv-giro;
  while(d> Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  const a=Math.min(1,dt*k);
  giro  += d*a;
  becco += (bv-becco)*a;
}
function guardaVerso(t){
  const dx=t.x-pos.x, dy=t.y-pos.y, dz=t.z-pos.z;
  giro  = Math.atan2(-dx,-dz);
  becco = Math.atan2(dy,Math.hypot(dx,dz));
  becco = Math.max(-1.45,Math.min(1.45,becco));
}
/* a fine spostamento si decide da soli se si e' atterrati o si sta volando:
   niente flag da tenere allineato a mano fra dodici voci di menu */
function verificaAppoggio(){

/* ==========================================================================
   LA SCIVOLATA — che cosa succede quando dal menu si sceglie "Piscine"
   --------------------------------------------------------------------------
   Non ci si arriva volando: ci si arriva SCIVOLANDO. Il giocatore si trova
   in cima alla pista dritta a quattro corsie, parte, scende, entra in acqua,
   va sotto, riemerge — e da li' cammina dove vuole a cercare la cassetta.

   I NUMERI SONO QUELLI DELLA PISTA, non inventati: corsie x 90,2 . 95,0
   (la seconda ha l'asse a x=92,0), testa a z -25,5 quota 7,40, piede a
   z -3,0 quota 0,95; il pelo dell'acqua del canale sta a 0,36 (misurato
   con un raggio verticale, non a occhio). Se un giorno la pista si sposta,
   questi cinque numeri sono gli unici da rifare.

   La velocita' NON e' costante: si parte fermi e si arriva lanciati, che e'
   il motivo per cui uno scivolo diverte. Sotto, la curva "t*t" fa esattamente
   questo senza bisogno di simulare niente.
   ========================================================================== */
const SCIV={x:92.0, zTesta:-25.5, yTesta:7.40, zPiede:-3.0, yPiede:0.95,
            pelo:0.36, zFine:2.6, occhio:0.55};
/* Il tuffo era un lampo: 0,55 s per scendere da 1,50 a 0,02 vuol dire che
   la testa passa sotto il pelo per meno di tre decimi, e il velo azzurro
   non fa in tempo nemmeno a comparire. Sott'acqua ci si RESTA un attimo:
   e' quella la parte che i ragazzi aspettano. */
/* PRIMA DI BUTTARSI SI GUARDA IL CAMPUS (Andrea). Dalla cima della pista si
   sta a otto metri, ed e' l'unico punto della caccia da cui si vede la
   piscina coperta per intero con la scuola dietro: buttarsi subito butta via
   anche quello. Quindi due tempi — un attimo a ponente, poi la testa gira
   verso il basso e si parte. */
const FASI={sguardo:2.0, giroTesta:1.0, discesa:2.3, tuffo:0.45, sotto:0.45,
            risalita:1.1};
const T0=FASI.sguardo, T1=T0+FASI.giroTesta, T2=T1+FASI.discesa,
      T3=T2+FASI.tuffo,  T4=T3+FASI.sotto;
const TSCIV=T4+FASI.risalita;
/* IN PIEDI, POI SEDUTI. Con l'occhio a 7,95 — cioe' gia' seduti sulla
   pista — il parapetto di ponente sta esattamente davanti agli occhi: il
   ventaglio di raggi lo trovava a 3 metri (pannello 7,68 . 8,68). Chi si
   ferma a guardare il campus e' ancora IN PIEDI, con l'occhio a 9,05, e
   guarda oltre la ringhiera; si siede mentre gira la testa verso il basso.
   Quota della piattaforma 7,40 + statura 1,65. */
const OCCHIO_SU=1.65;
/* E SI STA SULLA TESTA DELLA PISTA, non in mezzo alla piattaforma. Da
   z -26,4 il parapetto pieno della torretta (pannelli da 1 m, non una
   ringhiera a giorno) copriva mezza inquadratura. A z -25,4 la torretta
   e' alle spalle e davanti resta solo il campus. */
const MIRA_OVEST=V(52,7.3,-26.0);                /* la copertura e la scuola */
const MIRA_GIU  =V(SCIV.x, SCIV.yPiede+1.2, SCIV.zPiede);
const miraSciv=new THREE.Vector3();
let scivT=-1;                      /* <0 = non si sta scivolando */
const veloAcqua=document.getElementById('immersione');

function partiScivolata(){
  giroAttivo=false; voloT=1; scivT=0; inVolo=true;
  pos.set(SCIV.x, SCIV.yTesta+OCCHIO_SU, SCIV.zTesta-0.9);
  if(typeof segnaVista==='function') segnaVista();
}

function passoScivolata(dt){
  scivT+=dt;
  const t=scivT;
  let y, z, guarda;
  if(t<T0){                                            /* si guarda a ovest  */
    z=SCIV.zTesta+0.15; y=SCIV.yTesta+OCCHIO_SU;
    guarda=MIRA_OVEST;
  } else if(t<T1){                            /* ci si siede e si gira la testa */
    const u=(t-T0)/FASI.giroTesta, k=u*u*(3-2*u);      /* parte e si ferma piano */
    z=SCIV.zTesta+0.15;
    y=SCIV.yTesta+OCCHIO_SU+(SCIV.occhio-OCCHIO_SU)*k;
    guarda=miraSciv.lerpVectors(MIRA_OVEST,MIRA_GIU,k);
  } else if(t<T2){                                     /* giu' per la pista  */
    const u=(t-T1)/FASI.discesa, k=u*u;                /* si parte fermi     */
    z=SCIV.zTesta+(SCIV.zPiede-SCIV.zTesta)*k;
    y=SCIV.yTesta+(SCIV.yPiede-SCIV.yTesta)*k+SCIV.occhio;
    /* il beccheggio dei salti sulle giunzioni: piccolo, ma si sente */
    y+=Math.sin(u*34)*0.045*(1-u);
    guarda=V(SCIV.x+Math.sin(u*7)*0.5, y-1.6, z+6);
  } else if(t<T3){                                     /* si va sotto        */
    const u=(t-T2)/FASI.tuffo;
    z=SCIV.zPiede+(SCIV.zFine-SCIV.zPiede)*u*0.8;
    y=SCIV.yPiede+SCIV.occhio+(0.02-(SCIV.yPiede+SCIV.occhio))*Math.sin(u*Math.PI/2);
    guarda=V(SCIV.x, y+0.2, z+4);
  } else if(t<T4){                                     /* immersi            */
    const u=(t-T3)/FASI.sotto;
    z=SCIV.zPiede+(SCIV.zFine-SCIV.zPiede)*(0.8+0.2*u);
    y=0.02+0.05*Math.sin(u*Math.PI);                   /* si galleggia un po' */
    /* sott'acqua lo sguardo va verso l'alto, dove c'e' la luce */
    guarda=V(SCIV.x+0.6*Math.sin(u*4), y+1.4, z+2.4);
  } else {                                             /* si torna a galla   */
    const u=Math.min(1,(t-T4)/FASI.risalita);
    const k=1-Math.pow(1-u,3);
    z=SCIV.zFine+0.9*k;
    y=0.02+(ALTEZZA-0.02)*k;
    /* riemergendo ci si gira verso il campus, che e' da dove si e' venuti
       e dov'e' la cassetta da cercare */
    guarda=V(SCIV.x-14*k, y+0.1, z+2.2-6*k);
  }
  pos.set(SCIV.x, y, z);
  guardaVerso(guarda);
  if(veloAcqua) veloAcqua.classList.toggle('giu', pos.y < SCIV.pelo);
  if(scivT>=TSCIV){
    scivT=-1;
    if(veloAcqua) veloAcqua.classList.remove('giu');
    verificaAppoggio();
    if(typeof segnaVista==='function') segnaVista();
  }
}

  /* LE PISCINE NON SI GUARDANO DA LONTANO: ci si arriva scivolando. */

};

const ray=new THREE.Raycaster();
/* Il mirino aggancia due cose: la cassetta della tappa e i TOMBINI dei
   sottoservizi. Vince il bersaglio piu' vicino. Il tombino si apre solo
   standoci davanti (4,5 m): da mezzo campus si vedrebbe ma non si tocca. */
const PORTATA_TOMBINO=4.5;
function bersaglio(m){
  ray.setFromCamera(m,camera);
  const t=(typeof TOMBINI!=='undefined')
    ? ray.intersectObjects(TOMBINI,false).filter(i=>i.distance<PORTATA_TOMBINO) : [];
  const c=cassetta ? ray.intersectObject(cassetta,true) : [];
  if(t.length && (!c.length || t[0].distance<c[0].distance)) return {tombino:t[0].object};
  if(c.length) return {cassetta:true};
  return null; }
function agisci(m){
  if(velo.style.display==='flex') return;
  const b=bersaglio(m);
  if(!b) return;
  if(b.tombino) apriTombino(b.tombino); else trovata(); }
function provaMirino(){ agisci({x:0,y:0}); }
function provaClic(cx,cy){
  agisci({x:(cx/window.innerWidth)*2-1, y:-(cy/window.innerHeight)*2+1}); }

/* --- iPad: l'aula ha i tablet, non le tastiere (PROMPT-BASE-WEBAPP §5b) - */
function joystick(el,cb){
  const pomo=el.querySelector('.pomo'); let att=null,cx=0,cy=0; const R=42;
  function agg(t){ let dx=t.clientX-cx,dy=t.clientY-cy; const d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d;}
    pomo.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))'; cb(dx/R,dy/R); }
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];att=t.identifier;
    const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;agg(t);e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===att)agg(t);
    e.preventDefault();},{passive:false});
  el.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===att){att=null;

   l'aveva lasciata accesa. */
function avviaMusica(){ musicaChiesta=true; if(audioOn) caricaYT(); provaSuonare(); }
/* Rete di sicurezza. Serve in due casi: quando l'autoplay viene bloccato, e

  if(audioOn){ musicaChiesta=true; caricaYT(); provaSuonare(); }
