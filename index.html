<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Campus Sacra Famiglia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C73834'/%3E%3Cpath d='M21.6 10.6a7.2 7.2 0 1 0 0 10.8' fill='none' stroke='%23fff' stroke-width='4.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="campus-icona.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{ --blu:#123E90; --blu2:#0d2f6e; --ambra:#B8860B; --ambra2:#D4A017; --verde:#1f7a43; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#dfe8ef;
    font-family:'Atkinson Hyperlegible',sans-serif;font-size:18px}
  #scena{position:fixed;inset:0;display:block;touch-action:none}

  /* ---- intestazione ---- */
  /* niente contenitore: l'etichetta bianca e' il logo stesso, piu' grande */
  #targa{position:fixed;top:14px;left:14px;z-index:20;display:block;
    filter:drop-shadow(0 3px 12px rgba(0,0,0,.30))}
  #marchio{width:184px;height:89px;display:block}
  #targa .tit{font-family:'Lexend',sans-serif;font-weight:700;font-size:15px;color:var(--blu);line-height:1.15}
  #targa .sot{font-size:12px;color:#4a5a7a}


  /* ---- carta dell'indizio ---- */
  #carta{position:fixed;top:116px;left:14px;z-index:20;width:min(370px,calc(100vw - 24px));
    background:rgba(255,255,255,.96);border:1px solid rgba(18,62,144,.2);border-left:5px solid var(--ambra2);
    border-radius:12px;padding:13px 16px;box-shadow:0 6px 22px rgba(13,47,110,.16)}
  #carta .tappa{font-family:'Lexend',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ambra)}
  #carta h2{font-family:'Lexend',sans-serif;font-size:17px;color:var(--blu);margin:2px 0 6px;line-height:1.25}
  #carta p{font-size:15px;line-height:1.5;color:#33404f}
  #carta .fila{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  #carta button{font-family:'Lexend',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    border-radius:9px;padding:7px 12px;border:1px solid rgba(18,62,144,.3);background:#fff;color:var(--blu)}
  #carta button:hover{background:#eef3fc}
  #aiutoTesto{margin-top:9px;padding:9px 11px;background:#fdf6e3;border:1px solid #e6d3a3;
    border-radius:9px;font-size:14px;line-height:1.45;color:#6b5312;display:none}

  /* ---- pannello grande (scoperta / diario / debrief) ---- */
  #velo{position:fixed;inset:0;z-index:40;background:rgba(13,32,66,.5);display:flex;
    align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
  .foglio{width:min(560px,100%);max-height:88vh;overflow-y:auto;background:#fffdf7;border-radius:16px;
    padding:26px 28px;box-shadow:0 18px 60px rgba(0,0,0,.35);border-top:6px solid var(--blu)}
  .foglio h1{font-family:'Lexend',sans-serif;font-size:22px;color:var(--blu);margin-bottom:4px;line-height:1.2}
  .foglio .occhiello{font-family:'Lexend',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ambra);margin-bottom:3px}
  .foglio p{font-size:16px;line-height:1.6;color:#33404f;margin-bottom:11px}
  .foglio .imparato{background:#eef6f0;border-left:4px solid var(--verde);border-radius:0 10px 10px 0;
    padding:11px 14px;margin:13px 0;font-size:15.5px;line-height:1.55;color:#1d4a30}
  .foglio .prossimo{background:#fdf6e3;border-left:4px solid var(--ambra2);border-radius:0 10px 10px 0;
    padding:11px 14px;margin:13px 0;font-size:15.5px;line-height:1.55;color:#6b5312}
  .foglio table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
  .foglio td{padding:6px 3px;border-bottom:1px solid #eceadf;vertical-align:top}
  .foglio td:first-child{width:34px}
  .foglio .tasto{display:inline-block;background:#eef3fc;border:1px solid #c9d6ef;border-radius:6px;
    padding:1px 7px;font-weight:700;font-size:12.5px;color:var(--blu);margin-right:3px}
  .foglio .azione{background:#f2f6fd;border:1px dashed #b6c8ea;border-radius:11px;padding:14px 16px;margin-top:14px}
  .foglio .azione h3{font-family:'Lexend',sans-serif;font-size:15px;color:var(--blu);margin-bottom:6px}
  /* ---- card d'accesso al gioco ---- */
  .foglio.card{width:min(1000px,100%);padding:0;overflow:hidden;border-top:none;
    background:#12202f url('cacciatesoro.jpg') no-repeat right center/cover;
    display:flex;align-items:stretch;min-height:min(480px,72vh)}
  /* la colonna si ferma prima della coppa: il velo e' pieno solo dove
     l'immagine e' vuota (campi e ulivi) e sfuma prima del soggetto */
  .card .colonna{width:min(430px,52%);padding:20px 24px 22px;color:#fff;
    display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(90deg,rgba(8,17,29,.94) 0%,rgba(8,17,29,.90) 62%,
      rgba(8,17,29,.55) 86%,rgba(8,17,29,0) 100%)}
  .card .pillola{align-self:flex-start;margin-bottom:16px;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.35))}
  .card .pillola svg{width:172px;height:83px;display:block}
  .card .occhiello{color:#f0c04a;margin-bottom:2px}
  .card h1{color:#fff;font-size:26px;margin-bottom:8px}
  .card p{color:#dfe6ef;font-size:15.5px;line-height:1.5;margin-bottom:10px}
  .card .comandi{font-size:13.5px;line-height:1.75;color:#b9c6d6;margin:2px 0 4px}
  .card .comandi b{color:#fff;font-weight:700}
  .card .nota{font-size:13px;color:#93a3b6;line-height:1.45;margin-top:8px}
  .card .bottoni{margin-top:14px}
  .card .bottoni button{background:#f0c04a;color:#12202f;font-size:16px;padding:13px 18px}
  .card .bottoni button:hover{background:#ffd166}
  @media(max-width:720px){
    .foglio.card{min-height:0;background-position:center top}
    .card .colonna{width:100%;background:linear-gradient(180deg,rgba(8,17,29,.90),rgba(8,17,29,.97))}
  }
  /* ---- pannello della domanda ---- */
  .foglio .domanda{font-family:'Lexend',sans-serif;font-size:19px;line-height:1.35;
    color:var(--blu);margin:6px 0 14px}
  .opz{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .opz button{text-align:left;padding:12px 15px;font-family:'Atkinson Hyperlegible',sans-serif;
    font-size:16px;line-height:1.35;color:#25313f;background:#fff;
    border:1.5px solid #cfd8e6;border-radius:11px;cursor:pointer}
  .opz button:hover{background:#eef3fc;border-color:#9fb6dc}
  .opz button.via{opacity:.28;pointer-events:none;text-decoration:line-through}
  .opz button.giusta{background:#e7f4ea;border-color:var(--verde);color:#14502e;font-weight:700}
  .opz button.sbagliata{background:#fdf3e0;border-color:var(--ambra2);color:#6b4e10}
  .aiuti{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .aiuti button{font-family:'Lexend',sans-serif;font-weight:600;font-size:13px;
    color:var(--ambra);background:#fdf6e3;border:1px solid #e6d3a3;border-radius:9px;
    padding:8px 13px;cursor:pointer}
  .aiuti button:hover{background:#f8edd0}
  .aiuti button[disabled]{opacity:.4;cursor:default}
  .religioso{display:flex;gap:11px;align-items:flex-start;margin-top:11px;padding:11px 13px;
    background:#f2f6fd;border:1px solid #c9d8ef;border-radius:11px;font-size:15px;
    line-height:1.5;color:#2b3b52}
  .religioso svg{flex:0 0 auto;margin-top:2px}
  .bottoni{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .bottoni button{flex:1 1 auto;padding:12px 16px;font-family:'Lexend',sans-serif;font-weight:700;
    font-size:15px;color:#fff;background:var(--blu);border:none;border-radius:11px;cursor:pointer}
  .bottoni button:hover{background:var(--blu2)}
  .bottoni button.chiaro{background:#fff;color:var(--blu);border:1px solid rgba(18,62,144,.3)}
  .bottoni button.chiaro:hover{background:#eef3fc}

  /* ---- barra tappe + strumenti ---- */
  #barra{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;
    display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.93);
    border:1px solid rgba(18,62,144,.2);border-radius:999px;padding:7px 13px;
    box-shadow:0 3px 14px rgba(13,47,110,.16)}
  #perline{display:flex;gap:5px}
  .perla{width:13px;height:13px;border-radius:50%;background:#d5dbe6;border:1px solid #b9c3d4}
  .perla.fatta{background:var(--verde);border-color:var(--verde)}
  .perla.ora{background:var(--ambra2);border-color:var(--ambra);box-shadow:0 0 0 3px rgba(212,160,23,.25)}
  #barra button{font-family:'Lexend',sans-serif;font-weight:600;font-size:13px;color:var(--blu);
    background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:7px}
  #barra button:hover{background:#eef3fc}
  #barra .sep{width:1px;height:19px;background:#d5dbe6}

  /* ---- mirino oggetto ---- */
  /* mirino al centro: la vista e' automatica, si punta con la testa */
  #mirino{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;
    width:22px;height:22px;display:none;pointer-events:none}
  #mirino i{position:absolute;background:rgba(255,255,255,.9);
    box-shadow:0 0 3px rgba(0,0,0,.7)}
  #mirino i:nth-child(1){left:10px;top:0;width:2px;height:7px}
  #mirino i:nth-child(2){left:10px;bottom:0;width:2px;height:7px}
  #mirino i:nth-child(3){top:10px;left:0;height:2px;width:7px}
  #mirino i:nth-child(4){top:10px;right:0;height:2px;width:7px}
  #mirino.su i{background:#f0c04a}
  #avviso{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;
    background:rgba(8,17,29,.82);color:#fff;font-family:'Lexend',sans-serif;font-weight:600;
    font-size:15px;padding:11px 20px;border-radius:12px;display:none;pointer-events:none;
    box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #vicino{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:20;
    background:rgba(18,62,144,.94);color:#fff;font-family:'Lexend',sans-serif;font-weight:600;
    font-size:14px;padding:8px 15px;border-radius:999px;display:none;box-shadow:0 3px 14px rgba(0,0,0,.25)}

  /* ---- comandi touch ---- */
  .stick{position:fixed;z-index:25;width:118px;height:118px;border-radius:50%;display:none;
    background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.55)}
  .stick .pomo{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,.85);border:2px solid rgba(18,62,144,.4);transform:translate(-50%,-50%)}
  #stickMov{left:18px;bottom:78px} #stickVis{right:18px;bottom:78px}
  .tq{position:fixed;z-index:25;width:52px;height:52px;border-radius:14px;display:none;
    background:rgba(255,255,255,.85);border:2px solid rgba(18,62,144,.35);
    align-items:center;justify-content:center}
  #su{right:30px;bottom:212px} #giu{right:92px;bottom:212px}
  body.tocco .stick,body.tocco .tq{display:flex}
  body.tocco #carta{top:104px;width:min(300px,58vw);padding:10px 12px}
  body.tocco #carta p{font-size:13.5px}
  body.tocco #carta h2{font-size:15px}

  #quota{position:fixed;top:12px;right:12px;z-index:20;background:rgba(255,255,255,.9);
    border:1px solid rgba(18,62,144,.18);border-radius:11px;padding:6px 11px;font-size:12.5px;color:#4a5a7a}
  /* lettore YouTube: serve solo l'audio, resta fuori campo ma non display:none
     (alcuni browser non avviano un iframe non renderizzato) */
  #yt{position:fixed;width:1px;height:1px;left:-9999px;top:0;opacity:0;pointer-events:none}
  #bAudio{display:flex;align-items:center;gap:5px;padding:3px 7px !important}
  #bAudio svg{display:block}
  #bAudio.spento{opacity:.5}
  @media(max-width:780px){ #quota{display:none}
    #marchio{width:132px;height:64px} #carta{top:92px} }
</style>
</head>
<body>
<!--
  ============================================================================
  LA CHIAVE DEL CAMPUS — Scuola Sacra Famiglia di Orzinuovi (BS)
  Campus 3D navigabile in volo + caccia al tesoro a tappe.
  Single-file, Three.js r128, vanilla JS. Nessun build step.

  FONTI LETTE (mai dedotte):
  - Campus.png (aerea annotata) riletta A PIENA RISOLUZIONE in 6 ritagli.
    ATTENZIONE: l'aerea e' ruotata — SUD in alto, NORD in basso, EST a sinistra.
    Scala dal campo da basket (28 m = ~390 px → ~13.9 px/m).
    Coordinate reali confermate da Andrea: 45.3999212, 9.9029869.
  - scuola_primo_piano.MOV (335 s): sequenza fitta 1 fotogramma ogni 3 s,
    guardata IN ORDINE. E' la fonte della CONTINUITA' del primo piano.
  - IMG_4847..4903, scuola_primaria.jpeg, scuola_secondaria.jpeg, 3.jpg.

  CORREZIONI IMPOSTE DAL VIDEO (v3):
  - Le facciate sul cortile sono BIANCO/CREMA intonacate, non grigie, con
    vetrate molto piu' alte (davanzale 0.95 → quasi soffitto) e pannelli
    d'accento GIALLI fra le campate.
  - Primaria: pareti GIALLO FORTE con stipiti/fasce ARANCIO, pavimento a
    scacchi caldi, 4 Case come pannello dipinto 2x2 con DUE biliardini davanti.
  - Mezzanino: colonne tonde d'acciaio, nicchie rettangolari nei muri,
    soffitto a fasce arancio/celeste, scacchi piccoli, ficus, Mondrian con
    divano grigio e panchina a listelli, scala delle tabelline.
  - Corridoi: DUE listelli portalavori, tavoli gambe blu/piano verde con sedie
    in legno chiaro, gradinata di QUATTRO alzate in CEMENTO A VISTA a tutta
    larghezza, ringhiera nera al vano scala, cubiere bianche 2x2, mobile basso
    grigio con testata tonda, controsoffitto bianco con plafoniere lineari.
  - Aule: crema sopra + fascia GRIGIO-VERDE sotto, infissi NERI,
    sedie lime e blu.

  ==================== FOGLIO COORDINATE (metri) =============================
  RISCRITTO SULLA PLANIMETRIA QUOTATA 1:250 (VERIFICA-FOTOGRAFICA §16).
  Da qui in avanti l'impianto sta su queste quote, non su stime dalle foto.
  Regola del §16: le MISURE vengono dal rilievo quotato, i NOMI degli ambienti
  da Campus_zone.png e map.jpeg. Non si mescolano le due fonti.

  Assi: X+ = EST (verso le piscine), Z+ = SUD (verso il campo da calcio).
  ORIENTAMENTO VERIFICATO sull'ortofoto satellitare (via Milano 75, Orzinuovi):
  il modello e' orientato BENE, non e' speculare. Via Milano, la rotonda e il
  parcheggio stanno a NORD; le piscine a EST; chiesa e Primaria a OVEST; il
  campo da calcio a SUD. L'aerea etichettata Campus_zone.png e' una ripresa
  obliqua DA NORD verso SUD: e' per questo che, letta di getto, sembra ribaltata.

  --- il blocco scolastico: ~115 m di fronte, ali larghe 12,00 ---------------
  ATTENZIONE ai 156,22 m del rilievo: NON sono un corpo di fabbrica continuo.
  Sull'ortofoto il fronte della scuola finisce con l'ala nord-est e subito
  dopo comincia il complesso delle piscine. I 156,22 sono lo sviluppo
  COMPLESSIVO scuola + piscine. Avevo costruito 52 m di edificio in pietra per
  far tornare la quota: non esiste, l'ho tolto. Una quota che non torna non si
  fa tornare inventando volume.
  FRONTE (ala lunga, pietra)     x[-78,+26]  z[-24,-12]   muri 9.6 colmo 12.6
  FASCIA MODERNA sul cortile     x[-64,+14]  z[-12,-6]   h 7.6, tetto piano
  BLOCCO CORRIDOIO (bianco 3p)   x[-78,-64]  z[-24,-6]   muri 10.2 colmo 12.4
  ALA NORD-EST (Secondaria)      x[+14,+26]  z[-24,+26]  = 50.00  muri 10.4
  FASCIA MODERNA est (bianca)    x[+8,+14]   z[-6,+26]   h 7.6, tetto piano
  PALAZZINA CREMA + scala est.   x[+8,+22]   z[+26,+38]  coppi
  ALA PRIMARIA (ala tipo 12x40)  x[-78,-66]  z[-6,+34]   muri 9.6  colmo 12.6

  --- LE DUE CORTI, separate dalla PASSERELLA COPERTA -----------------------
  La passerella non e' una tettoia addossata a un muro: e' il DIAFRAMMA che
  divide le due corti. CORREZIONE DI ANDREA (dopo la prima stesura del §16):
  va portata a OVEST perche' deve COLLEGARE GLI EDIFICI. Qui parte dalla
  fascia moderna del fronte, corre lungo il fianco della palazzina gialla
  dell'Infanzia e si innesta nel corpo giallo con un braccio trasversale.
  PASSERELLA COPERTA             x[-34.8,-30.4] z[-6,+19]  lastra piana h 3.45
     DRITTA (non a L): unisce l'edificio a NORD (fascia moderna del fronte)
     con quello a SUD (corpo giallo, ora esteso x[-63,-29] per accoglierla).
  CORTE DELL'INFANZIA (a ovest)  x[-66,-35]  z[-6,+19]   ~31 m
     · giardino sintetico, palazzina gialla, giochi, fungo, pergola
  PIAZZALE DEI CAMPI (a est)     x[-29,+14]  z[-7,+19]   ~43 m, tutto pavimentato
     · basket 32x18 x[-21,+11] z[-4.5,+13.5]; volley 28x12 x[-19,+9] z[+17,+29]
  Larghezze misurate sull'ortofoto (31 e 43): il rilievo quotato dava 45x35 e
  38x22. Il 38 e' compatibile con il piazzale dei campi; il 45x35 no con una
  corte sola da 31. Probabile che il 45x35 comprenda il cortile dell'Infanzia
  PIU' il corpo giallo e la pergola. Discrepanza lasciata scritta, non nascosta.

  --- aree esterne (quote §16) ---------------------------------------------
  PARCHEGGIO   70 x 40   x[+4,+74]   z[-64,-24]   (davanti al fronte piscine)
  FRUTTETO     80 x 60   x[-20,+60]  z[-128,-68]  (oltre il parcheggio)
  QDV ARENA    40 x 25   x[-86,-46]  z[+43.5,+68.5]  (il tendone bianco)
  CALCIO N-S                     x[-44,-9]   z[+32,+87]; filari x=-46.5 e x=-6.5
  ROTONDA e DRIVEWAY             x=-36 z=-48, davanti al portale ad arco
  CHIESA x[-56,-47] z[-42,-30]

  --- PISCINE: a contatto con l'estremita' del fronte, oltre x=+78.22 -------
  PIAZZALE PIASTRELLATO          x[+67,+151] z[-32,+26]
  VASCA GRANDE   25 x 15   x[+86,+111] z[-14,+1]   piano vasca +0.50
  VASCA PICCOLA  16 x  6   x[+92,+108] z[+13,+19]  piano vasca +6.50 (terrazza)
  SCIVOLI: DUE, ELICOIDALI, 34,4 m di sviluppo (1,5 giri, r 3,6, dislivello
     5,4 m), assi a x=+84 z=+11 e z=+23, uscita nella vasca d'arrivo x[68,78]
  Vasche coperte nei due capannoni (94,-22) e (122,-22); vasca a forma libera
  (130,-4); terrazza bar (94,-27); torretta bagnino (112,-14).

  INTERNI 1P (quota bassa 3.55 al centro uffici, alta 4.19 altrove):
  ATRIO doppia altezza x[-35.8,-24.2] z[-19.8,-6.35] (vuoto + mezzanino)
  UFFICI ovest x[-64,-36], est x[-24,-6], angolo scala x[-6,+13.55]
  SECONDARIA corridoio x[8.55,13.55] z[-6.4,16.5]; aule x[13.55,25.3]
  PRIMARIA salone x[-76.85,-67.15] z[-3.7,33.3]

  Note tecniche gia' risolte:
  - geoSmussata(w,h,d,r) e' gia' orientata: NIENTE rotation.x sui piani.
  - Pareti che NON ricevono ombre; ombre di contatto sotto ogni ingombro.
  - Vetro mai complanare al muro (5 mm avanti).
  - Volo libero senza collisioni; ?touch=1 per provare i comandi iPad.
  ============================================================================
-->
<canvas id="scena"></canvas>

<div id="targa">
  <!-- marchio del Campus ricostruito da Campus.jpeg: banda #C73834, wordmark
       bianco con l'asta della "p" che taglia il bordo inferiore, sottoriga a
       due colori. Misure prese sull'originale (banda 618x194 su 777x375). -->
  <svg id="marchio" viewBox="40 70 700 300" role="img" aria-label="campus sacrafamiglia.education">
    <rect x="40" y="70" width="700" height="300" rx="16" fill="#ffffff"/>
    <rect x="83" y="101" width="618" height="194" fill="#C73834"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ===================== impostazioni ===================== */
const TOCCO = /[?&]touch=1/.test(location.search)
  || (('ontouchstart' in window) && navigator.maxTouchPoints>0 && /Mobi|iPad|iPhone|Android|Tablet/i.test(navigator.userAgent))
  || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
if(TOCCO) document.body.classList.add('tocco');

const canvas=document.getElementById('scena');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.92;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xe6ecef,300,1100);
const camera=new THREE.PerspectiveCamera(62,window.innerWidth/window.innerHeight,0.1,2400);

/* ===================== utilita' ===================== */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rip){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  if(rip){t.wrapS=t.wrapT=THREE.RepeatWrapping;} t.anisotropy=4; return t;}
function lam(col,o){return new THREE.MeshLambertMaterial(Object.assign({color:col},o||{}));}
function seme(n){let s=n>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const _gc={};
function geoSmussata(w,h,d,r){
  const k=w.toFixed(3)+'|'+h.toFixed(3)+'|'+d.toFixed(3)+'|'+r.toFixed(3);
  if(_gc[k])return _gc[k];
  const rr=Math.min(r,w/2-0.001,h/2-0.001);
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+rr,y); s.lineTo(x+w-rr,y); s.quadraticCurveTo(x+w,y,x+w,y+rr);
  s.lineTo(x+w,y+h-rr); s.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  s.lineTo(x+rr,y+h); s.quadraticCurveTo(x,y+h,x,y+h-rr);
  s.lineTo(x,y+rr); s.quadraticCurveTo(x,y,x+rr,y);
  const b=Math.min(0.006,d/4);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-b*2,bevelEnabled:true,bevelThickness:b,
    bevelSize:b,bevelSegments:1,curveSegments:2,steps:1});
  g.translate(0,0,-(d-b*2)/2-b); g.computeVertexNormals(); _gc[k]=g; return g;
}
const texOmbra=(()=>{const c=mkCanvas(128,128),g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(.55,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return tex(c,false);})();
const matOmbra=new THREE.MeshBasicMaterial({map:texOmbra,transparent:true,depthWrite:false});
function contatto(p,x,y,z,w,d,f){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),matOmbra.clone());
  m.material.opacity=(f===undefined)?0.8:f;
  m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.renderOrder=1;
  (p||scene).add(m);return m;}
function box(p,w,h,d,mat,x,y,z,omb){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); if(omb!==false)m.castShadow=true;
  (p||scene).add(m);return m;}

/* ===================== COLLISIONI =====================================
   Non si attraversano i muri. Si passa invece da porte, finestre e vetrate:
   ogni apertura e' registrata come VARCO, cioe' un volume dove il divieto
   non vale. Cosi' per salire al primo piano non servono le scale: si entra
   da una finestra, che e' esattamente come vuole muoversi chi gioca in volo.
   I volumi si calcolano una sola volta a fine costruzione (compilaCollisioni),
   quando le matrici mondo sono aggiornate: farlo prima darebbe scatole
   ferme all'origine. */
const _sol=[], _var=[]; const SOLIDI=[], VARCHI=[];
function solido(m){ if(m) _sol.push(m); return m; }
function varco(m){ if(m) _var.push(m); return m; }
let COLLISIONI=false;
function compilaCollisioni(){
  scene.updateMatrixWorld(true);
  const b=new THREE.Box3();
  _sol.forEach(m=>{ b.setFromObject(m); if(isFinite(b.min.x)) SOLIDI.push(b.clone()); });
  /* il varco dev'essere piu' profondo del muro PIU' il raggio del giocatore,
     altrimenti si entra dalla finestra e si resta incastrati in uscita */
  _var.forEach(m=>{ b.setFromObject(m); if(isFinite(b.min.x)){
    const c=b.clone(); c.expandByScalar(0.95); VARCHI.push(c); } });
  COLLISIONI=true;
}
const RAGGIO=0.30;
function _dentro(lista,p,r){
  for(let i=0;i<lista.length;i++){ const b=lista[i];
    if(p.x>b.min.x-r&&p.x<b.max.x+r&&p.y>b.min.y-r&&p.y<b.max.y+r&&
       p.z>b.min.z-r&&p.z<b.max.z+r) return true; }
  return false;
}
function libero(p){
  if(!COLLISIONI) return true;
  if(!_dentro(SOLIDI,p,RAGGIO)) return true;
  return _dentro(VARCHI,p,0);      /* dentro un muro si passa solo dai varchi */
}

/* ===================== cielo e luce del mattino ===================== */
(function cielo(){
  const c=mkCanvas(16,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#7fb0dd');gr.addColorStop(.5,'#a9c9e6');
  gr.addColorStop(.78,'#dfe4e2');gr.addColorStop(1,'#efe9d8');
  g.fillStyle=gr;g.fillRect(0,0,16,256);
  const t=tex(c,false);t.mapping=THREE.EquirectangularReflectionMapping;
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1500,24,16),
    new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false})));
})();
scene.add(new THREE.HemisphereLight(0xcfe0f0,0x9a8f78,0.55));
const sole=new THREE.DirectionalLight(0xffe6bd,1.55);
sole.position.set(150,52,22); sole.castShadow=true;
sole.shadow.mapSize.set(2048,2048);
sole.shadow.camera.left=-160;sole.shadow.camera.right=160;
sole.shadow.camera.top=160;sole.shadow.camera.bottom=-160;
sole.shadow.camera.far=520;sole.shadow.bias=-0.0012;
scene.add(sole); scene.add(sole.target);

/* ===================== TETTI: coppi veri, falde vere ===================== */
/* I coppi corrono NELLA DIREZIONE DELLA PENDENZA: nella texture le colonne
   sono i canali/coppi (asse v = risalita della falda), le righe orizzontali
   sono le sovrapposizioni, ciascuna con la sua ombra portata. */
const texCoppi=(()=>{
  const S=512,c=mkCanvas(S,S),g=c.getContext('2d'),rnd=seme(7);
  g.fillStyle='#8c4a35';g.fillRect(0,0,S,S);
  const nC=8,wC=S/nC,nR=7,hR=S/nR;
  for(let r=0;r<nR;r++){
    const y=r*hR;
    for(let i=0;i<nC;i++){
      const x=i*wC;
      const b=[[178,98,70],[158,84,58],[190,112,82],[142,76,52],[168,92,64],[150,80,55]][(rnd()*6)|0];
      const gr=g.createLinearGradient(x,0,x+wC,0);
      const sc=k=>'rgb('+Math.min(255,b[0]*k|0)+','+Math.min(255,b[1]*k|0)+','+Math.min(255,b[2]*k|0)+')';
      gr.addColorStop(0,sc(.5)); gr.addColorStop(.18,sc(.78)); gr.addColorStop(.42,sc(1.0));
      gr.addColorStop(.52,sc(1.16)); gr.addColorStop(.74,sc(.92)); gr.addColorStop(1,sc(.46));
      g.fillStyle=gr; g.fillRect(x,y,wC+0.7,hR+0.7);
    }
    /* ombra della sovrapposizione: la fila di monte copre quella di valle */
    const so=g.createLinearGradient(0,y,0,y+hR*0.3);
    so.addColorStop(0,'rgba(0,0,0,.45)'); so.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=so; g.fillRect(0,y,S,hR*0.3);
    /* bordo di gronda della fila, appena piu' chiaro */
    g.fillStyle='rgba(255,225,200,.10)'; g.fillRect(0,y+hR-2.5,S,2.5);
  }
  /* patina e muschio, deterministici */
  for(let i=0;i<160;i++){
    g.fillStyle='rgba('+(90+rnd()*40|0)+','+(100+rnd()*40|0)+','+(70+rnd()*30|0)+',.10)';
    g.beginPath(); g.arc(rnd()*S,rnd()*S,3+rnd()*9,0,Math.PI*2); g.fill();
  }
  return tex(c,true);
})();
const matTegole=lam(0xffffff,{map:texCoppi});
const matColmo=lam(0xa05a42);
const matGronda=lam(0xb8b2a6);
const matLattoneria=lam(0x8f8a80);

/* una falda: 3 o 4 punti, UV proiettate in metri sul piano della falda */
function falda(p,pts,mat,scala){
  const p0=pts[0];
  const e1=V(0,0,0).subVectors(pts[1],pts[0]).normalize();
  const nrm=V(0,0,0).subVectors(pts[1],pts[0])
    .cross(V(0,0,0).subVectors(pts[pts.length-1],pts[0])).normalize();
  const e2=V(0,0,0).crossVectors(nrm,e1).normalize();
  const idx = pts.length===4 ? [0,1,2,0,2,3] : [0,1,2];
  const pos=[],uv=[];
  for(const i of idx){
    const q=pts[i]; pos.push(q.x,q.y,q.z);
    const d=V(0,0,0).subVectors(q,p0);
    uv.push(d.dot(e1)/scala, d.dot(e2)/scala);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.castShadow=true; m.receiveShadow=true;
  (p||scene).add(m); return m;
}
/* fila di coppi di colmo/displuvio fra due punti */
function colmo(p,a,b,r){
  r=r||0.16;
  const len=a.distanceTo(b);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8,1,false,0,Math.PI),matColmo);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0),V(0,0,0).subVectors(b,a).normalize());
  m.castShadow=true; (p||scene).add(m); return m;
}
/* tetto a falde completo: padiglione o capanna, con sporto, gronda, colmo,
   displuvi, comignoli. Il colmo corre sempre lungo il lato lungo. */
function tetto(p,cx,cz,Lx,Lz,y0,alt,o){
  o=o||{};
  const sp=(o.sporto===undefined)?0.62:o.sporto;
  const g=new THREE.Group(); g.position.set(cx,0,cz); (p||scene).add(g);
  const ruota=Lz>Lx;
  const L=(ruota?Lz:Lx), W=(ruota?Lx:Lz);
  if(ruota) g.rotation.y=Math.PI/2;
  const Le=L+2*sp, We=W+2*sp, hw=Le/2, hd=We/2, yb=y0, yt=y0+alt, SC=2.0;
  const A=V(-hw,yb,-hd),B=V(hw,yb,-hd),C=V(hw,yb,hd),D=V(-hw,yb,hd);
  if(o.tipo==='capanna'){
    const E=V(-hw,yt,0),F=V(hw,yt,0);
    falda(g,[A,B,F,E],matTegole,SC); falda(g,[D,C,F,E],matTegole,SC);
    colmo(g,E,F);
    /* timpani verticali alle testate, sul filo del muro */
    const s=new THREE.Shape(); s.moveTo(-W/2,0); s.lineTo(W/2,0); s.lineTo(0,alt); s.closePath();
    [[-L/2,Math.PI/2],[L/2,-Math.PI/2]].forEach(t=>{
      const m=new THREE.Mesh(new THREE.ShapeGeometry(s),lam(o.colTimpano||0xd8d0bd));
      m.position.set(t[0],yb,0); m.rotation.y=t[1]; g.add(m);
    });
  } else {
    const rl=Math.max(0.05,(Le-We)/2);
    const E=V(-rl,yt,0),F=V(rl,yt,0);
    falda(g,[A,B,F,E],matTegole,SC);  /* nord */
    falda(g,[D,C,F,E],matTegole,SC);  /* sud  */
    falda(g,[C,B,F],matTegole,SC);    /* est  */
    falda(g,[A,D,E],matTegole,SC);    /* ovest*/
    colmo(g,E,F);
    [[A,E],[B,F],[C,F],[D,E]].forEach(q=>colmo(g,q[0],q[1],0.125));
  }
  /* sporto di gronda: fascia + canale semicilindrico su tutto il perimetro */
  const fasce=[[Le,0.2,-hd],[Le,0.2,hd]];
  fasce.forEach(f=>box(g,f[0]+0.1,0.2,0.12,matGronda,0,yb-0.1,f[2],false));
  box(g,0.12,0.2,We+0.1,matGronda,-hw,yb-0.1,0,false);
  box(g,0.12,0.2,We+0.1,matGronda, hw,yb-0.1,0,false);
  [[-hd,0],[hd,0]].forEach(q=>{
    const cn=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,Le,8,1,false,0,Math.PI),matLattoneria);
    cn.rotation.z=Math.PI/2; cn.rotation.y=Math.PI/2;
    cn.position.set(0,yb-0.2,q[0]); g.add(cn);
  });
  /* pluviali agli angoli, fino a terra se richiesto */
  if(o.pluviali!==undefined){
    const hP=yb-0.25-o.pluviali;
    if(hP>0.5)[[-hw+0.25,-hd+0.25],[hw-0.25,-hd+0.25],[-hw+0.25,hd-0.25],[hw-0.25,hd-0.25]].forEach(q=>{
      const t=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,hP,7),matLattoneria);
      t.position.set(q[0],o.pluviali+hP/2,q[1]); g.add(t);
    });
  }
  /* comignoli */
  (o.comignoli||[]).forEach(q=>{
    const h=q[2]||1.5, xx=q[0], zz=q[1];
    const yBase=yt-Math.abs(zz)/hd*alt*0.5;
    box(g,0.75,h,0.75,lam(0xc4b8a2),xx,yBase+h/2-0.3,zz,true);
    box(g,1.0,0.14,1.0,lam(0x9c9080),xx,yBase+h-0.25,zz,true);
    box(g,0.5,0.2,0.5,lam(0x8a7f70),xx,yBase+h-0.06,zz,true);
  });
  /* per le collisioni conta solo il volume delle falde: un proxy invisibile
     da y0 a y0+alt. Registrare l'intero gruppo includerebbe i pluviali, che
     arrivano a terra, e l'edificio diventerebbe un parallelepipedo pieno. */
  const proxy=new THREE.Mesh(new THREE.BoxGeometry(Lx+2*sp,alt+0.3,Lz+2*sp),
    new THREE.MeshBasicMaterial({visible:false}));
  proxy.position.set(cx,y0+alt/2,cz); (p||scene).add(proxy); solido(proxy);
  return g;
}

/* ===== PANNELLI SOLARI SULLE FALDE (tetti.png) =========================
   Sulle falde rivolte al cortile ci sono grandi campi di pannelli, in file
   regolari. Sono l'elemento piu' vistoso della copertura vista dall'alto e
   mancavano del tutto. I pannelli seguono l'inclinazione della falda: si
   ruotano dello stesso angolo, e si posano poco sopra il manto. ==== */
const texPannello=(()=>{const c=mkCanvas(128,128),g=c.getContext('2d');
  g.fillStyle='#1E3050';g.fillRect(0,0,128,128);
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){
    const gr=g.createLinearGradient(k*32,r*32,k*32+32,r*32+32);
    gr.addColorStop(0,'#2C4670');gr.addColorStop(0.5,'#1B2B49');gr.addColorStop(1,'#33507E');
    g.fillStyle=gr;g.fillRect(k*32+2,r*32+2,28,28);}
  g.strokeStyle='#8C99AC';g.lineWidth=2;g.strokeRect(0,0,128,128);
  return tex(c,true);})();
function matPannelli(nx,ny){const t=texPannello.clone();t.needsUpdate=true;
  t.repeat.set(nx,ny);
  return new THREE.MeshPhongMaterial({map:t,shininess:95,specular:0x9FB4CC});}
/* cx,cz centro dell'ala · lungo = sviluppo del colmo · semiProf = mezza
   larghezza della falda · y0 quota gronda · alt dislivello gronda-colmo
   verso = +1 se la falda guarda verso +Z (o +X se asseZ), -1 se il contrario */
function pannelliSolari(cx,cz,lungo,semiProf,y0,alt,verso,asseZ,nCampi){
  const ang=Math.atan2(alt,semiProf);
  const nR=3, nC=nCampi||6;
  const passoR=semiProf*0.80/nR;
  for(let r=0;r<nR;r++){
    const t=0.10+ (r+0.5)/nR*0.80;               /* dalla gronda verso il colmo */
    const off=semiProf*(1-t), yy=y0+alt*t+0.10;
    for(let c=0;c<nC;c++){
      const along=-lungo/2+lungo*(c+0.5)/nC;
      const w=lungo/nC-0.45, d=passoR-0.22;
      const m=new THREE.Mesh(new THREE.BoxGeometry(asseZ?d:w,0.07,asseZ?w:d),
        matPannelli(Math.max(1,Math.round((asseZ?d:w)/1.05)),
                    Math.max(1,Math.round((asseZ?w:d)/1.05))));
      if(asseZ){ m.position.set(cx+verso*off,yy,cz+along); m.rotation.z=-verso*ang; }
      else     { m.position.set(cx+along,yy,cz+verso*off); m.rotation.x= verso*ang; }
      m.castShadow=true; mondo.add(m);
      /* telaio d'alluminio sul bordo basso */
      const f=new THREE.Mesh(new THREE.BoxGeometry(asseZ?d+0.05:w+0.05,0.05,asseZ?w+0.05:d+0.05),
        lam(0x9AA3AE));
      f.position.copy(m.position); f.position.y-=0.05; f.rotation.copy(m.rotation);
      mondo.add(f);
    }}
}

/* abbaino a nastro sulla falda: cassonetto con la finestra inclinata, come
   nei rilievi di tetti.png. cx,cz = posizione sulla falda; verso e asseZ come
   in pannelliSolari. */
function abbaino(cx,cz,lungo,y0,alt,semiProf,verso,asseZ){
  const ang=Math.atan2(alt,semiProf);
  const t=0.55, off=semiProf*(1-t), yy=y0+alt*t;
  const px=asseZ?cx+verso*off:cx, pz=asseZ?cz:cz+verso*off;
  const w=asseZ?1.5:lungo, d=asseZ?lungo:1.5;
  box(mondo,w,0.95,d,lam(0xE0DAC8),px,yy+0.55,pz,true);
  const v=new THREE.Mesh(new THREE.BoxGeometry(w-0.2,0.08,d-0.2),
    new THREE.MeshPhongMaterial({color:0xBCD6E4,transparent:true,opacity:0.55,

function tettoPiano(p,cx,cz,Lx,Lz,y,colPar){
  const g=new THREE.Group(); (p||scene).add(g); solido(g);
  /* manto bituminoso con ghiaia, non una lastra bianca anonima */
  const manto=lam(0xffffff,{map:(()=>{const c=texPunti('#6f6c66',
      ['#66635d','#7a776f','#5f5c57','#807d75'],137),x=c.getContext('2d');

    const t2=tex(c,true);t2.repeat.set(Math.max(2,Lx/3),Math.max(2,Lz/3));return t2;})()});
  const t=box(g,Lx+0.5,0.32,Lz+0.5,manto,cx,y+0.16,cz,true);
  t.receiveShadow=true;
  /* lucernari a nastro, unita' di trattamento aria e bocchette */
  const nL=Math.max(2,Math.round(Lx/11));

    const lx=cx-Lx/2+Lx*(i+0.5)/nL;
    box(g,2.6,0.22,1.5,lam(0xb4b1a9),lx,y+0.43,cz,false);

      transparent:true,opacity:0.55,shininess:130,specular:0xffffff}),lx,y+0.57,cz,false);
    vt.rotation.x=0.12;}
  for(let i=0;i<Math.max(1,Math.round(Lx/26));i++){

    box(g,1.9,0.85,1.4,lam(0xb8b5ad),ux,y+0.75,cz-Lz/4,true);
    box(g,1.5,0.10,1.1,lam(0x8f8c85),ux,y+1.22,cz-Lz/4,false);
    for(let k=0;k<4;k++) box(g,0.06,0.55,1.2,lam(0x9a978f),ux-0.7+k*0.46,y+0.75,cz-Lz/4+0.72,false);}
  for(let i=0;i<Math.max(2,Math.round(Lx/18));i++){
    const dx=cx-Lx/2+Lx*(i+0.5)/Math.max(2,Math.round(Lx/18));
    const bo=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.18,10),lam(0x55524d));
    bo.position.set(dx,y+0.40,cz+Lz/2-0.7);g.add(bo);}
  const m=lam(colPar||0xeeece4);
  box(g,Lx+0.6,0.62,0.22,m,cx,y+0.62,cz-Lz/2-0.19,false);
  box(g,Lx+0.6,0.62,0.22,m,cx,y+0.62,cz+Lz/2+0.19,false);
  box(g,0.22,0.62,Lz+0.6,m,cx-Lx/2-0.19,y+0.62,cz,false);
  box(g,0.22,0.62,Lz+0.6,m,cx+Lx/2+0.19,y+0.62,cz,false);
  /* scossalina di coronamento */
  const s=lam(0xb0aca2);
  box(g,Lx+0.75,0.07,0.3,s,cx,y+0.95,cz-Lz/2-0.19,false);
  box(g,Lx+0.75,0.07,0.3,s,cx,y+0.95,cz+Lz/2+0.19,false);

   davanzale 0.95, altezza fino a quasi soffitto, campate da ~2.9 m con
   traverso orizzontale, e pannelli d'accento GIALLI ogni 5 montanti. */
function vetrataCorridoio(p,x0,x1,z,ry,y0){
  const g=new THREE.Group(); const w=Math.abs(x1-x0);
  const sill=y0+0.95, hV=2.55;
  solido(box(g,w,0.95,0.26,matIntonaco,0,y0+0.475,0,false)); /* parapetto sotto */
  box(g,w,0.12,0.3,lam(0xcac6bc),0,sill+0.02,0.03,false);      /* davanzale */
  const v=new THREE.Mesh(new THREE.PlaneGeometry(w-0.3,hV-0.2),matVetro);
  v.position.set(0,sill+hV/2,0.05);g.add(v);varco(v);
  /* 4861/4862/4873: nessun pannello giallo sull'esterno. Montanti tutti grigi,
     e ogni cinque campate un PILASTRO INTONACATO piu' largo, dello stesso
     colore del muro. Il giallo esiste solo DENTRO, sui pannelli di parete. */
  const n=Math.max(3,Math.round(w/2.9));
  for(let i=0;i<=n;i++){
    const px=-w/2+0.14+i*(w-0.28)/n, pil=(i%5===2);

  }
  box(g,w,0.13,0.22,matTelaioGrigio,0,sill+1.55,0.02,false);   /* traverso */
  solido(box(g,w,0.9,0.3,matIntonaco,0,sill+hV+0.45,0,false)); /* fascia sopra */
  g.position.set((x0+x1)/2,0,z); if(ry) g.rotation.y=ry;
  mondo.add(g); return g;}

/* CHIESA — ricostruita dall'aerea etichettata: facciata a capanna in muratura
   con timpano e cornice marcapiano, DUE finestre alte ad arco ai lati del
   portale, porta rettangolare con archetto, gradini d'accesso; navata lunga
   con tetto a due falde in coppi; cipressi ai lati. La facciata guarda a NORD,
   verso la strada e la rotonda. L'interno non e' modellato: non l'ho visto. */
(function chiesa(){
  const g=new THREE.Group();g.position.set(-51.5,0,-34);mondo.add(g);
  const W=9.4, L=17, hM=7.2, alt=3.0;
  const matMur=matPietra(3,3), matCorn=lam(0xcfc4ad);
  /* navata: due muri lunghi e la testata sud */
  solido(box(g,0.5,hM,L,matMur,-W/2,hM/2,2.5,true));
  solido(box(g,0.5,hM,L,matMur, W/2,hM/2,2.5,true));
  solido(box(g,W,hM,0.5,matMur,0,hM/2,11,true));
  /* finestrelle alte sui fianchi */
  for(let i=0;i<4;i++){[-W/2,W/2].forEach(px=>{
    const f=box(g,0.1,1.5,0.7,lam(0x4a5560),px,4.9,-2+i*3.4,false);
    box(g,0.12,1.7,0.9,matCorn,px+(px<0?0.03:-0.03),4.9,-2+i*3.4,false);
    f.position.x=px+(px<0?0.06:-0.06);});}
  /* FACCIATA a capanna, verso nord */
  solido(box(g,W,hM,0.55,matMur,0,hM/2,-6,true));
  const tim=new THREE.Shape();
  tim.moveTo(-W/2,0);tim.lineTo(W/2,0);tim.lineTo(0,alt);tim.closePath();
  const mt=new THREE.Mesh(new THREE.ShapeGeometry(tim),matMur);
  mt.position.set(0,hM,-6.28);mt.rotation.y=Math.PI;g.add(mt);
  /* cornice del timpano e marcapiano */
  /* cornici inclinate del timpano: ruotate attorno al proprio centro, quindi
     vanno posizionate a meta' dello spiovente, non all'angolo del muro */
  [-1,1].forEach(sgn=>{
    const lung=Math.hypot(W/2,alt)+0.25;
    const c=box(g,lung,0.24,0.3,matCorn,sgn*W/4,hM+alt/2,-6.32,false);
    c.rotation.z=-sgn*Math.atan2(alt,W/2);});
  box(g,W+0.35,0.28,0.34,matCorn,0,hM-0.12,-6.32,false);
  /* due finestre alte ad arco ai lati del portale */
  [-2.55,2.55].forEach(px=>{
    box(g,1.05,2.5,0.16,matCorn,px,4.5,-6.33,false);
    const ac=new THREE.Mesh(new THREE.CylinderGeometry(0.525,0.525,0.16,14,1,false,0,Math.PI),matCorn);
    ac.rotation.x=Math.PI/2;ac.rotation.y=-Math.PI/2;ac.position.set(px,5.75,-6.33);g.add(ac);
    box(g,0.72,2.3,0.06,lam(0x3d4650),px,4.5,-6.42,false);
    const av=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.06,14,1,false,0,Math.PI),lam(0x3d4650));
    av.rotation.x=Math.PI/2;av.rotation.y=-Math.PI/2;av.position.set(px,5.75,-6.42);g.add(av);});
  /* portale con archetto e gradini */
  box(g,2.5,3.5,0.18,matCorn,0,1.75,-6.34,false);
  const arp=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,0.18,16,1,false,0,Math.PI),matCorn);
  arp.rotation.x=Math.PI/2;arp.rotation.y=-Math.PI/2;arp.position.set(0,3.5,-6.34);g.add(arp);
  varco(box(g,1.9,3.15,0.1,lam(0x53381f),0,1.58,-6.44,false));
  for(let i=0;i<3;i++) box(g,3.6-i*0.4,0.16,0.42,lam(0xc6bda7),0,0.08+i*0.16,-6.9-i*0.34,true);
  /* tetto a due falde in coppi sulla navata */
  /* la copertura della chiesa e' VERDE-GRIGIA (lamiera), non in coppi */
  (function copertura(){
    const sp=0.5, Le=L+2*sp, We=W+2*sp, hw=Le/2, hd=We/2, yt=hM+alt;
    const mVerde=lam(0x7E9A78);
    [[-1],[1]].forEach(q=>{
      const f=new THREE.Mesh(new THREE.BoxGeometry(We/2+0.7,0.16,Le),mVerde);
      f.position.set(q[0]*W/4,hM+alt/2,2.5);
      f.rotation.z=q[0]*Math.atan2(alt,W/2);
      f.castShadow=true;g.add(f);});
    const cm=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,Le,8),lam(0x63805E));
    cm.rotation.x=Math.PI/2;cm.position.set(0,yt+0.05,2.5);g.add(cm);
    const sh=new THREE.Shape();sh.moveTo(-W/2,0);sh.lineTo(W/2,0);sh.lineTo(0,alt);sh.closePath();
    [[-6.28,Math.PI],[11.28,0]].forEach(t=>{
      const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),lam(0xb3a894));
      m.position.set(0,hM,t[0]);m.rotation.y=t[1];g.add(m);});
  })();
  contatto(mondo,-51.5,0.03,-31.5,13,20,0.5);
  /* cipressi ai lati della facciata */
  [[-8.5,-5],[8.5,-5],[-8.5,4],[9,7]].forEach(q=>{
    const c=new THREE.Mesh(new THREE.ConeGeometry(1.15,8.5,9),lam(0x33512f));
    c.position.set(-51.5+q[0],4.25,-34+q[1]);c.castShadow=true;mondo.add(c);
    contatto(mondo,-51.5+q[0],0.03,-34+q[1],3,3,0.5);});
})();

/* ===================== PISCINE ANDREANA ================================
   RIFATTE SULLE QUOTE DEL RILIEVO (VERIFICA-FOTOGRAFICA §16) e sull'aerea
   etichettata Campus_zone.png.
   - Le piscine NON stanno lontane dalla scuola: sono A CONTATTO con
     l'estremita' del fronte, subito oltre il tratto "Ingresso Piscina".
     Fra scuola e piscine c'e' solo il piazzale piastrellato.
   - VASCA GRANDE quotata 25,00 x 15,00, piano vasca +0,50.
   - VASCA PICCOLA quotata 16,00 x 6,00, piano vasca +6,50: sta SEI METRI
     PIU' IN ALTO, su una terrazza. E' la vasca di partenza degli scivoli, ed
     e' il dislivello che non avevo mai considerato.
   - DUE scivoli ELICOIDALI, ~35 m di sviluppo ciascuno (non uno solo ad ansa
     aperta): scendono avvolgendosi attorno alla torre fino alla vasca d'arrivo.
   - Due capannoni chiari affiancati (uno per vasca coperta), terrazza del bar
     con tende a braccio e ombrelloni, torretta del bagnino.
   ====================================================================== */
(function piscine(){
  const g=new THREE.Group();
  /* ORTOFOTO: le piscine cominciano SUBITO a est dell'ala nord-est.
     Tutto il complesso e' costruito attorno all'origine locale e poi
     traslato: cosi' si sposta in un punto solo. */
  g.position.x=-40; mondo.add(g);
  const matPiastre=lam(0xffffff,{map:(()=>{const t=tex(texPunti('#e0c3a8',
    ['#d8bb9f','#e8cdb2','#d0b397'],23),true);t.repeat.set(46,40);return t;})()});
  const piastra=new THREE.Mesh(new THREE.PlaneGeometry(84,58),matPiastre);
  piastra.rotation.x=-Math.PI/2;piastra.position.set(109,0.02,-3);piastra.receiveShadow=true;g.add(piastra);
  const matBordo=lam(0xe6e2d8);

  /* vasca rettangolare a una quota qualsiasi: il piano vasca e' un parametro,
     perche' §16 quota due vasche a quote diverse (+0,50 e +6,50) */
  function vascaRett(cx,cz,w,d,corsie,blocchi,y0){
    y0=y0||0;
    box(g,w+1.6,0.32,d+1.6,matBordo,cx,y0+0.16,cz,false);
    const a2=new THREE.Mesh(new THREE.PlaneGeometry(w,d),matAcqua);
    a2.rotation.x=-Math.PI/2;a2.position.set(cx,y0+0.34,cz);g.add(a2);
    for(let i=1;i<corsie;i++){const t=i/corsie;
      for(let k=0.5;k<w;k+=0.85){
        const b2=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,5),
          lam((Math.floor(k/0.85)%2)?0xe8e4dc:0xd8443a));
        b2.position.set(cx-w/2+k,y0+0.41,cz-d/2+d*t);g.add(b2);}}
    if(blocchi) for(let i=0;i<corsie;i++){const t=(i+0.5)/corsie;
      box(g,0.46,0.34,0.46,lam(0xd8d4cc),cx-w/2+0.7,y0+0.47,cz-d/2+d*t,true);
      box(g,0.30,0.05,0.30,lam(0x2f6fb5),cx-w/2+0.7,y0+0.65,cz-d/2+d*t,false);}
  }

  /* --- capannone vetrato: e' la copertura fissa delle vasche coperte -------
     Nell'aerea sono DUE, chiari e affiancati, a falde leggere su montanti
     bianchi ravvicinati, con il vetro azzurrino. */
  function capannone(cx,cz,w,d,h,alt){
    const mm=lam(0xf2f0ea);
    for(let i=0;i<=Math.round(w/3.2);i++){
      const px=cx-w/2+i*w/Math.round(w/3.2);
      box(g,0.22,h,0.22,mm,px,h/2,cz-d/2,true);
      box(g,0.22,h,0.22,mm,px,h/2,cz+d/2,true);}
    const vet=new THREE.Mesh(new THREE.PlaneGeometry(w,h-0.6),matVetro);
    vet.position.set(cx,h/2-0.1,cz-d/2-0.05);g.add(vet);

function texScacchi(pal,n,celle){

    g.strokeStyle='rgba(90,84,80,.5)';g.lineWidth=2;g.strokeRect(x*32,y*32,32,32);}

/* DUE SOLI TIPI DI PIASTRELLA IN TUTTA LA SCUOLA (indicazione di Andrea):
   1) Primaria, uffici e atrio: 30x30 a TRE COLORI — sabbia, antracite, rosa,
      posati a scacchiera irregolare (gli stessi del laboratorio di informatica);
   2) Secondaria: 60x60 effetto cemento GRIGIO MEDIO CALDO (non antracite:
      corretto sul video della passeggiata al primo piano).
   Le ripetizioni si calcolano dalle dimensioni reali del vano, cosi' la
   piastrella misura davvero 30 cm o 60 cm e non "quello che viene". */
const PAL3=['#DCCFB2','#6E6B67','#C9A79E','#DCCFB2','#6E6B67','#C9A79E',
            '#E2D6BA','#736F6B'];
function pav30(w,d,seed){            /* 30 cm: texture da 4x4 celle = 1,20 m */
  return matPav(PAL3, seed||107, Math.max(1,Math.round(w/1.2)),

/* CORREZIONE DAL VIDEO (§18): il 60x60 della Secondaria NON e' antracite.
   Nella passeggiata del primo piano e' un gres effetto cemento GRIGIO MEDIO
   CALDO, piuttosto chiaro, con nuvolature evidenti e fuga sottile appena piu'
   scura. Con l'antracite il corridoio veniva quasi nero e la gradinata in
   cemento non staccava; nel filmato e' l'opposto, l'ambiente e' luminoso. */
const texAntracite60=(()=>{const c=mkCanvas(256,256),g=c.getContext('2d'),rnd=seme(613);
  g.fillStyle='#918F89';g.fillRect(0,0,256,256);
  for(let i=0;i<160;i++){                       /* venature e nuvolature */
    const v=132+rnd()*40|0;
    g.fillStyle='rgba('+v+','+(v-2)+','+(v-6)+','+(0.07+rnd()*0.15).toFixed(2)+')';
    g.beginPath();g.ellipse(rnd()*256,rnd()*256,10+rnd()*44,8+rnd()*30,rnd()*3,0,Math.PI*2);g.fill();}
  for(let i=0;i<120;i++){
    g.fillStyle='rgba(96,94,90,'+(0.05+rnd()*0.12).toFixed(2)+')';
    g.fillRect(rnd()*256,rnd()*256,2,2);}
  g.strokeStyle='#787671';g.lineWidth=3;g.strokeRect(0,0,256,256);
  return tex(c,true);})();
function pav60(w,d){                 /* 60 cm: una piastrella per ripetizione */
  const t=texAntracite60.clone();t.needsUpdate=true;
  t.repeat.set(Math.max(1,Math.round(w/0.6)),Math.max(1,Math.round(d/0.6)));

  g.strokeStyle='#6d4a22';g.lineWidth=3;g.strokeRect(3,3,122,122);

/* ---- Coppa delle Case: il tesoro dell'ultima tappa ----
   Calice dorato su podio di pietra, con i quattro stemmi delle Case della
   Sacra Famiglia e quattro colonne di vetro riempite dei loro colori
   (Aquilablu, Querciaverde, Cerogiallo, Tassorosso). */
const texFascia=(()=>{const c=mkCanvas(1024,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#e8c86a');gr.addColorStop(.45,'#c9a03a');gr.addColorStop(1,'#9a7420');
  g.fillStyle=gr;g.fillRect(0,0,1024,256);
  g.fillStyle='rgba(255,244,206,.30)';g.fillRect(0,14,1024,10);
  g.fillStyle='rgba(90,64,10,.30)';g.fillRect(0,232,1024,12);
  [['#2b5aa8','AQUILABLU'],['#2e7a3a','QUERCIAVERDE'],
   ['#d8a828','CEROGIALLO'],['#a8302a','TASSOROSSO']].forEach((h,i)=>{
    const cx=128+i*256;
    g.fillStyle='#f2e6c2';
    g.beginPath();g.moveTo(cx-52,52);g.lineTo(cx+52,52);g.lineTo(cx+52,132);
    g.quadraticCurveTo(cx+52,186,cx,206);g.quadraticCurveTo(cx-52,186,cx-52,132);
    g.closePath();g.fill();
    g.fillStyle=h[0];
    g.beginPath();g.moveTo(cx-42,62);g.lineTo(cx+42,62);g.lineTo(cx+42,130);
    g.quadraticCurveTo(cx+42,176,cx,193);g.quadraticCurveTo(cx-42,176,cx-42,130);
    g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(cx,118,20,0,Math.PI*2);g.fill();
    g.fillStyle='#5a4410';g.font='bold 19px Lexend, sans-serif';g.textAlign='center';
    g.fillText(h[1],cx,40);});
  return tex(c,false);})();
function coppaDelleCase(){
  const g=new THREE.Group();
  const oro=new THREE.MeshPhongMaterial({color:0xd8ab3e,shininess:130,specular:0xfff2c8});
  const oroS=new THREE.MeshPhongMaterial({color:0xb0822a,shininess:100,specular:0xffe8a8});
  const pietra=lam(0xd2c8b0), pietraS=lam(0xbdb298);
  /* podio a due gradoni */
  box(g,3.4,0.30,1.7,pietraS,0,0.15,0,true);
  box(g,3.0,0.24,1.4,pietra,0,0.42,0,true);
  const targa=box(g,2.0,0.30,0.05,oro,0,0.20,0.87,false);
  targa.material=new THREE.MeshPhongMaterial({shininess:120,specular:0xfff2c8,
    map:(()=>{const c=mkCanvas(512,80),x=c.getContext('2d');
      x.fillStyle='#c9a03a';x.fillRect(0,0,512,80);
      x.fillStyle='#5a4410';x.font='bold 25px Lexend, sans-serif';x.textAlign='center';
      x.fillText('COPPA DELLE CASE',256,50);return tex(c,false);})()});
  /* calice: profilo a rivoluzione */
  const P=[[0.34,0],[0.36,0.05],[0.24,0.10],[0.11,0.16],[0.08,0.34],
           [0.15,0.42],[0.17,0.48],[0.12,0.55],[0.09,0.62],
           [0.20,0.70],[0.34,0.84],[0.43,1.04],[0.46,1.22],[0.455,1.28],[0.40,1.28]];
  const lat=new THREE.Mesh(new THREE.LatheGeometry(
    P.map(q=>new THREE.Vector2(q[0],q[1])),36),oro);
  lat.position.y=0.54;lat.castShadow=true;g.add(lat);
  /* fascia con i quattro stemmi attorno alla coppa */
  const fascia=new THREE.Mesh(new THREE.CylinderGeometry(0.455,0.40,0.42,40,1,true),
    new THREE.MeshPhongMaterial({map:texFascia,shininess:90,specular:0xfff0c0}));
  fascia.position.y=0.54+1.06;g.add(fascia);
  /* anse a voluta */
  [-1,1].forEach(sg=>{
    const an=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.032,8,20,Math.PI*1.25),oroS);
    an.position.set(sg*0.50,0.54+1.02,0);an.rotation.y=Math.PI/2;
    an.rotation.z=sg>0?-0.5:Math.PI+0.5;an.castShadow=true;g.add(an);});
  /* quattro colonne di vetro coi colori delle Case */
  const vetroT=new THREE.MeshPhongMaterial({color:0xdfeef6,transparent:true,opacity:0.34,
    shininess:170,specular:0xffffff,side:THREE.DoubleSide});
  [[-1.18,0x2b5aa8],[-0.78,0x2e7a3a],[0.78,0xd8a828],[1.18,0xa8302a]].forEach((q,i)=>{
    const x=q[0], h=0.95+((i===0||i===3)?0.16:0);
    box(g,0.34,0.30,0.34,pietra,x,0.69,0,true);
    const tu=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,h,16,1,true),vetroT);
    tu.position.set(x,0.84+h/2,0);g.add(tu);
    box(g,0.30,0.07,0.30,oroS,x,0.86,0,false);
    box(g,0.30,0.07,0.30,oroS,x,0.84+h,0,false);
    const rnd=seme(300+i*7);
    for(let k=0;k<16;k++){
      const gem=new THREE.Mesh(new THREE.IcosahedronGeometry(0.055,0),
        new THREE.MeshPhongMaterial({color:q[1],shininess:150,specular:0xffffff,
          transparent:true,opacity:0.9}));
      gem.position.set(x+(rnd()-0.5)*0.12, 0.92+k*(h-0.14)/16, (rnd()-0.5)*0.12);
      gem.rotation.set(rnd()*3,rnd()*3,rnd()*3);g.add(gem);}
  });
  return g;}
let cassetta=null, pulsa=0;
function creaCassetta(pos,ultima){
  if(cassetta){scene.remove(cassetta);cassetta=null;}
  if(ultima){                       /* il tesoro non e' una cassetta: e' la Coppa */
    const c=coppaDelleCase();
    c.position.set(pos[0],pos[1],pos[2]);c.userData.bersaglio=true;
    scene.add(c);cassetta=c;
    contatto(scene,pos[0],pos[1]+0.006,pos[2],4.2,2.6,0.6);
    return c;}
  const g=new THREE.Group();
  const s=ultima?1.35:1.0;
  const corpo=new THREE.Mesh(geoSmussata(0.52*s,0.34*s,0.38*s,0.03),
    lam(ultima?0x8a5a26:0xa9793f));
  corpo.position.y=0.17*s;corpo.castShadow=true;g.add(corpo);
  const cop=new THREE.Mesh(new THREE.BoxGeometry(0.54*s,0.06*s,0.4*s),
    lam(0xffffff,{map:texCoperchio}));
  cop.position.y=0.37*s;cop.castShadow=true;g.add(cop);
  [[-0.26*s,0],[0.26*s,0]].forEach(q=>
    box(g,0.03*s,0.36*s,0.4*s,lam(0xc9a227),q[0],0.18*s,0,false));
  box(g,0.1*s,0.13*s,0.03*s,lam(0xc9a227),0,0.3*s,0.2*s,false);
  g.position.set(pos[0],pos[1],pos[2]);
  g.userData.bersaglio=true;
  scene.add(g);cassetta=g;
  contatto(scene,pos[0],pos[1]+0.006,pos[2],1.1*s,1.0*s,0.55);
  return g;}

   Regole volute da Andrea: UN SOLO aiuto per domanda, a scelta fra 50:50 e il
   suggerimento del religioso; una risposta sbagliata fa RICOMINCIARE il
   percorso da capo. Domande e opzioni sono mescolate a ogni partita.

   corrente invece che dalla prima (utile se in aula la regola risulta troppo
   dura per i piu' piccoli). */
const RIPARTI_DA_CAPO = true;
let mazzo=[], quesito=null, aiutoUsato=false;
function rimescolaMazzo(){
  mazzo = DOMANDE.map((q,i)=>i);
  for(let i=mazzo.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    const t=mazzo[i]; mazzo[i]=mazzo[j]; mazzo[j]=t; }
}
function pescaDomanda(){
  if(!mazzo.length) rimescolaMazzo();
  const q=DOMANDE[mazzo.pop()];
  const opz=[{t:q.r,ok:true}].concat(q.x.map(v=>({t:v,ok:false})));
  for(let i=opz.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    const t=opz[i]; opz[i]=opz[j]; opz[j]=t; }
  return {q,opz};
}
function trovata(){
  if(cassetta){scene.remove(cassetta);cassetta=null;}
  quesito=pescaDomanda(); aiutoUsato=false;

/* Vista automatica: pointer lock, come nelle escape room gia' fatte. Un clic
   aggancia il mouse, poi lo sguardo segue il movimento senza tenere premuto;
   Esc lo rilascia. Si mira con il mirino al centro dello schermo, non con la
   punta del cursore. Su touch il pointer lock non esiste: restano i joystick. */
let bloccato=false;
const mirino=$('mirino'), avviso=$('avviso');
function agganciaMouse(){ if(!TOCCO && canvas.requestPointerLock) canvas.requestPointerLock(); }
function segnaVista(){
  const inGioco = velo.style.display!=='flex';
  mirino.style.display = (bloccato||TOCCO) && inGioco ? 'block':'none';
  avviso.style.display = (!bloccato && !TOCCO && inGioco) ? 'block':'none';
}
document.addEventListener('pointerlockchange',()=>{
  bloccato = (document.pointerLockElement===canvas); segnaVista();});
window.addEventListener('mousemove',e=>{
  if(!bloccato) return;
  yaw   -= e.movementX*0.0022;
  pitch -= e.movementY*0.0022;
  pitch = Math.max(-1.45,Math.min(1.45,pitch));});
canvas.addEventListener('click',()=>{
  if(velo.style.display==='flex') return;
  if(!TOCCO && !bloccato){ agganciaMouse(); return; }
  provaMirino();});

const ray=new THREE.Raycaster();
function provaMirino(){
  if(!cassetta||velo.style.display==='flex')return;
  ray.setFromCamera({x:0,y:0},camera);
  if(ray.intersectObject(cassetta,true).length) trovata();}
function provaClic(cx,cy){          /* usato dal tocco su iPad */
  if(!cassetta||velo.style.display==='flex')return;
  const m={x:(cx/window.innerWidth)*2-1, y:-(cy/window.innerHeight)*2+1};
  ray.setFromCamera(m,camera);
  if(ray.intersectObject(cassetta,true).length) trovata();}

function joystick(el,cb){
  const pomo=el.querySelector('.pomo');let att=null,cx=0,cy=0;const R=42;
  function agg(t){let dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d;}
    pomo.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';cb(dx/R,dy/R);}
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];att=t.identifier;
    const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;agg(t);e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===att)agg(t);
    e.preventDefault();},{passive:false});
  el.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===att){att=null;
    pomo.style.transform='translate(-50%,-50%)';cb(0,0);}},{passive:false});
  el.addEventListener('touchcancel',()=>{att=null;pomo.style.transform='translate(-50%,-50%)';cb(0,0);});}
let jM={x:0,y:0},jV={x:0,y:0},salgo=0;
if(TOCCO){
  joystick($('stickMov'),(x,y)=>{jM.x=x;jM.y=y;});
  joystick($('stickVis'),(x,y)=>{jV.x=x;jV.y=y;});
  $('su').addEventListener('touchstart',e=>{salgo=1;e.preventDefault();},{passive:false});
  $('su').addEventListener('touchend',()=>{salgo=0;});
  $('giu').addEventListener('touchstart',e=>{salgo=-1;e.preventDefault();},{passive:false});
  $('giu').addEventListener('touchend',()=>{salgo=0;});
  /* su iPad il tap sul canvas usa l'oggetto mirato */
  canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0];
    if(t) provaClic(t.clientX,t.clientY);},{passive:true});}

/* ===================== musica di sottofondo (YouTube IFrame API) ========
   Regole gia' imparate: sempre youtube.com/embed, mai nocookie; l'autoplay
   parte solo dopo un gesto reale (il clic su "Comincia dal portale"); loop
   rifatto a mano su ENDED; se l'embed e' vietato (errore 101/150) il brano
   non parte in nessuna pagina, quindi si nasconde il comando invece di
   lasciare un pulsante che non fa nulla. */
const MUSICA_ID='1WRP1GzukN8';
let ytPlayer=null, ytPronto=false, ytGuasto=false, musicaChiesta=false;
let audioOn=true;
try{ const v=localStorage.getItem('campus3d_audio'); if(v!==null) audioOn=(v==='1'); }catch(e){}

function segnaAudio(){
  const b=$('bAudio');
  b.classList.toggle('spento',!audioOn);
  $('onde').style.display=audioOn?'':'none';
  $('crocetta').style.display=audioOn?'none':'';
  $('etAudio').textContent=audioOn?'Musica':'Muta';
}
function nascondiAudio(){ const b=$('bAudio'); if(b){ b.style.display='none';
  const s=b.previousElementSibling; if(s&&s.className==='sep') s.style.display='none'; } }

window.onYouTubeIframeAPIReady=function(){
  ytPlayer=new YT.Player('yt',{
    videoId:MUSICA_ID, host:'https://www.youtube.com',
    playerVars:{autoplay:0,controls:0,rel:0,playsinline:1,enablejsapi:1,
      loop:1,playlist:MUSICA_ID,modestbranding:1,iv_load_policy:3},
    events:{
      onReady:()=>{ ytPronto=true; try{ytPlayer.setVolume(22);}catch(e){}
        if(musicaChiesta&&audioOn) provaSuonare(); },
      onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ try{ytPlayer.seekTo(0);ytPlayer.playVideo();}catch(err){} } },
      onError:e=>{ ytGuasto=true; nascondiAudio();
        console.warn('[Campus3D] musica non disponibile (codice '+e.data+
          '): il video non \u00e8 incorporabile o non esiste. Serve un altro brano.'); }
    }});
};
function provaSuonare(){
  if(!ytPronto||ytGuasto||!audioOn) return;
  try{ ytPlayer.setVolume(22); ytPlayer.playVideo(); }catch(e){}
}
function avviaMusica(){ musicaChiesta=true; provaSuonare(); }
/* Rete di sicurezza. Serve in due casi: quando l'autoplay viene bloccato, e
   quando la partita riprende da un salvataggio — li' la schermata iniziale non
   compare, quindi non c'e' nessun clic su "Comincia" a sbloccare l'audio.
   Questi listener scattano solo su un gesto reale, percio' bastano da soli. */
['pointerdown','keydown','touchend'].forEach(ev=>window.addEventListener(ev,()=>{
  if(ytGuasto||!audioOn) return;
  musicaChiesta=true;
  try{ if(ytPronto&&ytPlayer.getPlayerState&&ytPlayer.getPlayerState()!==1) ytPlayer.playVideo(); }catch(e){}
},{passive:true}));

  audioOn=!audioOn; segnaAudio();
  try{ localStorage.setItem('campus3d_audio',audioOn?'1':'0'); }catch(e){}
  if(!ytPronto||ytGuasto) return;
  try{ audioOn?ytPlayer.playVideo():ytPlayer.pauseVideo(); }catch(e){}
});
segnaAudio();
(function caricaYT(){
  const t=document.createElement('script');
  t.src='https://www.youtube.com/iframe_api';
  t.onerror=()=>{ ytGuasto=true; nascondiAudio();
    console.warn('[Campus3D] IFrame API non raggiungibile: musica disattivata.'); };
  document.head.appendChild(t);
  /* se in 8 s l'API non ha risposto, togli il comando invece di lasciarlo muto */
  setTimeout(()=>{ if(!ytPronto&&!ytGuasto){ ytGuasto=true; nascondiAudio();
    console.warn('[Campus3D] la musica non si \u00e8 avviata entro 8 s.'); } },8000);
})();

/* ===================== tutorial in quattro momenti ===================== */

  /* Card d'accesso: l'immagine occupa tutta la superficie, il testo sta solo
     sulla fascia sinistra (campi e ulivi) dove non copre nulla. In alto il

  apriFoglio(
     '<div class="colonna">'
    +'<div class="pillola">'+$('marchio').outerHTML.replace('id="marchio"','')+'</div>'
    +'<div class="occhiello">Caccia al tesoro</div>'
    +'<h1>Campus Sacra Famiglia</h1>'
    +'<p>Dieci tappe nascoste nel campus. In ognuna c\'è una cassetta di legno, '
    +'e dentro l\'indizio della tappa successiva. Gli indizi <strong>non dicono il '
    +'nome del posto</strong>: lo descrivono.</p>'
    +'<div class="comandi">'
    +(TOCCO
      ? '<b>Levetta sinistra</b> muoversi · <b>destra</b> guardarsi intorno<br>'
        +'<b>Frecce</b> salire e scendere · <b>tocca</b> la cassetta per aprirla'
      : '<b>Clic</b> per agganciare la vista, poi il <b>mouse</b> guarda in giro<br>'
        +'<b>W A S D</b> muoversi · <b>E</b> sali · <b>Q</b> scendi · <b>Esc</b> libera il mouse<br>'
        +'Punta la cassetta col <b>mirino</b> al centro e fai clic')
    +'</div>'
    +'<div class="bottoni"><button onclick="viaAlGioco()">Comincia dal portale</button></div>'
    +'<div class="nota">Se ti blocchi, <strong>Chiedi un aiuto</strong>: prima la zona, '
    +'poi che cosa cercare, infine ti porto sul posto. Nessun punteggio.</div>'
    +'</div>','card');}
window.viaAlGioco=function(){chiudiFoglio();$('carta').style.display='block';
  avviaMusica();               /* gesto utente reale: e' qui che l'autoplay e' concesso */
  mostraTappa(); vaiA(1);};

/* ===================== ciclo ===================== */
const orologio=new THREE.Clock(), qv=$('qv'), vicino=$('vicino');
function anima(){
  requestAnimationFrame(anima);
  const dt=Math.min(0.05,orologio.getDelta());
  if(voloT<1){
    voloT=Math.min(1,voloT+dt/1.6);
    const k=voloT<0.5?2*voloT*voloT:1-Math.pow(-2*voloT+2,2)/2;
    camera.position.lerpVectors(voloDa,voloA,k); guardaVerso(mira);
  } else if(velo.style.display!=='flex'){
    const av=(tasti['KeyW']||tasti['ArrowUp']?1:0)-(tasti['KeyS']||tasti['ArrowDown']?1:0);
    const de=(tasti['KeyD']||tasti['ArrowRight']?1:0)-(tasti['KeyA']||tasti['ArrowLeft']?1:0);
    const al=(tasti['KeyE']||tasti['Space']?1:0)-(tasti['KeyQ']||tasti['ShiftLeft']||tasti['ShiftRight']?1:0);
    const vA=av-jM.y, vD=de+jM.x, vU=al+salgo;
    yaw-=jV.x*1.9*dt; pitch-=jV.y*1.5*dt;
    pitch=Math.max(-1.45,Math.min(1.45,pitch));
    const dir=V(-Math.sin(yaw),0,-Math.cos(yaw)), lat=V(-dir.z,0,dir.x);
    const ob=V(0,0,0).addScaledVector(dir,vA*velBase).addScaledVector(lat,vD*velBase)
      .add(V(0,vU*velBase*0.7,0));
    vel.lerp(ob,1-Math.pow(0.0001,dt));
    /* collisioni: se la diagonale e' bloccata si prova a scivolare lungo un
       asse alla volta, altrimenti ci si incolla ai muri */
    const nuova=camera.position.clone().addScaledVector(vel,dt);
    if(libero(nuova)) camera.position.copy(nuova);
    else{
      const p=camera.position;
      const px=V(nuova.x,p.y,p.z), py=V(p.x,nuova.y,p.z), pz=V(p.x,p.y,nuova.z);
      if(libero(px)) p.x=nuova.x; else vel.x*=0.2;
      if(libero(py)) p.y=nuova.y; else vel.y*=0.2;
      if(libero(pz)) p.z=nuova.z; else vel.z*=0.2;
    }
    if(camera.position.y<0.6)camera.position.y=0.6;
    if(camera.position.y>260)camera.position.y=260;
  }
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;camera.rotation.x=pitch;camera.rotation.z=0;
  /* la cassetta pulsa piano quando sei vicino: è un segnale di processo,
     non una ricompensa — dice "stai cercando nel posto giusto" */
  if(cassetta){
    const d=camera.position.distanceTo(cassetta.position);
    pulsa+=dt;
    const vicinoOra=d<26;
    cassetta.position.y=cassetta.userData.y0===undefined
      ? (cassetta.userData.y0=cassetta.position.y)
      : cassetta.userData.y0+(vicinoOra?Math.sin(pulsa*2.6)*0.045:0);
    cassetta.rotation.y+=dt*(vicinoOra?0.55:0.18);
    vicino.style.display=(d<9)?'block':'none';
    if(bloccato||TOCCO){
      ray.setFromCamera({x:0,y:0},camera);
      mirino.classList.toggle('su', ray.intersectObject(cassetta,true).length>0);
    }
  } else { vicino.style.display='none'; mirino.classList.remove('su'); }
  qv.textContent=camera.position.y.toFixed(0);
  renderer.render(scene,camera);
}
compilaCollisioni();
console.log('[Campus3D] ostacoli:',SOLIDI.length,'| varchi:',VARCHI.length);
guardaVerso(V(-25,0,0));
anima();

apriIntro();          /* si parte sempre dalla card: nessuna tappa salvata */

setTimeout(()=>{console.log('[Campus3D v3] triangoli:',renderer.info.render.triangles,
  '| draw call:',renderer.info.render.calls,'| tappe:',TAPPE.length);},1500);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
