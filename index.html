/* ==========================================================================
   IL PRIMO PIANO — il file `primopiano.html`, portato qui INTERO
   --------------------------------------------------------------------------
   Corridoio a U scritto da zero sulle quote di PianoPrimo.pdf lette a
   300 dpi. Non e' stato ritoccato: sono state tolte solo le tre cose che
   qui sarebbero doppioni —
     · il suo impianto Three (scena, camera, renderer, luci): ce n'e' uno solo
       e sta in testa al file;
     · la sua passata di convertSRGBToLinear: una sola, in fondo;
     · la sua QUINTA SCENOGRAFICA ("quello che si vede fuori"), il campus in
       miniatura oltre le vetrate: con gli esterni veri era un doppione, e il
       suo muro da 70 m attraversava il campo da volley.
   Quattro nomi collidevano con gli esterni e sono stati rinominati, non
   fusi: boxP, pianoP, contattoP, semeP, texOmbraP.

   E il piano sta in un GRUPPO SUO, `piano1`, figlio di `mondo`. Non e' un
   dettaglio: il collaudo del corridoio e' geometrico su tutte le mesh, e
   condividendo `mondo` finiva per misurare anche il guscio degli edifici —
   che il corridoio lo CONTIENE per costruzione (corpo() fa un volume pieno).
   Risultato: "larghezza libera 0,00" su tutti e tre i bracci, cioe' un test
   che accusa il modello di un difetto che non ha. Il corridoio si misura
   dentro `piano1`; per il campus che gli passa attraverso c'e' un test
   apposta, piu' avanti, che cerca solo i pezzi SOTTILI.
   ========================================================================== */
const piano1=new THREE.Group(); mondo.add(piano1);

/* Le QUOTE e le coordinate del corridoio (PAV, SALTO, SOF, i fili dei tre
   bracci, la retta della gradinata) stanno in TESTA AL FILE, non qui: le
   usano anche gli esterni, che devono SCAVARE il corridoio dentro le masse
   degli edifici. Un numero, un posto solo. */
/* ============================ utilita' ================================== */
function tela(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function textura(c,rip){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  if(rip){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t;}
function mat(col,opt){return new THREE.MeshLambertMaterial(Object.assign({color:col},opt||{}));}

/* un generatore deterministico: le texture devono essere sempre uguali */
function semeP(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

function boxP(p,w,h,d,m,x,y,z,ombra){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);
  if(ombra){o.castShadow=true;o.receiveShadow=true;}
  p.add(o); return o;
}
function pianoP(p,w,d,m,x,y,z,rx){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  o.rotation.x = (rx===undefined?-Math.PI/2:rx);
  o.position.set(x,y,z); o.receiveShadow=true; p.add(o); return o;
}

/* ---- ombra di contatto: senza, ogni oggetto galleggia ------------------ */
const texOmbraP = (()=>{
  const c=tela(128,128), g=c.getContext('2d');
  const rg=g.createRadialGradient(64,64,4,64,64,62);
  rg.addColorStop(0,'rgba(0,0,0,.34)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,128,128); return textura(c,false);
})();
function contattoP(p,x,y,z,w,d){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({map:texOmbraP,transparent:true,depthWrite:false}));
  o.rotation.x=-Math.PI/2; o.position.set(x,y+0.004,z); p.add(o); return o;
}

/* ============================ materiali =================================
   I colori esadecimali sono sRGB ma Three r128 li tratta come lineari: a
   scena costruita si fa UNA passata di convertSRGBToLinear sui soli color,
   altrimenti ogni tinta esce di un tono e mezzo piu' chiara.           */

/* gres grigio a grandi lastre — 4868/4874: grigio medio caldo, fughe fini */
function texGres(w,d){
  const c=tela(512,512), g=c.getContext('2d'), r=semeP(17);
  g.fillStyle='#8e8a84'; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){
    g.fillStyle=['#948f89','#87837d','#9a958f'][(r()*3)|0];
    g.fillRect(r()*512,r()*512,3,3);
  }
  g.strokeStyle='#7a766f'; g.lineWidth=3;
  g.strokeRect(0,0,512,512);
  const t=textura(c,true); t.repeat.set(Math.max(1,w/0.8),Math.max(1,d/0.8));
  return t;
}
/* pavimento a scacchi della Primaria — 4856: rosa antico, grigio, beige */
function texScacchi(w,d){
  const c=tela(512,512), g=c.getContext('2d'), r=semeP(29);
  const pal=['#cbbdb2','#6e6a66','#ded5c8','#b9a89c'];
  for(let i=0;i<8;i++) for(let j=0;j<8;j++){
    g.fillStyle=pal[(i+j*3+((r()*2)|0))%4];
    g.fillRect(i*64,j*64,64,64);
  }
  g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=2;
  for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,512);g.stroke();
                        g.beginPath();g.moveTo(0,i*64);g.lineTo(512,i*64);g.stroke();}
  const t=textura(c,true); t.repeat.set(Math.max(1,w/4),Math.max(1,d/4));
  return t;
}
/* controsoffitto a quadrotti — 4868 e 4856 lo mostrano in tutti e due i corridoi */
function texQuadrotti(w,d){
  const c=tela(256,256), g=c.getContext('2d');
  g.fillStyle='#f4f3ef'; g.fillRect(0,0,256,256);
  g.strokeStyle='#d9d7d1'; g.lineWidth=6; g.strokeRect(3,3,250,250);
  const t=textura(c,true); t.repeat.set(Math.max(1,w/1.2),Math.max(1,d/1.2));
  return t;
}

const M = {
  muroSec   : mat(0xF2F1ED),   /* pareti bianche della Secondaria          */
  muroPrim  : mat(0xE8620A),   /* arancione pieno della Primaria           */
  solaio    : mat(0xbdbab2),
  telaioChi : mat(0xB9BEC3),   /* IMG_4878: i telai sono GRIGIO CHIARO     */
  telaioScu : mat(0x4A4E52),   /* telai grigio scuro, Primaria             */
  /* IMG_4878: il vetro e' TRASPARENTE — dal corridoio si vedono i campi, gli
     alberi e l'edificio di fronte. Con opacity 0,30 era una lastra lattiginosa
     che non lasciava vedere niente. */
  vetro     : new THREE.MeshPhongMaterial({color:0xcfe2ef,transparent:true,
                opacity:0.13,shininess:110,specular:0xffffff,side:THREE.DoubleSide,
                depthWrite:false}),
  legno     : mat(0xb9905e),
  salvia    : mat(0xA8C49A),
  gambaBlu  : mat(0x2b5cae),
  portaSec  : mat(0xE4E2DC),   /* chiare: le rosse sono della Primaria     */
  portaPrim : mat(0xD8443A),
  senape    : mat(0xD8A83C),
  gres      : mat(0x7E7A75),
  inox      : new THREE.MeshPhongMaterial({color:0xc6cad0,shininess:110,specular:0xffffff}),
  travert   : mat(0xE8E2D4),
  scuro     : mat(0x4E5155),
  arancioF  : mat(0xE8862A),
  bianco    : mat(0xF6F4EE)
};

/* ====================== i pezzi del corridoio ===========================
   tre primitive, usate da tutti e tre i bracci: e' la ragione per cui qui
   una correzione vale per tutto il corridoio e non per un terzo. */

/* pavimento + solaio sotto + controsoffitto a quota +3,00 */
function calpestio(x0,x1,z0,z1,q,mpav){
  const w=x1-x0, d=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  pianoP(piano1,w,d, mpav || mat(0xffffff,{map:texGres(w,d)}), cx,q,cz);
  boxP(piano1,w,0.34,d,M.solaio,cx,q-0.18,cz,false);
  pianoP(piano1,w,d,mat(0xffffff,{map:texQuadrotti(w,d)}),cx,q+3.00,cz,Math.PI/2);
}
/* parete piena su un lato lungo: mai in mezzo al passaggio */
function parete(x0,x1,z0,z1,q,m){
  const w=(x1-x0)||0.16, d=(z1-z0)||0.16;
  boxP(piano1,w,3.00,d,m,(x0+x1)/2,q+1.50,(z0+z1)/2,false);
}
/* fronte vetrato CHIUSO: parapetto, lastra, montanti, traverso.
   Un montante senza lastra non e' una finestra: e' un colonnato, ed e'
   cosi' che il corridoio si leggeva come un ballatoio esterno. */
function vetrata(x0,x1,z0,z1,q,telaio){
  /* IMG_4878 — LA VETRATA HA DUE REGISTRI, non uno:
       - in alto i battenti GRANDI, che prendono i due terzi dell'altezza,
       - in basso una fascia PIU' BASSA, l'ultimo terzo,
     separate da un TRAVERSO robusto, con i montanti che continuano su tutti
     e due i registri. Telai GRIGIO CHIARO, vetro trasparente.
     Avevo invertito le proporzioni — battenti bassi sopra e alti sotto — e
     scurito i telai, che invece sono chiari. */
  const dx=x1-x0, dz=z1-z0, L=dx||dz, lungoX=!!dx;
  const HTOT=3.00-0.90-0.30;                 /* dal parapetto al traverso alto */
  const HALT=HTOT*0.62, HBAS=HTOT-HALT;      /* i battenti alti sono i piu' grandi */
  const yBas=q+0.90+HBAS/2, yAlt=q+0.90+HBAS+HALT/2, yTrav=q+0.90+HBAS;
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  /* parapetto sotto e fascia piena sopra */
  boxP(piano1,dx||0.16,0.90,dz||0.16,M.muroSec,cx,q+0.45,cz,false);
  boxP(piano1,dx||0.16,0.30,dz||0.16,M.muroSec,cx,q+3.00-0.15,cz,false);
  /* le due lastre */
  [[HBAS,yBas],[HALT,yAlt]].forEach(r=>{
    const l=new THREE.Mesh(new THREE.PlaneGeometry(L,r[0]),M.vetro);
    l.rotation.y = lungoX?0:Math.PI/2;
    l.position.set(cx,r[1],cz); piano1.add(l);
  });
  /* montanti: passo ~1,5 m, su tutta l'altezza */
  const n=Math.max(2,Math.round(L/1.5));
  for(let i=0;i<=n;i++){
    const t=i/n;
    boxP(piano1,lungoX?0.10:0.15,HTOT,lungoX?0.15:0.10,telaio,
        x0+(x1-x0)*t, q+0.90+HTOT/2, z0+(z1-z0)*t, false);
  }
  /* montanti intermedi del solo registro BASSO: nella foto la fascia bassa
     e' divisa in ante piu' strette di quelle grandi che stanno sopra */
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n;
    boxP(piano1,lungoX?0.05:0.06,HBAS,lungoX?0.06:0.05,telaio,
        x0+(x1-x0)*t, yBas, z0+(z1-z0)*t, false);
  }
  /* il traverso, robusto */
  boxP(piano1,dx||0.17,0.13,dz||0.17,telaio,cx,yTrav,cz,false);
  /* davanzale interno */
  boxP(piano1,dx||0.20,0.06,dz||0.20,M.bianco,cx,q+0.92,cz,false);
}
/* asta portalavori: 4868 ne mostra UNA sola, a 1,40 */
function asta(len,x,y,z,ry){
  const o=boxP(piano1,len,0.05,0.03,M.legno,x,y,z,false);
  if(ry) o.rotation.y=ry; return o;
}
/* plafoniera incassata nel controsoffitto */
function plafone(x,z,q,ry){
  const o=boxP(piano1,1.25,0.05,0.22,M.bianco,x,q-0.03,z,false);
  if(ry) o.rotation.y=ry; return o;
}
/* ============================ IL CORRIDOIO ============================== */
(function corridoio(){

  /* ---- BRACCIO NORD ----------------------------------------------------
     LE DUE SVOLTE SONO PASSAGGI APERTI (Andrea, sull'assonometria): agli
     angoli non c'e' NIENTE, il pavimento e' continuo e si gira senza
     incontrare nulla. Il fronte sulla corte percio' NON corre per tutta la
     lunghezza: si ferma agli imbocchi dei due bracci, da OX1 a EX0.
     Prima la vetrata andava da -61,8 a +15,0 e tappava tutti e due gli
     innesti — e il collaudo non se ne accorgeva perche' camminava i tre
     bracci separatamente, senza mai passare da un angolo. */
  /* IL PAVIMENTO CAMBIA A META' DEL CORRIDOIO LUNGO, sul filo della
     ringhiera del vano scala (Andrea): a ovest gli SCACCHI della zona
     uffici e della Primaria, a est il GRES della Secondaria.
     La mezzeria fra -61,80 e +15,00 e' x = -23,40. */
  /* IL PAVIMENTO DEL BRACCIO NORD, in pezzi che AGGIRANO il vano scala:
     nel vuoto non ci va solaio, si deve vedere giu' fino al piano terra.
     Prima qui c'erano due calpestii a tutta lunghezza che lo tappavano, e
     il codice che avrebbe dovuto sostituirli non era mai stato scritto —
     c'era solo il commento che lo annunciava. Verificato coi raggi: ora
     dentro il vano il primo ostacolo sono i gradini, non il pavimento. */
  (function pavimentoNord(){
    const sc=(w,d)=>mat(0xffffff,{map:texScacchi(w,d)});
    const vx0=XMEZZ-3.0, vx1=XMEZZ+3.0, vz0=NZ0+1.65, vz1=NZ0+3.25;
    const sx0=XMEZZ-10.4, sx1=XMEZZ-5.2, sz0=NZ1-2.00, sz1=NZ1;
    calpestio(X0,sx0,NZ0,NZ1,PAV, sc(sx0-X0,NZ1-NZ0));        /* a ovest    */
    calpestio(sx0,sx1,NZ0,sz0,PAV, sc(sx1-sx0,sz0-NZ0));      /* lato aule  */
    calpestio(sx1,vx0,NZ0,NZ1,PAV, sc(vx0-sx1,NZ1-NZ0));      /* fino al vano */
    calpestio(vx0,vx1,NZ0,vz0,PAV, sc(vx1-vx0,vz0-NZ0));      /* lato aule  */
    calpestio(vx0,vx1,vz1,NZ1,PAV, sc(vx1-vx0,NZ1-vz1));      /* lato finestre */
    /* la mezzeria (-23,40) cade DENTRO il vano (-26,4 .. -20,4): il pezzo
       "fino alla mezzeria" andava quindi da -20,4 a -23,4, cioe' all'indietro,
       e ricopriva meta' del vuoto. A est del vano c'e' solo il gres. */
    calpestio(vx1,X1,NZ0,NZ1,PAV);                            /* gres, Secondaria */
  })();
  /* 4931/4932: alla ringhiera cambia anche il SOFFITTO — a ovest fasce
     colorate (celeste, salmone, giallo), a est i quadrotti bianchi di
     IMG_4868. Il controsoffitto lo posa gia' calpestio(): qui sopra ci
     vanno le fasce, appena sotto. */
  for(let i=0;i<22;i++){
    const xx=X0+(i+0.5)*(XMEZZ-X0)/22;
    pianoP(piano1,(XMEZZ-X0)/22,NZ1-NZ0,
      mat([0x8FC4D8,0xE8A48A,0xE8C84A,0xF2F0EA][i%4]),
      xx,PAV+3.00-0.015,(NZ0+NZ1)/2,Math.PI/2);
  }

  parete (X0,X1,NZ0,NZ0,PAV,M.muroSec);            /* verso le aule        */
  /* TESTATA EST del braccio nord: mancava, e oltre la gradinata si vedeva
     il prato esterno. */
  parete (X1,X1,NZ0,NZ1,PAV,M.muroSec);
  vetrata(OX1,EX0,NZ1,NZ1,PAV,M.telaioChi);        /* sulla corte, fra gli angoli */
  asta(X1-X0-1.0,(X0+X1)/2,PAV+1.40,NZ0+0.09,0);
  for(let i=0;i<13;i++) plafone(X0+3+i*6.0,(NZ0+NZ1)/2,SOF,0);

  /* ---- BRACCIO OVEST, la Primaria -------------------------------------- */
  const w=OX1-OX0, d=OZ1-NZ1, cx=(OX0+OX1)/2, cz=(NZ1+OZ1)/2;
  pianoP(piano1,w,d,mat(0xffffff,{map:texScacchi(w,d)}),cx,PAV,cz);
  boxP(piano1,w,0.34,d,M.solaio,cx,PAV-0.18,cz,false);
  pianoP(piano1,w,d,mat(0xffffff,{map:texQuadrotti(w,d)}),cx,SOF,cz,Math.PI/2);
  parete (OX0,OX0,NZ1,OZ1,PAV,M.muroPrim);         /* verso le aule        */
  vetrata(OX1,OX1,NZ1,OZ1,PAV,M.telaioScu);        /* sulla corte          */
  asta(OZ1-NZ1-1.0,OX0+0.09,PAV+1.40,cz,Math.PI/2);
  for(let i=0;i<5;i++) plafone(cx,NZ1+3+i*5.0,SOF,Math.PI/2);

  /* ---- BRACCIO EST, la Secondaria --------------------------------------
     due tratti a quote diverse, separati dalla gradinata nell'angolo. */
  /* i due tratti si SOVRAPPONGONO nella fascia della gradinata (z 1,8 · 4,2):
     la transizione e' obliqua, quindi un taglio netto lascerebbe scoperto un
     triangolo. Il piano alto sta sopra e la gradinata copre il giunto. */
  calpestio(EX0,EX1,NZ1,4.20,PAV);
  calpestio(EX0,EX1,1.80,EZ1,PAV+SALTO);
  parete (EX1,EX1,NZ1,EZ1,PAV+SALTO/2,M.muroSec);
  vetrata(EX0,EX0,NZ1,EZ1,PAV+SALTO/2,M.telaioChi);
  /* TESTATA SUD del braccio est: mancava, e in fondo si vedeva il prato. */
  parete(EX0,EX1,EZ1,EZ1,PAV+SALTO,M.muroSec);
  asta(EZ1-NZ1-1.0,EX1-0.09,PAV+1.40+SALTO/2,(NZ1+EZ1)/2,Math.PI/2);
  for(let i=0;i<6;i++) plafone((EX0+EX1)/2,NZ1+4+i*5.0,SOF+SALTO,Math.PI/2);
})();

/* ===== LA GRADINATA: tre alzate, obliqua a 30 gradi, nell'angolo NE ===== */
(function gradinata(){
  /* LA GRADINATA E' UN DISLIVELLO SCAVATO, NON TRE TRAVI APPOGGIATE.
     Prima ogni gradino era un box: aveva quattro fianchi liberi e le
     testate restavano sospese sopra il pavimento invece di morire dentro
     le pareti — nella foto reale il gradino non ha fianchi, e' il pavimento
     stesso che sale.
     Qui ogni gradino e' il POLIGONO dell'area oltre la sua retta,
     ritagliato sui fili del corridoio ed estruso in altezza: tocca le due
     pareti per costruzione e non puo' restare a mezz'aria.
     Tre rette parallele a 45 gradi, distanti una pedata: due rette
     z = x - C1 e z = x - C2 distano |dC|/radice2, quindi dC = ped*radice2.
     Il gradino piu' alto sta su CGRAD, la stessa retta da cui parte il
     pavimento rialzato. */
  /* PEDATE LARGHE: 0,95 m, non 0,42. Nella foto e nel confronto di Andrea i
     tre gradini sono ampi e comodi, occupano tutta la svolta — non tre
     scalini stretti al centro del corridoio. */
  const N=3, alz=SALTO/N, ped=0.95;
  for(let i=0;i<N;i++){
    const h=alz*(i+1);
    const Ki=KGRAD-(N-1-i)*ped*Math.SQRT2;   /* rette parallele, verso opposto */
    /* la shape sta nel piano XY e diventa XZ con rotation.x = -PI/2:
       la y della shape e' quindi -z del piano1. */
    const sh=new THREE.Shape();
    sh.moveTo(EX0, -(Ki-EX0));
    sh.lineTo(EX1, -(Ki-EX1));
    sh.lineTo(EX1, -EZ1);
    sh.lineTo(EX0, -EZ1);
    sh.closePath();
    const geo=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});
    const m=new THREE.Mesh(geo,M.gres);
    m.rotation.x=-Math.PI/2; m.position.y=PAV;
    m.castShadow=true; m.receiveShadow=true; piano1.add(m);
    /* il naso: una riga chiara a filo dello spigolo, non un listello */
    /* NIENTE NASI (Andrea): erano box ruotati attorno al proprio centro,
       mentre il gradino e' un poligono ritagliato sui muri — due forme che
       non combaciano, e le righe chiare proseguivano oltre lo spigolo sul
       pavimento basso. Lo spigolo del gradino si legge gia' da solo. */
  }
  contattoP(piano1,(EX0+EX1)/2,PAV,zSoglia((EX0+EX1)/2)-0.7,EX1-EX0+1.0,3.6);
})();

/* ================= LA SCALA DELLE TABELLINE (IMG_4982) ==================
   Dodici pedate a passo 0,30 fra X -51,9 e -55,5, larghe 2,40 su z=+3,5:
   sta sul FILO EST del braccio ovest e i gradini salgono LUNGO X. Sulle
   prime dieci alzate c'e' la tavola pitagorica a quadretti colorati. */
function texAlzata(n){
  const c=tela(512,64), g=c.getContext('2d');
  g.fillStyle='#f2efe8'; g.fillRect(0,0,512,64);
  const pal=['#2f6fb5','#3fa02a','#d8a02a','#c0453a','#7a5aa8',
             '#2f9a8f','#d2691e','#4a7fc1','#6aa03a','#b8434f'];
  for(let i=0;i<10;i++){
    g.fillStyle=pal[i];
    g.fillRect(6+i*50,7,44,50);
    g.fillStyle='#fff';
    g.font='bold 26px Helvetica, Arial'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(String(n*(i+1)), 6+i*50+22, 33);
  }
  return textura(c,false);
}
(function tabelline(){
  /* LA SCALA STA NEL BRACCIO NORD — "il lungo corridoio" — APPOGGIATA AL
     LATO FINESTRE (Andrea). Non va ruotata: i gradini salgono lungo X, come
     li disegna il rilievo, e la rampa scivola dentro il corridoio lungo.
     Tre tentativi sbagliati prima di questo, tutti trovati dal collaudo:
       - con le sole coordinate del rilievo (X -55,5 … -51,9) cadeva oltre
         il filo est del braccio OVEST, sospesa nella corte;
       - portata dentro il braccio ovest lo tagliava di traverso (10 punti
         bloccati), perche' quel braccio corre nord-sud;
       - girata di 90 gradi e addossata alla parete ovest era nel posto
         sbagliato: il corridoio giusto e' un altro.
     Qui e' larga 2,40 in Z contro il fronte vetrato (z da -2,90 a -0,50) e
     sale lungo X per 3,60 m. Restano 2,5 m di passaggio lungo la parete
     delle aule, sui 4,90 del braccio. */
  const nNum=10, nTot=12, alz=0.19, ped=0.30, W=2.4;
  const zC=NZ1-W/2, xIn=-50.0, xFin=xIn-ped*nTot;   /* -1,70 · da -50,0 a -53,6 */
  /* rivestimento antracite sul fianco, verso il fronte vetrato */
  boxP(piano1,ped*nTot+0.6,3.00,0.10,M.scuro,(xIn+xFin)/2,PAV+1.50,NZ1-0.10,false);
  /* pedana di partenza */
  boxP(piano1,1.5,0.16,W+0.3,M.travert,xIn+0.55,PAV+0.08,zC,true);
  for(let i=0;i<nTot;i++){
    const xx=xIn-ped*i, yy=PAV+0.16+alz*i;
    boxP(piano1,ped,alz,W,M.travert,xx-ped/2,yy+alz/2,zC,true);
    if(i<nNum){
      const a=new THREE.Mesh(new THREE.PlaneGeometry(W,alz),
        mat(0xffffff,{map:texAlzata(i+1)}));
      a.rotation.y=Math.PI/2; a.position.set(xx+0.004,yy+alz/2,zC); piano1.add(a);
    }
  }
  /* in cima la parete arancio con la scritta */
  boxP(piano1,0.18,3.00,W+0.2,M.arancioF,xFin-0.09,PAV+1.50,zC,false);
  /* corrimano inox sul fianco murato, in due tratti */
  const ang=Math.atan2(alz,ped);
  [[0,6],[6,nTot]].forEach(s=>{
    const Lr=ped*(s[1]-s[0]), xm=xIn-ped*(s[0]+s[1])/2;
    const c=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,Lr+0.4,10),M.inox);
    c.rotation.z=Math.PI/2+ang;
    c.position.set(xm,PAV+0.16+alz*(s[0]+s[1])/2+0.95,zC+W/2-0.12); piano1.add(c);
  });
  /* IL SOTTOSCALA E' PIENO, non vuoto (Andrea): sotto la rampa c'e' un
     volume chiuso, non un vano in cui si vede dentro. Un cuneo che segue
     la pendenza, fatto a gradoni come i gradini che lo coprono. */
  for(let i=0;i<nTot;i++){
    const xx=xIn-ped*i, h=PAV+0.16+alz*i;
    boxP(piano1,ped,h-0.02,W,M.travert,xx-ped/2,(h-0.02)/2,zC,false);
  }
  /* colonna tonda sul filo libero, verso la parete delle aule */
  const col=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,3.00,12),M.inox);
  col.position.set(xIn-0.15,PAV+1.50,zC-W/2-0.25); piano1.add(col);
  contattoP(piano1,(xIn+xFin)/2,PAV,zC,ped*nTot+1.5,W+1.4);
})();

/* =============== IL VANO SCALA E IL TRATTO DEGLI UFFICI =================
   4859/4860/4870/4871/4901/4902 — la RINGHIERA BLU-GRIGIA non recinta una
   corte: delimita la SCALA CHE SCENDE AL PIANO TERRA, sta ESATTAMENTE A
   META' DEL CORRIDOIO LUNGO e segna anche il cambio delle piastrelle
   (Andrea). Mezzeria fra -61,80 e +15,00: x = -23,40.
   GLI UFFICI NON SI RICOSTRUISCONO: stanno dietro una porta che affaccia
   dove c'e' il tavolo di legno, fra il vano scale e la corte vuota. Qui c'e'
   solo lo SPAZIO DEL CORRIDOIO davanti a loro.
   Avevo costruito un ballatoio a doppia altezza in una stanza a nord: erano
   sbagliati il posto, la cosa e il fatto stesso di costruirla. */
(function vanoScala(){
  const g=new THREE.Group(); piano1.add(g);
  const vx0=XMEZZ-3.0, vx1=XMEZZ+3.0;        /* 6 m di vano, sulla mezzeria */
  /* IL BALLATOIO E' CENTRALE, CON DUE PASSAGGI AI LATI (Andrea, dalle
     fotografie): il vuoto sta in mezzo alla larghezza del corridoio e ci si
     cammina da tutte e due le parti — in 4931 si vede il ballatoio opposto
     oltre la ringhiera. L'avevo addossato alla parete delle aule, lasciando
     un solo passaggio.
     Vano largo 1,60 sulla mezzeria (-2,95): restano 1,65 m per lato. */
  const vz0=NZ0+1.65, vz1=NZ0+3.25;
  const blu=mat(0x5A6E86);

  /* il buco nel solaio: si scende al piano terra */
  /* il piano terra che si vede in fondo al vuoto. NIENTE SOLAIO qui: era
     rimasto anche quello, e tappava il buco da sotto. */
  pianoP(g,vx1-vx0,vz1-vz0,mat(0xBFB9AE),(vx0+vx1)/2,0.0,(vz0+vz1)/2);
  /* NIENTE RAMPA QUI: il ballatoio e' un vuoto affacciato, e basta. La
     scala che scende sta FRA IL BALLATOIO E LE TABELLINE, appoggiata al
     vetrocemento — me l'aveva detto Andrea, e quando gli ho chiesto se
     scala e vetrocemento fossero lo stesso vano confermava QUELLO, non che
     la scala stesse qui dentro. */
  /* RINGHIERA su tre lati: il quarto e' la parete delle aule */
  function tratto(ax0,ax1,az0,az1){
    const dx=ax1-ax0, dz=az1-az0, L=Math.hypot(dx,dz), n=Math.round(L/0.12);
    for(let i=0;i<=n;i++){ const t=i/n;
      boxP(g,0.025,1.00,0.025,blu,ax0+dx*t,PAV+0.50,az0+dz*t,false); }
    boxP(g,dx||0.05,0.05,dz||0.05,blu,(ax0+ax1)/2,PAV+0.06,(az0+az1)/2,false);
    const cm=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,L,10),M.inox);
    cm.rotation.z=Math.PI/2; if(dz) cm.rotation.y=Math.PI/2;
    cm.position.set((ax0+ax1)/2,PAV+1.02,(az0+az1)/2); g.add(cm);
  }
  /* ringhiera su TUTTI E QUATTRO i lati: il vuoto e' centrale */
  tratto(vx0,vx1,vz0,vz0); tratto(vx0,vx1,vz1,vz1);
  tratto(vx0,vx0,vz0,vz1); tratto(vx1,vx1,vz0,vz1);
  /* colonne d'acciaio tonde ai due capi */
  [[vx0,vz0],[vx1,vz0],[vx0,vz1],[vx1,vz1]].forEach(q=>{
    const c=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,3.00,14),M.inox);
    c.position.set(q[0],PAV+1.50,q[1]); c.castShadow=true; g.add(c);
  });
  /* IL TAVOLONE di legno scuro, accanto alla ringhiera */
  (function tavolone(x,z){
    boxP(g,3.6,0.09,0.95,mat(0x6B4A2E),x,PAV+0.76,z,true);
    [[-1.6,-0.38],[1.6,-0.38],[-1.6,0.38],[1.6,0.38]].forEach(q=>
      boxP(g,0.09,0.76,0.09,mat(0x5A3E26),x+q[0],PAV+0.38,z+q[1],false));
    /* sedie solo alle TESTATE: sul lato corridoio ruberebbero il passaggio */
    [-2.25,2.25].forEach(o=>{
      boxP(g,0.42,0.05,0.44,mat(0x4E3623),x+o,PAV+0.46,z,true);
      boxP(g,0.05,0.44,0.44,mat(0x4E3623),x+o+(o>0?0.2:-0.2),PAV+0.70,z,true); });
    contattoP(g,x,PAV,z,5.2,1.8);
  })(XMEZZ+5.6, (vz0+vz1)/2);   /* oltre la TESTATA del vano, in asse */
  /* ===== LA SCALA CHE SCENDE AL PIANO TERRA ==========================
     In primopiano3d sta FRA IL BALLATOIO E LA SCALA DELLE TABELLINE, cioe'
     nel tratto ovest del braccio nord. Non e' la rampa dentro il vuoto:
     quella e' il vano; questa e' la scala vera, addossata alla parete delle
     aule, che porta giu' al piano terra. Ne avevamo gia' parlato e non
     l'avevo costruita. */
  /* --- quello che 4931/4932 mostrano in questo tratto ------------------ */
  /* CARTELLO BLU A BANDIERA con le tre frecce: Primaria · Direzione · Secondaria */
  (function cartello(x,z){
    const c=tela(256,128), gg=c.getContext('2d');
    gg.fillStyle='#1F4E9C'; gg.fillRect(0,0,256,128);
    gg.fillStyle='#fff'; gg.font='bold 21px Helvetica'; gg.textBaseline='middle';
    [['Primaria','\u2190',30],['Direzione','\u2192',64],['Secondaria','\u2192',98]].forEach(q=>{
      gg.textAlign='left';  gg.fillText(q[0],14,q[2]);
      gg.textAlign='right'; gg.fillText(q[1],240,q[2]);
    });
    const m=new THREE.Mesh(new THREE.PlaneGeometry(1.30,0.65),
      mat(0xffffff,{map:textura(c,false)}));
    m.rotation.y=Math.PI/2; m.position.set(x,PAV+2.25,z); g.add(m);
    const br=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.5,8),M.inox);
    br.rotation.z=Math.PI/2; br.position.set(x-0.25,PAV+2.55,z); g.add(br);
  })(XMEZZ-11.5, NZ0+0.9);
  /* ===== LA SCALA CHE SCENDE AL PIANO TERRA ==========================
     FRA IL BALLATOIO E LA SCALA DELLE TABELLINE, appoggiata al VETROCEMENTO
     (Andrea). Si scende verso EST, come sulle tabelline, e scendendo si ha
     il vetrocemento SULLA DESTRA: quindi il muro di vetromattoni e' il lato
     SUD di questo vano. Il solaio qui e' bucato: la rampa affiora. */
  (function scendeAlPT(){
    const sx0=XMEZZ-10.4, sx1=XMEZZ-5.2;          /* il vano, 5,2 m        */
    /* APPOGGIATA ALLA PARETE SUD (Andrea), non al lato aule: il
       vetrocemento e' quella parete, ed e' per questo che scendendo verso
       est lo si ha sulla destra. */
    const sz0=NZ1-2.00,  sz1=NZ1;
    const nn=16, alz=PAV/nn, ped=(sx1-sx0-0.7)/nn, WR=sz1-sz0-0.30;
    /* il piano terra in fondo al vuoto */
    pianoP(g,sx1-sx0,sz1-sz0,mat(0xBFB9AE),(sx0+sx1)/2,0.0,(sz0+sz1)/2);
    const PAROLE=['Buona Scuola','Gestione','Creativita\u0300','Impegno',
                  'Attitudini','Lavori in corso','Partecipazione','Comunicazione',
                  'Life Skills','Ascolto','Rispetto','Fiducia','Coraggio','Cura',
                  'Silenzio','Accoglienza'];
    for(let i=0;i<nn;i++){
      const xx=sx0+0.35+ped*i, yy=PAV-alz*(i+1);
      boxP(g,ped,0.16,WR,mat(0xE0D8C6),xx,yy+0.08,(sz0+sz1)/2,true);
      const c=tela(512,64), gg=c.getContext('2d');
      gg.fillStyle='#EFEBE2'; gg.fillRect(0,0,512,64);
      gg.fillStyle='#2B5CAE'; gg.font='500 30px Helvetica, Arial';
      gg.textAlign='left'; gg.textBaseline='middle';
      gg.fillText(PAROLE[i],18,34);
      const a=new THREE.Mesh(new THREE.PlaneGeometry(WR,alz),
        mat(0xffffff,{map:textura(c,false)}));
      a.rotation.y=Math.PI/2;
      a.position.set(xx-ped/2-0.004,yy+alz/2,(sz0+sz1)/2); g.add(a);
    }
    /* IL VETROCEMENTO: lato SUD del vano, cioe' a destra di chi scende */
    (function vetrocemento(x,z){
      const bl=new THREE.MeshPhongMaterial({color:0xD8E6EC,transparent:true,
        opacity:0.55,shininess:60,specular:0xffffff});
      const n=Math.round((sx1-sx0)/0.33);
      for(let i=0;i<n;i++) for(let j=0;j<8;j++)
        boxP(g,0.30,0.30,0.10,bl,sx0+0.16+i*0.33,PAV+0.30+j*0.33,z,false);
    })(0,sz1+0.06);
    /* RINGHIERA blu, uguale a quella del ballatoio, sui lati aperti */
    const blu4=mat(0x5A6E86);
    function ring2(ax0,ax1,az0,az1){
      const dx=ax1-ax0, dz=az1-az0, L=Math.hypot(dx,dz), n=Math.round(L/0.12);
      for(let i=0;i<=n;i++){ const t=i/n;
        boxP(g,0.025,1.00,0.025,blu4,ax0+dx*t,PAV+0.50,az0+dz*t,false); }
      boxP(g,dx||0.05,0.05,dz||0.05,blu4,(ax0+ax1)/2,PAV+0.06,(az0+az1)/2,false);
      const cm=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,L,10),M.inox);
      cm.rotation.z=Math.PI/2; if(dz) cm.rotation.y=Math.PI/2;
      cm.position.set((ax0+ax1)/2,PAV+1.02,(az0+az1)/2); g.add(cm);
    }
    /* ringhiera solo sul lato NORD (verso il corridoio) e sulla testata
       EST: a ovest c'e' il PRIMO GRADINO, da li' si entra e la ringhiera
       non ci va. */
    ring2(sx0,sx1,sz0,sz0); ring2(sx1,sx1,sz0,sz1);
  })();

  /* PANCHINA in legno contro la parete */
  (function panchina(x,z){
    for(let i=0;i<4;i++) boxP(g,1.80,0.06,0.12,M.legno,x,PAV+0.44,z+i*0.15,true);
    [-0.78,0.78].forEach(o=>boxP(g,0.08,0.44,0.44,mat(0x6E6A64),x+o,PAV+0.22,z+0.22,false));
    contattoP(g,x,PAV,z+0.2,2.2,1.0);
  })(XMEZZ-13.5, NZ0+0.45);
  /* LA PORTA DEGLI UFFICI, davanti al tavolone: quello che c'e' dietro non
     si costruisce. */
  /* LA PORTA DEGLI UFFICI (terza foto): non e' una porta chiara come quelle
     delle aule — e' un serramento in LEGNO SCURO con i VETRI, a doppio
     battente, dentro un vano con lo stipite scuro e il sopraluce. */
  (function portaUffici(x,z){
    const scuro=mat(0x4A3526), telaio=mat(0x3E2C1E);
    const vetro=new THREE.MeshPhongMaterial({color:0xBFCBD2,transparent:true,
      opacity:0.34,shininess:90,specular:0xffffff,side:THREE.DoubleSide,
      depthWrite:false});
    /* mazzetta del vano, scura, che incornicia tutto */
    boxP(g,2.60,0.14,0.30,telaio,x,PAV+2.62,z,false);           /* architrave */
    [-1.23,1.23].forEach(o=>boxP(g,0.14,2.62,0.30,telaio,x+o,PAV+1.31,z,false));
    /* i due battenti: montanti scuri e specchiature vetrate */
    [-0.58,0.58].forEach(o=>{
      boxP(g,1.10,0.06,0.05,scuro,x+o,PAV+0.18,z,true);         /* zoccolo    */
      boxP(g,1.10,0.08,0.05,scuro,x+o,PAV+2.12,z,true);         /* traverso   */
      [-0.52,0.52].forEach(m2=>boxP(g,0.07,2.10,0.05,scuro,x+o+m2,PAV+1.10,z,true));
      const v=new THREE.Mesh(new THREE.PlaneGeometry(0.98,1.86),vetro);
      v.position.set(x+o,PAV+1.15,z+0.01); g.add(v);
      /* i due traversi intermedi che dividono il vetro in tre */
      [0.72,1.52].forEach(y=>boxP(g,1.02,0.05,0.045,scuro,x+o,PAV+y,z,false));
    });
    /* sopraluce sopra i battenti */
    const sl=new THREE.Mesh(new THREE.PlaneGeometry(2.30,0.34),vetro);
    sl.position.set(x,PAV+2.36,z+0.01); g.add(sl);
    /* maniglioni verticali inox */
    [-0.10,0.10].forEach(o=>{
      const mn=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.62,8),M.inox);
      mn.position.set(x+o,PAV+1.06,z+0.05); g.add(mn);
    });
  })(XMEZZ, NZ0+0.08);
})();

/* ============== quello che sta NEL corridoio, contro la parete ==========
   4874/4884/4899: le due file di tavoli stanno fra 0,05 e 1,65 m dalla
   parete nord, e davanti restano 3,25 m di passaggio netto sui 4,90. */
function tavolo(x,z,q){
  const g=new THREE.Group(); g.position.set(x,0,z); piano1.add(g);
  boxP(g,2.2,0.05,0.8,M.salvia,0,q+0.74,0,true);
  [[-1.0,-0.34],[1.0,-0.34],[-1.0,0.34],[1.0,0.34]].forEach(p=>
    boxP(g,0.05,0.74,0.05,M.gambaBlu,p[0],q+0.37,p[1],false));
  contattoP(g,0,q,0,2.6,1.2);
}
function sedia(x,z,ry,q){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry||0; piano1.add(g);
  boxP(g,0.44,0.04,0.42,M.legno,0,q+0.45,0,true);
  boxP(g,0.44,0.42,0.05,M.legno,0,q+0.68,-0.19,true);
  [[-0.18,-0.18],[0.18,-0.18],[-0.18,0.18],[0.18,0.18]].forEach(p=>
    boxP(g,0.03,0.45,0.03,M.inox,p[0],q+0.22,p[1],false));
}
function kallax(x,z,q){
  boxP(piano1,0.78,0.78,0.40,M.bianco,x,q+0.39,z,true);
  boxP(piano1,0.72,0.03,0.36,mat(0xD8D6D0),x,q+0.39,z,false);
  boxP(piano1,0.03,0.72,0.36,mat(0xD8D6D0),x,q+0.39,z,false);
  contattoP(piano1,x,q,z,1.1,0.7);
}
(function arredi(){
  /* i tavoli verde salvia stanno SOLO nel tratto della Secondaria, cioe' a
     est della mezzeria: nella zona uffici le foto mostrano il tavolone di
     legno scuro e la panchina, non questi. Ce n'era uno a x=-26 che tappava
     il passaggio sul lato aule del ballatoio. */
  [-15,-10,-5,0,5,10].forEach(x=>{
    tavolo(x,NZ0+0.45,PAV); tavolo(x,NZ0+1.25,PAV);

  /* NIENTE PANNELLI ARANCIONE: il muro del corridoio e' TUTTO BIANCO
     (Andrea). Le campiture senape che avevo dedotto da 4884/4899 non
     esistono — erano gia' state, in una versione precedente, le "mezze
     pareti trasversali" che ho dovuto togliere. Stessa invenzione, forma
     diversa. */
})();

/* ---- le porte, a filo muro: chiare nella Secondaria, rosse nella Primaria */
function porta(x,y,z,ry,m){
  const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry||0; piano1.add(g);
  boxP(g,0.95,2.15,0.05,m,0,1.075,0,true);
  boxP(g,1.05,2.25,0.03,mat(0xdcd9d2),0,1.12,-0.02,false);
  const mn=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.13,8),M.inox);
  mn.rotation.z=Math.PI/2; mn.position.set(0.36,1.06,0.05); g.add(mn);
}
/* ---- DOVE STANNO LE PORTE ----------------------------------------------
   Non stimate dai divisori: MISURATE sulla tavola. In pianta ogni porta
   lascia due tracce disegnate in BLU — il battente sul muro e l'arco di
   apertura — e cercandole per colore sul raster a 300 dpi si leggono a una
   a una. L'assonometria conferma il verso: si aprono VERSO IL CORRIDOIO e
   stanno addossate ai divisori, non al centro dell'aula.
   Erano quattro sul nord, piazzate a "divisorio + 3,20": fino a 1,63 m
   fuori posto. E sul braccio est non ce n'era nessuna. */
(function porte(){
  /* BRACCIO NORD — quattro aule, parete a z = -5,40 */
  [-13.78,-7.72,-0.59,6.69].forEach(x=>

/* ---- la cassetta: oggetto fisico, non pannello (regola di progetto) ---- */
const texCoperchio=(()=>{const c=mkCanvas(128,128),g=c.getContext('2d');
  g.fillStyle='#a9793f';g.fillRect(0,0,128,128);
  for(let i=0;i<5;i++){g.fillStyle=(i%2)?'#b5854a':'#9d6f38';g.fillRect(0,i*26,128,24);}
  g.strokeStyle='#6d4a22';g.lineWidth=3;g.strokeRect(3,3,122,122);
  g.fillStyle='#c9a227';g.beginPath();g.arc(64,64,21,0,Math.PI*2);g.fill();
  g.fillStyle='#7a5a12';g.font='bold 25px Lexend';g.textAlign='center';
  g.fillText('?',64,74);return tex(c,false);})();
/* ---- Coppa delle Case: il tesoro dell'ultima tappa ----
   Calice dorato su podio di pietra, con i quattro stemmi delle Case della
   Sacra Famiglia e quattro colonne di vetro riempite dei loro colori
   (Aquilablu, Querciaverde, Cerogiallo, Tassorosso). */
const texFascia=(()=>{const c=mkCanvas(1024,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#e8c86a');gr.addColorStop(.45,'#c9a03a');gr.addColorStop(1,'#9a7420');
  g.fillStyle=gr;g.fillRect(0,0,1024,256);
  g.fillStyle='rgba(255,244,206,.30)';g.fillRect(0,14,1024,10);
  g.fillStyle='rgba(90,64,10,.30)';g.fillRect(0,232,1024,12);
  [['#2b5aa8','AQUILABLU'],['#2e7a3a','QUERCIAVERDE'],
   ['#d8a828','CEROGIALLO'],['#a8302a','TASSOROSSO']].forEach((h,i)=>{
    const cx=128+i*256;
    g.fillStyle='#f2e6c2';
    g.beginPath();g.moveTo(cx-52,52);g.lineTo(cx+52,52);g.lineTo(cx+52,132);
    g.quadraticCurveTo(cx+52,186,cx,206);g.quadraticCurveTo(cx-52,186,cx-52,132);
    g.closePath();g.fill();
    g.fillStyle=h[0];
    g.beginPath();g.moveTo(cx-42,62);g.lineTo(cx+42,62);g.lineTo(cx+42,130);
    g.quadraticCurveTo(cx+42,176,cx,193);g.quadraticCurveTo(cx-42,176,cx-42,130);
    g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(cx,118,20,0,Math.PI*2);g.fill();
    g.fillStyle='#5a4410';g.font='bold 19px Lexend, sans-serif';g.textAlign='center';
    g.fillText(h[1],cx,40);});
  return tex(c,false);})();
function coppaDelleCase(){
  const g=new THREE.Group();
  const oro=new THREE.MeshPhongMaterial({color:0xd8ab3e,shininess:130,specular:0xfff2c8});
  const oroS=new THREE.MeshPhongMaterial({color:0xb0822a,shininess:100,specular:0xffe8a8});
  const pietra=lam(0xd2c8b0), pietraS=lam(0xbdb298);
  /* podio a due gradoni */
  box(g,3.4,0.30,1.7,pietraS,0,0.15,0,true);
  box(g,3.0,0.24,1.4,pietra,0,0.42,0,true);
  const targa=box(g,2.0,0.30,0.05,oro,0,0.20,0.87,false);
  targa.material=new THREE.MeshPhongMaterial({shininess:120,specular:0xfff2c8,
    map:(()=>{const c=mkCanvas(512,80),x=c.getContext('2d');
      x.fillStyle='#c9a03a';x.fillRect(0,0,512,80);
      x.fillStyle='#5a4410';x.font='bold 25px Lexend, sans-serif';x.textAlign='center';
      x.fillText('COPPA DELLE CASE',256,50);return tex(c,false);})()});
  /* calice: profilo a rivoluzione */
  const P=[[0.34,0],[0.36,0.05],[0.24,0.10],[0.11,0.16],[0.08,0.34],
           [0.15,0.42],[0.17,0.48],[0.12,0.55],[0.09,0.62],
           [0.20,0.70],[0.34,0.84],[0.43,1.04],[0.46,1.22],[0.455,1.28],[0.40,1.28]];
  const lat=new THREE.Mesh(new THREE.LatheGeometry(
    P.map(q=>new THREE.Vector2(q[0],q[1])),36),oro);
  lat.position.y=0.54;lat.castShadow=true;g.add(lat);
  /* fascia con i quattro stemmi attorno alla coppa */
  const fascia=new THREE.Mesh(new THREE.CylinderGeometry(0.455,0.40,0.42,40,1,true),
    new THREE.MeshPhongMaterial({map:texFascia,shininess:90,specular:0xfff0c0}));
  fascia.position.y=0.54+1.06;g.add(fascia);
  /* anse a voluta */
  [-1,1].forEach(sg=>{
    const an=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.032,8,20,Math.PI*1.25),oroS);
    an.position.set(sg*0.50,0.54+1.02,0);an.rotation.y=Math.PI/2;
    an.rotation.z=sg>0?-0.5:Math.PI+0.5;an.castShadow=true;g.add(an);});
  /* quattro colonne di vetro coi colori delle Case */
  const vetroT=new THREE.MeshPhongMaterial({color:0xdfeef6,transparent:true,opacity:0.34,
    shininess:170,specular:0xffffff,side:THREE.DoubleSide});
  [[-1.18,0x2b5aa8],[-0.78,0x2e7a3a],[0.78,0xd8a828],[1.18,0xa8302a]].forEach((q,i)=>{
    const x=q[0], h=0.95+((i===0||i===3)?0.16:0);
    box(g,0.34,0.30,0.34,pietra,x,0.69,0,true);
    const tu=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,h,16,1,true),vetroT);
    tu.position.set(x,0.84+h/2,0);g.add(tu);
    box(g,0.30,0.07,0.30,oroS,x,0.86,0,false);
    box(g,0.30,0.07,0.30,oroS,x,0.84+h,0,false);
    const rnd=seme(300+i*7);
    for(let k=0;k<16;k++){
      const gem=new THREE.Mesh(new THREE.IcosahedronGeometry(0.055,0),
        new THREE.MeshPhongMaterial({color:q[1],shininess:150,specular:0xffffff,
          transparent:true,opacity:0.9}));
      gem.position.set(x+(rnd()-0.5)*0.12, 0.92+k*(h-0.14)/16, (rnd()-0.5)*0.12);
      gem.rotation.set(rnd()*3,rnd()*3,rnd()*3);g.add(gem);}
  });
  return g;}
let cassetta=null, pulsa=0;
function creaCassetta(pos,ultima){
  if(cassetta){scene.remove(cassetta);cassetta=null;}
  if(ultima){                       /* il tesoro non e' una cassetta: e' la Coppa */
    const c=coppaDelleCase();
    /* LA COPPA E' A GRANDEZZA DI PIAZZA, ed e' nata cosi' quando stava in un
       atrio a doppia altezza: podio 3,40 x 1,70 e calice fino a 2,50. Sul
       tavolone del corridoio — largo 3,60, con il controsoffitto a 3,00 dal
       pavimento — sfondava il soffitto e straripava dal tavolo da tutti i
       lati. Ridotta a 0,55: 1,87 di podio su un tavolo da 3,60, e la punta
       del calice a 1,38 dal piano. */
    c.scale.setScalar(0.55);
    c.position.set(pos[0],pos[1],pos[2]);c.userData.bersaglio=true;
    scene.add(c);cassetta=c;
    contatto(scene,pos[0],pos[1]+0.006,pos[2],2.4,1.5,0.6);
    return c;}
  const g=new THREE.Group();
  const s=ultima?1.35:1.0;
  const corpo=new THREE.Mesh(geoSmussata(0.52*s,0.34*s,0.38*s,0.03),
    lam(ultima?0x8a5a26:0xa9793f));
  corpo.position.y=0.17*s;corpo.castShadow=true;g.add(corpo);
  const cop=new THREE.Mesh(new THREE.BoxGeometry(0.54*s,0.06*s,0.4*s),
    lam(0xffffff,{map:texCoperchio}));
  cop.position.y=0.37*s;cop.castShadow=true;g.add(cop);
  [[-0.26*s,0],[0.26*s,0]].forEach(q=>
    box(g,0.03*s,0.36*s,0.4*s,lam(0xc9a227),q[0],0.18*s,0,false));
  box(g,0.1*s,0.13*s,0.03*s,lam(0xc9a227),0,0.3*s,0.2*s,false);
  g.position.set(pos[0],pos[1],pos[2]);
  g.userData.bersaglio=true;
  scene.add(g);cassetta=g;
  contatto(scene,pos[0],pos[1]+0.006,pos[2],1.1*s,1.0*s,0.55);
  return g;}

/* ---- trovata la cassetta: si apre la DOMANDA sulla Fondatrice ----
   Regole volute da Andrea: UN SOLO aiuto per domanda, a scelta fra 50:50 e il
   suggerimento del religioso; una risposta sbagliata fa RICOMINCIARE il
   percorso da capo. Domande e opzioni sono mescolate a ogni partita.
   RIPARTI_DA_CAPO e' un parametro: mettendolo a false si riprende dalla tappa
   corrente invece che dalla prima (utile se in aula la regola risulta troppo
   dura per i piu' piccoli). */
const RIPARTI_DA_CAPO = true;
let mazzo=[], quesito=null, aiutoUsato=false;
function rimescolaMazzo(){
  mazzo = DOMANDE.map((q,i)=>i);
  for(let i=mazzo.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    const t=mazzo[i]; mazzo[i]=mazzo[j]; mazzo[j]=t; }
}
function pescaDomanda(){
  if(!mazzo.length) rimescolaMazzo();
  const q=DOMANDE[mazzo.pop()];
  const opz=[{t:q.r,ok:true}].concat(q.x.map(v=>({t:v,ok:false})));
  for(let i=opz.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
    const t=opz[i]; opz[i]=opz[j]; opz[j]=t; }
  return {q,opz};
}
function trovata(){
  if(cassetta){scene.remove(cassetta);cassetta=null;}
  quesito=pescaDomanda(); aiutoUsato=false;
  mostraDomanda();
}
function mostraDomanda(){
  const t=TAPPE[G.i], q=quesito.q;
  apriFoglio('<div class="occhiello">Tappa '+(G.i+1)+' di '+TAPPE.length+' · trovata</div>'
    +'<h1>'+t.titolo+'</h1>'
    +'<div class="imparato">'+t.imparato+'</div>'
    +'<p style="margin-bottom:4px"><strong>Per proseguire, rispondi sulla Fondatrice.</strong> '
    +'Hai <em>un solo aiuto</em>: se sbagli, il percorso ricomincia da capo.</p>'
    +'<div class="domanda">'+q.d+'</div>'
    +'<div class="opz" id="opz">'
    + quesito.opz.map((o,i)=>'<button id="op'+i+'" onclick="rispondi('+i+')">'+o.t+'</button>').join('')
    +'</div>'
    +'<div class="aiuti" id="aiuti">'
    +'<button id="a50" onclick="aiuto50()">Togli due risposte</button>'
    +'<button id="ars" onclick="aiutoReligioso()">Chiedi al religioso</button>'
    +'<button onclick="apriStoria()" style="color:#123E90;background:#eef3fc;'
    +'border-color:#c9d6ef">Leggi la storia</button>'
    +'</div><div id="suggerimento"></div>');
}

window.rispondi=function(i){

          ? 'Il percorso riparte dalla prima tappa. Le tappe le conosci già: '

          : 'Riprendi da questa stessa tappa: la domanda sarà un\'altra.')+'</p>'

  }};

/* ==========================================================================
   NAVIGAZIONE — quella di primopiano.html, estesa al campus
   --------------------------------------------------------------------------
   NON e' la navigazione di index. Quella lavorava su `camera`, `yaw`, `pitch`
   e `vel`, e trapiantarla e' esattamente l'errore che ha fatto fallire tre
   volte il travaso: si porta l'ambiente, non la finestra da cui lo si
   guardava. Qui restano `pos`, `giro`, `becco` e `quotaSotto` del primo
   piano; quello che cambia e' che quotaSotto adesso conosce anche il terreno,
   e che da fermi si puo' staccare i piedi da terra.

   DUE MODI, UN SOLO COMANDO
   - A PIEDI (partenza): si cammina sulla quota che sta sotto — il pavimento
     del corridoio se si e' dentro la U, il terreno se si e' fuori. Un passo
     che cambierebbe quota di piu' di 55 cm viene RIFIUTATO: e' cosi' che non
     si cade dal primo piano e non ci si arrampica sui muri. Il salto della
     gradinata (37 cm) invece si sale, come deve essere.
   - IN VOLO: si entra premendo "sali" e si esce toccando terra. Serve per
     raggiungere le tappe che stanno oltre i muri, che e' il modo di muoversi
     di chi gioca.
   Le collisioni sono quelle registrate con solido()/varco() dagli esterni:
   il corridoio del primo piano non ne registra nessuna, e resta libero
   com'era stato collaudato.
   ========================================================================== */

const ALTEZZA = 1.62;            /* altezza degli occhi                     */
const PASSO   = 3.4;             /* m/s a piedi                             */
let   velBase = 14;              /* m/s in volo, regolabile con la rotella   */
let   COLLISIONI_ATTIVE = true;

const pos = new THREE.Vector3();
let giro = 0, becco = 0, inVolo = false;

/* --- quale quota di calpestio sta sotto un punto? ----------------------
   Dentro la U del primo piano si cammina sul suo pavimento; il tratto est
   oltre la gradinata sta 37 cm piu' in alto, e la soglia e' LA STESSA retta
   con cui e' costruito il pavimento (zSoglia): se le due divergono, si
   cerca l'appoggio alla quota alta dove c'e' ancora quella bassa. Fuori
   dalla U si cammina per terra. */
function quotaSotto(x,z){
  const nord  = (x>X0  && x<X1  && z>NZ0  && z<NZ1);
  const ovest = (x>OX0 && x<OX1 && z>=NZ1 && z<OZ1);
  const est   = (x>EX0 && x<EX1 && z>=NZ1 && z<EZ1);
  if(est && z>zSoglia(x)) return PAV+SALTO;
  if(nord||ovest||est)    return PAV;
  return 0;
}
/* --- si passa? --------------------------------------------------------
   Le collisioni sono quelle del CAMPUS: le pareti registrate con solido()
   dagli esterni. DENTRO IL CORRIDOIO DEL PRIMO PIANO NON VALGONO, e non e'
   una scorciatoia: il guscio degli edifici contiene il corridoio per
   costruzione — corpo() posa un volume pieno — e il fronte dell'ala ovest
   passa proprio dove si cammina. Applicandole li' dentro il corridoio
   diventa impercorribile a meta' del braccio nord, cioe' esattamente il
   percorso che il collaudo geometrico certifica come libero. Dentro la U
   decide il collaudo del corridoio; fuori, i muri del campus. */
function passabile(p){
  if(!COLLISIONI_ATTIVE) return true;
  if(quotaSotto(p.x,p.z)>1) return true;
  return libero(p);
}

/* --- i luoghi della barra "Luoghi" ------------------------------------
   nomi come sulla mappa Campus_zone.png. Terzina: [nome, dove si sta,
   dove si guarda]. Le sei voci del primo piano stanno all'altezza degli
   occhi sul suo pavimento (3,42 + 1,62 = 5,04), cioe' ci si arriva A PIEDI:
   e' il modo giusto di visitare un corridoio. */
/* le mete a terra stanno all'ALTEZZA DEGLI OCCHI (1,62), non a tre o quattro
   metri: cosi' si atterra e si prosegue a piedi. Restano in quota solo le due
   viste d'insieme, che servono a guardare, non a camminare. */
const LUOGHI=[
  ['Vista dall\'alto',              [30,46,64],            [-25,0,0]],
  ['Ingresso Scuola',               [-22.6,1.62,-33],      [-22.6,2.6,-19]],
  ['Campo Basket',                  [-8.6,1.62,18],        [-8.6,3.2,-2]],
  ['Portico e le due corti',        [-28.1,1.62,26],       [-28.1,2.2,-4]],
  ['Campo Calcio',                  [-8.6,1.62,78],        [-8.6,2.5,40]],
  ['Piscine Andreana',              [58,18,34],            [60,2,-8]],
  ['Primo piano · braccio nord',    [-40,5.04,-2.60],      [14,4.87,-2.45]],
  ['Primo piano · Primaria',        [-58.6,5.04,18.0],     [-58.6,4.72,-5.0]],
  ['Primo piano · Secondaria',      [12.7,5.41,24.0],      [12.7,5.24,-4.0]],
  ['Primo piano · la gradinata',    [12.7,5.04,6.20],      [12.7,4.52,-3.0]],
  ['Primo piano · uffici e scala',  [-18.5,5.04,-2.95],    [-31.0,4.72,-3.60]],
  ['Primo piano · scala tabelline', [-45.0,5.04,-2.60],    [-53.0,5.12,-1.70]]
];
let voloDa=null, voloA=null, voloT=1;
const mira=new THREE.Vector3();
function guardaVerso(t){
  const dx=t.x-pos.x, dy=t.y-pos.y, dz=t.z-pos.z;
  giro  = Math.atan2(-dx,-dz);
  becco = Math.atan2(dy,Math.hypot(dx,dz));
  becco = Math.max(-1.45,Math.min(1.45,becco));
}
/* a fine spostamento si decide da soli se si e' atterrati o si sta volando:
   niente flag da tenere allineato a mano fra dodici voci di menu */
function verificaAppoggio(){
  inVolo = Math.abs(pos.y-(quotaSotto(pos.x,pos.z)+ALTEZZA)) > 0.60;
}
window.vaiA=function(i){
  const m=LUOGHI[i]; if(!m) return;
  voloDa=pos.clone(); voloA=V(m[1][0],m[1][1],m[1][2]);
  mira.set(m[2][0],m[2][1],m[2][2]); voloT=0;
};
function portamiA(t){
  const d=t.da||[t.pos[0]+3.2,t.pos[1]+2.4,t.pos[2]+3.2];
  voloDa=pos.clone(); voloA=V(d[0],d[1],d[2]);
  mira.set(t.pos[0],t.pos[1],t.pos[2]); voloT=0;
}

  if(ray.intersectObject(cassetta,true).length) trovata(); }

/* --- iPad: l'aula ha i tablet, non le tastiere (PROMPT-BASE-WEBAPP §5b) - */
function joystick(el,cb){
  const pomo=el.querySelector('.pomo'); let att=null,cx=0,cy=0; const R=42;
  function agg(t){ let dx=t.clientX-cx,dy=t.clientY-cy; const d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d;}
    pomo.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))'; cb(dx/R,dy/R); }
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];att=t.identifier;
    const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;agg(t);e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===att)agg(t);
    e.preventDefault();},{passive:false});
  el.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===att){att=null;
    pomo.style.transform='translate(-50%,-50%)';cb(0,0);}},{passive:false});
  el.addEventListener('touchcancel',()=>{att=null;pomo.style.transform='translate(-50%,-50%)';cb(0,0);});
}
let jM={x:0,y:0}, jV={x:0,y:0}, salgo=0;
if(TOCCO){
  joystick($('stickMov'),(x,y)=>{jM.x=x;jM.y=y;});
  joystick($('stickVis'),(x,y)=>{jV.x=x;jV.y=y;});
  $('su').addEventListener('touchstart',e=>{salgo=1;e.preventDefault();},{passive:false});
  $('su').addEventListener('touchend',()=>{salgo=0;});
  $('giu').addEventListener('touchstart',e=>{salgo=-1;e.preventDefault();},{passive:false});
  $('giu').addEventListener('touchend',()=>{salgo=0;});
  canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0];
    if(t) provaClic(t.clientX,t.clientY);},{passive:true});
}

   Regole gia' imparate: sempre youtube.com/embed, mai nocookie; l'autoplay
   parte solo dopo un gesto reale (il clic su "Comincia dal portale"); loop

   non parte in nessuna pagina, quindi si nasconde il comando invece di
   lasciare un pulsante che non fa nulla. */
const MUSICA_ID='1WRP1GzukN8';
let ytPlayer=null, ytPronto=false, ytGuasto=false, musicaChiesta=false;
let audioOn=true;
try{ const v=localStorage.getItem('campus3d_audio'); if(v!==null) audioOn=(v==='1'); }catch(e){}

function segnaAudio(){
  const b=$('bAudio');
  b.classList.toggle('spento',!audioOn);
  $('onde').style.display=audioOn?'':'none';
  $('crocetta').style.display=audioOn?'none':'';
  $('etAudio').textContent=audioOn?'Musica':'Muta';
}
function nascondiAudio(){ const b=$('bAudio'); if(b){ b.style.display='none';
  const s=b.previousElementSibling; if(s&&s.className==='sep') s.style.display='none'; } }

window.onYouTubeIframeAPIReady=function(){
  ytPlayer=new YT.Player('yt',{
    videoId:MUSICA_ID, host:'https://www.youtube.com',
    playerVars:{autoplay:0,controls:0,rel:0,playsinline:1,enablejsapi:1,
      loop:1,playlist:MUSICA_ID,modestbranding:1,iv_load_policy:3},
    events:{
      onReady:()=>{ ytPronto=true; try{ytPlayer.setVolume(22);}catch(e){}
        if(musicaChiesta&&audioOn) provaSuonare(); },
      onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ try{ytPlayer.seekTo(0);ytPlayer.playVideo();}catch(err){} } },
      onError:e=>{ ytGuasto=true; nascondiAudio();
        console.warn('[Campus3D] musica non disponibile (codice '+e.data+
          '): il video non \u00e8 incorporabile o non esiste. Serve un altro brano.'); }
    }});
};
function provaSuonare(){
  if(!ytPronto||ytGuasto||!audioOn) return;
  try{ ytPlayer.setVolume(22); ytPlayer.playVideo(); }catch(e){}
}
function avviaMusica(){ musicaChiesta=true; provaSuonare(); }
/* Rete di sicurezza. Serve in due casi: quando l'autoplay viene bloccato, e
   quando la partita riprende da un salvataggio — li' la schermata iniziale non
   compare, quindi non c'e' nessun clic su "Comincia" a sbloccare l'audio.
   Questi listener scattano solo su un gesto reale, percio' bastano da soli. */
['pointerdown','keydown','touchend'].forEach(ev=>window.addEventListener(ev,()=>{
  if(ytGuasto||!audioOn) return;
  musicaChiesta=true;
  try{ if(ytPronto&&ytPlayer.getPlayerState&&ytPlayer.getPlayerState()!==1) ytPlayer.playVideo(); }catch(e){}
},{passive:true}));

$('bAudio').addEventListener('click',()=>{
  audioOn=!audioOn; segnaAudio();
  try{ localStorage.setItem('campus3d_audio',audioOn?'1':'0'); }catch(e){}
  if(!ytPronto||ytGuasto) return;
  try{ audioOn?ytPlayer.playVideo():ytPlayer.pauseVideo(); }catch(e){}
});
segnaAudio();
(function caricaYT(){
  const t=document.createElement('script');
  t.src='https://www.youtube.com/iframe_api';
  t.onerror=()=>{ ytGuasto=true; nascondiAudio();
    console.warn('[Campus3D] IFrame API non raggiungibile: musica disattivata.'); };

  /* se in 8 s l'API non ha risposto, togli il comando invece di lasciarlo muto */

/* ============================== il ciclo ================================ */
const orologio=new THREE.Clock(), qv=$('qv'), qm=$('qm'), vicino=$('vicino');
function anima(){
  requestAnimationFrame(anima);
  const dt=Math.min(0.05,orologio.getDelta());

  if(voloT<1){
    /* spostamento guidato (menu Luoghi, "ti porto sul posto") */
    voloT=Math.min(1,voloT+dt/1.6);
    const k=voloT<0.5?2*voloT*voloT:1-Math.pow(-2*voloT+2,2)/2;
    pos.lerpVectors(voloDa,voloA,k);
    guardaVerso(mira);
    if(voloT>=1) verificaAppoggio();
  } else if(velo.style.display!=='flex'){
    const av=(tasti['KeyW']||tasti['ArrowUp']   ?1:0)-(tasti['KeyS']||tasti['ArrowDown'] ?1:0)-jM.y;
    const la=(tasti['KeyD']||tasti['ArrowRight']?1:0)-(tasti['KeyA']||tasti['ArrowLeft'] ?1:0)+jM.x;
    const al=(tasti['KeyE']||tasti['Space']     ?1:0)
            -(tasti['KeyQ']||tasti['ShiftLeft']||tasti['ShiftRight']?1:0)+salgo;
    giro  -= jV.x*1.9*dt;
    becco -= jV.y*1.5*dt;
    becco  = Math.max(-1.45,Math.min(1.45,becco));

    if(al>0 && !inVolo) inVolo=true;          /* si stacca da terra          */

    /* la camera guarda lungo il proprio -Z: avanti e' (-sin, -cos) */
    const v = (inVolo?velBase:PASSO)*dt;
    const dx = (-Math.sin(giro)*av + Math.cos(giro)*la)*v;
    const dz = (-Math.cos(giro)*av - Math.sin(giro)*la)*v;

    if(inVolo){
      const n=V(pos.x+dx, pos.y+al*velBase*0.7*dt, pos.z+dz);
      if(passabile(n)) pos.copy(n);
      else{ /* di traverso si scivola lungo un asse per volta, altrimenti
               ci si incolla ai muri */
        [[n.x,pos.y,pos.z],[pos.x,n.y,pos.z],[pos.x,pos.y,n.z]].forEach(q=>{
          const p2=V(q[0],q[1],q[2]); if(passabile(p2)) pos.copy(p2); });
      }
      const suolo=quotaSotto(pos.x,pos.z)+ALTEZZA;
      if(pos.y<=suolo){ pos.y=suolo; inVolo=false; }
      if(pos.y>260) pos.y=260;
    } else {
      /* A PIEDI: il passo si accetta solo se la quota sotto non salta.
         E' questa riga a impedire di cadere dal primo piano e di salire
         sui muri, e a lasciar salire la gradinata (37 cm). */
      const nx=pos.x+dx, nz=pos.z+dz;
      const q0=quotaSotto(pos.x,pos.z), q1=quotaSotto(nx,nz);
      const n=V(nx,q1+ALTEZZA,nz);
      if(Math.abs(q1-q0)<=0.55 && passabile(n)) pos.copy(n);
      else {
        /* scivolamento sui due assi: davanti a uno spigolo ci si sposta
           lungo il muro invece di fermarsi del tutto */
        [[nx,pos.z],[pos.x,nz]].forEach(q=>{
          const qq=quotaSotto(q[0],q[1]), p2=V(q[0],qq+ALTEZZA,q[1]);
          if(Math.abs(qq-q0)<=0.55 && passabile(p2)) pos.copy(p2); });
      }
      pos.y=quotaSotto(pos.x,pos.z)+ALTEZZA;
    }
  }

  camera.position.copy(pos);
  camera.rotation.order='YXZ';
  camera.rotation.y=giro; camera.rotation.x=becco; camera.rotation.z=0;

  /* la cassetta pulsa piano quando sei vicino: e' un segnale di processo,
     non una ricompensa — dice "stai cercando nel posto giusto" */
  if(cassetta){
    const d=pos.distanceTo(cassetta.position);
    pulsa+=dt;
    const vicinoOra=d<26;
    cassetta.position.y=cassetta.userData.y0===undefined
      ? (cassetta.userData.y0=cassetta.position.y)
      : cassetta.userData.y0+(vicinoOra?Math.sin(pulsa*2.6)*0.045:0);
    cassetta.rotation.y+=dt*(vicinoOra?0.55:0.18);
    vicino.style.display=(d<9)?'block':'none';
    if(agganciato||TOCCO){
      ray.setFromCamera({x:0,y:0},camera);
      mirino.classList.toggle('su', ray.intersectObject(cassetta,true).length>0);
    }
  } else { vicino.style.display='none'; mirino.classList.remove('su'); }

  /* a piedi si legge la quota del PAVIMENTO (che e' il dato interessante:
     +3,42 nel corridoio, +3,79 oltre la gradinata); in volo si legge
     l'altezza a cui si sta, che a piedi non direbbe niente. */
  const q=quotaSotto(pos.x,pos.z);
  qv.textContent = inVolo ? 'in volo' : (q>1 ? 'primo piano' : 'a terra');
  qm.textContent = '+'+(inVolo?pos.y:q).toFixed(2).replace('.',',')+' m';
  renderer.render(scene,camera);
}

/* ==========================================================================
   LA LUCE DEGLI INTERNI — misurata, non a occhio
   --------------------------------------------------------------------------
   Il sole e l'emisferica di questo file sono tarati sugli ESTERNI: sole
   radente, cielo 0,55, tone mapping ACES a 0,86. Dentro il corridoio c'e' un
   controsoffitto, e una superficie rivolta in giu' prende solo il colore "da
   terra" dell'emisferica. Leggendo il framebuffer dalla STESSA camera nei due
   file, il corridoio qui usciva piu' scuro di primopiano.html di un quinto —
   e l'arancione della Primaria di un terzo:
        primopiano.html   pavimento 230,212,197 · muro 249,247,240 · arancio 233,134,42
        prima di questo   pavimento 194,185,174 · muro 192,190,184 · arancio 153, 76,13

   COSA NON HA FUNZIONATO, ed e' bene che resti scritto: i LAYER. In Three
   r128 una luce su un layer suo NON illumina solo gli oggetti di quel layer.
   Il layer decide se la luce viene RACCOLTA (la prova e' `object.layers.test(
   camera.layers)` su ogni oggetto, luci comprese), non chi illumina: appena
   si accende il layer sulla camera per farla entrare in scena, quella luce
   rischiara tutto, esterni compresi. Misurato: il cortile passava da
   99,49,44 a 204,130,113.

   Quello che funziona e' l'unica cosa davvero locale che r128 offre:
   l'EMISSIVE dei materiali del solo `piano1`. Emissive = colore x k e'
   esattamente una luce ambiente applicata a quei materiali e a nessun altro.
   Per i materiali con texture il colore e' bianco, quindi l'emissive va
   messo sulla MAPPA (emissiveMap), altrimenti il pavimento a scacchi
   sbianca. k=0,45 misurato: pavimento 214,207,199 · muro 219,218,215 ·
   arancio 211,130,37.
   Va DOPO la conversione sRGB→lineare: l'emissive si ricava dal colore
   lineare, non da quello scritto in esadecimale.
   ========================================================================== */

/* FASCIA BORDEAUX al piano terra dei due corpi ocra (LETTURA-FOTO.md §1). */
(function fasciaBordeaux(){
  const m = lam(0x8E3B32);
  [[-70.7,-24.4,-54.4,24.5],[-52.6,24.5,-24.6,32.7]].forEach(q=>{
    const x0=q[0],z0=q[1],x1=q[2],z1=q[3], L=x1-x0, P=z1-z0;
    box(mondo,L+0.10,1.05,0.12,m,(x0+x1)/2,0.52,z0-0.06,false);
    box(mondo,L+0.10,1.05,0.12,m,(x0+x1)/2,0.52,z1+0.06,false);
    box(mondo,0.12,1.05,P+0.10,m,x0-0.06,0.52,(z0+z1)/2,false);
    box(mondo,0.12,1.05,P+0.10,m,x1+0.06,0.52,(z0+z1)/2,false);
  });
})();

/* ==========================================================================
   COLORI: da sRGB a lineare — UNA VOLTA SOLA, a scena costruita
   --------------------------------------------------------------------------
   I colori dei materiali sono scritti in esadecimale come li si legge sulle
   fotografie, cioe' in sRGB; Three r128 li tratta come LINEARI e poi, con
   outputEncoding=sRGB, li rischiarisce in uscita: ogni tinta satura esce
   slavata di un tono e mezzo (l'arancione della Primaria E8620A usciva
   giallo sabbia). Si converte UNA VOLTA e solo i `color`: le texture hanno
   gia' il loro encoding.
   ATTENZIONE: i due file di partenza avevano CIASCUNO la sua passata. Farle
   tutte e due vuol dire due toni piu' SCURO, e il pavimento a scacchi che
   diventa grigio e nero. Il flag __c le rende idempotenti, ma la passata
   resta una sola ed e' questa.
   ========================================================================== */
(function coloriInLineare(){
  const visti=new Set();
  scene.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m.color || m.__c || visti.has(m.uuid)) return;
      visti.add(m.uuid); m.__c=true; m.color.convertSRGBToLinear();});});
})();

/* ...e subito dopo, la luce degli interni (vedi il blocco qui sopra) */
(function luceInterni(){
  const K=0.45, visti=new Set();
  piano1.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    const m=o.material;
    if(visti.has(m.uuid) || !m.emissive || m.transparent) return;
    visti.add(m.uuid);
    if(m.map){ m.emissiveMap=m.map; m.emissive.setRGB(K,K,K); }
    else     { m.emissive.copy(m.color).multiplyScalar(K); }
    m.needsUpdate=true;
  });
})();

/* ==========================================================================
   SGOMBERO DEL CORRIDOIO
   --------------------------------------------------------------------------
   Gli esterni sono stati scritti quando al primo piano non c'era niente: i
   pluviali, i discendenti della lattoneria e la telecamera dome sono stati
   messi sul filo delle facciate, e quel filo adesso cade DENTRO il corridoio.
   Sono nove pezzi, e a cercarli a mano uno per uno ne resta sempre qualcuno:
   li si toglie con la stessa regola con cui il collaudo li trova.
   Si tolgono SOLO gli elementi SNELLI (meno di 35 cm nella dimensione minore)
   e CORTI (meno di 12 m): tubi, pali, apparecchi. Un muro o una trave non li
   tocca nessuno — quelli, se ci sono, il collaudo li segnala e si decide.
   ========================================================================== */
(function sgombraCorridoio(){
  /* le matrici mondo PRIMA di misurare: un oggetto creato e interrogato
     nello stesso frame porta ancora la posizione vecchia, e il test guarda
     un altro punto dello spazio */
  scene.updateMatrixWorld(true);
  const BRACCI=[[X0,X1,NZ0,NZ1],[OX0,OX1,NZ1,OZ1],[EX0,EX1,NZ1,EZ1]];
  const b=new THREE.Box3(), fuori=[];
  mondo.traverse(o=>{
    if(!o.isMesh||!o.geometry) return;
    let p=o.parent; while(p){ if(p===piano1) return; p=p.parent; }
    b.setFromObject(o);
    const sx=b.max.x-b.min.x, sy=b.max.y-b.min.y, sz=b.max.z-b.min.z;
    if(Math.min(sx,sy,sz)>0.35 || Math.max(sx,sy,sz)>12) return;
    if(b.max.y<PAV+0.20 || b.min.y>PAV+2.60) return;
    const cx=(b.min.x+b.max.x)/2, cz=(b.min.z+b.max.z)/2;
    if(BRACCI.some(t=>cx>t[0]&&cx<t[1]&&cz>t[2]&&cz<t[3])) fuori.push(o);
  });
  /* NIENTE TAGLI SILENZIOSI: quello che si toglie si scrive, con dove
     stava. Un elenco che nessuno legge e' come non averlo tolto. */
  const dove={};
  fuori.forEach(o=>{
    b.setFromObject(o);
    const k=o.geometry.type+' ('+((b.min.x+b.max.x)/2).toFixed(0)+','+
            ((b.min.z+b.max.z)/2).toFixed(0)+')';
    dove[k]=(dove[k]||0)+1;
    if(o.parent) o.parent.remove(o);
  });
  if(fuori.length) console.log('[Campus3D] sgomberati dal corridoio '+fuori.length+
    ' elementi degli esterni:\n  '+Object.keys(dove).map(k=>k+(dove[k]>1?' x'+dove[k]:'')).join('\n  '));
})();

compilaCollisioni();

/* ==========================================================================
   COLLAUDO — si lancia da console con  collaudo()
   --------------------------------------------------------------------------
   Sono i due collaudi dei file di partenza, messi insieme e nessuno dei due
   buttato via:
     A. gli esterni — coperture, percorsi, vegetazione dentro gli edifici,
        canestri dai due lati, luoghi raggiungibili;
     B. il corridoio del primo piano — larghezza libera sezione per sezione
        con un test GEOMETRICO su tutte le mesh (non sulla lista degli
        ostacoli registrati, che non vede quello che nessuno ha registrato e
        per questo diceva "zero bloccati" con cinque muri in mezzo), il giro
        completo dalla Primaria alla Secondaria passando dalle DUE svolte, e
        i due passaggi ai lati del ballatoio;
     C. le tappe — non "sotto c'e' qualcosa?" ma "cade DENTRO l'ambiente che
        il suo indizio nomina?". Con la prima domanda la cassetta del campo
        da basket passava appoggiata alla facciata.
   ========================================================================== */
const CORPI=[['ala ovest',-70.7,-54.4,-24.4,21],['palestra',-57.3,-36.3,-15.5,-5],
  ['corpo nord',-36,14.3,-18.1,-2.4],['ala est',14.3,22.5,-18.1,28.5],
  ['corpo sud (mensa)',-52.6,-24.6,24.5,32.7],['pertinenze',22.5,36.7,-18.1,-2.4]];

window.collaudo=function(){
  scene.updateMatrixWorld(true);
  const R=[];
  const pieni=h=>h.filter(q=>{const m=q.object.material;
    return m&&m.depthWrite!==false&&m.transparent!==true;});

  /* ---------- A. GLI ESTERNI ------------------------------------------ */
  CORPI.forEach(c=>{
    let buchi=0,tot=0;
    const nx=Math.max(3,Math.round((c[2]-c[1])/2)), nz=Math.max(3,Math.round((c[4]-c[3])/2));
    for(let i=1;i<nx;i++)for(let j=1;j<nz;j++){
      const x=c[1]+(c[2]-c[1])*i/nx, z=c[3]+(c[4]-c[3])*j/nz; tot++;
      const r=new THREE.Raycaster(new THREE.Vector3(x,45,z),new THREE.Vector3(0,-1,0),0.1,70);
      if(!pieni(r.intersectObjects(scene.children,true)).length) buchi++;}
    if(buchi) R.push('TETTO MANCANTE  '+c[0]+': '+buchi+'/'+tot+' punti scoperti');});
  /* alberi cresciuti dentro un edificio: si trova coi raggi, non a occhio.
     Le chiome di `piano1` sono escluse — il ficus dell'angolo di sosta sta
     dentro apposta. */
  {const b=new THREE.Box3(), v=new THREE.Vector3(); let n=0;
   mondo.traverse(o=>{ if(!o.isMesh||!o.geometry) return;
     if(o.geometry.type!=='SphereGeometry') return;
     let p=o.parent, dentro=false;
     while(p){ if(p===piano1){dentro=true;break;} p=p.parent; }
     if(dentro) return;
     b.setFromObject(o); b.getCenter(v); if(v.y<2.5) return;
     CORPI.forEach(c=>{ if(v.x>c[1]&&v.x<c[2]&&v.z>c[3]&&v.z<c[4]) n++;});});
   if(n) R.push('VEGETAZIONE DENTRO GLI EDIFICI: '+n+' chiome');}
  {const cx=[]; const b=new THREE.Box3(), v=new THREE.Vector3();
   scene.traverse(o=>{ if(o.userData&&o.userData.canestro){
     b.setFromObject(o); b.getCenter(v); cx.push(+v.x.toFixed(1));}});
   const ov=cx.filter(x=>x<-8.6).length, es=cx.filter(x=>x>-8.6).length;
   if(cx.length&&(ov===0||es===0))
     R.push('CANESTRI DALLO STESSO LATO: '+ov+' a ovest, '+es+' a est  ('+cx.join(' ')+')');}
  LUOGHI.forEach(L=>{ if(!libero(new THREE.Vector3(L[1][0],L[1][1],L[1][2])))
    R.push('LUOGO IRRAGGIUNGIBILE: '+L[0]);});

  /* ---------- B. IL CORRIDOIO DEL PRIMO PIANO ------------------------- */
  const solidi=[];
  piano1.traverse(o=>{
    if(!o.isMesh || !o.geometry) return;
    if(o.material && o.material.depthWrite===false) return;      /* ombre, vetri */
    const gg=o.geometry; if(!gg.boundingBox) gg.computeBoundingBox();
    solidi.push(gg.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  /* Un punto e' libero se nessuna mesh lo occupa fra il ginocchio alto e la
     testa. Sotto 0,55 ci sono i gradini: un dislivello si sale. */
  function liberoP(x,z){
    const q=quotaSotto(x,z), y0=q+0.55, y1=q+1.75;
    for(const b of solidi)
      if(x>b.min.x-0.22 && x<b.max.x+0.22 && z>b.min.z-0.22 && z<b.max.z+0.22 &&
         b.max.y>y0 && b.min.y<y1) return false;
    return true;
  }
  function haPavimento(x,z){
    const q=quotaSotto(x,z);
    for(const b of solidi)
      if(x>b.min.x && x<b.max.x && z>b.min.z && z<b.max.z && Math.abs(b.max.y-q)<0.30)
        return true;
    return false;
  }
  /* La larghezza libera, sezione per sezione: nel braccio nord il passaggio
     si SPOSTA (davanti alla scala sta sul lato aule, davanti ai tavoli sul
     lato finestre), quindi tre corsie fisse mentirebbero. Qui per ogni
     sezione si misura la fascia continua piu' larga — la domanda vera. */
  const MINL = 1.20;
  function scansiona(nome, t0, t1, u0, u1, lungoX){
    let peggio=1e9, dovePeggio=null, senzaPav=0;
    for(let t=t0; t<=t1; t+=0.5){
      let run=0, best=0, bestFine=null;
      for(let u=u0; u<=u1; u+=0.10){
        const x = lungoX? t : u, z = lungoX? u : t;
        if(liberoP(x,z)){ run+=0.10; if(run>best){best=run; bestFine=u;} }
        else run=0;
        if(!haPavimento(x,z)) senzaPav++;
      }
      if(best<peggio){ peggio=best; dovePeggio=[+t.toFixed(1), +(bestFine||0).toFixed(1)]; }
    }
    if(peggio<MINL) R.push('CORRIDOIO STRETTO  '+nome+': larghezza libera '+
      peggio.toFixed(2)+' m (min '+MINL+') a '+JSON.stringify(dovePeggio));
    /* i punti senza pavimento sono una MISURA, non un difetto: nel braccio
       nord sono i due vuoti voluti — il ballatoio sulla scala e il vano
       della scala che scende al piano terra. Segnalarli come problema vuol
       dire chiedere di tappare i buchi che si e' fatta apposta. */
    return nome+' larghezza minima '+peggio.toFixed(2)+' m · '+senzaPav+
           ' punti senza pavimento (i due vuoti)';
  }
  const misure=[
    scansiona('NORD ', X0+0.8, X1-0.8,   NZ0+0.15, NZ1-0.15, true ),
    scansiona('OVEST', NZ1+0.8, OZ1-0.8, OX0+0.15, OX1-0.15, false),
    scansiona('EST  ', NZ1+0.8, EZ1-0.8, EX0+0.15, EX1-0.15, false)
  ];
  /* IL GIRO COMPLETO: i tre bracci passavano puliti mentre le due svolte
     erano tappate, perche' li camminavo separatamente. */
  (function giroCompleto(){
    const punti=[];
    for(let z=OZ1-0.8; z>=NZ0+0.8; z-=0.4) punti.push([(OX0+OX1)/2, z]);
    for(let x=(OX0+OX1)/2; x<=(EX0+EX1)/2; x+=0.4){
      const suTabelline = (x>-54.2 && x<-49.4);           /* si passa a sud   */
      const suScesa     = (x>XMEZZ-10.2 && x<XMEZZ-4.6);  /* scala: a nord    */
      const suVanoScala = (x>XMEZZ-5.4 && x<XMEZZ+4.2);   /* ballatoio: a sud */
      punti.push([x, suTabelline? NZ0+1.05
                   : suScesa    ? NZ0+1.00
                   : suVanoScala? -1.30 : -2.20]);
    }
    for(let z=NZ0+0.8; z<=EZ1-0.8; z+=0.4) punti.push([(EX0+EX1)/2, z]);
    let bl=0; const dove=[];
    punti.forEach(p=>{ if(!liberoP(p[0],p[1])){ bl++;
      if(dove.length<6) dove.push([+p[0].toFixed(1), +p[1].toFixed(1)]); }});
    misure.push('GIRO  '+bl+'/'+punti.length+' bloccati');
    if(bl) R.push('GIRO INTERROTTO: '+bl+'/'+punti.length+
      ' punti bloccati dalla Primaria alla Secondaria → '+JSON.stringify(dove));
  })();
  /* i due passaggi ai lati del ballatoio: il vuoto e' centrale, si deve
     poter passare da tutte e due le parti. Un giro solo non lo dimostra. */
  [['lato aule',NZ0+0.80],['lato finestre',NZ1-0.80]].forEach(c=>{
    let bl=0,tot=0;
    for(let x=XMEZZ-6.0; x<=XMEZZ+6.0; x+=0.3){ tot++; if(!liberoP(x,c[1])) bl++; }
    misure.push('BALLATOIO '+c[0]+' '+bl+'/'+tot+' bloccati');
    if(bl) R.push('BALLATOIO CHIUSO ('+c[0]+'): '+bl+'/'+tot+' punti bloccati');
  });

  /* ---------- B2. GLI INTRUSI DEL CAMPUS NEL CORRIDOIO -----------------
     Un pezzo degli esterni che attraversa il primo piano non si cerca a
     occhio girandoci intorno: si prendono i bounding box di tutto quello
     che NON e' `piano1` e si guarda chi entra nel volume in cui si cammina.
     I gusci degli edifici lo contengono per costruzione (corpo() fa un
     volume pieno, e il corridoio ci sta dentro): quelli non contano. Conta
     quello che e' SOTTILE — un muro, un cavo, una falda, un secondo
     soffitto. Sono esattamente i 40 m di cavi che attraversavano il
     corridoio e il soffitto terracotta sovrapposto. */
  (function intrusi(){
    const BRACCI=[['nord',X0,X1,NZ0,NZ1],['ovest',OX0,OX1,NZ1,OZ1],['est',EX0,EX1,NZ1,EZ1]];
    const b=new THREE.Box3(), trovati={};
    mondo.traverse(o=>{
      if(!o.isMesh||!o.geometry) return;
      let p=o.parent; while(p){ if(p===piano1) return; p=p.parent; }
      if(o.material && o.material.depthWrite===false) return;
      b.setFromObject(o);
      const sx=b.max.x-b.min.x, sy=b.max.y-b.min.y, sz=b.max.z-b.min.z;
      if(Math.min(sx,sy,sz)>1.20) return;               /* e' massa, non un setto */
      /* dal ginocchio alto alla testa, come nel test della larghezza libera:
         sotto ci sono il solaio e i marcapiani, che si incrociano per forza
         col pavimento del corridoio e non danno fastidio a nessuno. */
      if(b.max.y<PAV+0.55 || b.min.y>PAV+2.60) return;
      BRACCI.forEach(t=>{
        if(b.max.x<t[1]+0.2||b.min.x>t[2]-0.2||b.max.z<t[3]+0.2||b.min.z>t[4]-0.2) return;
        const k=t[0];
        trovati[k]=trovati[k]||[];
        if(trovati[k].length<4) trovati[k].push(
          [+((b.min.x+b.max.x)/2).toFixed(1),+((b.min.z+b.max.z)/2).toFixed(1)]);
        trovati[k].n=(trovati[k].n||0)+1;
      });
    });
    Object.keys(trovati).forEach(k=>R.push('INTRUSO NEL BRACCIO '+k.toUpperCase()+': '+
      trovati[k].n+' pezzi del campus attraversano il corridoio → '+JSON.stringify(trovati[k])));
  })();

  /* ---------- C. LE TAPPE --------------------------------------------- */
  TAPPE.forEach((t,i)=>{
    const d=t.da||t.pos;
    if(!libero(new THREE.Vector3(d[0],d[1],d[2])))
      R.push('TAPPA '+(i+1)+' — punto d\'arrivo dentro un muro: '+t.titolo);
    if(t.zona3d){
      const z=t.zona3d;
      if(!(t.pos[0]>=z[0]&&t.pos[0]<=z[1]&&t.pos[2]>=z[2]&&t.pos[2]<=z[3]))
        R.push('TAPPA '+(i+1)+' FUORI DALL\'AMBIENTE che il suo indizio nomina: '+
               t.titolo+'  pos '+JSON.stringify([t.pos[0],t.pos[2]])+
               ' fuori da '+JSON.stringify(z));
    }
    /* e sotto la cassetta ci dev'essere un appoggio a portata di mano */
    const rr=new THREE.Raycaster(new THREE.Vector3(t.pos[0],t.pos[1]+0.6,t.pos[2]),
      new THREE.Vector3(0,-1,0),0.02,2.2);
    if(!pieni(rr.intersectObjects(scene.children,true)).length)
      R.push('TAPPA '+(i+1)+' SOSPESA: sotto la cassetta non c\'e' + ' appoggio entro 2,2 m');
  });

  console.log('— MISURE —\n'+misure.join('\n'));
  console.log(R.length? '— COLLAUDO: '+R.length+' problemi —\n'+R.join('\n')
                      : '— COLLAUDO: nessun problema —');
  return R;
};

/* ============================== avvio =================================== */
pos.set(LUOGHI[0][1][0],LUOGHI[0][1][1],LUOGHI[0][1][2]);
guardaVerso(V(LUOGHI[0][2][0],LUOGHI[0][2][1],LUOGHI[0][2][2]));
verificaAppoggio();
segnaVista();
anima();
apriIntro();          /* si parte sempre dalla card: nessuna tappa salvata */

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);});

console.log('[Campus3D] ostacoli:',SOLIDI.length,'| varchi:',VARCHI.length,
            '| tappe:',TAPPE.length);
console.log('[Primo piano] pavimento '+PAV+' · soffitto '+SOF+
            ' · tratto est '+(PAV+SALTO).toFixed(2)+
            ' — scrivi collaudo() per il test completo');
setTimeout(()=>{console.log('[Campus3D] triangoli:',renderer.info.render.triangles,
  '| draw call:',renderer.info.render.calls);},1500);

</script>
