/* ===================== PALESTRA, capannone, CHIESA ====================== */
/* QdV Arena: il "tendone". Falde a doppio spiovente che salgono verso il colmo
   (prima erano invertite) e manto VERDE, come nella foto della facciata. */
(function qdvArena(){
  /* Foto aerea annotata: il Q.D.V. ARENA e' un CAPANNONE con la copertura
     METALLICA CHIARA a due falde poco inclinate e il fronte a portale — non
     il tendone da circo con le fasce blu che avevo modellato per mesi.
     Accanto, verso l'esterno, il GARAGE DEI BUS. */
  const g=new THREE.Group();mondo.add(g);
  const cx=-66,cz=56,w=40,d=25,hM=8.6,alt=2.2;
  /* LA FOTOGRAFIA DELL'INGRESSO (Andrea) dice di che cosa e' fatto: NON e'
     muratura ne' lamiera, e' un TELONE BIANCO di PVC teso su un'ossatura, con
     una FASCIA BLU lungo la gronda, i teli verticali cuciti uno accanto
     all'altro, e l'ingresso chiuso da due tende bianche scostate ai lati e
     zavorrate in basso col nastro blu. Sopra il varco corre uno STRISCIONE
     NERO con la scritta. Intorno, erba sintetica verde.
     Il volume resta quello misurato sull'aerea: qui cambia la pelle, non
     l'ingombro — un volume non si tocca senza una fonte che lo misuri. */
  const mur=lam(0xF0EDE6), lam1=lam(0xF4F2EC), lam2=lam(0xDEDBD3);
  const BLU=lam(0x1F5FA8), TELO=lam(0xF4F2EC), TENDA=lam(0xEAE6DC);
  /* IL GUSCIO E' VUOTO. Era un volume PIENO w x hM x d: ogni punto
     dell'interno risultava dentro un muro e non ci si poteva entrare — e'
     l'errore gia' segnalato («il solido sta sulle pareti sottili, mai sulla
     massa»). Qui le pareti sono quattro teli spessi 25 cm, e quella di
     levante e' spezzata per lasciare il varco. */
  const SP=0.25, xW=cx-w/2, zN=cz-d/2, zS=cz+d/2, VA=2.35;
  /* IL FONDO DI PONENTE HA IL SUO VARCO, uguale e in asse con quello di
     levante: il volo attraversa il tendone da parte a parte a quota d'uomo
     e ne esce dalla porta, invece di bucare il telo sopra il palco. */
  [[zN,cz-VA],[cz+VA,zS]].forEach(function(q){
    solido(box(g,SP,hM,q[1]-q[0],mur,xW,hM/2,(q[0]+q[1])/2,true));});
  box(g,SP,hM-3.6,VA*2,mur,xW,3.6+(hM-3.6)/2,cz,false);
  /* HP e LP sono dichiarate sessanta righe piu' sotto: qui sarebbero in
     TDZ e lo script morirebbe con un solo ReferenceError, lasciando la
     scena vuota. Quote per esteso — 3,20 di altezza, 4,40 di luce. */
  [-1,1].forEach(function(sg){
    box(g,0.22,3.30,0.14,lam(0xDCD7CB),xW-0.14,1.65,cz+sg*2.36,false);
    box(g,0.26,0.20,0.34,BLU,xW-0.16,0.10,cz+sg*2.36,false);});
  box(g,0.22,0.16,4.90,lam(0xDCD7CB),xW-0.14,3.28,cz,false);
  solido(box(g,w,hM,SP,mur,cx,hM/2,zN,true));            /* lato nord        */
  solido(box(g,w,hM,SP,mur,cx,hM/2,zS,true));            /* lato sud         */
  [[zN,cz-VA],[cz+VA,zS]].forEach(q=>{                   /* levante, spezzato*/
    const L=q[1]-q[0];
    solido(box(g,SP,hM,L,mur,cx+w/2,hM/2,(q[0]+q[1])/2,true));});
  box(g,SP,hM-3.6,VA*2,mur,cx+w/2,3.6+(hM-3.6)/2,cz,false);  /* sopra il varco */
  (function(){const m=new THREE.Mesh(new THREE.PlaneGeometry(w-SP,d-SP),
    lam(0x2F6B39,{emissive:0x16240F}));
   /* IL PAVIMENTO E' UN TAPPETO UNICO DI ERBA SINTETICA (Andrea), da parete
      a parete. Non si vedeva perche' gli stava sopra lo zoccolo pieno, non
      perche' fosse troppo basso: la mia prima ipotesi — «coperto dai tappeti
      del campus» — era sbagliata, e alzarlo da 0,03 a 0,09 infatti non aveva
      cambiato niente. Restare a 0,09 va bene: e' sopra il terreno (0,05) e
      sotto qualunque arredo. */
   m.rotation.x=-Math.PI/2; m.position.set(cx,0.09,cz); g.add(m);})();
  /* ERA QUESTO. Uno zoccolo PIENO w+0,4 x 0,80 x d+0,4, cioe' un blocco
     alto 80 cm esteso a tutta l'impronta: veniva dalla versione «capannone»
     e non dava fastidio finche' dentro non c'era niente. Con l'allestimento
     ha prodotto due difetti che sembravano scollegati — le seggiole
     affogate (spuntava solo la cimasa dello schienale, che sta fra 0,80 e
     0,94) e il pavimento grigio invece che verde (il tappeto d'erba stava
     a 0,09, sotto). Un solo blocco, due sintomi.
     Lo zoccolo di un telone e' un CORDOLO perimetrale, non una platea. */
  [[cx,cz-d/2-0.32,w+1.0,0.36],[cx,cz+d/2+0.32,w+1.0,0.36],
   [cx-w/2-0.32,cz,0.36,d+1.0],[cx+w/2+0.32,cz,0.36,d+1.0]].forEach(q=>
    box(g,q[2],0.34,q[3],lam(0xCFCABE),q[0],0.17,q[1],false));
  /* copertura metallica a due falde, con le nervature */
  [[-1],[1]].forEach(q=>{
    const f=new THREE.Mesh(new THREE.BoxGeometry(w/2+1.0,0.20,d+1.0),lam1);
    f.position.set(cx+q[0]*w/4,hM+alt/2,cz);
    f.rotation.z=-q[0]*Math.atan2(alt,w/2);
    f.castShadow=true;g.add(f);
    for(let k=0;k<9;k++){
      const n=new THREE.Mesh(new THREE.BoxGeometry(w/2+0.9,0.06,0.16),lam2);
      n.position.set(cx+q[0]*w/4,hM+alt/2+0.13,cz-d/2+1.4+k*2.8);
      n.rotation.z=-q[0]*Math.atan2(alt,w/2);g.add(n);}});
  const cm=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,d+1.1,8),lam2);
  cm.rotation.x=Math.PI/2;cm.position.set(cx,hM+alt+0.08,cz);g.add(cm);
  [cz-d/2-0.5,cz+d/2+0.5].forEach(zz=>{
    const sh=new THREE.Shape();sh.moveTo(-w/2-0.5,0);sh.lineTo(w/2+0.5,0);
    sh.lineTo(0,alt+0.15);sh.closePath();
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),mur);
    m.position.set(cx,hM,zz);if(zz<cz)m.rotation.y=Math.PI;g.add(m);});
  /* L'ACCESSO E' SUL LATO EST, non sul lato nord (Andrea). Il portale e la
     fila di finestre alte vanno quindi sulla testata a x = cx + w/2. */
  const xE = cx + w/2;
  /* --- la fascia blu di gronda, su tutto il perimetro --------------- */
  [[cx,cz-d/2-0.22,w+0.9,0.30],[cx,cz+d/2+0.22,w+0.9,0.30],
   [cx-w/2-0.22,cz,0.30,d+0.9],[xE+0.22,cz,0.30,d+0.9]].forEach(q=>
    box(g,q[2],0.85,q[3],BLU,q[0],hM-0.30,q[1],false));
  /* --- i teli verticali: le cuciture sono cio' che dice "telone" ----- */
  for(let i=1;i<16;i++){
    const zz=cz-d/2+i*d/16;
    box(g,0.06,hM-1.0,0.05,lam2,xE+0.11,(hM-1.0)/2,zz,false);}
  for(let i=1;i<24;i++){
    const xx=cx-w/2+i*w/24;
    box(g,0.05,hM-1.0,0.06,lam2,xx,(hM-1.0)/2,cz-d/2-0.11,false);}

  /* --- IL VARCO D'INGRESSO, a misura d'uomo (3,2 x 4,4) ------------- */
  const HP=3.2, LP=4.4;
  box(g,0.26,HP,LP,lam(0x141518),xE+0.14,HP/2,cz,false);   /* il buio dentro */
  /* i due montanti dell'ossatura che si vedono nel varco */
  [-1,1].forEach(sg=>box(g,0.10,HP,0.10,lam(0x3A3E44),xE-0.10,HP/2,
    cz+sg*LP*0.30,false));
  /* IL TENDONE NON HA PORTA (Andrea): solo il rettangolo d'accesso, sempre
     aperto. Le due tende scostate ai lati erano un pezzo di scenografia in
     piu' — e nella fotografia sono raccolte proprio perche' li' non si
     chiude mai. Restano i due montanti d'ossatura che bordano il vano e la
     zavorra blu a terra, che si vedono. */
  [-1,1].forEach(sg=>{
    const zz=cz+sg*(LP/2+0.16);
    box(g,0.22,HP+0.10,0.14,lam(0xDCD7CB),xE+0.14,(HP+0.10)/2,zz,false);
    box(g,0.26,0.20,0.34,BLU,xE+0.16,0.10,zz,false);});
  box(g,0.22,0.16,LP+0.5,lam(0xDCD7CB),xE+0.14,HP+0.08,cz,false);     /* zavorra blu */

  /* --- LO STRISCIONE NERO sopra il varco ---------------------------- */
  const cs=mkCanvas(1024,168), q=cs.getContext('2d');
  q.fillStyle='#141416'; q.fillRect(0,0,1024,168);
  q.fillStyle='rgba(255,255,255,0.05)';
  q.beginPath(); q.arc(560,84,66,0,Math.PI*2); q.fill();
  q.textBaseline='middle';
  q.font='bold 62px Arial Black, Arial, sans-serif';
  q.lineWidth=7; q.strokeStyle='#C8511E'; q.fillStyle='#EFEDE7';
  q.textAlign='center';
  q.strokeText('QDV',300,52);  q.fillText('QDV',300,52);
  q.font='bold 86px Arial Black, Arial, sans-serif';

  /* la seconda riga in corsivo NON la trascrivo: nella fotografia e'
     tagliata a "Dove nascono i s...", e non si inventa quello che non si
     legge. Resta il posto, vuoto. */
  const str=new THREE.Mesh(new THREE.PlaneGeometry(9.6,1.58),
    new THREE.MeshBasicMaterial({map:tex(cs,false)}));
  /* il telo va DAVANTI al pannello, non dentro: il pannello e' spesso 10 cm
     e sta a +0,26, quindi arriva a +0,31. A +0,30 il piano col testo era
     sepolto e si vedeva solo il nero. */
  str.rotation.y=Math.PI/2; str.position.set(xE+0.36,HP+1.15,cz); g.add(str);
  box(g,0.10,1.70,9.8,lam(0x1A1B1E),xE+0.26,HP+1.15,cz,false);

  /* le finestre alte restano anche sul fronte nord */
  for(let i=0;i<8;i++) box(g,2.2,1.5,0.10,lam(0x9FB6C4),cx-16+i*4.6,6.6,cz-d/2-0.06,false);
  /* l'erba sintetica davanti all'ingresso, e il marciapiede di cemento.
     (tappeto() vive dentro un'altra IIFE e qui non c'e': i due piani si
     fanno a mano. Lo script era morto sul primo `tappeto is not defined`,
     e la pagina restava vuota.) */
  [[0x3E7A46,13,16,xE+6.6,0.024],[0xC6C3BC,3.2,17,xE+14.0,0.026]].forEach(q=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(q[1],q[2]),lam(q[0]));
    m.rotation.x=-Math.PI/2; m.position.set(q[3],q[4],cz); g.add(m);});
  contatto(mondo,cx,0.03,cz,w+4,d+4,0.5);
  /* ---- GARAGE BUS: capannone piu' basso, subito accanto --------------- */
  const bx=-66,bz=78,bw=26,bd=14,bh=5.6,ba=1.5;
  solido(box(g,bw,bh,bd,lam(0xE0DCD2),bx,bh/2,bz,true));

    const f=new THREE.Mesh(new THREE.BoxGeometry(bw/2+0.8,0.18,bd+0.8),lam1);

  /* i tre portoni dei bus */

  contatto(mondo,bx,0.03,bz,bw+4,bd+4,0.5);
})();

   ARCONI davanti e un campanile sottinteso, dedotti da una ripresa obliqua e
   da un'etichetta. Nelle tre fotografie non c'e' nessuna loggia e nessun
   campanile. C'e' una chiesa degli anni Sessanta, e si legge tutta:

   VOLUME (misurato sull'ortofoto zenitale `strumenti/campus_zen.png`,
   0,20966 m/px, origine del modello a (1165,632) px):
     navata  x[-41,3 · -32,6]  z[-49,8 · -19,1]   =  8,70 x 30,70
     colmo in mezzeria, asse NORD-SUD, copertura in lamiera verde-grigia
     (e' il #ABB6A3 che si legge sul satellite)
     La FACCIATA sta a NORD, verso il piazzale, ed e' una LASTRA PIU' LARGA
     della navata: in chiesa2 e chiesa3 il muro laterale rientra dietro la
     lesena d'angolo in marmo. 12,40 di fronte su 8,70 di navata.
   Il modello la teneva a (-51,5 · -34), cioe' 14 m piu' a ovest, sopra gli
   alberi e il vialetto: la posizione veniva da una stima, non da una misura.

   FACCIATA (chiesa1 frontale, chiesa3 d'angolo), dal basso in alto:
     · zoccolo di intonaco chiaro;
     · portale a DUE ANTE in legno scuro, a specchiature orizzontali, con
       stipiti e architrave in marmo grigio;
     · fascia di marmo con la scritta "1963 · I CENTENARIO DELLA CONGREGAZIONE";
     · edicola: arco di mattoni attorno a una nicchia con il MOSAICO a fondo
       oro (la Sacra Famiglia), incorniciato di pietra grigia;
     · GRANDE ARCO CIECO in mattoni a corsi sottilissimi, che prende quasi
       tutta la facciata; dentro l'arco e' mattone, fuori e' travertino chiaro;
     · quattro FINESTRE ALTE E STRETTE a tutto sesto, due per lato: una sotto
       l'anca dell'arco e una fuori, con mostre color crema e vetri grigi
       divisi da traversi;
     · LESENE D'ANGOLO in marmo grigio venato, a tutta altezza;
     · TIMPANO a capanna in travertino, con cornicione scuro sporgente sui due
       spioventi e una fascia ocra sul filo superiore;
     · CROCE di ferro sul vertice;
     · gradinata di pietra su tutto il fronte, con due corrimano neri.

   FIANCHI (chiesa2): pannelli di intonaco VERDE-GRIGIO fra lesene di
   mattoni, fascia di mattoni sotto la gronda, cornicione scuro sporgente,
   pluviali scuri sulle lesene. Nessuna finestra sui fianchi visibile.
   ========================================================================== */
(function chiesa(){
  const W=8.70, L=30.70, WF=11.60, PF=1.20;      /* navata, fronte, spessore */
  const H=11.00, ALT=1.70;                        /* gronda e monta del timpano */
  const CX=-36.95, CZ=-34.45;                     /* centro, dall'ortofoto     */
  const g=new THREE.Group(); g.position.set(CX,0,CZ); mondo.add(g);
  const ZF=-L/2, ZR=L/2;                          /* filo facciata e testata   */

  /* ------------------------------ materiali ----------------------------- */
  /* mattoni a corsi SOTTILISSIMI: nelle foto il paramano e' fatto di mattoni
     bassi e fitti, ed e' quello che da' alla facciata il suo "rigato" */
  const texMattoni=(()=>{const c=mkCanvas(256,256),x=c.getContext('2d'),r=seme(1963);
    x.fillStyle='#B9612E';x.fillRect(0,0,256,256);
    for(let i=0;i<32;i++){const y=i*8;
      x.fillStyle='#C9A98C';x.fillRect(0,y+6.4,256,1.6);          /* letto di malta */
      for(let k=0;k<9;k++){const w=28.4,px=(k*28.4+(i%2?14:0))%256;
        const t=r();
        x.fillStyle=t<0.33?'#AE5628':(t<0.66?'#C2662F':'#B05A2A');
        x.fillRect(px,y,w-1.2,6.4);}}
    return tex(c,true);})();
  const matMattoni=lam(0xffffff,{map:texMattoni});
  function mattoni(rx,ry){const t=texMattoni.clone();t.needsUpdate=true;t.repeat.set(rx,ry);
    return lam(0xffffff,{map:t});}
  /* travertino chiaro dei pennacchi e del timpano: venature orizzontali */
  const texTrav=(()=>{const c=mkCanvas(256,256),x=c.getContext('2d'),r=seme(77);
    x.fillStyle='#DED4C0';x.fillRect(0,0,256,256);
    for(let i=0;i<170;i++){x.fillStyle=r()<0.5?'rgba(190,180,158,.55)':'rgba(238,231,214,.5)';
      x.fillRect(0,r()*256,256,0.7+r()*1.8);}
    return tex(c,true);})();
  function travertino(rx,ry){const t=texTrav.clone();t.needsUpdate=true;t.repeat.set(rx,ry);
    return lam(0xffffff,{map:t});}
  /* marmo grigio venato delle lesene d'angolo: venature VERTICALI */
  const texMarmo=(()=>{const c=mkCanvas(256,256),x=c.getContext('2d'),r=seme(311);
    x.fillStyle='#B7B9B6';x.fillRect(0,0,256,256);
    for(let i=0;i<130;i++){x.fillStyle=r()<0.5?'rgba(140,142,142,.45)':'rgba(226,226,222,.5)';
      x.fillRect(r()*256,0,0.8+r()*2.4,256);}
    for(let i=0;i<10;i++){x.strokeStyle='rgba(120,124,126,.35)';x.lineWidth=1+r()*2;
      x.beginPath();const px=r()*256;x.moveTo(px,0);
      for(let y=0;y<256;y+=32)x.lineTo(px+(r()-0.5)*22,y);x.stroke();}
    return tex(c,true);})();
  function marmo(rx,ry){const t=texMarmo.clone();t.needsUpdate=true;t.repeat.set(rx,ry);
    return lam(0xffffff,{map:t});}
  const matVerde  = lam(0x8E948A);   /* i pannelli dei fianchi              */
  const matCrema  = lam(0xEFE3C6);   /* le mostre delle finestre            */
  const matCorn   = lam(0x565049);   /* il cornicione scuro                 */
  const matOcra   = lam(0xE4CE96);   /* la fascia sul filo del timpano      */
  const matPietra2= lam(0x9E9E97);   /* stipiti, architrave, fascia scritta */
  const matLegno  = lam(0x5A3B27);   /* le due ante                         */
  const matVetroC2= lam(0x93A0A6);   /* i vetri delle finestre alte         */
  const matZocc   = lam(0xD6D2C8);   /* intonaco chiaro alla base           */
  const matLamiera= lam(0xA6B0A2);   /* la copertura, verde-grigia          */
  const matFerro  = lam(0x3A3632);

  /* ---------------- forme: rettangolo con la testa a tutto sesto -------- */
  function formaArco(w,h){                     /* origine in basso al centro */
    const r=w/2, s=new THREE.Shape();
    s.moveTo(-r,0); s.lineTo(-r,h-r);
    s.absarc(0,h-r,r,Math.PI,0,true);
    s.lineTo(r,0); s.closePath(); return s;
  }
  function estrudi(shape,sp,m,y,z,ry){
    const o=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:sp,bevelEnabled:false}),m);
    o.position.set(0,y,z); if(ry) o.rotation.y=ry; o.castShadow=true; g.add(o); return o;
  }

  /* ============================== LA NAVATA ============================= */
  (function navata(){
    const mFianco=mattoni(15,5);        /* box: piastrelle sull'intera faccia */
    /* i due muri lunghi: pannelli verde-grigio fra lesene di mattoni */
    [-1,1].forEach(s=>{
      const px=s*W/2;
      /* IL MURO DI LEVANTE HA IL VANO DELLA MONOFORA CHE SI APRE. Aprendo
         l'anta si vedeva il MURO: la vetrata era solo un pannello dipinto
         all'interno, e il guscio restava pieno — lo stesso errore del
         portale, dove il campo di mattoni chiudeva il portone appena
         spalancato. Qui il muro si spezza in quattro attorno al buco:
         sotto il davanzale, sopra l'arco e le due fasce laterali.
         Coordinate LOCALI del gruppo chiesa (che sta a -36,95 · -34,45):
         la finestra del volo, che nel mondo e' a x=-32,95 z=-24,30, qui
         cade a z=+10,15; luce 0,86, davanzale 2,90, imposta 6,25. */
      if(s===1){
        const zF=10.15, LFv=0.86, yD=2.90, yA=6.25, zA=ZF+PF, zB=ZR;
        [[zA,zF-LFv/2],[zF+LFv/2,zB]].forEach(function(q){
          solido(box(g,0.36,H,q[1]-q[0],mFianco,px,H/2,(q[0]+q[1])/2,true));});
        solido(box(g,0.36,yD,LFv,mFianco,px,yD/2,zF,true));
        solido(box(g,0.36,H-yA,LFv,mFianco,px,yA+(H-yA)/2,zF,true));
      } else
      solido(box(g,0.36,H,L-PF,mFianco,px,H/2,(ZF+PF+ZR)/2,true));
      /* i pannelli, appena rientrati */
      const n=5, z0=ZF+PF+0.9, z1=ZR-0.9, passo=(z1-z0)/n;
      for(let i=0;i<n;i++){
        const zc=z0+passo*(i+0.5);
        /* il pannello che copre la monofora apribile si spezza in due,
           altrimenti aprendo l'anta si vede lui invece del cielo */
        if(s===1 && Math.abs(zc-10.15)<passo/2){
          [[zc-passo/2+0.45,10.15-0.55],[10.15+0.55,zc+passo/2-0.45]].forEach(function(q){
            if(q[1]-q[0]>0.2)
              box(g,0.10,H-1.1-2.0,q[1]-q[0],matVerde,px+s*0.14,
                  1.1+(H-1.1-2.0)/2,(q[0]+q[1])/2,false);});
          continue;}
        box(g,0.10,H-1.1-2.0,passo-0.9,matVerde,px+s*0.14,1.1+(H-1.1-2.0)/2,zc,false);}
      /* zoccolo di cemento e fascia di mattoni sotto la gronda: gia' nel
         muro, qui solo lo zoccolo chiaro che nelle foto e' evidente */
      box(g,0.13,1.10,L-PF,matZocc,px+s*0.13,0.55,(ZF+PF+ZR)/2,false);
      /* pluviali scuri sulle lesene */
      for(let i=1;i<n;i++){
        const zz=z0+passo*i-0.45;
        const t=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,H-0.2,8),matCorn);
        t.position.set(px+s*0.22,(H-0.2)/2,zz); g.add(t);}
    });
    /* testata sud: la chiesa si appoggia al blocco della scuola */
    solido(box(g,W,H,0.36,mFianco,0,H/2,ZR,true));
    /* cornicione scuro sporgente su tutti e due i fianchi */
    [-1,1].forEach(s=>box(g,0.46,0.42,L+0.3,matCorn,s*(W/2+0.10),H+0.06,(ZF+ZR)/2,false));
    /* copertura a due falde in lamiera */
    const half=Math.hypot(W/2+0.35,ALT);
    [-1,1].forEach(s=>{
      const f=box(g,half,0.16,L+0.5,matLamiera,s*(W/2+0.35)/2,H+ALT/2,(ZF+ZR)/2,true);
      f.rotation.z=-s*Math.atan2(ALT,W/2+0.35);});
    const cm=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,L+0.5,8),lam(0x8E988B));
    cm.rotation.x=Math.PI/2; cm.position.set(0,H+ALT+0.06,(ZF+ZR)/2); g.add(cm);
    /* i due timpani della falda, in mattoni */
    const tim=new THREE.Shape();
    tim.moveTo(-W/2,0); tim.lineTo(W/2,0); tim.lineTo(0,ALT); tim.closePath();
    [[ZR-0.18,0],[ZF+PF,Math.PI]].forEach(q=>{
      const m=new THREE.Mesh(new THREE.ShapeGeometry(tim),mFianco);
      m.position.set(0,H,q[0]); m.rotation.y=q[1]; g.add(m);});
  })();

  /* ============================= LA FACCIATA ============================ */
  (function facciata(){
    const zf=ZF, sp=PF;                    /* la lastra: dal filo, spessa PF */
    /* IL GRANDE ARCO PRENDE QUASI TUTTA LA FACCIATA: nelle foto arriva a
       sfiorare le lesene d'angolo e sale fin sotto la cornice di gronda.
       Era troppo piccolo, e sopra restava una fascia di travertino che
       nella realta' non c'e'. */
    const RA=4.35, YA=5.60;                /* arco: raggio esterno, imposta */
    /* ATTENZIONE ALLE RIPETIZIONI. Su una ExtrudeGeometry l'UV che Three
     genera E' LA COORDINATA DELLA SHAPE IN METRI: `repeat` vale allora
     "quante volte per metro", cioe' 0,4 = una piastrella ogni 2,5 m. Su un
     box l'UV va invece da 0 a 1 sulla faccia, e `repeat` e' il numero di
     piastrelle sull'intera faccia. Con repeat(4,4) sull'estrusione i corsi
     di mattoni venivano da 1,2 cm e la facciata usciva rigata di grigio. */
  const mFacc=travertino(0.4,0.4), mArco=mattoni(0.5,0.5);

    /* --- la lastra di travertino con il buco del grande arco ------------ */
    const lastra=new THREE.Shape();
    lastra.moveTo(-WF/2,0); lastra.lineTo(WF/2,0); lastra.lineTo(WF/2,H);
    lastra.lineTo(-WF/2,H); lastra.closePath();
    const buco=new THREE.Path();
    buco.moveTo(-RA,0); buco.lineTo(-RA,YA);
    buco.absarc(0,YA,RA,Math.PI,0,true);
    buco.lineTo(RA,0); buco.lineTo(-RA,0);
    lastra.holes.push(buco);
    solido(estrudi(lastra,sp,mFacc,0,zf));

    /* --- dentro il buco: il campo di mattoni, con l'archivolto ----------
       IL VANO DEL PORTALE VA TAGLIATO ANCHE QUI. La lastra di travertino il
       buco ce l'ha (l'arco arriva fino a terra), ma dietro c'e' il campo di
       mattoni che chiudeva tutto: aprendo le ante si vedeva il muro, e il
       raggio di collaudo lo trovava come ultimo strato pieno a z=-49,63.
       Il vano e' quello del portale — 2,30 x 3,35 a partire da 0,42 — con
       tre centimetri di gioco per parte, cosi' lo stipite di marmo copre il
       taglio invece di lasciarlo a filo. */
    const campo=formaArco(RA*2,YA+RA);
    const vanoP=new THREE.Path();
    vanoP.moveTo(-1.18,0.39); vanoP.lineTo(1.18,0.39);
    vanoP.lineTo(1.18,3.80);  vanoP.lineTo(-1.18,3.80);
    vanoP.closePath();
    campo.holes.push(vanoP);
    estrudi(campo,sp*0.72,mArco,0,zf+sp*0.14);

    /* --- l'edicola del mosaico: arco di mattoni + nicchia --------------- */
    const WE=2.20, YE=4.05, HE=4.85;       /* edicola: largh., quota, altezza */
    const ed=formaArco(WE,HE);
    const edB=new THREE.Path(); const rI=(WE-0.70)/2;
    edB.moveTo(-rI,0); edB.lineTo(-rI,HE-0.35-rI);
    edB.absarc(0,HE-0.35-rI,rI,Math.PI,0,true);
    edB.lineTo(rI,0); edB.lineTo(-rI,0);
    ed.holes.push(edB);
    estrudi(ed,0.30,mArco,YE,zf-0.10);
    /* la cornice di pietra della nicchia e il mosaico */
    const nic=formaArco(WE-0.70,HE-0.35);
    estrudi(nic,0.14,matPietra2,YE,zf-0.02);
    (function mosaico(){
      const c=mkCanvas(256,720),x=c.getContext('2d'),r=seme(1963);
      /* il piano e' ruotato di PI per guardare a nord: se non si specchia
         il disegno, le figure escono scambiate di lato */
      x.translate(256,0); x.scale(-1,1);
      const gr=x.createLinearGradient(0,0,0,720);
      gr.addColorStop(0,'#E2C063');gr.addColorStop(.5,'#D8B44E');gr.addColorStop(1,'#C79E38');
      x.fillStyle=gr;x.fillRect(0,0,256,720);
      for(let i=0;i<2600;i++){x.fillStyle=r()<0.5?'rgba(255,240,190,.30)':'rgba(150,116,40,.22)';
        x.fillRect((r()*32|0)*8,(r()*90|0)*8,7,7);}                 /* tessere */
      /* le tre figure: al centro il piu' alto con le mani alzate, a sinistra
         il manto verde e rosa, a destra il saio ocra (chiesa1) */
      function figura(cx,cy,hh,ww,manto,veste,incarn,aureola){
        if(aureola){x.fillStyle=aureola;x.beginPath();
          x.arc(cx,cy-hh*0.46,ww*0.52,0,Math.PI*2);x.fill();}
        x.fillStyle=veste;x.beginPath();
        x.moveTo(cx-ww*0.34,cy+hh*0.5);x.lineTo(cx-ww*0.20,cy-hh*0.30);
        x.lineTo(cx+ww*0.20,cy-hh*0.30);x.lineTo(cx+ww*0.34,cy+hh*0.5);x.closePath();x.fill();
        x.fillStyle=manto;x.beginPath();
        x.moveTo(cx-ww*0.46,cy+hh*0.5);x.lineTo(cx-ww*0.30,cy-hh*0.34);
        x.lineTo(cx-ww*0.02,cy-hh*0.30);x.lineTo(cx-ww*0.06,cy+hh*0.5);x.closePath();x.fill();
        x.fillStyle=incarn;x.beginPath();x.arc(cx,cy-hh*0.40,ww*0.20,0,Math.PI*2);x.fill();
      }
      figura(128,300,470,120,'#8C2F3A','#B23C46','#E0BB92','rgba(255,238,180,.85)');
      figura( 84,430,360,100,'#2E5B3C','#C77A6A','#E5C49C','rgba(240,170,150,.75)');
      figura(176,440,340, 96,'#8A6A2E','#C9A24E','#E0BB92','rgba(255,240,190,.75)');
      const m=new THREE.Mesh(new THREE.PlaneGeometry(WE-1.02,HE-0.72),
        lam(0xffffff,{map:tex(c,false)}));
      m.position.set(0,YE+(HE-0.72)/2+0.02,zf-0.06); m.rotation.y=Math.PI; g.add(m);
    })();

    /* --- la fascia con la scritta del 1963 ----------------------------- */
    (function scritta(){
      const c=mkCanvas(512,64),x=c.getContext('2d');
      x.translate(512,0); x.scale(-1,1);   /* idem: qui e' scritta, e si leggerebbe al rovescio */
      x.fillStyle='#A5A49C';x.fillRect(0,0,512,64);
      x.fillStyle='#5E5C55';x.font='bold 22px Lexend, sans-serif';x.textAlign='center';
      x.fillText('1963',256,24);
      x.font='bold 17px Lexend, sans-serif';
      x.fillText('I CENTENARIO DELLA CONGREGAZIONE',256,48);
      const m=new THREE.Mesh(new THREE.PlaneGeometry(2.55,0.34),
        lam(0xffffff,{map:tex(c,false)}));
      m.position.set(0,YE-0.20,zf-0.10); m.rotation.y=Math.PI; g.add(m);
      box(g,2.75,0.40,0.16,matPietra2,0,YE-0.20,zf-0.02,false);
    })();

    /* --- il portale: stipiti di marmo e due ante di legno scuro --------- */
    const HP=3.35, WP=2.30, Y0=0.42;
    box(g,WP+0.56,0.26,0.22,matPietra2,0,Y0+HP+0.13,zf-0.06,false);       /* architrave */
    [-1,1].forEach(s=>box(g,0.28,HP+0.26,0.22,matPietra2,s*(WP/2+0.14),Y0+(HP+0.26)/2,zf-0.06,false));
    /* IL PORTALE SI APRE COME QUELLO DELLA SCUOLA (Andrea): due ante
       incernierate agli stipiti, che si spalancano arrivando davanti e si
       richiudono andando via. Era un pannello unico e chiudeva il varco:
       il giro del campus entrava attraversando la facciata. */
    const ante=[];
    [-1,1].forEach(sg=>{
      const gA=new THREE.Group();
      gA.position.set(sg*WP/2,Y0,zf-0.02);      /* cerniera sullo stipite */
      gA.userData.animato=true; g.add(gA); ante.push(gA);
      const an=box(gA,WP/2,HP,0.09,matLegno,-sg*WP/4,HP/2,0,false);
      an.castShadow=true;
      for(let i=0;i<6;i++)
        box(gA,WP/2-0.08,0.035,0.03,lam(0x462E1D),-sg*WP/4,0.28+i*0.53,-0.05,false);
      const p=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),lam(0xB09A54));
      p.position.set(-sg*(WP/2-0.14),1.05,-0.07); gA.add(p);});
    /* NIENTE ATRIO POSTICCIO. L'avevo messo perche' aprendo non si vedesse
       il prato attraverso il portale — ma adesso dietro c'e' la navata
       vera, e quel pannello faceva solo una cosa: chiudere di nuovo il
       varco che le ante avevano appena aperto. Il collaudo lo trovava come
       secondo strato pieno a 4 cm dal filo interno. */
    let apChiesa=0;
    AGGIORNA.push(dt=>{
      const dx=pos.x-CX, dz=pos.z-(CZ+zf);
      const davanti=(dz<0 && dz>-11 && Math.abs(dx)<5.0);
      apChiesa += ((davanti?1:0)-apChiesa)*Math.min(1,dt*2.8);
      ante[0].rotation.y = -apChiesa*1.28;
      ante[1].rotation.y =  apChiesa*1.28;});

    /* --- quattro finestre alte a tutto sesto: due per lato ------------- */
    /* una sotto l'anca dell'arco (dentro il mattone) e una fuori, nel
       travertino: e' quello che si vede in chiesa1 e in chiesa3 */
    /* TUTTE E QUATTRO stanno SOTTO l'arco, fra l'edicola e l'archivolto:
       con l'arco largo 8,70 non c'e' piu' facciata libera ai lati. */
    [-1,1].forEach(s=>[1.78,2.88].forEach(px=>{
      const x=s*px, WV=0.66, HV=4.40, YV=2.05;
      const mo=formaArco(WV+0.44,HV+0.22);
      const mm=new THREE.Mesh(new THREE.ExtrudeGeometry(mo,{depth:0.14,bevelEnabled:false}),matCrema);
      mm.position.set(x,YV-0.11,zf-0.12); g.add(mm);
      const vt=formaArco(WV,HV);
      const vv=new THREE.Mesh(new THREE.ExtrudeGeometry(vt,{depth:0.06,bevelEnabled:false}),matVetroC2);
      vv.position.set(x,YV,zf-0.16); g.add(vv);
      for(let i=1;i<5;i++) box(g,WV,0.05,0.05,matCrema,x,YV+i*(HV-WV/2)/5,zf-0.20,false);
    }));

   Coordinate MONDO dal rilievo: navata x[-41,30 · -32,60] z[-49,80 · -19,10].

(function internoChiesa(){

  function mappaShape(t,w,h){

    v.position.set(X0+1.2,1.96,ZP+0.6); g.add(v);})();

  /* ---- I BANCHI: due file, corridoio centrale ------------------------- */
  function banco(bx,bz,lung){
    box(g,lung,0.07,0.42,LEG,bx,0.48,bz,true);            /* seduta      */
    box(g,lung,0.44,0.05,LEG,bx,0.72,bz-0.20,false);      /* schienale   */
    box(g,lung,0.06,0.20,LEG,bx,0.30,bz-0.34,false);      /* inginocch.  */
    [-1,1].forEach(q=>box(g,0.07,0.46,0.50,LEG,bx+q*(lung/2-0.10),
      0.23,bz,false));}
  const LB=3.05, XSX=CXX-1.05-LB/2, XDX=CXX+1.05+LB/2;
  for(let i=0;i<15;i++){
    const bz=ZP-1.9-i*1.30;
    if(bz<ZN+1.6) break;
    banco(XSX,bz,LB); banco(XDX,bz,LB);}
})();

/* ==========================================================================
   LA MESSA — tre sacerdoti dietro l'altare, i fedeli nei banchi
   --------------------------------------------------------------------------
   Coordinate MONDO, le stesse dell'interno: navata x[-40,95 · -32,95],
   asse a -36,95; presbiterio da z=-24,05 all'abside (-19,45), pedana a
   quota 0,66; altare a z=-22,45.
   ORIENTAMENTO: qui l'abside sta a z CRESCENTE, quindi i fedeli guardano
   verso +Z — il contrario degli spettatori del tendone, che guardano -Z.
   Non e' un dettaglio: nel tendone lo schienale sta a +Z, qui a -Z, e
   copiare la figura senza specchiarla avrebbe messo tutti di spalle
   all'altare. Il verso si ricava dal banco, non si ricorda.
   VERDE: e' il colore del paramento che si vede nella sfera, lo stesso
   dell'altare e dell'ambone — tempo ordinario.
   ========================================================================== */
(function laMessa(){
  const g=new THREE.Group(); mondo.add(g);
  const CXX=-36.95, ZS=-19.45, ZP=ZS-4.6, YP=0.66;
  const em=(c,e)=>lam(c,{emissive:e===undefined?0x2E2E32:e});
  const rnd=seme(2611);
  const CARNI=[0xE4C3A0,0xC98F63,0x8B5A38,0xD9AE86];
  const CAPI =[0x2B2118,0x4A3524,0x8A6A3A,0x1A1512,0xB9B4AC];

  /* ---- I TRE SACERDOTI, dietro l'altare e rivolti all'assemblea ------- */
  function sacerdote(sx,sz,principale){
    const bianco=em(0xF2F0E8,0x3E3E3A), verde=em(0x3E7A50,0x142A1A),
          pelle=em(CARNI[(rnd()*4)|0],0x2A2420),
          cap=em(CAPI[(rnd()*5)|0],0x1A1614);
    const camice=new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.34,1.34,12),
      bianco);
    camice.position.set(sx,YP+0.67,sz); camice.castShadow=true; g.add(camice);
    /* la casula: piu' corta e piu' larga, verde */
    const cas=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.36,
      principale?0.92:0.84,12),verde);
    cas.position.set(sx,YP+1.05,sz); g.add(cas);
    /* la stola, due strisce sul davanti (verso l'assemblea, cioe' -Z) */
    if(principale) [-1,1].forEach(q=>{
      const st=new THREE.Mesh(new THREE.BoxGeometry(0.075,0.78,0.03),verde);
      st.position.set(sx+q*0.10,YP+1.12,sz-0.30); g.add(st);});
    [-1,1].forEach(q=>{                                   /* braccia       */
      const b=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.44,8),
        bianco);
      b.position.set(sx+q*0.30,YP+1.28,sz-0.14);
      b.rotation.x=-0.55; b.rotation.z=q*0.20; g.add(b);});
    const t=new THREE.Mesh(new THREE.SphereGeometry(0.115,12,10),pelle);
    t.position.set(sx,YP+1.60,sz); g.add(t);
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.122,12,8,0,6.3,0,
      Math.PI*0.52),cap);
    c.position.set(sx,YP+1.615,sz); g.add(c);}
  /* il celebrante in asse, i due concelebranti ai lati e un filo indietro */
  sacerdote(CXX,       ZS-2.15, true);
  sacerdote(CXX-1.15,  ZS-1.85, false);
  sacerdote(CXX+1.15,  ZS-1.85, false);

  /* ---- I FEDELI NEI BANCHI ------------------------------------------- */
  const VESTI=[0x2E5B8C,0x8A4A3E,0x3E6A4E,0x5E4A7A,0x8A7A3E,0x2A2E34,
               0xC6C0B4,0x5A6470];
  function fedele(sx,sz,i){
    const ve=em(VESTI[i%VESTI.length],0x24242A),
          pe=em(CARNI[(i*3)%CARNI.length],0x2A2420),
          ca=em(CAPI[(i*5)%CAPI.length],0x1A1614),
          pa=em(0x36393F,0x1C1E22);
    /* seduti sul banco: seduta a 0,48, e si guarda verso +Z (l'altare) */
    box(g,0.34,0.46,0.20,ve,sx,0.84,sz-0.12,false);          /* busto     */
    box(g,0.30,0.16,0.32,pa,sx,0.56,sz+0.06,false);          /* cosce     */
    [-1,1].forEach(q=>{
      box(g,0.12,0.44,0.13,pa,sx+q*0.09,0.26,sz+0.21,false);   /* tibie   */
      box(g,0.13,0.07,0.22,em(0x24282E,0x141618),sx+q*0.09,0.05,sz+0.27,false);
      box(g,0.09,0.38,0.10,ve,sx+q*0.21,0.86,sz-0.06,false);});/* braccia */
    const t=new THREE.Mesh(new THREE.SphereGeometry(0.108,10,8),pe);
    t.position.set(sx,1.19,sz-0.08); g.add(t);
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.115,10,7,0,6.3,0,
      Math.PI*0.54),ca);
    c.position.set(sx,1.20,sz-0.08); g.add(c);
    const n=new THREE.Mesh(new THREE.SphereGeometry(0.090,8,6),ca);
    n.position.set(sx,1.17,sz-0.15); g.add(n);}
  /* i banchi stanno a x -39,525 e -34,375, lunghi 3,05, uno ogni 1,30 a
     partire da z=-25,95. Piu' gente davanti che in fondo, come sempre. */
  const LB=3.05, XB=[CXX-1.05-LB/2, CXX+1.05+LB/2];
  let n=0;
  for(let i=0;i<15;i++){
    const bz=ZP-1.9-i*1.30;
    XB.forEach(bx=>{ for(let k=0;k<4;k++)
      if(rnd() < 0.72-i*0.038)
        fedele(bx-0.93+k*0.62, bz, n++); });}
})();


/* ===================== PISCINE ANDREANA ================================
   RIFONDATE SULL'ORTOFOTO ZENITALE, non piu' su foto oblique.
   strumenti/campus_zen.png — 0,20966 m/px, nord in alto, origine del modello
   al pixel (1165, 632). Ogni numero qui sotto e' MISURATO li' sopra
   estraendo gli intervalli d'acqua riga per riga, non stimato a occhio.

   COSA AVEVO SBAGLIATO (e che si vede in un colpo solo sulla zenitale):
   - Avevo messo DUE TETTOIE VETRATE affiancate sopra le vasche. Non
     esistono. Esistono due VOLUMI BASSI COL TETTO BIANCO, e non stanno
     sopra le vasche: stanno ACCANTO. Quello grande e' fermo SUBITO A NORD
     della vasca a corsie — e' la copertura ritirata sui binari, cioe'
     esattamente la struttura che Andrea aveva indicato dal parcheggio.
   - Avevo una sola vasca a corsie. Sono DUE, incrociate: quella nord ha le
     corde EST-OVEST, quella sud le ha NORD-SUD.
   - Avevo la torre degli scivoli a sud-ovest, alta sei metri, con la vasca
     piccola in cima. Gli scivoli stanno a EST, e sono di due specie
     diverse: a nord una PISTA A QUATTRO CORSIE dritta (la striscia azzurra
     lunga 22 m che scende verso il canale), a sud DUE TUBI ELICOIDALI.
   - Avevo una vasca d'arrivo a x=33, cioe' addosso agli edifici.

   IL RILIEVO (coordinate MONDO: x+ est, z+ sud):
     copertura scorrevole   x 50,5 . 80,9   z -40,7 . -17,2   (30,4 x 23,5)
     vasca corsie nord      x 56,0 . 81,3   z -16,6 .  -3,0   (25,3 x 13,6)
     pista a 4 corsie       x 90,2 . 95,0   z -25,5 .  -3,0
     canale + laguna        x 75,3 . 97,1   z  -2,5 .  32,5
     vasca corsie sud       x 66,9 . 83,7   z  16,4 .  40,7   (16,8 x 24,3)
     padiglione sud-ovest   x 47,6 . 62,1   z  21,6 .  48,4   (14,5 x 26,8)
     scivoli elicoidali     x 84,3 . 98,9   z  23,1 .  42,6
     siepe di confine       x ~102                            (est)

   NIENTE OFFSET DI GRUPPO. La versione precedente teneva il gruppo a
   x=-40 e scriveva coordinate locali: ogni pezzo finiva piazzato a mano,
   con uno scarto suo. Qui il gruppo sta a zero e si scrivono le coordinate
   del modello, le stesse che si leggono sull'ortofoto.
   ====================================================================== */
(function piscine(){
  const g=new THREE.Group(); mondo.add(g);

  /* --- materiali, campionati sull'ortofoto ------------------------------
     cotto  #E2BC9C (deck attorno alla vasca nord, caldo)
     cemento #E6E7DE (deck attorno alla laguna e alla vasca sud)
     tetti  #F0EDE2 (i due volumi chiari)                                 */
  const matCotto=lam(0xffffff,{map:(()=>{const t=tex(texPunti('#e2bc9c',
    ['#d8b090','#ecc8a8','#cfa484'],23),true);t.repeat.set(24,16);return t;})()});
  const matCemento=lam(0xffffff,{map:(()=>{const t=tex(texPunti('#e6e7de',
    ['#dcddd4','#eff0e8','#d2d3ca'],23),true);t.repeat.set(24,16);return t;})()});
  const matBordo =lam(0xE6E2D8);
  const matTetto =lam(0xF0EDE2);
  const matMuro  =lam(0xDCD8CE);
  const matLatt  =lam(0xB2B6BC);
  /* tre acque diverse, come sull'ortofoto: la vasca nord e' turchese
     chiaro, la laguna appena piu' verde, la vasca sud ha il rivestimento
     blu e risulta molto piu' scura. */
  const acquaNord   =matAcqua;
  const acquaLaguna =new THREE.MeshPhongMaterial({color:0x6FD4E8,shininess:110,
    specular:0xffffff,transparent:true,opacity:0.93});
  const acquaSud    =new THREE.MeshPhongMaterial({color:0x3FA8E0,shininess:110,
    specular:0xffffff,transparent:true,opacity:0.94});

  function deck(mat,x0,x1,z0,z1,y){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),mat);
    m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2,y||0.02,(z0+z1)/2);
    m.receiveShadow=true;g.add(m);return m;}

  /* il piazzale: cotto attorno alla vasca nord, cemento chiaro da meta' in
     giu'. Il cambio di pavimentazione si legge nettamente sulla zenitale. */
  deck(matCotto,  44,102,-22,13.5,0.02);
  deck(matCemento,44,102,13.5,49,0.02);
  deck(lam(0xC9C5BC),47,84,-43,-17,0.03);      /* platea della copertura   */

  /* --- vasca rettangolare a corsie --------------------------------------
     corde lungo X (vert=false) o lungo Z (vert=true), blocchi di partenza
     sul lato corto d'ingresso. */
  function vasca(x0,x1,z0,z1,mat,corsie,vert,blocchi){
    const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
    box(g,w+1.8,0.34,d+1.8,matBordo,cx,0.17,cz,false);
    const a=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
    a.rotation.x=-Math.PI/2;a.position.set(cx,0.36,cz);g.add(a);
    for(let i=1;i<corsie;i++){
      const t=i/corsie;
      const lungo=vert?d:w;
      for(let k=0.5;k<lungo;k+=0.85){
        const b=new THREE.Mesh(new THREE.SphereGeometry(0.09,6,5),
          lam((Math.floor(k/0.85)%2)?0xE8E4DC:0xD4A017));
        if(vert) b.position.set(x0+w*t,0.43,z0+k); else b.position.set(x0+k,0.43,z0+d*t);
        g.add(b);}}
    /* I BLOCCHI DI PARTENZA STANNO SUL BORDO, NON SULL'ACQUA: vanno messi
       fuori dal filo della vasca, sul piastrellato. */
    if(blocchi) for(let i=0;i<corsie;i++){
      const t=(i+0.5)/corsie;
      const bx=vert?x0+w*t:x0-0.55, bz=vert?z0-0.55:z0+d*t;
      box(g,0.48,0.36,0.48,lam(0xD8D4CC),bx,0.50,bz,true);
      box(g,0.32,0.05,0.32,lam(0x2F6FB5),bx,0.70,bz,false);}
    /* scalette a bordo vasca, sul lato lungo */
    for(let i=0;i<2;i++){
      const sx=vert?x1+0.3:x0+w*(0.3+0.4*i), sz=vert?z0+d*(0.3+0.4*i):z1+0.3;
      box(g,0.07,1.05,0.07,lam(0xD6D8D6),sx,0.62,sz,false);}
    contatto(g,cx,0.03,cz,w+4,d+4,0.40);
  }

  /* =================== 1) QUI NON C'E' NESSUNA VASCA =====================
     CORREZIONE DI ANDREA. Avevo letto sull'ortofoto uno specchio d'acqua a
     x 56,0 . 81,3  z -16,6 . -3,0 e ci avevo messo una seconda vasca a sei
     corsie, appena fuori dalle vetrate. Non esiste: quell'acqua ERA LA
     VASCA GRANDE SCOPERTA, cioe' la stessa vasca che sta sotto la
     copertura, fotografata in un momento in cui il tetto era ritirato.
     Le vasche sono una sola, e sta dentro il padiglione.

     La lezione e' la stessa dei due corridoi paralleli: quando una fonte
     mostra una cosa in UNA delle sue posizioni possibili, disegnarla li'
     E ANCHE dove si pensa che stia fa nascere un doppione. Un impianto che
     si muove va letto sapendo che si muove.
     (Il deck di cotto che c'era intorno resta: quello c'e' davvero.) */

  /* =================== 2) LA COPERTURA SCORREVOLE =======================
     x 50,5 . 80,9  z -40,7 . -17,2, alta 5,6. Sull'ortofoto il tetto e'
     bianchissimo e diviso in QUATTRO campate da giunti che corrono
     nord-sud; sul fianco nord e su quello ovest c'e' la fascia d'ombra,
     che e' quanto basta a dire che il volume e' alto cinque o sei metri.
     Sta fermo a nord della vasca: quando si chiude scende sui binari e ci
     va sopra. E' la struttura che si vede dal parcheggio. */
  const PN={x0:50.5,x1:80.9,z0:-40.7,z1:-17.2,h:5.6};
  /* SOTTO IL TETTO SCORREVOLE C'E' LA VASCA GRANDE (vista aerea annotata
     da Andrea: "Tetto scorrevole su vasca grande"). Avevo letto quel
     volume bianco come un padiglione vuoto parcheggiato ACCANTO alla
     vasca: e' invece la copertura, e la vasca ci sta dentro. I binari
     proseguono verso nord, ed e' li' che il tetto scorre quando si apre. */
  vasca(PN.x0+3.2,PN.x1-3.2,PN.z0+3.4,PN.z1-3.4,acquaNord,6,false,true);
  (function copertura(){
    const w=PN.x1-PN.x0,d=PN.z1-PN.z0,cx=(PN.x0+PN.x1)/2,cz=(PN.z0+PN.z1)/2,h=PN.h;
    /* IL CARRELLO SU CUI IL CAPANNONE CAMMINA — CORNICE, NON PIASTRA.
       Era un blocco pieno w x d: quando la copertura era un padiglione
       vuoto non dava fastidio, ma adesso la VASCA GRANDE ci sta dentro, e
       quel blocco alto 56 cm la seppelliva tutta. Dell'acqua non si vedeva
       niente: solo una superficie grigia. Il telaio di scorrimento va
       fatto per quello che e' — quattro travi sul perimetro. */
    [[cx,PN.z0-0.25,w+0.5,0.5],[cx,PN.z1+0.25,w+0.5,0.5],
     [PN.x0-0.25,cz,0.5,d+0.5],[PN.x1+0.25,cz,0.5,d+0.5]].forEach(q=>
      box(g,q[2],0.55,q[3],lam(0x6E7278),q[0],0.28,q[1],true));
    /* montanti e vetrate sui quattro lati */
    const nm=Math.round(w/3.0);
    for(let i=0;i<=nm;i++){
      const px=PN.x0+i*w/nm;
      box(g,0.20,h,0.20,matMuro,px,h/2+0.5,PN.z0,true);
      box(g,0.20,h,0.20,matMuro,px,h/2+0.5,PN.z1,true);}
    [[cx,PN.z0-0.06,w,0],[cx,PN.z1+0.06,w,0]].forEach(q=>{
      const v=new THREE.Mesh(new THREE.PlaneGeometry(q[2],h-0.7),matVetro);
      v.position.set(q[0],h/2+0.55,q[1]);g.add(v);});
    [[PN.x0-0.06],[PN.x1+0.06]].forEach(q=>{
      const v=new THREE.Mesh(new THREE.PlaneGeometry(d,h-0.7),matVetro);
      v.rotation.y=Math.PI/2;v.position.set(q[0],h/2+0.55,cz);g.add(v);});
    /* IL TETTO E' UN PEZZO UNICO DI LAMIERA BLU, e scorre tutto intero.
       (Fotografia da terra annotata da Andrea.) Tre correzioni insieme:
       - NON e' telescopico a quattro campate che si annidano: e' una
         falda sola che cammina;
       - NON e' bianco: e' LAMIERA BLU. Il blu che avevo tolto dicendo che
         era del capannone accanto era proprio questo;
       - aperto NON si raccoglie a nord dell'impronta: slitta SOPRA IL
         PARCHEGGIO, e fa ombra alle automobili. E' il motivo per cui la
         struttura coi binari prosegue cosi' a lungo verso nord.
       La corsa e' pari alla profondita' del tetto: chiuso copre la vasca,
       aperto la libera tutta e si stende sui posti auto. */
    const matBlu=new THREE.MeshPhongMaterial({color:0x2E5F94,shininess:60,
      specular:0x8FB4D8});
    const CORSA=d+0.6;
    const gTetto=new THREE.Group(); g.add(gTetto);
    gTetto.userData.animato=true;
    box(gTetto,w+1.2,0.26,d+0.6,matBlu,cx,h+0.62,cz,true);
    /* le nervature della lamiera, nel senso della larghezza */
    for(let k=0;k<Math.round((d+0.6)/1.5);k++)
      box(gTetto,w+1.1,0.08,0.13,lam(0x24507E),cx,h+0.79,
          cz-(d+0.6)/2+0.75+k*1.5,false);
    /* bordo di lattoneria e le due travi che corrono sui binari */
    box(gTetto,w+1.5,0.18,0.20,lam(0x1E4570),cx,h+0.50,cz-(d+0.6)/2,false);
    box(gTetto,w+1.5,0.18,0.20,lam(0x1E4570),cx,h+0.50,cz+(d+0.6)/2,false);
    [-1,1].forEach(sg=>box(gTetto,0.26,0.40,d+0.6,matLatt,
      cx+sg*(w/2+0.6),h+0.34,cz,false));

    /* il ciclo: 9 s chiuso, 7 per aprirsi, 9 aperto, 7 per chiudersi */
    let tCiclo=0;
    AGGIORNA.push(function(dt){
      tCiclo=(tCiclo+dt)%32;
      let u;                                  /* 0 = chiuso, 1 = aperto */
      if(tCiclo<9)        u=0;
      else if(tCiclo<16)  u=(tCiclo-9)/7;
      else if(tCiclo<25)  u=1;
      else                u=1-(tCiclo-25)/7;
      u=u*u*(3-2*u);                          /* parte e si ferma piano */
      gTetto.position.z=-CORSA*u;             /* verso nord, sul parcheggio */
    });

    /* lattoneria perimetrale e colmo */
    box(g,w+0.8,0.20,0.24,matLatt,cx,h+0.60,PN.z0-0.35,false);
    box(g,w+0.8,0.20,0.24,matLatt,cx,h+0.60,PN.z1+0.35,false);
    box(g,0.24,0.20,d+0.9,matLatt,PN.x0-0.35,h+0.60,cz,false);
    box(g,0.24,0.20,d+0.9,matLatt,PN.x1+0.35,h+0.60,cz,false);
    solido(box(g,w,h+0.6,d,new THREE.MeshBasicMaterial({visible:false}),cx,(h+0.6)/2,cz,false));
    contatto(g,cx,0.04,cz,w+4,d+4,0.5);
  })();

  /* --- i BINARI su cui la copertura scorre sopra la vasca ---------------
     ANDREA (parcheggio.png, IMG_5006): dal parcheggio si vede un colonnato
     di PILASTRI QUADRATI INTONACATI che regge DUE TRAVI PARALLELE. Sulla
     zenitale il parcheggio e' asfalto nudo con le strisce dei posti: il
     colonnato non sta li' in mezzo, sta sui FIANCHI DEL PADIGLIONE, ed e'
     quello che si vede guardando da nord. Quindi le travi alte corrono
     lungo il tratto di riposo (z -43 . -17) e proseguono verso la vasca
     come sole rotaie a terra: sul deck di cotto, a bordo vasca, non c'e'
     nessuna ombra di pilastro da leggere sull'ortofoto. */
  (function binari(){
    /* La struttura coi binari arriva fin SOPRA IL PARCHEGGIO (z -53,5 .
       -36,5): e' li' che il tetto va a finire quando si apre, e nella
       fotografia si vede il colonnato proseguire per tutta quella
       lunghezza. Prima si fermava a -43 e il tetto sarebbe scivolato nel
       vuoto. Le travi stanno appena sotto il filo del tetto. */
    const ZA=-65.0, ZM=PN.z1, YT=PN.h+0.34;
    const mPil=lam(0xE0D8BE), mTrave=lam(0xD8D2C2);

  /* =================== 3) PISTA A QUATTRO CORSIE ========================
     La striscia azzurra x 90,2 . 95,0 che scende da z -25,5 a z -3,0:

  (function pista(){
    const cx=92.6,W=4.8,ZT=-25.5,ZB=-3.0,YT=7.4,YB=0.95;
    const ang=Math.atan2(YT-YB,ZB-ZT), L=Math.hypot(ZB-ZT,YT-YB);

    [[0,-2.3,W+2.4,0.09],[-(W/2+1.2),0,0.09,4.9],[W/2+1.2,0,0.09,4.9]].forEach(q=>
      [1.05,0.55].forEach(hh=>

    for(let i=0;i<4;i++){

      f.rotation.x=ang;

    for(let k=1;k<=4;k++){

  const LGC=[86.5,12.5];
  (function laguna(){
    const P=(x,z)=>[x-LGC[0],-(z-LGC[1])];
    const sh=new THREE.Shape();
    const q=(a,b)=>{const A=P(a[0],a[1]),B=P(b[0],b[1]);sh.quadraticCurveTo(A[0],A[1],B[0],B[1]);};
    const l=p=>{const A=P(p[0],p[1]);sh.lineTo(A[0],A[1]);};

  const TS={x:91.0,z:33.0,h:8.6};

    [[0,-2.4,4.8,0.08],[0,2.4,4.8,0.08],[2.4,0,0.08,4.8]].forEach(p=>
      box(g,p[2],1.0,p[3],matLatt,TS.x+p[0],TS.h+0.80,TS.z+p[1],false));
    function elica(cx,cz,r,giri,col,fine){
